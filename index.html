rror all day. His soldiers stay {{idle}} because they have nothing to do. They are {{ignorant}} of Mario's real power.","ja":"クッパの手下たちはあまりかしこくない。一人は無謀で、壁に突っこむ。別の一人は内気で、木の後ろに隠れる。ただおバカなだけのやつもいれば、本当に愚かなやつもいる。クッパJr.はいたずらっ子で、みんなにいたずらをする。カメックは悪い計画を持つ意地悪な魔法使いだ。クッパはうぬぼれ屋で、一日中鏡で自分の顔を見ている。兵士たちはやることがないので、ぶらぶらしている。彼らはマリオの本当の力を知らない。","ken":"<b>vain</b> は「うぬぼれた」と「むだな」の2つ！ <b>in vain（むだに）</b>は熟語で超大事★ <b>be ignorant of ～（～を知らない）</b>も of とセットで。","words":[{"n":"1974","w":"reckless","m":"無謀な","p":[["reck","気にかける"],["less","ない"]],"i":"後先考えない","r":"careless ≒"},{"n":"1145","w":"shy","m":"内気な、恥ずかしがりの","p":[["shy","おびえた"]],"i":"人前でもじもじ","r":"shyness（内気）"},{"n":"1129","w":"silly","m":"ばかげた、おバカな","p":[["silly","幸せな→愚か"]],"i":"ちょっと抜けてる","r":"stupid より軽い"},{"n":"580","w":"stupid","m":"愚かな","p":[["stup","ぼうぜん"]],"i":"頭がボーッとしてる","r":"stupidity（愚かさ）"},{"n":"1963","w":"naughty","m":"いたずらな","p":[["naught","無"]],"i":"行儀が悪い子","r":"子どもに使う"},{"n":"1956","w":"wicked","m":"意地悪な、邪悪な","p":[["wick","魔女"]],"i":"悪だくみをする","r":"evil ≒"},{"n":"300","w":"evil","m":"邪悪な、悪","p":[["evil","悪い"]],"i":"悪の大魔王","r":"good and evil（善悪）"},{"n":"823","w":"vain","m":"うぬぼれた、むだな","p":[["vain","空っぽ"]],"i":"中身が空っぽ","r":"in vain（むだに）★"},{"n":"1331","w":"idle","m":"ぶらぶらしている、怠けた","p":[["idle","空っぽの"]],"i":"何もしていない","r":"アイドリング"},{"n":"1191","w":"ignorant","m":"無知な、知らない","p":[["i","否定"],["gno","知る"]],"i":"知らない","r":"be ignorant of ～"}]},{"world":"mario","title":"城のモンスター","lab":"悪い性格3","labJa":"テーマ","icon":"feel","en":"A {{savage}} monster lives in Koopa's castle. It's {{aggressive}} and attacks anyone who comes near. It throws {{brutal}} punches. Its breath has a {{foul}} smell. Kamek gives the monster {{harsh}} orders. He is a {{strict}} boss. The monster is {{hostile}} even to Koopa. \"This plan is {{insane}},\" says Luigi. \"Only a {{dumb}} person would go in there.\" Wario makes a {{nasty}} joke and laughs.","ja":"野蛮なモンスターがクッパ城に住んでいる。攻撃的で、近づく者には誰でも襲いかかる。残忍なパンチをくり出す。その息はひどいにおいがする。カメックはモンスターにきびしい命令をする。彼は厳格なボスだ。モンスターはクッパにさえ敵意をもっている。「この作戦は正気じゃない」とルイージ。「バカしかあそこに入らないよ」。ワリオは意地の悪い冗談を言って笑う。","ken":"<b>harsh と strict</b>：strict はルールにきびしい、harsh は言い方や環境がきびしい。aggressive は「攻撃的な」やけど、ビジネスだと「積極的な」の良い意味もあるで。","words":[{"n":"1988","w":"savage","m":"野蛮な","p":[["sav","森"]],"i":"森の中の野生の","r":"wild ≒"},{"n":"1143","w":"aggressive","m":"攻撃的な、積極的な","p":[["ag","～へ"],["gress","進む"]],"i":"ガンガン前に出る","r":"aggression（攻撃）"},{"n":"1960","w":"brutal","m":"残忍な","p":[["brute","獣"]],"i":"獣みたいにひどい","r":"brutality（残忍さ）"},{"n":"1991","w":"foul","m":"ひどい、反則","p":[["foul","くさい"]],"i":"くさくて汚い","r":"ファウル（反則）"},{"n":"1175","w":"harsh","m":"きびしい、とげとげしい","p":[["harsh","ざらざら"]],"i":"ざらついて痛い","r":"harsh climate（厳しい気候）"},{"n":"578","w":"strict","m":"厳格な","p":[["strict","しばる"]],"i":"ルールでギュッとしばる","r":"be strict with ～"},{"n":"1618","w":"hostile","m":"敵意のある","p":[["host","敵"]],"i":"敵として向かってくる","r":"hostility（敵意）"},{"n":"2006","w":"insane","m":"正気でない","p":[["in","否定"],["sane","健全な"]],"i":"まともじゃない","r":"crazy ≒"},{"n":"1950","w":"dumb","m":"バカな、口がきけない","p":[["dumb","しゃべれない"]],"i":"間抜けな","r":"b は読まない"},{"n":"1658","w":"nasty","m":"意地の悪い、不快な","p":[["nasty","汚い"]],"i":"いやな感じ","r":"a nasty smell（いやなにおい）"}]},{"world":"mario","title":"ルイージの冒険","lab":"気持ち形容詞","labJa":"テーマ","icon":"feel","en":"Luigi is {{anxious}} about tomorrow's adventure. He is {{nervous}} and can't sleep. But he is also {{curious}} about the new world. On the way, he gets {{thirsty}} in the desert. He is {{reluctant}} to cross a scary bridge. When he trips, he feels {{ashamed}}. He gets lost and feels {{miserable}}. He is {{desperate}} to find Mario. When he finds him, Mario is {{furious}}. \"Where were you?\" But Mario is {{fond}} of his brother, so he smiles.","ja":"ルイージは明日の冒険のことを心配している。緊張して眠れない。でも、新しい世界に好奇心もある。途中、砂漠でのどがかわく。こわい橋を渡るのは気が進まない。つまずいたときは、恥ずかしいと感じる。迷子になって、みじめな気持ちになる。必死にマリオを探す。見つけたとき、マリオは激怒している。「どこにいたんだ？」でもマリオは弟が大好きなので、にっこり笑う。","ken":"★<b>be anxious about ～（～を心配する）と be anxious to ～（～したがる）</b>で意味が変わる！ <b>be reluctant to ～（～したがらない）</b>、<b>be fond of ～（～が好き）</b>もセットで覚えよう。","words":[{"n":"303","w":"anxious","m":"心配して、切望して","p":[["anx","しめつける"]],"i":"胸がしめつけられる","r":"anxiety（不安）"},{"n":"293","w":"nervous","m":"緊張して","p":[["nerve","神経"]],"i":"神経がピリピリ","r":"nerve（神経）"},{"n":"307","w":"curious","m":"好奇心の強い","p":[["cure","注意"]],"i":"気になってしかたない","r":"curiosity（好奇心）"},{"n":"563","w":"thirsty","m":"のどがかわいた","p":[["thirst","かわき"]],"i":"水がほしい","r":"thirst for ～（～への渇望）"},{"n":"1118","w":"reluctant","m":"気が進まない","p":[["re","反対に"],["luct","もがく"]],"i":"いやいやもがく","r":"be reluctant to ～"},{"n":"1137","w":"ashamed","m":"恥じて","p":[["a","強め"],["shame","恥"]],"i":"恥ずかしくてたまらない","r":"be ashamed of ～"},{"n":"838","w":"miserable","m":"みじめな","p":[["miser","不幸"]],"i":"ひどくつらい","r":"misery（みじめさ）"},{"n":"831","w":"desperate","m":"必死の、絶望的な","p":[["de","離れて"],["sper","希望"]],"i":"希望がないからこそ必死","r":"despair（絶望）"},{"n":"1952","w":"furious","m":"激怒した","p":[["fury","激怒"]],"i":"カンカンに怒る","r":"fury（激怒）"},{"n":"840","w":"fond","m":"好きで","p":[["fond","愚かな"]],"i":"夢中になるほど好き","r":"be fond of ～"}]},{"world":"mario","title":"マリオ救出作戦","lab":"気持ち形容詞2","labJa":"テーマ","icon":"feel","en":"It's a {{gloomy}} day in the kingdom. Luigi feels {{uneasy}} and {{restless}}. He can't sit still. Koopa has caught Mario, and Luigi feels {{helpless}}. Wario is {{indifferent}}. \"Not my problem,\" he says. Kinopio is {{skeptical}} about Luigi's plan. Koopa is {{obsessed}} with Peach, and he is {{preoccupied}} with his wedding plans. When Luigi spins inside a cannon, he feels {{dizzy}}. But when he saves Mario, he is {{thrilled}}!","ja":"王国はどんよりした日だ。ルイージは落ち着かなくて、そわそわしている。じっと座っていられない。クッパがマリオを捕まえたので、ルイージはどうしようもない気持ちだ。ワリオは無関心だ。「オレには関係ない」と彼。キノピオはルイージの作戦に懐疑的だ。クッパはピーチに取りつかれていて、結婚式の計画で頭がいっぱいだ。大砲の中で回されて、ルイージは目が回る。でもマリオを助け出したときは、大興奮！","ken":"★<b>be indifferent to ～（～に無関心だ）</b>は前置詞 to！ be obsessed with ～（～に取りつかれている）、be preoccupied with ～（～で頭がいっぱい）は with がポイントやで。","words":[{"n":"1951","w":"gloomy","m":"どんよりした、憂うつな","p":[["gloom","暗がり"]],"i":"空も気分も暗い","r":"gloom（暗さ）"},{"n":"1627","w":"uneasy","m":"不安な","p":[["un","否定"],["easy","気楽な"]],"i":"落ち着かない","r":"uneasiness（不安）"},{"n":"1649","w":"restless","m":"そわそわした","p":[["rest","休み"],["less","ない"]],"i":"休めずじっとできない","r":"restlessly（落ち着きなく）"},{"n":"1659","w":"helpless","m":"どうしようもない","p":[["help","助け"],["less","ない"]],"i":"自分ではどうにもできない","r":"無力な"},{"n":"1142","w":"indifferent","m":"無関心な","p":[["in","否定"],["different","区別する"]],"i":"どっちでもいい","r":"be indifferent to ～"},{"n":"1982","w":"skeptical","m":"懐疑的な","p":[["skept","よく見る"]],"i":"ほんまかいな？と疑う","r":"skepticism（懐疑）"},{"n":"1971","w":"obsessed","m":"取りつかれた","p":[["ob","前に"],["sess","座る"]],"i":"頭の前にずっと居座る","r":"be obsessed with ～"},{"n":"1976","w":"preoccupied","m":"頭がいっぱいの","p":[["pre","先に"],["occupy","占める"]],"i":"先に頭を占められている","r":"be preoccupied with ～"},{"n":"1961","w":"dizzy","m":"目が回る","p":[["dizzy","ぼーっとした"]],"i":"クラクラする","r":"feel dizzy"},{"n":"833","w":"thrilled","m":"大興奮して","p":[["thrill","ゾクゾク"]],"i":"うれしくてゾクゾク","r":"be thrilled to ～"}]},{"world":"mario","title":"温泉旅行","lab":"気持ち形容詞3","labJa":"テーマ","icon":"feel","en":"Koopa is {{outraged}} when he loses again. After the battle, the brothers go to a hot spring. Mario is {{accustomed}} to hot water, but Luigi isn't. Luigi feels {{awkward}} in front of Peach. The water is {{refreshing}}, and the weather is {{pleasant}}. \"This place is {{fantastic}}!\" says Yoshi. \"The food is {{terrific}}!\" says Kinopio. \"What a {{marvelous}} view,\" says Peach. It's a {{splendid}} day. Mario is {{inclined}} to stay one more night.","ja":"クッパはまた負けて激怒している。戦いのあと、兄弟は温泉へ行く。マリオは熱いお湯に慣れているけど、ルイージは慣れていない。ルイージはピーチの前で気まずく感じる。お湯はさわやかで、天気も心地いい。「ここ、最高！」とヨッシー。「料理がすごくうまい！」とキノピオ。「なんてすばらしい景色」とピーチ。すばらしい1日だ。マリオはもう一晩泊まりたい気分だ。","ken":"★<b>be accustomed to ～ing（～に慣れている）</b>は to の後ろが ～ing！ be used to ～ing と同じ。<b>be inclined to ～（～したい気がする）</b>も大事。terrific（最高）と terrible（ひどい）は逆やから注意！","words":[{"n":"1999","w":"outraged","m":"激怒した","p":[["outrage","暴力"]],"i":"ひどすぎて怒りくるう","r":"outrageous（とんでもない）"},{"n":"797","w":"accustomed","m":"慣れている","p":[["ac","～に"],["custom","習慣"]],"i":"習慣になっている","r":"be accustomed to ～ing★"},{"n":"829","w":"awkward","m":"気まずい、ぎこちない","p":[["awk","逆の"]],"i":"なんか変な感じ","r":"an awkward silence（気まずい沈黙）"},{"n":"832","w":"refreshing","m":"さわやかな","p":[["re","再び"],["fresh","新鮮"]],"i":"もう一度フレッシュになる","r":"refresh（元気にする）"},{"n":"279","w":"pleasant","m":"心地いい","p":[["please","喜ばせる"]],"i":"いい気分にする","r":"unpleasant（不快な）"},{"n":"267","w":"fantastic","m":"すばらしい","p":[["fantasy","空想"]],"i":"空想みたいにすごい","r":"fantasy（空想）"},{"n":"1954","w":"terrific","m":"すごくいい","p":[["terr","こわがらせる"]],"i":"こわいくらいすごい→最高","r":"terrible（ひどい）と逆"},{"n":"1338","w":"marvelous","m":"すばらしい","p":[["marvel","驚き"]],"i":"驚くほどすばらしい","r":"marvel（驚嘆する）"},{"n":"1621","w":"splendid","m":"すばらしい、豪華な","p":[["splend","輝く"]],"i":"キラキラ輝く","r":"splendor（壮麗さ）"},{"n":"828","w":"inclined","m":"～したい気がする、傾いた","p":[["in","～へ"],["cline","傾く"]],"i":"気持ちがそっちに傾く","r":"be inclined to ～"}]},{"world":"mario","title":"キノコ王国の歴史","lab":"王国","labJa":"テーマ","icon":"theme","en":"Long ago, the Kinoko {{Kingdom:kingdom}} was a small country. Its first {{monarch}} built a white {{palace}}. Today, Peach is the {{heir}} to the throne. Koopa wants to build a huge {{empire}}. He calls himself the {{lord}} of darkness. His {{reign}} of fear has lasted for years. His {{castle}} is full of lava. In the kingdom's {{aristocracy}}, everyone wears fine clothes. Mario protects the whole {{realm}}.","ja":"昔むかし、キノコ王国は小さな国だった。最初の君主が白い宮殿を建てた。今、ピーチは王位の継承者だ。クッパは巨大な帝国を築きたい。彼は自分を闇の支配者と呼ぶ。彼の恐怖の統治は何年も続いている。彼の城は溶岩だらけだ。王国の貴族階級では、みんな上等な服を着ている。マリオは王国全体を守っている。","ken":"王様系単語。<b>reign（統治）は「レイン」</b>、g は読まへん。rain（雨）と同じ発音！ heir（相続人）も h を読まへん（エア）。発音問題で狙われるで★","words":[{"n":"726","w":"kingdom","m":"王国","p":[["king","王"],["dom","領域"]],"i":"王が治める国","r":"United Kingdom（イギリス）"},{"n":"1826","w":"monarch","m":"君主","p":[["mon","1人"],["arch","支配"]],"i":"1人で国を治める人","r":"monarchy（君主制）"},{"n":"1595","w":"palace","m":"宮殿","p":[["palace","丘の名前"]],"i":"王が住む豪華な建物","r":"Buckingham Palace"},{"n":"1796","w":"heir","m":"相続人、後継者","p":[["heir","相続する"]],"i":"あとを継ぐ人","r":"h は読まない（エア）"},{"n":"1020","w":"empire","m":"帝国","p":[["em","中に"],["pire","命令"]],"i":"命令で治める大きな国","r":"emperor（皇帝）"},{"n":"777","w":"lord","m":"君主、支配者","p":[["lord","パンを守る人"]],"i":"えらい人","r":"landlord（大家）"},{"n":"1936","w":"reign","m":"統治、治める","p":[["reg","王"]],"i":"王が治める期間","r":"g は読まない（レイン）"},{"n":"1044","w":"castle","m":"城","p":[["cast","とりで"]],"i":"守りの建物","r":"t は読まない（キャッスル）"},{"n":"1853","w":"aristocracy","m":"貴族（階級）","p":[["aristo","最良の"],["cracy","支配"]],"i":"最良の人たちが支配","r":"aristocrat（貴族）"},{"n":"1918","w":"realm","m":"領域、王国","p":[["real","王の"]],"i":"王の土地、分野","r":"the realm of science（科学の分野）"}]},{"world":"mario","title":"王国が変わる","lab":"政治","labJa":"テーマ","icon":"theme","en":"The Kinoko Kingdom is changing. Peach wants to build a {{democracy}}. \"Every {{citizen}} should have a voice,\" she says. The {{nation}} will have a new kind of {{government}}. Some people want a {{republic}} with no princess. The town {{council}} meets every week. A special {{committee}} writes the new rules. The country next door has a {{federal}} system and a {{congress}}. One of its {{senators:senator}} visits to give advice.","ja":"キノコ王国は変わりつつある。ピーチは民主主義を築きたい。「すべての市民が声を持つべきです」と彼女。国は新しい種類の政府を持つことになる。王女のいない共和国を望む人もいる。町の議会は毎週集まる。特別な委員会が新しいルールを書く。となりの国には連邦制と議会がある。そこの上院議員の一人がアドバイスをしに訪れる。","ken":"政治の単語は社会系長文で必須！ <b>democracy は demo（人々）+ cracy（支配）</b>。aristocracy（貴族支配）と同じ cracy やで。committee は m, t, e が2つずつ★スペル注意。","words":[{"n":"710","w":"democracy","m":"民主主義","p":[["demo","人々"],["cracy","支配"]],"i":"人々が国を治める","r":"democratic（民主的な）"},{"n":"451","w":"citizen","m":"市民","p":[["city","都市"]],"i":"まちの住民","r":"citizenship（市民権）"},{"n":"398","w":"nation","m":"国家、国民","p":[["nat","生まれる"]],"i":"同じところで生まれた人々","r":"national（国の）"},{"n":"396","w":"government","m":"政府","p":[["govern","かじを取る"]],"i":"国のかじ取りをする組織","r":"govern（治める）"},{"n":"1508","w":"republic","m":"共和国","p":[["re","物"],["public","公の"]],"i":"みんなのものとしての国","r":"the Republic of Korea"},{"n":"1095","w":"council","m":"議会、評議会","p":[["coun","一緒に"],["cil","呼ぶ"]],"i":"呼び集められた会議","r":"counsel（助言）とスペル注意"},{"n":"995","w":"committee","m":"委員会","p":[["commit","任せる"]],"i":"仕事を任された人たち","r":"m, t, e が2つずつ"},{"n":"1172","w":"federal","m":"連邦の","p":[["fed","同盟"]],"i":"州が同盟した国の","r":"FBI の F"},{"n":"1056","w":"congress","m":"（米国の）議会","p":[["con","一緒に"],["gress","進む"]],"i":"一緒に集まる","r":"the Diet（日本の国会）"},{"n":"1888","w":"senator","m":"上院議員","p":[["sen","年老いた"]],"i":"年長者の会議の人","r":"senior も同じ仲間"}]},{"world":"mario","title":"砂の国の大使","lab":"政治2","labJa":"テーマ","icon":"theme","en":"Peach acts like a true {{statesman}}. Her {{minister}} of food is Kinopio. The {{mayor}} of New Donk City is Pauline. An {{ambassador}} from the Sand Kingdom visits. He is very {{diplomatic}} and polite. They talk about trade {{policy}}. {{Political:political}} opinions in the kingdom are divided. {{Liberal:liberal}} people want change, and {{conservative}} people want to keep traditions. Koopa has {{radical}} ideas.","ja":"ピーチは真の政治家のようにふるまう。彼女の食料大臣はキノピオだ。ニュードンク・シティの市長はポリーンだ。砂の国から大使が訪れる。彼はとても外交的で礼儀正しい。二人は貿易政策について話す。王国の政治的な意見は分かれている。リベラル（進歩的）な人々は変化を求め、保守的な人々は伝統を守りたい。クッパは過激な考えを持っている。","ken":"<b>liberal（自由主義の）⇔ conservative（保守的な）</b>は反対語セット！ radical は「根本的な、過激な」、radish（大根）と同じ「根っこ」の語源やで。","words":[{"n":"1889","w":"statesman","m":"（りっぱな）政治家","p":[["state","国家"],["man","人"]],"i":"国のことを考える政治家","r":"politician（政治家）"},{"n":"249","w":"minister","m":"大臣、聖職者","p":[["mini","小さい"]],"i":"王に仕える者","r":"prime minister（首相）"},{"n":"1500","w":"mayor","m":"市長","p":[["may","より大きい"]],"i":"町でいちばんえらい人","r":"発音「メイヤー」"},{"n":"1811","w":"ambassador","m":"大使","p":[["ambassador","使者"]],"i":"国を代表して外国へ行く人","r":"embassy（大使館）"},{"n":"1657","w":"diplomatic","m":"外交の、如才ない","p":[["diploma","公文書"]],"i":"国と国のやりとり","r":"diplomat（外交官）"},{"n":"440","w":"policy","m":"政策、方針","p":[["poli","都市"]],"i":"国や会社の方針","r":"Honesty is the best policy."},{"n":"533","w":"political","m":"政治の","p":[["poli","都市"]],"i":"政治に関する","r":"politics（政治）"},{"n":"1179","w":"liberal","m":"自由主義の、寛大な","p":[["liber","自由"]],"i":"自由を大切にする","r":"liberty（自由）"},{"n":"1149","w":"conservative","m":"保守的な","p":[["con","強め"],["serve","守る"]],"i":"昔のものを守る","r":"conserve（保存する）"},{"n":"1185","w":"radical","m":"根本的な、過激な","p":[["radic","根"]],"i":"根っこから変える","r":"radish（大根）も同じ仲間"}]},{"world":"mario","title":"初めての選挙","lab":"選挙","labJa":"テーマ","icon":"theme","en":"The kingdom holds its first election. Citizens will {{vote}} to {{elect}} a new leader. Koopa is a {{candidate}} too. He starts a loud {{campaign}}. A {{poll}} shows Peach in first place. An {{activist}} warns, \"Koopa's rule would be {{tyranny}}!\" Some people even talk about a {{revolution}}. A {{communist}} group shares its {{ideology}} on the street. In the end, Peach wins.","ja":"王国は初めての選挙を行う。市民が新しいリーダーを選ぶために投票する。クッパも候補者だ。彼はうるさい選挙運動を始める。世論調査ではピーチが1位だ。ある活動家が警告する。「クッパの支配は暴政になるぞ！」革命について話す人までいる。共産主義のグループが通りで自分たちの思想を広めている。最後には、ピーチが勝つ。","ken":"選挙単語セット！ <b>elect（選挙で選ぶ）、vote（投票する）、candidate（候補者）、poll（世論調査）</b>。ideology（イデオロギー）は「思想」やで。","words":[{"n":"241","w":"vote","m":"投票する、票","p":[["vote","誓い"]],"i":"一票を入れる","r":"voter（有権者）"},{"n":"669","w":"elect","m":"選挙で選ぶ","p":[["e","外へ"],["lect","選ぶ"]],"i":"みんなの中から選び出す","r":"election（選挙）"},{"n":"999","w":"candidate","m":"候補者","p":[["cand","白い"]],"i":"白い服を着た立候補者（古代ローマ）","r":"candid（率直な）"},{"n":"1007","w":"campaign","m":"選挙運動、組織的な運動","p":[["camp","戦場"]],"i":"戦場での作戦行動","r":"キャンペーン"},{"n":"1280","w":"poll","m":"世論調査、投票","p":[["poll","頭"]],"i":"頭数を数える","r":"opinion poll（世論調査）"},{"n":"1855","w":"activist","m":"活動家","p":[["act","行動"]],"i":"社会を変えるために動く人","r":"activism（活動）"},{"n":"1835","w":"tyranny","m":"暴政","p":[["tyrant","暴君"]],"i":"ひどい支配","r":"tyrant（暴君）"},{"n":"229","w":"revolution","m":"革命、回転","p":[["re","もう一度"],["volve","回す"]],"i":"世の中をひっくり返す","r":"the Industrial Revolution（産業革命）"},{"n":"1838","w":"communist","m":"共産主義者、共産主義の","p":[["commune","共有の"]],"i":"財産をみんなで共有","r":"communism（共産主義）"},{"n":"1876","w":"ideology","m":"思想、イデオロギー","p":[["idea","考え"],["logy","学"]],"i":"考え方のまとまり","r":"political ideology"}]},{"world":"mario","title":"クッパの裁判","lab":"法律","labJa":"テーマ","icon":"theme","en":"Koopa is finally caught and goes on {{trial}}. The kingdom's {{constitution}} protects everyone's rights, even his. A {{jury}} of twelve Kinopio will decide. A {{witness}} says, \"I saw him take the princess!\" Koopa says he is {{innocent}}. But the jury finds him {{guilty}}. Everyone says {{justice}} was done. After the trial, the government passes new {{legislation}} and an {{amendment}} to make the rules stronger. Now kidnapping a princess is clearly not {{legal}}.","ja":"クッパはついに捕まって、裁判にかけられる。王国の憲法は、クッパをふくむすべての人の権利を守っている。12人のキノピオからなる陪審員が判断する。ある目撃者が言う。「彼が王女を連れ去るのを見ました！」クッパは無罪だと言う。でも陪審員は彼を有罪とする。みんな正義が行われたと言う。裁判のあと、政府はルールを強くするために新しい法律と改正案を通す。今では王女をさらうのは明らかに合法ではない。","ken":"裁判セット！ <b>guilty（有罪の）⇔ innocent（無罪の）</b>。innocent は「無邪気な」の意味もあるで。constitution は「憲法」と「体質」の2つ★","words":[{"n":"731","w":"trial","m":"裁判、試み","p":[["try","試す"]],"i":"正しいか試す場","r":"trial and error（試行錯誤）"},{"n":"761","w":"constitution","m":"憲法、体質","p":[["con","一緒に"],["stitute","立てる"]],"i":"国を立てる土台","r":"★「体質」の意味も"},{"n":"1812","w":"jury","m":"陪審員","p":[["jur","法、誓う"]],"i":"誓って判断する市民たち","r":"juror（陪審員1人）"},{"n":"725","w":"witness","m":"目撃者、目撃する","p":[["wit","知る"]],"i":"知っている人","r":"eyewitness（目撃者）"},{"n":"824","w":"innocent","m":"無罪の、無邪気な","p":[["in","否定"],["nocent","害する"]],"i":"害がない","r":"innocence（無罪）"},{"n":"792","w":"guilty","m":"有罪の、罪悪感のある","p":[["guilt","罪"]],"i":"悪いことをした","r":"feel guilty（罪悪感を感じる）"},{"n":"982","w":"justice","m":"正義、司法","p":[["just","正しい"]],"i":"正しいこと","r":"injustice（不正）"},{"n":"1583","w":"legislation","m":"法律、立法","p":[["legis","法"],["late","運ぶ"]],"i":"法を作ること","r":"legislature（議会）"},{"n":"1828","w":"amendment","m":"改正、修正","p":[["a","外へ"],["mend","欠点"]],"i":"欠点を直す","r":"amend（修正する）"},{"n":"306","w":"legal","m":"合法の、法律の","p":[["leg","法"]],"i":"法にかなった","r":"illegal（違法の）"}]},{"world":"mario","title":"ニュードンク・シティの事件簿","lab":"犯罪","labJa":"テーマ","icon":"theme","en":"There is a {{crime}} wave in New Donk City. A {{thief}} {{robs:rob}} a store, and a {{burglar}} breaks into a house at night. Wario tries to {{cheat}} at cards. A detective investigates a {{murder}} mystery at an old hotel. The police chief takes a {{bribe}} from Koopa, and the {{corruption}} spreads. Finally, Mario helps the police {{arrest}} the criminals, and they are sent to {{prison}}.","ja":"ニュードンク・シティで犯罪が多発している。泥棒がお店で強盗をはたらき、夜盗が夜中に家に押し入る。ワリオはトランプでズルをしようとする。探偵が古いホテルで殺人ミステリーを調べている。警察署長はクッパからわいろを受け取り、汚職が広がる。最後に、マリオが警察を手伝って犯人たちを逮捕し、彼らは刑務所に送られる。","ken":"★<b>rob 人 of 物（人から物を奪う）</b>。rob the store（店を襲う）はOK、rob money はダメ！ steal money は OK。この違い大事やで。burglar は夜に家に忍びこむ泥棒。","words":[{"n":"506","w":"crime","m":"犯罪","p":[["crime","判決"]],"i":"法律に反すること","r":"criminal（犯罪者）"},{"n":"1567","w":"thief","m":"泥棒","p":[["thief","泥棒"]],"i":"こっそり盗む人","r":"複数形は thieves"},{"n":"671","w":"rob","m":"奪う","p":[["rob","奪う"]],"i":"力ずくで取る","r":"rob 人 of 物★"},{"n":"1834","w":"burglar","m":"夜盗、空き巣","p":[["burgle","押し入る"]],"i":"家に忍びこむ泥棒","r":"burglary（強盗）"},{"n":"681","w":"cheat","m":"ズルをする、だます","p":[["cheat","没収"]],"i":"ずるいことをする","r":"cheat on a test（カンニングする）"},{"n":"955","w":"murder","m":"殺人","p":[["murder","死"]],"i":"人を殺すこと","r":"murderer（殺人犯）"},{"n":"1911","w":"bribe","m":"わいろ","p":[["bribe","パンのかけら"]],"i":"お金でこっそり頼む","r":"bribery（贈収賄）"},{"n":"1601","w":"corruption","m":"汚職、腐敗","p":[["cor","完全に"],["rupt","破れる"]],"i":"心がこわれる","r":"corrupt（腐敗した）"},{"n":"626","w":"arrest","m":"逮捕する","p":[["ar","～へ"],["rest","止める"]],"i":"つかまえて止める","r":"under arrest（逮捕されて）"},{"n":"979","w":"prison","m":"刑務所","p":[["prison","つかむ"]],"i":"つかまえて入れる場所","r":"prisoner（囚人）"}]},{"world":"mario","title":"キノコ泥棒ワリオ","lab":"罰","labJa":"テーマ","icon":"theme","en":"Kinopio {{accuses:accuse}} Wario of stealing his mushrooms. Wario says no, but later he {{confesses:confess}}. A witness agrees to {{testify}} in court. Peach decides to {{punish}} Wario. His {{penalty}} is to clean the castle for a month. Kinopio also wants to {{sue}} him for money. Everyone {{condemns:condemn}} his behavior. The kingdom will {{ban}} card games in the castle. Parents {{forbid}} their kids to play with Wario. A new law will {{prohibit}} people from stealing mushrooms.","ja":"キノピオはワリオがキノコを盗んだと責める。ワリオは否定するけど、あとで白状する。目撃者が法廷で証言することに同意する。ピーチはワリオを罰することに決める。彼の罰は1か月間お城をそうじすることだ。キノピオはお金を求めて彼を訴えたいとも思っている。みんなが彼の行いを非難する。王国はお城でのカードゲームを禁止する。親たちは子どもがワリオと遊ぶのを禁じる。新しい法律はキノコを盗むことを禁止する。","ken":"★<b>accuse A of B（BのことでAを責める）</b>と <b>prohibit A from ～ing（Aが～するのを禁じる）</b>は形が大事！ 「禁止」は ban, forbid, prohibit の3つ。forbid は forbid 人 to ～ の形が多いで。","words":[{"n":"650","w":"accuse","m":"責める、告訴する","p":[["ac","～に"],["cuse","罪"]],"i":"罪を言い立てる","r":"accuse A of B★"},{"n":"1422","w":"confess","m":"白状する","p":[["con","完全に"],["fess","言う"]],"i":"全部言う","r":"confession（告白）"},{"n":"1717","w":"testify","m":"証言する","p":[["test","証人"]],"i":"証人として話す","r":"testimony（証言）"},{"n":"876","w":"punish","m":"罰する","p":[["pun","罰"]],"i":"悪いことに罰を与える","r":"punishment（罰）"},{"n":"1058","w":"penalty","m":"罰、罰金","p":[["pen","罰"]],"i":"ルール違反の罰","r":"ペナルティ"},{"n":"1769","w":"sue","m":"訴える","p":[["sue","ついていく"]],"i":"裁判にもちこむ","r":"lawsuit（訴訟）"},{"n":"1781","w":"condemn","m":"非難する","p":[["con","強め"],["demn","損害"]],"i":"強くとがめる","r":"criticize ≒"},{"n":"605","w":"ban","m":"禁止する","p":[["ban","布告"]],"i":"公に禁止する","r":"a ban on smoking（喫煙禁止）"},{"n":"873","w":"forbid","m":"禁じる","p":[["for","離れて"],["bid","命じる"]],"i":"やってはダメと命じる","r":"forbid-forbade-forbidden"},{"n":"643","w":"prohibit","m":"禁止する","p":[["pro","前に"],["hibit","持つ"]],"i":"前に立ちふさがる","r":"prohibit A from ～ing★"}]},{"world":"mario","title":"星の村の信仰","lab":"宗教","labJa":"テーマ","icon":"theme","en":"In a small village in the kingdom, people follow an old {{religion}}. They have deep {{faith}} in the Star Spirits. Every morning, they {{pray}} at a {{sacred}} tree. A {{priest}} leads the {{worship}}. They believe a {{saint}} once lived there. \"Lying is a {{sin}},\" the priest says. People believe good souls go to {{heaven}}. Rosetta's power seems almost {{divine}}.","ja":"王国の小さな村では、人々が古い宗教を信じている。彼らはスターの精霊たちに深い信仰を持っている。毎朝、神聖な木の前で祈る。司祭が礼拝を導く。昔そこに聖人が住んでいたと信じられている。「うそをつくのは罪です」と司祭は言う。人々は、良い魂は天国へ行くと信じている。ロゼッタの力はほとんど神のようだ。","ken":"宗教の単語は文化系の長文で出る。<b>sacred（神聖な）と divine（神の）</b>はセット。sin（宗教上の罪）と crime（法律上の犯罪）の違いも大事やで★","words":[{"n":"468","w":"religion","m":"宗教","p":[["re","強め"],["lig","結ぶ"]],"i":"神と人を結ぶもの","r":"religious（宗教の）"},{"n":"723","w":"faith","m":"信仰、信頼","p":[["faith","信じる"]],"i":"心から信じる","r":"faithful（忠実な）"},{"n":"911","w":"pray","m":"祈る","p":[["pray","頼む"]],"i":"神様にお願いする","r":"prayer（祈り）、play と区別"},{"n":"1625","w":"sacred","m":"神聖な","p":[["sacr","神聖"]],"i":"おそれ多い","r":"holy ≒"},{"n":"1067","w":"priest","m":"司祭、聖職者","p":[["priest","長老"]],"i":"神に仕える人","r":"pastor ≒"},{"n":"1321","w":"worship","m":"崇拝、礼拝","p":[["worth","価値"],["ship","状態"]],"i":"価値あるものをあがめる","r":"worship God"},{"n":"1568","w":"saint","m":"聖人","p":[["sanct","神聖な"]],"i":"神聖な人","r":"St. のこと"},{"n":"1806","w":"sin","m":"（宗教・道徳上の）罪","p":[["sin","罪"]],"i":"神の教えにそむくこと","r":"crime（法律上の犯罪）と区別"},{"n":"985","w":"heaven","m":"天国","p":[["heaven","空"]],"i":"空の上の世界","r":"hell（地獄）が反対"},{"n":"1997","w":"divine","m":"神の、神のような","p":[["div","神"]],"i":"神々しい","r":"divinity（神性）"}]},{"world":"mario","title":"赤い服の英雄","lab":"伝説","labJa":"テーマ","icon":"theme","en":"An old {{legend}} says a hero in red will save the kingdom. A {{prophet}} told this story long ago. It's like a {{myth}}, but many believe it. Some people say it's Mario's {{destiny}}. A {{witch}} put a {{curse}} on the castle. To break it, people do a {{ritual}} with candles. \"It's just {{superstition}},\" says Wario. But Kamek {{preaches:preach}} that no one can escape {{fate}}.","ja":"昔の伝説によると、赤い服の英雄が王国を救うという。預言者がずっと昔にこの話をした。神話のようなものだけど、多くの人が信じている。それはマリオの運命だと言う人もいる。魔女がお城に呪いをかけた。それを解くため、人々はろうそくを使った儀式を行う。「ただの迷信さ」とワリオ。でもカメックは、誰も運命からは逃れられないと説く。","ken":"<b>destiny と fate</b> はどっちも「運命」やけど、fate のほうが「さけられない悪い運命」っぽい。★myth は「神話」だけじゃなくて<b>「（まちがった）通説」</b>の意味で長文によく出るで！","words":[{"n":"1019","w":"legend","m":"伝説","p":[["leg","読む"]],"i":"読み伝えられたお話","r":"legendary（伝説的な）"},{"n":"1804","w":"prophet","m":"預言者","p":[["pro","前に"],["phet","言う"]],"i":"未来を前もって言う人","r":"prophecy（預言）"},{"n":"1053","w":"myth","m":"神話、作り話","p":[["myth","物語"]],"i":"神様のお話、よくある誤解","r":"★「誤った通説」の意味も大事"},{"n":"1489","w":"destiny","m":"運命","p":[["de","完全に"],["stin","立つ"]],"i":"しっかり決められた行き先","r":"destination（目的地）も同じ仲間"},{"n":"1799","w":"witch","m":"魔女","p":[["witch","魔法使い"]],"i":"ほうきに乗るあの人","r":"wizard（男の魔法使い）"},{"n":"1877","w":"curse","m":"呪い、のろう","p":[["curse","のろい"]],"i":"悪いことが起きるように","r":"blessing（祝福）が反対"},{"n":"1081","w":"ritual","m":"儀式","p":[["rite","儀式"]],"i":"決まった手順で行うこと","r":"daily ritual（日課）"},{"n":"1456","w":"superstition","m":"迷信","p":[["super","上に"],["stit","立つ"]],"i":"理屈を飛びこえた信仰","r":"superstitious（迷信深い）"},{"n":"1772","w":"preach","m":"説く、説教する","p":[["pre","前で"],["ach","言う"]],"i":"みんなの前で教えを語る","r":"preacher（説教者）"},{"n":"1012","w":"fate","m":"運命","p":[["fate","言われたこと"]],"i":"神に言い渡された運命","r":"fatal（致命的な）"}]},{"world":"mario","title":"マリオの正義","lab":"道徳","labJa":"テーマ","icon":"theme","en":"Mario has strong {{moral}} values. He follows a simple {{ethic}}: help people in need. Honesty is his greatest {{virtue}}. His {{conscience}} never lets him lie. Even when he loses, he keeps his {{dignity}}. Peach moves with {{grace}}. Koopa only cares about {{glory}}. But Mario fights for {{honor}}, not fame. People trust his {{integrity}}. Koopa Jr., on the other hand, is always up to {{mischief}}.","ja":"マリオは強い道徳的な価値観を持っている。彼はシンプルな倫理に従っている。困っている人を助けることだ。正直さは彼の最大の美徳だ。彼の良心はうそをつくことを決して許さない。負けたときでも、彼は品位を保つ。ピーチは優雅に動く。クッパは栄光のことしか考えていない。でもマリオは名声ではなく名誉のために戦う。人々は彼の誠実さを信頼している。一方クッパJr.は、いつもいたずらをたくらんでいる。","ken":"<b>conscience（良心）は「コンシャンス」</b>、conscious（意識している）とスペルも発音も似てるから注意★ integrity（誠実さ）は面接でよく使う単語やで。","words":[{"n":"297","w":"moral","m":"道徳の、教訓","p":[["mor","習慣"]],"i":"正しいふるまい","r":"morality（道徳）"},{"n":"788","w":"ethic","m":"倫理","p":[["ethic","習慣"]],"i":"正しい行いのルール","r":"ethical（倫理的な）"},{"n":"944","w":"virtue","m":"美徳","p":[["vir","男らしさ"]],"i":"人として良いところ","r":"vice（悪徳）が反対"},{"n":"1471","w":"conscience","m":"良心","p":[["con","一緒に"],["science","知る"]],"i":"自分の中で善悪を知る心","r":"conscious（意識している）と区別★"},{"n":"1446","w":"dignity","m":"威厳、品位","p":[["dign","ふさわしい"]],"i":"人としての誇り","r":"dignified（威厳のある）"},{"n":"1550","w":"grace","m":"優雅さ、気品","p":[["grace","感謝"]],"i":"ふるまいが美しい","r":"graceful（優雅な）"},{"n":"1521","w":"glory","m":"栄光","p":[["glory","名声"]],"i":"かがやかしい名誉","r":"glorious（栄光ある）"},{"n":"732","w":"honor","m":"名誉、光栄","p":[["honor","名誉"]],"i":"誇らしいこと","r":"in honor of ～（～をたたえて）"},{"n":"1909","w":"integrity","m":"誠実さ、まとまり","p":[["integr","完全な"]],"i":"うらおもてがない","r":"honesty ≒"},{"n":"1900","w":"mischief","m":"いたずら","p":[["mis","悪く"],["chief","結末"]],"i":"悪い結果になる遊び","r":"mischievous（いたずらな）"}]},{"world":"mario","title":"みんなの王国","lab":"社会","labJa":"テーマ","icon":"theme","en":"The kingdom is a {{society}} of many kinds of people. Kinopio, Yoshi, and even former Koopa soldiers live together. Many {{ethnic}} groups share their food and festivals. Some {{immigrants:immigrant}} came from the Sand Kingdom. Peach works hard to end {{discrimination}}. She says, \"Don't judge people by a {{stereotype}}.\" {{Racial:racial}} and {{gender}} equality is part of her plan. She fights {{prejudice}} with education. The government supports {{welfare}} for poor families, and many people give money to {{charity}}.","ja":"王国はいろんな種類の人々からなる社会だ。キノピオ、ヨッシー、さらには元クッパ軍の兵士までが一緒に暮らしている。多くの民族グループが食べ物やお祭りを分かち合っている。砂の国から来た移民もいる。ピーチは差別をなくすために一生けんめい働いている。「固定観念で人を判断しないで」と彼女は言う。人種や性別の平等は彼女の計画の一部だ。彼女は教育で偏見と戦っている。政府は貧しい家族のための福祉を支え、多くの人が慈善団体にお金を寄付している。","ken":"社会問題の単語は早稲田の長文で超よく出る！ <b>prejudice（偏見）は pre（前に）+ judice（判断）</b>、よく知る前に判断してしまうこと。stereotype（固定観念）とセットで覚えよう★","words":[{"n":"177","w":"society","m":"社会","p":[["soci","仲間"]],"i":"仲間の集まり","r":"social（社会の）"},{"n":"821","w":"ethnic","m":"民族の","p":[["ethn","民族"]],"i":"同じ文化を持つ集団の","r":"ethnicity（民族性）"},{"n":"713","w":"immigrant","m":"（入ってくる）移民","p":[["im","中に"],["migr","移る"]],"i":"外国から移り住んできた人","r":"emigrant（出ていく移民）"},{"n":"1064","w":"discrimination","m":"差別","p":[["discrimin","区別する"]],"i":"不公平に区別する","r":"discriminate against ～"},{"n":"774","w":"stereotype","m":"固定観念","p":[["stereo","固い"],["type","型"]],"i":"固まった型でものを見る","r":"ステレオタイプ"},{"n":"1169","w":"racial","m":"人種の","p":[["race","人種"]],"i":"人種に関する","r":"racism（人種差別）"},{"n":"1096","w":"gender","m":"（社会的な）性","p":[["gen","種類"]],"i":"男女という区分","r":"gender equality（男女平等）"},{"n":"742","w":"prejudice","m":"偏見","p":[["pre","前に"],["judice","判断"]],"i":"よく知る前に決めつける","r":"be prejudiced against ～"},{"n":"720","w":"welfare","m":"福祉","p":[["well","よく"],["fare","行く"]],"i":"うまくやっていけるように","r":"social welfare（社会福祉）"},{"n":"450","w":"charity","m":"慈善（団体）","p":[["char","愛"]],"i":"困った人への思いやり","r":"charitable（慈善の）"}]},{"world":"mario","title":"いとこの結婚式","lab":"家族","labJa":"テーマ","icon":"theme","en":"Mario and Luigi are not {{twins:twin}}, but they look alike. Their {{bond}} is very strong. Today, a {{relative}} is getting married. Their cousin will {{marry}} a nice girl. The {{bride}} wears a white dress. Her new {{spouse}} smiles. Their uncle's {{nephew}}, a small boy, carries the rings. He was an {{orphan}} before the family adopted him. Yoshi is Mario's best {{companion}} on trips. Sadly, another cousin went through a {{divorce}} last year.","ja":"マリオとルイージは双子ではないけど、よく似ている。二人のきずなはとても強い。今日は親せきが結婚する。いとこがすてきな女の子と結婚するのだ。花嫁は白いドレスを着ている。彼女の新しい配偶者がにっこりする。おじさんのおいである小さな男の子が指輪を運ぶ。彼は家族に引き取られる前は孤児だった。ヨッシーは旅でのマリオの一番の仲間だ。悲しいことに、別のいとこは去年離婚した。","ken":"★<b>marry は他動詞</b>！ marry with はダメで、marry her か get married to her。これ並べかえで超出る。nephew（おい）⇔ niece（めい）もセットで。","words":[{"n":"216","w":"twin","m":"双子（の1人）","p":[["twin","2"]],"i":"そっくりな2人","r":"twins（双子）"},{"n":"1070","w":"bond","m":"きずな、結びつき","p":[["bond","しばるもの"]],"i":"心をつなぐ糸","r":"a strong bond"},{"n":"212","w":"relative","m":"親せき、相対的な","p":[["relate","関係する"]],"i":"血のつながった人","r":"absolute（絶対的な）が反対"},{"n":"339","w":"marry","m":"結婚する","p":[["marry","夫をもつ"]],"i":"一生のパートナーに","r":"marry with はダメ★"},{"n":"1575","w":"bride","m":"花嫁","p":[["bride","花嫁"]],"i":"白いドレスの人","r":"bridegroom（花婿）"},{"n":"1604","w":"spouse","m":"配偶者","p":[["spouse","婚約した人"]],"i":"夫または妻","r":"husband or wife"},{"n":"1536","w":"nephew","m":"おい","p":[["nephew","孫"]],"i":"兄弟姉妹の息子","r":"niece（めい）とセット"},{"n":"1922","w":"orphan","m":"孤児","p":[["orphan","失った"]],"i":"親を失った子","r":"orphanage（孤児院）"},{"n":"980","w":"companion","m":"仲間","p":[["com","一緒に"],["pan","パン"]],"i":"一緒にパンを食べる仲間","r":"company（仲間、会社）も同じ"},{"n":"748","w":"divorce","m":"離婚、離婚する","p":[["di","離れて"],["vorce","向く"]],"i":"別々の方を向く","r":"get divorced（離婚する）"}]},{"world":"mario","title":"工事現場のマリオ","lab":"人","labJa":"テーマ","icon":"theme","en":"Mario starts a new job at a construction site. His {{colleague}} is Donkey Kong. The {{crew}} works hard. A {{senior}} worker teaches the new {{personnel}}. A {{youngster}} on the team is eager to learn. Mario's {{peer}} group are all strong workers. One day, a {{stranger}} comes to the site. He says he is an {{acquaintance}} of the boss. \"Hey, {{mate}}!\" he says. His {{fellow}} travelers wait in a car.","ja":"マリオは工事現場で新しい仕事を始める。彼の同僚はドンキーコングだ。作業員たちはよく働く。先輩の作業員が新しい職員たちに教える。チームの若者は熱心に学びたがっている。マリオの仲間たちはみんな力の強い作業員だ。ある日、見知らぬ人が現場にやってくる。彼はボスの知り合いだと言う。「よう、相棒！」と彼。彼の旅の仲間たちは車の中で待っている。","ken":"「仲間」系の使い分け★ <b>colleague（職場の同僚）、peer（同年代・同じ立場の仲間）、acquaintance（顔見知り）</b>。peer pressure（同調圧力）は社会系の長文の常連やで！","words":[{"n":"507","w":"colleague","m":"同僚","p":[["col","一緒に"],["league","選ぶ"]],"i":"一緒に選ばれた仲間","r":"coworker ≒"},{"n":"931","w":"crew","m":"乗組員、作業員","p":[["crew","増える"]],"i":"一緒に働くチーム","r":"クルー"},{"n":"310","w":"senior","m":"年上の、先輩","p":[["sen","年老いた"]],"i":"年上の人","r":"junior（年下の）が反対"},{"n":"1482","w":"personnel","m":"職員（全体）、人事部","p":[["person","人"]],"i":"会社の人たち","r":"personal（個人の）とスペル注意"},{"n":"1075","w":"youngster","m":"若者","p":[["young","若い"],["ster","人"]],"i":"若い人","r":"youth ≒"},{"n":"784","w":"peer","m":"同僚、仲間、じっと見る","p":[["peer","同等の"]],"i":"同じ立場の人","r":"peer pressure（同調圧力）"},{"n":"464","w":"stranger","m":"見知らぬ人、不案内な人","p":[["strange","よその"]],"i":"知らない人","r":"I'm a stranger here.（このへんは不案内です）"},{"n":"757","w":"acquaintance","m":"知り合い","p":[["ac","～に"],["quaint","知る"]],"i":"ちょっと知っている人","r":"friend より浅い"},{"n":"444","w":"mate","m":"仲間、相棒","p":[["mate","食べ物を共にする"]],"i":"一緒にいる人","r":"classmate, roommate"},{"n":"794","w":"fellow","m":"仲間、やつ","p":[["fellow","仲間"]],"i":"同じことをしている人","r":"fellow students（学友）"}]},{"world":"mario","title":"かぜをひいたマリオ","lab":"sub-","labJa":"下に・下から","icon":"sub","en":"Mario {{suffers:suffer}} from a bad cold before the big race. Luigi {{suggests:suggest}} that he rest. \"I {{suppose}} you're right,\" Mario says. Luigi will be his {{substitute}}. Peach {{supports:support}} the idea. Kinopio brings a {{supply}} of mushrooms. \"Is this {{sufficient}}?\" he asks. Luigi must {{submit}} his entry form by noon. Wario {{suspects:suspect}} a trick. In the {{subsequent}} race, Luigi wins!","ja":"マリオは大きなレースの前にひどいかぜで苦しむ。ルイージは休むよう提案する。「たぶん君が正しいな」とマリオ。ルイージが彼の代わりになる。ピーチはその考えを支持する。キノピオがキノコの補給品を持ってくる。「これで十分？」と彼は聞く。ルイージは昼までに参加申込書を提出しないといけない。ワリオは何かトリックがあるんじゃないかと疑う。そのあとのレースで、ルイージが勝つ！","ken":"sub- は<b>「下に・下から」</b>。suggest は「下からそっと出す」＝提案、support は「下から運ぶ」＝支える。★<b>suggest that S (should) 原形</b>は文法問題で鉄板！ <b>suspect（～ではないかと疑う）と doubt（～ではないと疑う）</b>の違いも大事やで。","words":[{"n":"36","w":"suffer","m":"苦しむ","p":[["suf","下で"],["fer","運ぶ"]],"i":"重荷を下で支えて耐える","r":"suffer from ～（～に苦しむ）"},{"n":"16","w":"suggest","m":"提案する、示す","p":[["sug","下から"],["gest","運ぶ"]],"i":"下からそっと差し出す","r":"suggest that S (should) 原形★"},{"n":"32","w":"suppose","m":"思う、仮定する","p":[["sup","下に"],["pose","置く"]],"i":"下に仮に置いてみる","r":"be supposed to ～（～することになっている）"},{"n":"621","w":"substitute","m":"代わり、代わりに使う","p":[["sub","下に"],["stitute","立てる"]],"i":"代わりに下に立てる","r":"substitute A for B"},{"n":"25","w":"support","m":"支える、支持する","p":[["sup","下から"],["port","運ぶ"]],"i":"下から持ち上げる","r":"supporter（支持者）"},{"n":"50","w":"supply","m":"供給、供給する","p":[["sup","下から"],["ply","満たす"]],"i":"下から満たしていく","r":"supply and demand（需要と供給）"},{"n":"567","w":"sufficient","m":"十分な","p":[["suf","下から"],["fic","作る"]],"i":"下から作って満たす","r":"enough ≒、insufficient（不十分な）"},{"n":"1201","w":"submit","m":"提出する、従う","p":[["sub","下に"],["mit","送る"]],"i":"下に差し出す","r":"submit to ～（～に従う）"},{"n":"145","w":"suspect","m":"疑う、容疑者","p":[["su","下から"],["spect","見る"]],"i":"下からじろじろ見る","r":"suspect that ～（～ではないかと思う）"},{"n":"1640","w":"subsequent","m":"そのあとの","p":[["sub","すぐ下に"],["sequ","続く"]],"i":"すぐ後に続く","r":"subsequently（そのあとで）"}]},{"world":"mario","title":"郊外のクッパ","lab":"sub-","labJa":"下に・下から","icon":"sub","en":"Koopa finally {{surrenders:surrender}}. He moves to a quiet {{suburb}} of the kingdom. He tries to {{suppress}} his anger. He takes a health {{supplement}} every day. He is now a {{subscriber}} to a cooking magazine. His old {{subordinate}}, Kamek, visits him. \"You've changed in a {{subtle}} way,\" says Kamek. \"That's a {{subjective}} opinion,\" Koopa replies. But there is a {{substantial}} change: he now cooks without any dangerous {{substance}}.","ja":"クッパはついに降伏する。彼は王国の静かな郊外に引っこす。怒りを抑えようとしている。毎日、健康サプリを飲んでいる。今では料理雑誌の定期購読者だ。昔の部下のカメックが訪ねてくる。「あなたは微妙に変わりましたね」とカメック。「それは主観的な意見だ」とクッパは返す。でも大きな変化がある。今の彼は危険な物質を一切使わずに料理するのだ。","ken":"<b>subtle（微妙な）は b を読まへん</b>（サトル）！ subjective（主観的な）⇔ objective（客観的な）は反対語セットで★ substantial は「かなりの」、considerable と同じ意味で長文に出る。","words":[{"n":"1213","w":"surrender","m":"降伏する","p":[["sur","上に"],["render","渡す"]],"i":"相手に自分を渡す","r":"give up ≒"},{"n":"1021","w":"suburb","m":"郊外","p":[["sub","近く"],["urb","都市"]],"i":"都市のすぐそば","r":"suburban（郊外の）"},{"n":"1362","w":"suppress","m":"抑える、鎮圧する","p":[["sup","下に"],["press","押す"]],"i":"下へ押さえこむ","r":"suppression（抑圧）"},{"n":"1401","w":"supplement","m":"補うもの、サプリ","p":[["sup","下から"],["ple","満たす"]],"i":"足りない分を満たす","r":"supplementary（補足の）"},{"n":"1894","w":"subscriber","m":"定期購読者、加入者","p":[["sub","下に"],["scribe","書く"]],"i":"名前を下に書いた人","r":"subscribe（定期購読する）"},{"n":"1890","w":"subordinate","m":"部下、下位の","p":[["sub","下に"],["ordin","順番"]],"i":"順番が下の人","r":"boss（上司）が反対"},{"n":"1148","w":"subtle","m":"微妙な","p":[["sub","下に"],["tle","織る"]],"i":"下に織りこまれた細かさ","r":"b は読まない（サトル）"},{"n":"1957","w":"subjective","m":"主観的な","p":[["sub","下に"],["ject","投げる"]],"i":"自分の下から見た","r":"objective（客観的な）が反対"},{"n":"839","w":"substantial","m":"かなりの、実質的な","p":[["sub","下に"],["stant","立つ"]],"i":"しっかり下に立つ中身","r":"considerable ≒"},{"n":"1076","w":"substance","m":"物質、中身","p":[["sub","下に"],["stance","立つ"]],"i":"下にあるもの","r":"substantial（かなりの）"}]},{"world":"mario","title":"スーパースターの力","lab":"sur- / super-","labJa":"上に・越えて","icon":"super","en":"Mario finds a Super Star. Its power is {{superior}} to any mushroom. With it, his speed {{surpasses:surpass}} everyone's. He feels a {{surge}} of energy. Enemies {{surround}} him, but they can't touch him. However, the power can't {{sustain}} itself for long. After ten seconds, it's gone. Without it, Mario is {{susceptible}} to attacks again. Koopa says Mario's skill is only {{superficial}}. But Mario's courage is {{supreme}}. Under the {{surface}}, he is always ready. The game is {{suspended:suspend}} for a moment while the music changes.","ja":"マリオはスーパースターを見つける。その力はどんなキノコよりもすぐれている。それがあると、彼のスピードはみんなを上回る。エネルギーが押し寄せるのを感じる。敵が彼を取り囲むけど、彼にさわれない。でもその力は長くは持続できない。10秒後には消えてしまう。それがなければ、マリオはまた攻撃を受けやすくなる。クッパはマリオの技なんて表面的なものだと言う。でもマリオの勇気は最高だ。表面の下では、彼はいつでも準備ができている。音楽が変わる間、ゲームは一時停止される。","ken":"sur-/super- は<b>「上に・越えて」</b>。スーパーマリオの super やで！ ★<b>be superior to ～（～よりすぐれている）</b>は than じゃなくて to！ 文法問題の鉄板。susceptible は be susceptible to ～（～の影響を受けやすい）で使う。","words":[{"n":"288","w":"superior","m":"すぐれた","p":[["super","上の"]],"i":"上のランク","r":"be superior to ～（than ではない）★"},{"n":"1361","w":"surpass","m":"上回る","p":[["sur","越えて"],["pass","通る"]],"i":"上を越えて通りすぎる","r":"exceed ≒"},{"n":"1807","w":"surge","m":"押し寄せること、急上昇","p":[["surge","わき上がる"]],"i":"波がドッと高まる","r":"a surge in prices（物価の急騰）"},{"n":"79","w":"surround","m":"取り囲む","p":[["sur","上に"],["round","あふれる"]],"i":"まわりをぐるっと囲む","r":"surroundings（環境）"},{"n":"886","w":"sustain","m":"持続させる、支える","p":[["sus","下から"],["tain","持つ"]],"i":"下から持ち続ける","r":"sustainable（持続可能な）"},{"n":"2021","w":"susceptible","m":"影響を受けやすい","p":[["sus","下で"],["cept","受ける"]],"i":"下で受けてしまう","r":"be susceptible to ～"},{"n":"1631","w":"superficial","m":"表面的な","p":[["super","上の"],["fici","表面"]],"i":"うわべだけ","r":"deep の反対"},{"n":"1623","w":"supreme","m":"最高の","p":[["supre","いちばん上"]],"i":"上の上","r":"the Supreme Court（最高裁判所）"},{"n":"437","w":"surface","m":"表面","p":[["sur","上の"],["face","顔"]],"i":"いちばん上の面","r":"on the surface（表面上は）"},{"n":"1266","w":"suspend","m":"一時停止する、つるす","p":[["sus","下に"],["pend","つるす"]],"i":"宙ぶらりんにする","r":"suspension（停止）"}]},{"world":"mario","title":"ニュードンク・シティのショー","lab":"per-","labJa":"通して・完全に","icon":"per","en":"Mario wants to {{perform}} at a big show in New Donk City. At first, the mayor won't {{permit}} it. But Mario {{persists:persist}}, and finally he {{persuades:persuade}} her. Fans {{perceive}} him as a real star. His jumps are so high that they seem to {{penetrate}} the clouds. The city's income {{per capita}} goes up. Mario practiced {{thoroughly}} for the show. The memory will be {{permanent}}. Peach says, \"Your fame will be {{perpetual}}.\"","ja":"マリオはニュードンク・シティの大きなショーでパフォーマンスをしたい。最初、市長はそれを許可しない。でもマリオはねばって、ついに彼女を説得する。ファンは彼を本物のスターとして受け止める。彼のジャンプはとても高くて、雲をつき抜けるようだ。市の1人あたりの収入が上がる。マリオはショーのために徹底的に練習した。その思い出は永遠に残るだろう。ピーチは言う。「あなたの名声は永久に続くわ」。","ken":"per- は<b>「通して・完全に」</b>。perform は「最後までやり通す」、persuade は「完全にすすめる」＝説得。★<b>persuade 人 to ～（人を説得して～させる）</b>は超頻出！ per capita（1人あたり）は経済の長文で出る。","words":[{"n":"65","w":"perform","m":"演じる、行う","p":[["per","完全に"],["form","形作る"]],"i":"最後までやり通す","r":"performance（演技、成績）"},{"n":"364","w":"permit","m":"許可する","p":[["per","通して"],["mit","送る"]],"i":"通してあげる","r":"permit 人 to ～、permission（許可）"},{"n":"1262","w":"persist","m":"ねばる、続く","p":[["per","最後まで"],["sist","立つ"]],"i":"最後まで立ち続ける","r":"persist in ～"},{"n":"113","w":"persuade","m":"説得する","p":[["per","完全に"],["suade","すすめる"]],"i":"すすめて完全にその気にさせる","r":"persuade 人 to ～★"},{"n":"155","w":"perceive","m":"気づく、受け止める","p":[["per","完全に"],["ceive","取る"]],"i":"しっかり感じ取る","r":"perception（知覚）"},{"n":"1238","w":"penetrate","m":"つき抜ける、入りこむ","p":[["pene","中へ"]],"i":"中までずぶっと入る","r":"penetration（浸透）"},{"n":"1680","w":"per capita","m":"1人あたり","p":[["per","～につき"],["capita","頭"]],"i":"1つの頭につき","r":"GDP per capita"},{"n":"1200","w":"thoroughly","m":"徹底的に","p":[["thorough","通して"]],"i":"すみずみまで通して","r":"completely ≒"},{"n":"571","w":"permanent","m":"永久の","p":[["per","通して"],["man","残る"]],"i":"ずっと残る","r":"temporary（一時的な）が反対"},{"n":"2019","w":"perpetual","m":"永久の、絶え間ない","p":[["per","通して"],["pet","求める"]],"i":"ずっと続く","r":"eternal ≒"}]},{"world":"mario","title":"ルイージ、ついに勝つ","lab":"副詞：強めと否定","labJa":"テーマ","icon":"theme","en":"Luigi {{hardly}} ever wins against Mario. Today, he {{barely}} catches the last train to the stadium. There is {{scarcely}} any time left. \"Are you ready?\" asks Peach. \"{{Absolutely:absolutely}}!\" says Luigi. \"I will {{definitely}} win this time.\" {{Frankly:frankly}}, nobody believes him. Peach says winning is not {{necessarily}} everything. But Luigi wins! He {{literally}} jumps for joy. It happens {{exactly}} as he said. The {{seemingly}} weak brother is a hero.","ja":"ルイージはマリオにめったに勝てない。今日、彼はスタジアムへの最終電車にかろうじて間に合う。残り時間はほとんどない。「準備はいい？」とピーチが聞く。「もちろん！」とルイージ。「今回は絶対に勝つよ」。正直に言って、誰も彼を信じていない。勝つことが必ずしもすべてではない、とピーチは言う。でもルイージが勝つ！ 彼は文字どおり飛び上がって喜ぶ。まさに彼が言ったとおりになる。一見弱そうな弟がヒーローだ。","ken":"★<b>hardly / scarcely（ほとんど～ない）</b>は否定の意味！ hard（一生けんめい）と hardly はまったく別やで。<b>not necessarily（必ずしも～ない）</b>は部分否定、長文の内容一致で超ねらわれる★","words":[{"n":"583","w":"hardly","m":"ほとんど～ない","p":[["hard","かたい→ほとんど"]],"i":"ほぼゼロ","r":"hard（一生けんめい）と別物★"},{"n":"847","w":"barely","m":"かろうじて、ほとんど～ない","p":[["bare","むき出しの"]],"i":"ギリギリセーフ","r":"barely pass（ギリギリ合格）"},{"n":"848","w":"scarcely","m":"ほとんど～ない","p":[["scarce","乏しい"]],"i":"ほぼない","r":"scarce（乏しい）"},{"n":"1193","w":"absolutely","m":"絶対に、もちろん","p":[["absolute","完全な"]],"i":"100％","r":"Absolutely!（もちろん！）"},{"n":"594","w":"definitely","m":"確かに、絶対に","p":[["define","はっきりさせる"]],"i":"はっきりと","r":"Definitely!（絶対そう！）"},{"n":"1696","w":"frankly","m": ],["via","道"]],"i":"3本道の交差点の雑談","r":"trivia（雑学）"},{"n":"1632","w":"absurd","m":"ばかげた","p":[["absurd","耳ざわりな"]],"i":"ありえない","r":"ridiculous ≒"}]},{"world":"mario","title":"ピーチの演説","lab":"形容詞いろいろ2","labJa":"テーマ","icon":"theme","en":"Peach gives a speech about {{domestic}} problems. \"We have an {{urgent}} need for new roads,\" she says. \"This is a {{practical}} plan.\" The idea gets {{widespread}} support. She keeps a {{moderate}} tone and gives {{rational}} reasons. Many citizens feel {{patriotic}}. The kingdom and the Sand Kingdom have a {{mutual}} understanding, and they have avoided {{civil}} war. Her {{sophisticated}} way of speaking impresses everyone.","ja":"ピーチが国内の問題について演説する。「新しい道路が緊急に必要です」と彼女。「これは実用的な計画です」。その考えは広い支持を集める。彼女はおだやかな口調を保ち、理にかなった理由を挙げる。多くの市民が愛国心を感じる。王国と砂の国はおたがいに理解し合っていて、内戦をさけてきた。彼女の洗練された話し方はみんなを感心させる。","ken":"<b>domestic（国内の、家庭内の）⇔ foreign（外国の）</b>。civil は「市民の」で、civil war（内戦）、civil rights（公民権）。mutual（おたがいの）は mutual understanding で覚えよう★","words":[{"n":"295","w":"domestic","m":"国内の、家庭の","p":[["dom","家"]],"i":"家の中の、国の中の","r":"foreign（外国の）が反対"},{"n":"1128","w":"urgent","m":"緊急の","p":[["urge","せき立てる"]],"i":"すぐやらなあかん","r":"urgency（緊急）"},{"n":"540","w":"practical","m":"実用的な","p":[["pract","行う"]],"i":"実際に使える","r":"practically（実際には、ほとんど）"},{"n":"1123","w":"widespread","m":"広まった","p":[["wide","広く"],["spread","広がる"]],"i":"あちこちに広がる","r":"common ≒"},{"n":"1181","w":"moderate","m":"適度な、おだやかな","p":[["mod","ほどよい"]],"i":"ちょうどいい","r":"moderate exercise（適度な運動）"},{"n":"1155","w":"rational","m":"理にかなった","p":[["ratio","理性"]],"i":"筋が通っている","r":"irrational（不合理な）"},{"n":"2003","w":"patriotic","m":"愛国的な","p":[["patri","父の国"]],"i":"自分の国が好き","r":"patriotism（愛国心）"},{"n":"1135","w":"mutual","m":"おたがいの","p":[["mut","交換する"]],"i":"お互いさま","r":"mutual understanding（相互理解）"},{"n":"308","w":"civil","m":"市民の、国内の","p":[["civ","市民"]],"i":"市民どうしの","r":"civil war（内戦）"},{"n":"816","w":"sophisticated","m":"洗練された、高度な","p":[["sophist","かしこい"]],"i":"あか抜けた","r":"sophisticated technology（高度な技術）"}]},{"world":"mario","title":"レース後の言い合い","lab":"言う","labJa":"テーマ","icon":"theme","en":"After the race, Wario {{boasts:boast}} about his speed. \"I'm the best!\" he says. Peach {{praises:praise}} Luigi instead. Wario {{argues:argue}} with her. He {{claims:claim}} that Luigi cheated. Kinopio {{criticizes:criticize}} Wario for lying. Peach {{scolds:scold}} Wario like a child. Mario {{advises:advise}} him to calm down. He also {{warns:warn}} him about the rules. Finally, Wario {{apologizes:apologize}}. \"Don't {{mention}} it,\" says Luigi.","ja":"レースのあと、ワリオは自分のスピードを自慢する。「オレが最高だ！」と彼。代わりにピーチはルイージをほめる。ワリオは彼女と言い争う。ルイージがズルをしたと主張する。キノピオはうそをついたことでワリオを批判する。ピーチはワリオを子どもみたいにしかる。マリオは彼に落ち着くよう忠告する。ルールについても警告する。最後に、ワリオは謝る。「気にしないで」とルイージ。","ken":"「言う」系の動詞は語法がめっちゃ大事★ <b>apologize to 人 for ～</b>、<b>warn 人 of/about ～</b>、<b>advise 人 to ～</b>。claim は「（本当だと）主張する」で、日本語の「クレーム（苦情）」は complaint やで！","words":[{"n":"1432","w":"boast","m":"自慢する","p":[["boast","大声"]],"i":"えらそうに言う","r":"boast about ～"},{"n":"371","w":"praise","m":"ほめる、称賛","p":[["praise","価値"]],"i":"価値を認めてほめる","r":"praise A for B"},{"n":"69","w":"argue","m":"言い争う、主張する","p":[["argue","はっきりさせる"]],"i":"意見をぶつける","r":"argument（議論）"},{"n":"56","w":"claim","m":"主張する、要求する","p":[["claim","叫ぶ"]],"i":"本当だと言い張る","r":"★日本語の「クレーム」は complaint"},{"n":"375","w":"criticize","m":"批判する","p":[["critic","判断する人"]],"i":"悪いところを指摘","r":"criticism（批判）"},{"n":"1417","w":"scold","m":"しかる","p":[["scold","あざける"]],"i":"ガミガミ怒る","r":"scold 人 for ～"},{"n":"362","w":"advise","m":"忠告する","p":[["ad","～へ"],["vise","見る"]],"i":"相手を見てアドバイス","r":"advice（名詞）とスペル注意★"},{"n":"94","w":"warn","m":"警告する","p":[["warn","注意する"]],"i":"危ないよと言う","r":"warn 人 of ～"},{"n":"366","w":"apologize","m":"謝る","p":[["apo","離れて"],["logy","言葉"]],"i":"弁明の言葉","r":"apologize to 人 for ～"},{"n":"60","w":"mention","m":"述べる、言及する","p":[["ment","心"]],"i":"心に浮かべさせる","r":"Don't mention it.（どういたしまして）"}]},{"world":"mario","title":"平和会議","lab":"話す","labJa":"テーマ","icon":"theme","en":"Peach {{greets:greet}} Koopa at the peace meeting. They {{chat}} for a while. Then they {{negotiate}} a peace deal. Koopa {{swears:swear}} he will stop attacking. He {{vows:vow}} to be good. He even {{pledges:pledge}} money to rebuild the town. Kamek {{pleads:plead}} with Koopa to change his mind. Koopa Jr. {{begs:beg}} his father to keep the promise. Peach {{cites:cite}} an old peace treaty. She {{clarifies:clarify}} every rule.","ja":"ピーチは平和会議でクッパにあいさつする。二人はしばらくおしゃべりする。それから平和協定について交渉する。クッパは攻撃をやめると誓う。良い子になると誓う。町の再建のためにお金を出すことまで約束する。カメックは考え直すようクッパに嘆願する。クッパJr.は父に約束を守るよう頼みこむ。ピーチは昔の平和条約を引用する。彼女はすべてのルールをはっきりさせる。","ken":"「誓う」が3つ！ <b>swear, vow, pledge</b>。swear は「ののしる」の意味もあるで。beg は「頼みこむ、物ごいする」、I beg your pardon?（もう一度言ってください）は会話の定番。","words":[{"n":"870","w":"greet","m":"あいさつする","p":[["greet","呼びかける"]],"i":"こんにちは！","r":"greeting（あいさつ）"},{"n":"892","w":"chat","m":"おしゃべりする","p":[["chat","ペチャクチャ"]],"i":"気軽におしゃべり","r":"チャット"},{"n":"1261","w":"negotiate","m":"交渉する","p":[["neg","否定"],["oti","ひま"]],"i":"ひまじゃない仕事の話し合い","r":"negotiation（交渉）"},{"n":"1713","w":"swear","m":"誓う、ののしる","p":[["swear","誓う"]],"i":"神にかけて言う","r":"swear-swore-sworn"},{"n":"1761","w":"vow","m":"誓う、誓い","p":[["vow","誓約"]],"i":"かたく約束する","r":"wedding vows（結婚の誓い）"},{"n":"1767","w":"pledge","m":"誓約する、誓約","p":[["pledge","担保"]],"i":"公に約束する","r":"pledge money（寄付を約束する）"},{"n":"1778","w":"plead","m":"嘆願する、弁護する","p":[["plead","訴える"]],"i":"必死にお願い","r":"plead guilty（罪を認める）"},{"n":"882","w":"beg","m":"頼みこむ、物ごいする","p":[["beg","求める"]],"i":"お願いします！","r":"I beg your pardon?"},{"n":"1219","w":"cite","m":"引用する、挙げる","p":[["cite","呼び出す"]],"i":"例として持ち出す","r":"citation（引用）"},{"n":"1701","w":"clarify","m":"はっきりさせる","p":[["clar","明るい"]],"i":"クリアにする","r":"clarification（説明）"}]},{"world":"mario","title":"クッパの野望","lab":"支配","labJa":"テーマ","icon":"theme","en":"Koopa wants to {{dominate}} the kingdom. He tries to {{dictate}} everything people do. He plans to {{regulate}} the price of mushrooms. Peach will not {{tolerate}} this. She {{guarantees:guarantee}} freedom for everyone. Koopa's soldiers {{violate}} the rules. One soldier decides to {{betray}} Koopa and helps Mario. The kingdom's walls {{withstand}} Koopa's attack. Peach makes new laws to {{curb}} his power. Bad weather also {{hinders:hinder}} Koopa's army.","ja":"クッパは王国を支配したい。人々がすることすべてに命令しようとする。キノコの値段を規制するつもりだ。ピーチはこれを許さない。彼女はすべての人に自由を保証する。クッパの兵士たちはルールに違反する。ある兵士はクッパを裏切ることに決めて、マリオを助ける。王国の城壁はクッパの攻撃に耐える。ピーチは彼の力を抑えるために新しい法律を作る。悪天候もクッパ軍をじゃまする。","ken":"<b>tolerate（がまんする、許す）</b>は can't tolerate ～ の形でよく使う。dictate は「命令する」と「書き取らせる」、dictator（独裁者）もセットで！ hinder は「じゃまする」、prevent に近いで。","words":[{"n":"868","w":"dominate","m":"支配する","p":[["domin","主人"]],"i":"主人としておさえる","r":"dominant（支配的な）"},{"n":"1211","w":"dictate","m":"命令する、書き取らせる","p":[["dict","言う"]],"i":"言ったとおりにさせる","r":"dictator（独裁者）"},{"n":"889","w":"regulate","m":"規制する","p":[["reg","規則"]],"i":"ルールで管理する","r":"regulation（規制）"},{"n":"1431","w":"tolerate","m":"がまんする、許容する","p":[["toler","耐える"]],"i":"がまんして受け入れる","r":"tolerance（寛容）"},{"n":"867","w":"guarantee","m":"保証する","p":[["guarantee","守る"]],"i":"絶対だと約束する","r":"ギャランティー"},{"n":"1228","w":"violate","m":"違反する、侵害する","p":[["viol","力"]],"i":"力で破る","r":"violation（違反）"},{"n":"1235","w":"betray","m":"裏切る","p":[["be","強め"],["tray","渡す"]],"i":"敵に引き渡す","r":"betrayal（裏切り）"},{"n":"1774","w":"withstand","m":"耐える","p":[["with","反対に"],["stand","立つ"]],"i":"立ち向かって耐える","r":"resist ≒"},{"n":"1773","w":"curb","m":"抑える、歩道のふち","p":[["curb","曲げる"]],"i":"手綱でおさえる","r":"curb spending（支出を抑える）"},{"n":"1732","w":"hinder","m":"じゃまする","p":[["hind","後ろ"]],"i":"後ろに引っぱる","r":"hinder A from ～ing"}]},{"world":"mario","title":"ルイージとおばけ屋敷","lab":"心の動詞","labJa":"テーマ","icon":"feel","en":"Luigi lost his best friend, a friendly ghost. He {{weeps:weep}} for days. The whole town {{mourns:mourn}} with him. He {{cherishes:cherish}} every memory. He {{yearns:yearn}} to see his friend again. One night, a strange voice tries to {{tempt}} him into a dark mansion. He {{hesitates:hesitate}} at the door. He doesn't {{dare}} to go inside alone. \"{{Trust:trust}} me,\" says Mario. Later, Luigi {{forgives:forgive}} the ghost who scared him. \"{{Pardon:pardon}} me,\" says the ghost.","ja":"ルイージは親友の、やさしいおばけを失った。何日も泣く。町じゅうが彼と一緒に悲しむ。彼はすべての思い出を大切にしている。もう一度友だちに会いたいと強く願う。ある夜、不思議な声が彼を暗い屋敷へ誘いこもうとする。彼はドアの前でためらう。一人で中に入る勇気がない。「オレを信じろ」とマリオ。あとで、ルイージは自分をこわがらせたおばけを許す。「失礼しました」とおばけは言う。","ken":"「泣く」は <b>cry（声を出して）、weep（しくしく涙を流して）、sob（すすり泣き）</b>。★<b>hesitate to ～（～するのをためらう）</b>、Don't hesitate to ask.（遠慮なく聞いて）はメールの定番やで。","words":[{"n":"1374","w":"weep","m":"しくしく泣く","p":[["weep","嘆く"]],"i":"涙をぽろぽろ","r":"weep-wept-wept"},{"n":"1703","w":"mourn","m":"（死を）悼む、嘆く","p":[["mourn","悲しむ"]],"i":"亡くなった人を悲しむ","r":"mourning（喪）"},{"n":"1245","w":"cherish","m":"大切にする","p":[["cher","大切な"]],"i":"宝物みたいに心にしまう","r":"cherish memories"},{"n":"1764","w":"yearn","m":"強く願う、あこがれる","p":[["yearn","熱望"]],"i":"会いたくてたまらない","r":"yearn for ～"},{"n":"1202","w":"tempt","m":"誘惑する","p":[["tempt","試す"]],"i":"悪いことに誘う","r":"temptation（誘惑）"},{"n":"864","w":"hesitate","m":"ためらう","p":[["hesit","くっつく"]],"i":"足がくっついて動けない","r":"hesitate to ～"},{"n":"1276","w":"dare","m":"思い切って～する","p":[["dare","勇気がある"]],"i":"勇気を出してやる","r":"How dare you!（よくもそんなことを！）"},{"n":"369","w":"trust","m":"信頼する、信頼","p":[["trust","しっかり"]],"i":"心から信じる","r":"trustworthy（信頼できる）"},{"n":"171","w":"forgive","m":"許す","p":[["for","完全に"],["give","与える"]],"i":"全部ゆるしてあげる","r":"forgive A for B"},{"n":"136","w":"pardon","m":"許す、許し","p":[["par","完全に"],["don","与える"]],"i":"罪をゆるす","r":"Pardon?（もう一度お願いします）"}]},{"world":"mario","title":"配管工のお仕事","lab":"仕事","labJa":"テーマ","icon":"theme","en":"Mario thinks about his {{career}}. His {{occupation}} is plumber, and the job requires hard {{labor}}. Today's {{task}} is to fix a pipe at the castle. It's his {{duty}} to keep the castle safe. Kinopio's {{role}} is to help him. Peach's {{secretary}} handles the papers. The castle {{administration}} is busy. Some Kinopio work there as {{volunteers:volunteer}}. A travel {{agency}} sends tourists to the castle.","ja":"マリオは自分のキャリアについて考える。彼の職業は配管工で、その仕事はきつい労働が必要だ。今日の作業はお城のパイプを直すことだ。お城を安全に保つのは彼の義務だ。キノピオの役割は彼を手伝うことだ。ピーチの秘書が書類を処理している。お城の管理部門は忙しい。そこでボランティアとして働いているキノピオもいる。旅行代理店がお城に観光客を送ってくる。","ken":"仕事の単語！ <b>occupation（職業）、career（経歴・生涯の仕事）、labor（労働）、task（作業）、duty（義務）</b>。マリオの本職は配管工（plumber）って知ってた？笑","words":[{"n":"454","w":"career","m":"経歴、職業","p":[["car","車輪"]],"i":"人生で走ってきた道","r":"★発音は「カリア」"},{"n":"724","w":"occupation","m":"職業、占領","p":[["occupy","占める"]],"i":"毎日の時間を占めるもの","r":"What's your occupation?"},{"n":"994","w":"labor","m":"労働","p":[["labor","苦労"]],"i":"体を使う仕事","r":"laboratory（研究所）も「働く場所」"},{"n":"425","w":"task","m":"作業、仕事","p":[["task","税"]],"i":"やらなあかん仕事","r":"multitasking"},{"n":"220","w":"duty","m":"義務、関税","p":[["due","当然の"]],"i":"当然やるべきこと","r":"on duty（勤務中）、duty-free（免税の）"},{"n":"408","w":"role","m":"役割","p":[["role","巻物"]],"i":"台本の役","r":"play a role in ～（～で役割を果たす）"},{"n":"1072","w":"secretary","m":"秘書、長官","p":[["secret","秘密"]],"i":"秘密を守る人","r":"Secretary of State（国務長官）"},{"n":"762","w":"administration","m":"管理、行政","p":[["ad","～へ"],["minister","仕える"]],"i":"運営すること","r":"administrative（管理の）"},{"n":"250","w":"volunteer","m":"ボランティア、自分から申し出る","p":[["vol","意志"]],"i":"自分の意志でやる人","r":"voluntary（自発的な）"},{"n":"247","w":"agency","m":"代理店、機関","p":[["ag","行う"]],"i":"代わりにやる会社","r":"agent（代理人）"}]},{"world":"mario","title":"王国の国勢調査","lab":"人々","labJa":"テーマ","icon":"theme","en":"The kingdom holds a {{census}} every ten years. The {{population}} is growing. The {{majority}} of people live in towns. {{Demographics:demographics}} show that young people are leaving the farms. Long ago, most people were {{peasants:peasant}}. Some people were even {{slaves:slave}}, and that was a dark time in history. Today, a big {{crowd}} gathers for the festival. Old {{folk}} songs are sung. Kinopio, a {{patient}} teacher, explains the history of {{mankind}}.","ja":"王国は10年ごとに国勢調査を行う。人口は増えている。人々の大多数は町に住んでいる。人口統計によると、若者が農場を離れている。昔は、ほとんどの人が農民だった。奴隷にされた人もいて、それは歴史の暗い時代だった。今日、お祭りのために大勢の人が集まる。古い民謡が歌われる。忍耐強い先生のキノピオが、人類の歴史を説明する。","ken":"★<b>patient は「忍耐強い」と「患者」</b>の2つ！ 長文でどっちの意味か見分けるのが大事。population は「人口」で、large / small で大小を言う（many / few はダメ）。","words":[{"n":"1858","w":"census","m":"国勢調査","p":[["cens","評価する"]],"i":"国の人数を数える","r":"人口調査"},{"n":"401","w":"population","m":"人口","p":[["popul","人々"]],"i":"住んでいる人の数","r":"a large population（many ではない）"},{"n":"460","w":"majority","m":"大多数","p":[["major","より大きい"]],"i":"半分より多く","r":"minority（少数派）が反対"},{"n":"2013","w":"demographics","m":"人口統計","p":[["demo","人々"],["graph","書く"]],"i":"人々のデータ","r":"demographic（人口統計の）"},{"n":"1941","w":"peasant","m":"農民","p":[["pays","田舎"]],"i":"昔の小作農","r":"farmer ≒"},{"n":"746","w":"slave","m":"奴隷","p":[["Slav","スラブ人"]],"i":"自由を奪われた人","r":"slavery（奴隷制度）"},{"n":"421","w":"crowd","m":"群衆、人ごみ","p":[["crowd","押す"]],"i":"ぎゅうぎゅうの人だかり","r":"crowded（混雑した）"},{"n":"1048","w":"folk","m":"人々、民間の","p":[["folk","人々"]],"i":"ふつうの人たち","r":"folk song（民謡）、l は読まない"},{"n":"205","w":"patient","m":"忍耐強い、患者","p":[["pati","苦しむ"]],"i":"苦しさに耐える（人）","r":"★2つの意味"},{"n":"954","w":"mankind","m":"人類","p":[["man","人"],["kind","種類"]],"i":"人間という種類","r":"humankind ≒"}]},{"world":"mario","title":"王国の伝統","lab":"伝統","labJa":"テーマ","icon":"theme","en":"The Kinoko Kingdom has a long {{tradition}}. It's an old {{custom}} to eat mushroom soup on New Year's Day. The castle is part of the kingdom's {{heritage}}. It is the {{legacy}} of the first king. A museum shows {{artifacts:artifact}} from an ancient {{civilization}}. Kinopio has a {{habit}} of bowing to everyone. His daily {{routine}} starts at 5 a.m. Visitors love the {{hospitality}} of the kingdom. The {{courtesy}} of its people is famous.","ja":"キノコ王国には長い伝統がある。元日にキノコスープを食べるのは昔からの習慣だ。お城は王国の遺産の一部だ。それは最初の王が遺したものだ。博物館には古代文明の工芸品が展示されている。キノピオには誰にでもおじぎをする癖がある。彼の毎日の決まった流れは朝5時に始まる。訪れる人たちは王国のおもてなしが大好きだ。そこの人々の礼儀正しさは有名だ。","ken":"<b>custom（社会の習慣）と habit（個人の癖）</b>の違い★ customs は「税関」の意味もある！ hospitality は「おもてなし」で、ホテル業界のことを hospitality industry って言うで。","words":[{"n":"448","w":"tradition","m":"伝統","p":[["tra","向こうへ"],["dit","与える"]],"i":"次の世代へ渡すもの","r":"traditional（伝統的な）"},{"n":"195","w":"custom","m":"（社会の）習慣","p":[["custom","慣れ"]],"i":"みんながする習わし","r":"customs（税関）"},{"n":"1059","w":"heritage","m":"遺産","p":[["herit","相続"]],"i":"受けつがれたもの","r":"World Heritage（世界遺産）"},{"n":"1839","w":"legacy","m":"遺産、遺したもの","p":[["leg","任せる"]],"i":"後に遺されたもの","r":"heritage ≒"},{"n":"1843","w":"artifact","m":"工芸品、人工物","p":[["art","技"],["fact","作る"]],"i":"人が作ったもの","r":"ancient artifacts"},{"n":"948","w":"civilization","m":"文明","p":[["civil","市民"]],"i":"都市が発達した社会","r":"civilized（文明化した）"},{"n":"418","w":"habit","m":"（個人の）癖、習慣","p":[["habit","持つ"]],"i":"身についたこと","r":"be in the habit of ～ing"},{"n":"715","w":"routine","m":"決まった手順、日課","p":[["route","道"]],"i":"毎日通る道","r":"daily routine（日課）"},{"n":"1822","w":"hospitality","m":"おもてなし","p":[["hospit","客"]],"i":"お客を大切にすること","r":"hospital（病院）も同じ仲間"},{"n":"1499","w":"courtesy","m":"礼儀正しさ","p":[["court","宮廷"]],"i":"宮廷のマナー","r":"courteous（礼儀正しい）"}]},{"world":"minecraft","title":"新しい家の会議","lab":"con-","labJa":"一緒に","icon":"con","en":"Steve and Alex hold a {{conference}} about a new house. Alex {{considers:consider}} the options. \"The {{construction}} will take a week,\" she says. Steve {{complains:complain}}. \"That's too long!\" There is a small {{conflict}}, but they agree. The house will {{contain}} a big kitchen and a {{comfortable}} bed. Building it will {{consume}} a lot of wood. As a {{consequence}}, they must cut many trees. Finally, the house is {{complete}}.","ja":"スティーブとアレックスは新しい家について会議を開く。アレックスは選択肢をよく考える。「建設には1週間かかるわ」と彼女。スティーブは文句を言う。「長すぎるよ！」小さな対立があるけど、二人は合意する。家には大きな台所と快適なベッドが入る予定だ。それを建てるにはたくさんの木材を消費する。その結果として、二人はたくさんの木を切らないといけない。ついに、家が完成する。","ken":"con-/com- 第2弾！ <b>complain about ～（～について文句を言う）</b>、名詞は complaint。consequence（結果）は result より「悪い結果」っぽいことが多いで。","words":[{"n":"928","w":"conference","m":"会議","p":[["con","一緒に"],["fer","運ぶ"]],"i":"意見を持ち寄る","r":"press conference（記者会見）"},{"n":"2","w":"consider","m":"よく考える、見なす","p":[["con","完全に"],["sider","星"]],"i":"星をじっくり観察する","r":"consider A (to be) B"},{"n":"488","w":"construction","m":"建設","p":[["con","一緒に"],["struct","積む"]],"i":"積み上げて建てる","r":"construct（建設する）"},{"n":"350","w":"complain","m":"文句を言う","p":[["com","強め"],["plain","嘆く"]],"i":"ブーブー嘆く","r":"complaint（苦情）"},{"n":"968","w":"conflict","m":"対立、衝突","p":[["con","一緒に"],["flict","打つ"]],"i":"ぶつかり合う","r":"be in conflict with ～"},{"n":"344","w":"contain","m":"含む","p":[["con","一緒に"],["tain","持つ"]],"i":"中に一緒に持つ","r":"container（入れ物）"},{"n":"543","w":"comfortable","m":"快適な","p":[["com","強め"],["fort","力"]],"i":"力がわく心地よさ","r":"comfort（快適さ）"},{"n":"387","w":"consume","m":"消費する","p":[["con","完全に"],["sume","取る"]],"i":"全部使い切る","r":"consumption（消費）、consumer（消費者）"},{"n":"519","w":"consequence","m":"結果","p":[["con","一緒に"],["sequ","続く"]],"i":"あとについてくるもの","r":"as a consequence（その結果）"},{"n":"530","w":"complete","m":"完成した、完成させる","p":[["com","完全に"],["plete","満たす"]],"i":"全部満たす","r":"completely（完全に）"}]},{"world":"minecraft","title":"線路をつなげ","lab":"con-","labJa":"一緒に","icon":"con","en":"Steve finds a {{convenient}} way to travel: a rail system. It saves a {{considerable}} amount of time. He {{consults:consult}} Alex about the design. Ten rails {{constitute}} one line. He wants to {{convert}} an old mine into a station. Alex {{composes:compose}} a song for the opening. Steve {{commits:commit}} himself to the project. Each station {{corresponds:correspond}} to a village. One day, he {{confronts:confront}} a creeper on the tracks. He is {{conscious}} of the danger and jumps away.","ja":"スティーブは移動に便利な方法を見つける。線路のシステムだ。それでかなりの時間が節約できる。彼はデザインについてアレックスに相談する。10本のレールで1路線が構成される。彼は古い採掘場を駅に変えたい。アレックスは開通式のために曲を作る。スティーブはそのプロジェクトに打ちこむ。それぞれの駅はひとつの村に対応している。ある日、彼は線路の上でクリーパーと向き合う。彼は危険を意識していて、飛びのく。","ken":"★<b>commit</b> は「（罪を）犯す」と「打ちこむ（commit oneself to）」の2つ！ consult は「相談する」と「（辞書を）調べる」。considerable（かなりの）と considerate（思いやりのある）の区別も鉄板やで。","words":[{"n":"553","w":"convenient","m":"便利な","p":[["con","一緒に"],["ven","来る"]],"i":"ちょうどよく一緒に来る","r":"convenience store（コンビニ）"},{"n":"560","w":"considerable","m":"かなりの","p":[["consider","考える"],["able","できる"]],"i":"考慮すべきほどの","r":"considerate（思いやりのある）と区別★"},{"n":"629","w":"consult","m":"相談する、調べる","p":[["consult","相談"]],"i":"専門家に聞く、辞書を引く","r":"consultant（コンサルタント）"},{"n":"664","w":"constitute","m":"構成する","p":[["con","一緒に"],["stitute","立てる"]],"i":"集まって形を作る","r":"constitution（構成、憲法）"},{"n":"662","w":"convert","m":"変える","p":[["con","完全に"],["vert","向ける"]],"i":"向きをすっかり変える","r":"conversion（転換）"},{"n":"619","w":"compose","m":"作曲する、構成する","p":[["com","一緒に"],["pose","置く"]],"i":"音をならべて置く","r":"be composed of ～（～から成る）"},{"n":"610","w":"commit","m":"（罪を）犯す、打ちこむ","p":[["com","一緒に"],["mit","送る"]],"i":"自分を任せる","r":"commit oneself to ～"},{"n":"655","w":"correspond","m":"一致する、文通する","p":[["cor","一緒に"],["respond","応える"]],"i":"おたがいに応える","r":"correspondence（文通）"},{"n":"624","w":"confront","m":"立ち向かう","p":[["con","一緒に"],["front","正面"]],"i":"正面から向き合う","r":"confrontation（対立）"},{"n":"287","w":"conscious","m":"意識している","p":[["con","完全に"],["sci","知る"]],"i":"よくわかっている","r":"be conscious of ～"}]},{"world":"minecraft","title":"緑の村計画","lab":"con-","labJa":"一緒に","icon":"con","en":"The villagers have a {{collective}} meeting. The topic is the {{conservation}} of the forest. It's a {{controversial}} issue. Alex explains the {{concept}} of a \"green village.\" Each house is a {{component}} of the plan. She shows the {{contrast}} between old and new villages. In the {{context}} of climate change, it's important. The villagers sign a {{contract}}. They follow the {{convention}} of planting a tree for every one they cut. Their village becomes a model of {{contemporary}} design.","ja":"村人たちは全体集会を開く。議題は森林の保護だ。それは賛否が分かれる問題だ。アレックスが「緑の村」という考え方を説明する。一軒一軒の家は計画の構成要素だ。彼女は古い村と新しい村の対比を見せる。気候変動という背景の中で、それは重要だ。村人たちは契約に署名する。木を1本切るごとに1本植えるという慣習に従う。彼らの村は現代的なデザインのお手本になる。","ken":"★<b>controversial（議論を呼ぶ）</b>は長文の超頻出語！ context は「文脈・背景」で、文脈から推測問題の「文脈」もこれ。contemporary は「現代の」と「同時代の」の2つやで。","words":[{"n":"1656","w":"collective","m":"集団の","p":[["col","一緒に"],["lect","集める"]],"i":"みんなでまとまった","r":"collect（集める）"},{"n":"1083","w":"conservation","m":"保護、保存","p":[["con","強め"],["serve","守る"]],"i":"大事に守ること","r":"conserve（保存する）"},{"n":"1171","w":"controversial","m":"議論を呼ぶ","p":[["contro","反対に"],["vers","向ける"]],"i":"意見が反対に分かれる","r":"controversy（論争）"},{"n":"1111","w":"concept","m":"概念、考え","p":[["con","一緒に"],["cept","取る"]],"i":"頭の中にまとめたもの","r":"conception（考え）"},{"n":"1041","w":"component","m":"構成要素","p":[["com","一緒に"],["pon","置く"]],"i":"一緒に置かれる部品","r":"part ≒"},{"n":"442","w":"contrast","m":"対比、対照","p":[["contra","反対に"],["st","立つ"]],"i":"反対側に立たせて比べる","r":"in contrast（対照的に）"},{"n":"738","w":"context","m":"文脈、背景","p":[["con","一緒に"],["text","織る"]],"i":"まわりに織りこまれた状況","r":"in the context of ～"},{"n":"703","w":"contract","m":"契約、縮む","p":[["con","一緒に"],["tract","引く"]],"i":"おたがいを引き合う約束","r":"★「縮む」の意味もある"},{"n":"778","w":"convention","m":"慣習、大会","p":[["con","一緒に"],["vent","来る"]],"i":"みんなが集まって決めたやり方","r":"conventional（従来の）"},{"n":"795","w":"contemporary","m":"現代の、同時代の","p":[["con","一緒に"],["tempor","時"]],"i":"同じ時代の","r":"modern ≒"}]},{"world":"minecraft","title":"二人で橋を作る","lab":"con-","labJa":"一緒に","icon":"con","en":"Steve and Alex {{cooperate}} to build a bridge. Steve wants stone, but Alex wants {{concrete}}. They reach a {{compromise}}: they will use both. They mix a special {{compound}}. Alex {{confirms:confirm}} that it's strong. Their test results are {{consistent}} every time. A villager {{conveys:convey}} a message: \"The bridge must be ready today.\" The deadline {{compels:compel}} them to work fast. The village gives them emeralds to {{compensate}} them. They {{conclude}} that teamwork is the key.","ja":"スティーブとアレックスは協力して橋を作る。スティーブは石を使いたいけど、アレックスはコンクリートを使いたい。二人は妥協点を見つける。両方使うのだ。二人は特別な混合物を混ぜる。アレックスはそれが丈夫だと確認する。テスト結果は毎回一貫している。村人がメッセージを伝える。「橋は今日中に完成させなければなりません」。締め切りが二人に急いで働くことを強いる。村は二人に報いるためにエメラルドを渡す。二人はチームワークが鍵だと結論づける。","ken":"<b>concrete（具体的な）⇔ abstract（抽象的な）</b>は反対語セット★ 「コンクリート」の意味だけちゃうで！ compel 人 to ～（人に無理やり～させる）は force と同じ形。","words":[{"n":"895","w":"cooperate","m":"協力する","p":[["co","一緒に"],["operate","働く"]],"i":"一緒に働く","r":"cooperation（協力）"},{"n":"806","w":"concrete","m":"具体的な、コンクリート","p":[["con","一緒に"],["crete","育つ"]],"i":"固まって形がはっきり","r":"abstract（抽象的な）が反対"},{"n":"1288","w":"compromise","m":"妥協、妥協する","p":[["com","一緒に"],["promise","約束"]],"i":"おたがいゆずって約束","r":"reach a compromise"},{"n":"1309","w":"compound","m":"混合物、合成の","p":[["com","一緒に"],["pound","置く"]],"i":"いろいろ一緒に置いた","r":"compound word（複合語）"},{"n":"869","w":"confirm","m":"確認する","p":[["con","強め"],["firm","固い"]],"i":"しっかり固める","r":"confirmation（確認）"},{"n":"835","w":"consistent","m":"一貫した","p":[["con","一緒に"],["sist","立つ"]],"i":"ずっと同じ立ち位置","r":"be consistent with ～（～と一致する）"},{"n":"885","w":"convey","m":"伝える、運ぶ","p":[["con","一緒に"],["vey","道"]],"i":"道を通って運ぶ","r":"conveyor belt"},{"n":"1258","w":"compel","m":"強いる","p":[["com","強め"],["pel","押す"]],"i":"ぐいぐい押してやらせる","r":"compel 人 to ～"},{"n":"1265","w":"compensate","m":"埋め合わせる、補償する","p":[["com","一緒に"],["pens","はかる"]],"i":"釣り合わせる","r":"compensation（補償）"},{"n":"866","w":"conclude","m":"結論づける","p":[["con","完全に"],["clude","閉じる"]],"i":"話を閉じる","r":"conclusion（結論）"}]},{"world":"minecraft","title":"ネザーのガイドブック","lab":"con-","labJa":"一緒に","icon":"con","en":"Alex {{compiles:compile}} a guidebook about the Nether. The book {{comprises:comprise}} ten chapters. Each chapter {{complements:complement}} the others. Steve can't {{comprehend}} some parts. \"Who could {{conceive}} of a world like this?\" he says. In the Nether, players are {{confined:confine}} to small areas. Piglins {{conceal}} gold in their chests. If you {{conform}} to their rules and {{comply}} with them, they won't attack. Steve's visit {{coincides:coincide}} with a big festival there.","ja":"アレックスはネザーについてのガイドブックを編集する。その本は10章で構成されている。それぞれの章がほかの章を補っている。スティーブは理解できない部分がある。「こんな世界を誰が思いつけるんだ？」と彼。ネザーでは、プレイヤーは狭いエリアに閉じこめられる。ピグリンは宝箱の中に金を隠している。彼らのルールに合わせて従えば、攻撃してこない。スティーブの訪問はそこでの大きなお祭りと重なる。","ken":"★<b>comply with ～（～に従う）、conform to ～（～に合わせる）、coincide with ～（～と重なる）</b>は前置詞もセット！ complement（補うもの）と compliment（ほめ言葉）はスペル1文字違い、要注意やで。","words":[{"n":"1745","w":"compile","m":"編集する、まとめる","p":[["com","一緒に"],["pile","積む"]],"i":"集めて積み上げる","r":"compilation（編集）"},{"n":"1236","w":"comprise","m":"構成する、含む","p":[["com","一緒に"],["prise","つかむ"]],"i":"まとめてつかむ","r":"be comprised of ～"},{"n":"1808","w":"complement","m":"補う、補完するもの","p":[["com","完全に"],["ple","満たす"]],"i":"足りないところを満たす","r":"compliment（ほめ言葉）とスペル注意★"},{"n":"1260","w":"comprehend","m":"理解する","p":[["com","完全に"],["prehend","つかむ"]],"i":"全体をつかむ","r":"comprehension（理解）"},{"n":"1264","w":"conceive","m":"思いつく、想像する","p":[["con","完全に"],["ceive","取る"]],"i":"頭の中に取りこむ","r":"concept（概念）"},{"n":"1205","w":"confine","m":"閉じこめる、限定する","p":[["con","完全に"],["fine","境界"]],"i":"境界の中に入れる","r":"be confined to ～"},{"n":"1358","w":"conceal","m":"隠す","p":[["con","完全に"],["ceal","隠す"]],"i":"すっかり隠す","r":"reveal（明らかにする）が反対"},{"n":"1204","w":"conform","m":"合わせる、従う","p":[["con","一緒に"],["form","形"]],"i":"みんなと同じ形にする","r":"conform to ～"},{"n":"1729","w":"comply","m":"従う","p":[["com","完全に"],["ply","満たす"]],"i":"要求を満たす","r":"comply with ～"},{"n":"1231","w":"coincide","m":"同時に起こる、一致する","p":[["co","一緒に"],["in","上に"],["cide","落ちる"]],"i":"同時に落ちてくる","r":"coincidence（偶然の一致）"}]},{"world":"minecraft","title":"村に学校を","lab":"con-","labJa":"一緒に","icon":"con","en":"The village wants a new school, so a {{comprehensive}} plan is needed. Some villagers {{contend}} that school should be {{compulsory}}. Others {{contradict}} them. After a long talk, they reach a {{consensus}}. Every parent gives {{consent}}. Alex {{coordinates:coordinate}} the project. Her plan is {{coherent}} and easy to understand. Kids will {{commute}} by minecart. The new computers are {{compatible}} with the old ones.","ja":"村は新しい学校がほしいので、包括的な計画が必要だ。学校は義務にするべきだと主張する村人もいる。それに反論する人もいる。長い話し合いのあと、彼らは合意に達する。すべての親が同意する。アレックスがプロジェクトの調整をする。彼女の計画は筋が通っていてわかりやすい。子どもたちはトロッコで通学する。新しいコンピューターは古いものと互換性がある。","ken":"<b>consent（同意）と consensus（全体の合意）</b>はセットで！ compulsory（義務の）は compulsory education（義務教育）で覚えよう。contradict は contra（反対に）+ dict（言う）やで。","words":[{"n":"1637","w":"comprehensive","m":"包括的な","p":[["com","完全に"],["prehend","つかむ"]],"i":"全体をつかんだ","r":"comprehensive plan"},{"n":"1712","w":"contend","m":"主張する、争う","p":[["con","強め"],["tend","伸ばす"]],"i":"意見をぐっと伸ばす","r":"contend that ～"},{"n":"1993","w":"compulsory","m":"義務的な","p":[["com","強め"],["puls","押す"]],"i":"押しつけられる","r":"compulsory education（義務教育）"},{"n":"1242","w":"contradict","m":"反論する、矛盾する","p":[["contra","反対に"],["dict","言う"]],"i":"反対のことを言う","r":"contradiction（矛盾）"},{"n":"1465","w":"consensus","m":"合意","p":[["con","一緒に"],["sens","感じる"]],"i":"みんなが同じように感じる","r":"reach a consensus"},{"n":"1579","w":"consent","m":"同意、同意する","p":[["con","一緒に"],["sent","感じる"]],"i":"同じ気持ちになる","r":"informed consent"},{"n":"1438","w":"coordinate","m":"調整する","p":[["co","一緒に"],["ordin","順番"]],"i":"順番を整える","r":"coordinator（まとめ役）"},{"n":"1989","w":"coherent","m":"筋の通った","p":[["co","一緒に"],["here","くっつく"]],"i":"話がくっついてまとまっている","r":"coherence（一貫性）"},{"n":"1248","w":"commute","m":"通勤する、通学する","p":[["com","強め"],["mute","変える"]],"i":"行ったり来たり","r":"commuter（通勤者）"},{"n":"2002","w":"compatible","m":"互換性のある、両立する","p":[["com","一緒に"],["pat","耐える"]],"i":"一緒にいても大丈夫","r":"be compatible with ～"}]},{"world":"minecraft","title":"洞窟のトラブル","lab":"con-","labJa":"一緒に","icon":"con","en":"Steve's red shirt is very {{conspicuous}} in the dark cave, so a creeper sees him at once. Then there is a {{collision}} between a minecart and a wall. The water in the cave is {{contaminated}}. The situation is {{complicated}}. Alex, a {{competent}} engineer, finds the {{correct}} answer. Time is a big {{constraint}}. {{Contrary:contrary}} to what Steve thought, the Nether portal still works. Alex's {{counterpart}} in another world sends a message.","ja":"スティーブの赤いシャツは暗い洞窟の中でとても目立つので、クリーパーがすぐに彼を見つける。それからトロッコと壁が衝突する。洞窟の水は汚染されている。状況は複雑だ。有能なエンジニアのアレックスが正しい答えを見つける。時間が大きな制約だ。スティーブが思っていたのとは反対に、ネザーゲートはまだ動く。別の世界にいるアレックスと同じ立場の人がメッセージを送ってくる。","ken":"★<b>contrary to ～（～に反して）</b>、<b>on the contrary（それどころか）</b>は熟語で超大事！ counterpart は「（別の場所で）同じ立場の人」、日本の首相の counterpart はアメリカ大統領、みたいに使う。","words":[{"n":"1978","w":"conspicuous","m":"目立つ","p":[["con","強め"],["spic","見る"]],"i":"よく見える","r":"noticeable ≒"},{"n":"1554","w":"collision","m":"衝突","p":[["col","一緒に"],["lis","打つ"]],"i":"ぶつかり合う","r":"collide（衝突する）"},{"n":"1646","w":"contaminated","m":"汚染された","p":[["con","一緒に"],["tamin","さわる"]],"i":"よごれにふれた","r":"contamination（汚染）"},{"n":"1124","w":"complicated","m":"複雑な","p":[["com","一緒に"],["plic","折る"]],"i":"折り重なってゴチャゴチャ","r":"complex ≒"},{"n":"1622","w":"competent","m":"有能な","p":[["com","一緒に"],["pet","求める"]],"i":"求められる力がある","r":"competence（能力）"},{"n":"262","w":"correct","m":"正しい、訂正する","p":[["cor","完全に"],["rect","まっすぐ"]],"i":"まっすぐ正しい","r":"correction（訂正）"},{"n":"1827","w":"constraint","m":"制約","p":[["con","強め"],["strain","しばる"]],"i":"ギュッとしばる","r":"constrain（制約する）"},{"n":"316","w":"contrary","m":"反対の","p":[["contra","反対"]],"i":"逆向き","r":"contrary to ～、on the contrary★"},{"n":"1317","w":"counterpart","m":"相手方、対応する人","p":[["counter","反対の"],["part","部分"]],"i":"向こう側の同じ立場の人","r":"同じ役割の人"}]},{"world":"minecraft","title":"スティーブのお店","lab":"in- / en-","labJa":"中に","icon":"in","en":"Alex {{encourages:encourage}} Steve to open a shop. He {{employs:employ}} two villagers. The shop sells many items, {{including:include}} swords and books. Steve {{imports:import}} rare items from other villages. Sales {{indicate:indicate}} that people love enchanted books. One day, Steve {{encounters:encounter}} a wandering trader. The trader {{insists:insist}} on a better price. Steve {{engages:engage}} in a long talk with him. The trader's advice {{influences:influence}} his business, and Steve's shop {{improves:improve}} quickly.","ja":"アレックスはスティーブにお店を開くよう勧める。彼は村人を二人雇う。お店は剣や本をふくむたくさんのアイテムを売る。スティーブはほかの村からめずらしいアイテムを輸入する。売り上げは、人々がエンチャントされた本を大好きだということを示している。ある日、スティーブは行商人と出会う。行商人はもっといい値段を強く求める。スティーブは彼と長い話し合いをする。行商人のアドバイスは彼の商売に影響を与え、スティーブのお店はすぐに良くなる。","ken":"in-/im-/en- は<b>「中に」</b>（たまに「否定」）。マイクラで「中に入る・掘る」イメージ。★<b>insist on ～（～を強く主張する）</b>、<b>engage in ～（～に従事する）</b>、<b>encourage 人 to ～</b>は形ごと覚えよう！","words":[{"n":"42","w":"encourage","m":"勇気づける、勧める","p":[["en","中に"],["courage","勇気"]],"i":"勇気を中に入れる","r":"discourage（やる気をなくさせる）"},{"n":"121","w":"employ","m":"雇う","p":[["em","中に"],["ploy","折りこむ"]],"i":"会社の中に組みこむ","r":"employer（雇い主）、employee（従業員）"},{"n":"9","w":"include","m":"含む","p":[["in","中に"],["clude","閉じる"]],"i":"中に閉じこめる","r":"exclude（除外する）が反対"},{"n":"137","w":"import","m":"輸入する、輸入","p":[["im","中に"],["port","運ぶ"]],"i":"国の中へ運ぶ","r":"export（輸出）が反対"},{"n":"71","w":"indicate","m":"示す","p":[["in","中に"],["dic","言う"]],"i":"指でさし示す","r":"indication（しるし）"},{"n":"125","w":"encounter","m":"出会う","p":[["en","中に"],["counter","反対の"]],"i":"向かい合って出くわす","r":"meet by chance ≒"},{"n":"90","w":"insist","m":"主張する","p":[["in","上に"],["sist","立つ"]],"i":"自分の意見の上に立ち続ける","r":"insist on ～"},{"n":"122","w":"engage","m":"従事する、婚約させる","p":[["en","中に"],["gage","誓約"]],"i":"約束で中に入る","r":"be engaged to ～（～と婚約）"},{"n":"182","w":"influence","m":"影響、影響を与える","p":[["in","中に"],["flu","流れる"]],"i":"中に流れこむ","r":"influential（影響力のある）"},{"n":"29","w":"improve","m":"改善する","p":[["im","中に"],["prove","利益"]],"i":"もうけを中に入れる","r":"improvement（改善）"}]},{"world":"minecraft","title":"村の音楽学校","lab":"in- / en-","labJa":"中に","icon":"in","en":"Alex wants to be {{independent}}, so she builds her own house. Each villager is an {{individual}} with a different job. She gets {{involved}} in a village project to build a music school. The school will be an important {{institution}}. For {{instance}}, kids can learn an {{instrument}}. A teacher gives {{instructions:instruction}}. The project has a big {{impact}} on the village. Visitors get a good {{impression}}. Kids sign up {{immediately}}.","ja":"アレックスは独立したいので、自分の家を建てる。村人一人ひとりは、それぞれ違う仕事を持つ個人だ。彼女は音楽学校を建てる村のプロジェクトにかかわる。学校は大事な機関になるだろう。たとえば、子どもたちは楽器を学べる。先生が指示を出す。プロジェクトは村に大きな影響を与える。訪れる人は良い印象を持つ。子どもたちはすぐに申しこむ。","ken":"<b>independent、individual</b>の in は「否定」の in！ in + dependent（頼る）＝頼らない、in + divid（分ける）＝これ以上分けられない＝個人。★<b>be involved in ～（～にかかわる）</b>は超頻出。","words":[{"n":"277","w":"independent","m":"独立した","p":[["in","否定"],["depend","頼る"]],"i":"誰にも頼らない","r":"be independent of ～"},{"n":"181","w":"individual","m":"個人、個々の","p":[["in","否定"],["divid","分ける"]],"i":"これ以上分けられない1人","r":"individuality（個性）"},{"n":"266","w":"involved","m":"かかわって","p":[["in","中に"],["volve","巻く"]],"i":"巻きこまれた","r":"be involved in ～★"},{"n":"243","w":"institution","m":"機関、制度","p":[["in","中に"],["stitute","立てる"]],"i":"社会の中に立てたもの","r":"institute（研究所）"},{"n":"422","w":"instance","m":"例","p":[["in","近くに"],["stance","立つ"]],"i":"近くに立っている例","r":"for instance（たとえば）"},{"n":"492","w":"instrument","m":"楽器、道具","p":[["in","中に"],["stru","積む"]],"i":"組み立てた道具","r":"musical instrument（楽器）"},{"n":"490","w":"instruction","m":"指示、教育","p":[["in","中に"],["struct","積む"]],"i":"頭の中に積み上げる","r":"instruct（指示する）"},{"n":"242","w":"impact","m":"影響、衝撃","p":[["im","中に"],["pact","打ちこむ"]],"i":"ドンと打ちこむ","r":"have an impact on ～"},{"n":"452","w":"impression","m":"印象","p":[["im","中に"],["press","押す"]],"i":"心に押しつけられたもの","r":"impress（感動させる）"},{"n":"584","w":"immediately","m":"すぐに","p":[["im","否定"],["medi","間"]],"i":"間をおかずに","r":"at once ≒"}]},{"world":"minecraft","title":"パン焼きマシーン","lab":"in- / en-","labJa":"中に","icon":"in","en":"Steve {{invents:invent}} a new machine. It will {{enable}} villagers to make bread faster. He {{intends:intend}} to share it. He {{informs:inform}} the village chief. The chief makes an {{inquiry}} about safety. He doesn't want to {{impose}} new rules. \"Are you {{implying:imply}} it's dangerous?\" Steve asks. The {{internal}} parts are simple. Alex and Steve are {{intimate}} friends, and she {{embraces:embrace}} the idea.","ja":"スティーブは新しい機械を発明する。それで村人たちはもっと早くパンを作れるようになる。彼はそれを共有するつもりだ。彼は村長に知らせる。村長は安全性について問い合わせる。彼は新しいルールを押しつけたくない。「危険だとほのめかしてるの？」とスティーブ。内部の部品はシンプルだ。アレックスとスティーブは親しい友だちで、彼女はその考えを受け入れる。","ken":"★<b>enable 人 to ～（人が～できるようにする）</b>、<b>impose A on B（AをBに押しつける）</b>、<b>inform 人 of ～（人に～を知らせる）</b>。imply（ほのめかす）は長文の「筆者が暗に言いたいこと」でよく出るで！","words":[{"n":"360","w":"invent","m":"発明する","p":[["in","上に"],["vent","来る"]],"i":"アイデアが上に出てくる","r":"invention（発明）"},{"n":"352","w":"enable","m":"可能にする","p":[["en","～にする"],["able","できる"]],"i":"できるようにする","r":"enable 人 to ～"},{"n":"353","w":"intend","m":"～するつもりだ","p":[["in","～へ"],["tend","伸ばす"]],"i":"心をそっちへ伸ばす","r":"intention（意図）"},{"n":"367","w":"inform","m":"知らせる","p":[["in","中に"],["form","形"]],"i":"頭の中に形を作る","r":"inform 人 of ～"},{"n":"768","w":"inquiry","m":"問い合わせ、調査","p":[["in","中に"],["quire","求める"]],"i":"中のことを聞く","r":"inquire（尋ねる）"},{"n":"661","w":"impose","m":"押しつける、課す","p":[["im","上に"],["pose","置く"]],"i":"上にドンと置く","r":"impose A on B"},{"n":"666","w":"imply","m":"ほのめかす","p":[["im","中に"],["ply","折りこむ"]],"i":"言葉の中に折りこむ","r":"implication（含意）"},{"n":"803","w":"internal","m":"内部の","p":[["inter","中の"]],"i":"中にある","r":"external（外部の）が反対"},{"n":"814","w":"intimate","m":"親しい","p":[["intim","いちばん内側の"]],"i":"心のいちばん奥まで","r":"close ≒"},{"n":"701","w":"embrace","m":"受け入れる、抱きしめる","p":[["em","中に"],["brace","腕"]],"i":"腕の中に入れる","r":"hug ≒"}]},{"world":"minecraft","title":"ジャングルの神殿","lab":"in- / en-","labJa":"中に","icon":"in","en":"Alex {{investigates:investigate}} an old temple. She {{inherited:inherit}} a map from her grandfather. An {{inhabitant}} of the jungle warns her. \"Don't go in!\" Alex trusts her {{instinct}} and enters. In the {{inner}} room, she finds a strange machine. It's a great {{innovation}} from the past. It gives her {{insight}} into the old culture. She uses it to {{enhance}} her tools. A rude villager {{insults:insult}} her, but she ignores him. Danger is {{inevitable}}, but she goes on.","ja":"アレックスは古い神殿を調べる。彼女はおじいさんから地図を受けついだ。ジャングルの住人が彼女に警告する。「入っちゃダメだ！」アレックスは自分の直感を信じて中に入る。いちばん奥の部屋で、不思議な機械を見つける。それは昔のすばらしい技術革新だ。それは昔の文化についての洞察を与えてくれる。彼女はそれを使って道具の性能を高める。失礼な村人が彼女を侮辱するけど、彼女は無視する。危険はさけられないけど、彼女は進み続ける。","ken":"★<b>inevitable（さけられない）</b>は長文の超頻出語！ in（否定）+ evit（さける）+ able やで。insight（洞察）は「中を見る力」、innovation（技術革新）は「中に新しさを入れる」。","words":[{"n":"858","w":"investigate","m":"調査する","p":[["in","中に"],["vestig","足跡"]],"i":"足跡を追って中を調べる","r":"investigation（調査）"},{"n":"896","w":"inherit","m":"受けつぐ","p":[["in","中に"],["herit","相続"]],"i":"相続して中に入れる","r":"inheritance（遺産）"},{"n":"1015","w":"inhabitant","m":"住人","p":[["in","中に"],["habit","住む"]],"i":"中に住んでいる人","r":"inhabit（住む）"},{"n":"1018","w":"instinct","m":"本能、直感","p":[["in","中で"],["stinct","突く"]],"i":"内側からつき動かすもの","r":"instinctive（本能的な）"},{"n":"834","w":"inner","m":"内側の","p":[["in","中"]],"i":"中にある","r":"outer（外側の）が反対"},{"n":"1098","w":"innovation","m":"技術革新","p":[["in","中に"],["nov","新しい"]],"i":"中に新しさを入れる","r":"innovative（革新的な）"},{"n":"1010","w":"insight","m":"洞察（力）","p":[["in","中を"],["sight","見る"]],"i":"ものの中まで見る力","r":"insightful（洞察力のある）"},{"n":"891","w":"enhance","m":"高める","p":[["en","～にする"],["hance","高い"]],"i":"より高くする","r":"improve ≒"},{"n":"1014","w":"insult","m":"侮辱する、侮辱","p":[["in","上に"],["sult","跳ぶ"]],"i":"相手に飛びかかって傷つける","r":"insulting（侮辱的な）"},{"n":"1139","w":"inevitable","m":"さけられない","p":[["in","否定"],["evit","さける"]],"i":"さけることができない","r":"inevitably（必然的に）"}]},{"world":"minecraft","title":"アレックスの畑","lab":"in- / en-","labJa":"中に","icon":"in","en":"Alex {{enrolls:enroll}} in a farming class. Her {{initial}} plan is simple. She {{encloses:enclose}} a field with a fence. She {{inserts:insert}} seeds into the soil. She uses bone meal to {{enrich}} the soil. The village decides to {{implement}} her method. Guards {{enforce}} the new farm rules. The harvest is {{incredible}}. The good food {{induces:induce}} more villagers to move in. At night, Steve {{indulges:indulge}} in too much cake.","ja":"アレックスは農業のクラスに登録する。彼女の最初の計画はシンプルだ。畑をフェンスで囲う。土の中に種をさしこむ。骨粉を使って土を豊かにする。村は彼女の方法を実行することに決める。警備員が新しい農場のルールを守らせる。収穫は信じられないほどだ。おいしい食べ物にひかれて、さらに村人が引っこしてくる。夜、スティーブはケーキを食べすぎてしまう。","ken":"<b>indulge in ～（～にふける）</b>は「好きなことにどっぷり」。implement（実行する）は「計画を実行」でビジネス英語の定番。induce 人 to ～（人を～する気にさせる）も覚えとこ。","words":[{"n":"1408","w":"enroll","m":"登録する、入学する","p":[["en","中に"],["roll","名簿"]],"i":"名簿の中に入れる","r":"enrollm
