<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>こーちゃんのゲーム単語帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: header with progress, world tabs, stage strip for the chosen world, then one scene (diagram + story) and its word cards. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --fg:#1B1F2B; --muted:#5F6678; --line:#DDE1EB; --chip:#EEF1F7;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --en:"Lexend","Segoe UI",system-ui,sans-serif;
  --w:#E0312B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12141B;--surface:#1B1E28;--fg:#E9ECF3;--muted:#9AA1B2;--line:#2C3040;--chip:#252937;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141B;--surface:#1B1E28;--fg:#E9ECF3;--muted:#9AA1B2;--line:#2C3040;--chip:#252937;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.75}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.3;margin:0;text-wrap:balance}
.note{color:var(--muted);margin:6px 0 0;max-width:62ch}
.progress{font-family:var(--en);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);white-space:nowrap}
.progress b{font-size:1.4rem;color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px;width:180px}
.bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .3s}
nav.worlds{display:flex;gap:8px;overflow-x:auto;margin:20px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
nav.worlds button{flex:0 0 auto;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.worlds button[aria-selected="true"]{border-color:var(--wc);background:color-mix(in srgb,var(--wc) 16%,var(--surface))}
nav.worlds small{font-family:var(--en);font-weight:400;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
button:focus-visible,.card:focus-visible,input:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;font:inherit;font-family:var(--en);padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.results{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0 / .12);overflow:hidden}
.results button{display:flex;gap:10px;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;color:var(--fg);cursor:pointer;align-items:baseline}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--chip)}
.results .rn{font-family:var(--en);font-size:.75rem;color:var(--muted);min-width:4.5em;font-variant-numeric:tabular-nums}
.results .rw{font-family:var(--en);font-weight:700}
.results .rm{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tgl{font:inherit;font-size:.9rem;font-weight:700;border:1.5px solid var(--fg);background:transparent;color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
body.test .tgl.test{background:var(--fg);color:var(--bg)}
.stages{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 8px;scrollbar-width:thin}
.stages button{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:10px;cursor:pointer;max-width:170px}
.stages button[aria-current="true"]{border-color:var(--w);box-shadow:inset 0 -3px 0 var(--w)}
.stages .sn{font-family:var(--en);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stages .st{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.stages .sd{font-size:.68rem;color:var(--muted);font-family:var(--en);font-variant-numeric:tabular-nums}
.stages .full .sd{color:var(--w);font-weight:700}
.scene{margin-top:12px;display:grid;grid-template-columns:200px 1fr;gap:20px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--w);border-radius:14px;padding:20px}
.scene>*{min-width:0}
@media (max-width:640px){.scene{grid-template-columns:1fr}.prefix svg{max-width:160px}}
.prefix{display:flex;flex-direction:column;gap:6px}
.prefix .lab{font-family:var(--en);font-weight:700;font-size:1.9rem;line-height:1.15;color:var(--w);word-break:keep-all}
.prefix .lab.ja{font-family:var(--display);font-size:1.5rem}
.prefix .lab small{font-family:var(--body);font-size:.9rem;color:var(--fg);margin-left:4px;font-weight:700}
.prefix svg{width:100%;max-width:200px;height:auto}
.kicker{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.en{font-family:var(--en);font-size:1.05rem;line-height:1.85;margin:4px 0 12px}
.w{font:inherit;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--w) 22%,transparent);border:0;border-radius:4px;padding:0 3px;cursor:pointer}
.ja{color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:0}
.ken{margin-top:14px;background:var(--chip);border-radius:10px;padding:12px 14px;font-size:.95rem}
.ken b{color:var(--w)}
.grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s,border-color .2s}
.card.flash{border-color:var(--w);box-shadow:0 0 0 3px color-mix(in srgb,var(--w) 35%,transparent)}
.card.done{opacity:.6}
.top{display:flex;align-items:baseline;gap:8px}
.num{font-family:var(--en);font-variant-numeric:tabular-nums;font-size:.72rem;color:var(--muted);min-width:2.8em}
.word{font-family:var(--en);font-weight:700;font-size:1.3rem;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.chk{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--w)}
.mean{font-weight:700}
.parts{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.85rem}
.p{background:var(--chip);border-radius:6px;padding:1px 7px}
.p.pre{background:color-mix(in srgb,var(--w) 22%,transparent)}
.p em{font-family:var(--en);font-style:normal;font-weight:600;margin-right:4px}
.img{font-size:.88rem;color:var(--muted)}
.rel{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.rel span{font-family:var(--en)}
body.test .hide{filter:blur(6px);user-select:none}
body.test .card.reveal .hide,body.test .scene.reveal .hide{filter:none}
body.test .card{cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;max-width:48%;text-align:left;min-width:0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager button[disabled]{visibility:hidden}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>こーちゃんのゲーム単語帳</h1>
      <p class="note">シス単5訂版の2027語を、5つのゲームの世界ごとに「同じ語源・同じテーマ」でまとめたで。1ステージ10語、全202ステージ。太字の単語をタップすると下のカードに飛ぶよ。 健ちゃんより</p>
    </div>
    <div class="progress" aria-live="polite"><b id="cnt">0</b> / <span id="tot">0</span> 語おぼえた<div class="bar"><i id="barfill"></i></div></div>
  </header>
  <nav class="worlds" id="tabs" role="tablist" aria-label="ゲームの世界"></nav>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="単語や番号でさがす（例: suffer / 36）" autocomplete="off" aria-label="単語や番号でさがす">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="tgl test" id="testBtn" type="button">テストモード：OFF</button>
  </div>
  <div class="stages" id="stages" aria-label="ステージ一覧"></div>
  <main id="view"></main>
  <div class="pager" id="pager"></div>
  <footer>番号はシス単5訂版の見出し番号（1003と1005の appetite は同じ単語なので1枚にまとめています）。訳語・語源・例文は健ちゃん＆Claudeのオリジナル。語源は覚えるための目安やから、細かい学説とはちがうこともあるで。テストモードでは意味と和訳がぼやけるので、タップで答え合わせ！</footer>
</div>

<script>
const DATA=[{"world":"mario","title":"クッパ城、ふたたび","lab":"感情","labJa":"させる動詞","icon":"feel","en":"Koopa took Peach again and {{frightened:frighten}} all the Kinopio. Luigi was {{upset}} and a little {{confused:confuse}}. Mario said, \"I'm so {{bored:bore}} of this,\" but the new castle {{amazed:amaze}} him. Its tricky doors {{puzzled:puzzle}} him, and falling into lava in front of Luigi really {{embarrassed:embarrass}} him. Still, the castle {{fascinated:fascinate}} him. In the end, Koopa was {{disappointed:disappoint}} again, and Peach was {{amused:amuse}} by his angry face.","ja":"クッパがまたピーチをさらって、キノピオたちをみんな怖がらせた。ルイージは動揺して、ちょっと混乱していた。マリオは「もうこれ飽きたわ」と言ったけど、新しいお城にはびっくりした。トリッキーな扉に頭を悩ませ、ルイージの前で溶岩に落ちたのは本当に恥ずかしかった。それでも、お城には夢中になった。最後にクッパはまたがっかりして、ピーチはその怒った顔を見ておもしろがった。","ken":"<b>★ここ絶対出るで！</b> 全部「人を〇〇させる」動詞。だから<b>人が主語なら -ed</b>（I'm bored）、<b>物が主語なら -ing</b>（The game is boring）。I'm boring って言うたら「ぼくはつまらん人間です」になるからな笑","words":[{"n":"141","w":"frighten","m":"怖がらせる","p":[["fright","恐怖"],["en","与える"]],"i":"恐怖をぐいっと与える","r":"fear, scare ≒ 同じ意味"},{"n":"283","w":"upset","m":"動揺させる、動揺した","p":[["up","上"],["set","置く"]],"i":"気持ちを上下ひっくり返す","r":"be upset about ～ で「～に動揺する」"},{"n":"86","w":"confuse","m":"混乱させる","p":[["con","一緒に"],["fuse","注ぐ"]],"i":"いろんなものを一緒に注いでごちゃ混ぜ","r":"confusion（混乱）"},{"n":"66","w":"bore","m":"退屈させる","p":[["bore","穴をあける"]],"i":"同じ所をドリルでずっと掘ってる感じ","r":"boredom（退屈）"},{"n":"140","w":"amaze","m":"びっくりさせる","p":[["a","強め"],["maze","迷路"]],"i":"迷路に放りこまれて呆然","r":"surprise, astonish ≒"},{"n":"130","w":"puzzle","m":"困らせる、悩ませる","p":[["puzzle","パズル"]],"i":"パズルを前にして固まる","r":"be puzzled ＝ 困惑している"},{"n":"162","w":"embarrass","m":"恥ずかしい思いをさせる","p":[["em","中に"],["bar","棒"]],"i":"棒で行く手をふさがれて、どうしていいかわからん","r":"embarrassment（当惑）"},{"n":"135","w":"fascinate","m":"魅了する","p":[["fascin","魔法"],["ate","する"]],"i":"魔法をかけて目を離せなくする","r":"attract, charm ≒"},{"n":"115","w":"disappoint","m":"がっかりさせる","p":[["dis","外す"],["appoint","約束する"]],"i":"約束（期待）を外される","r":"disappointment（失望）"},{"n":"126","w":"amuse","m":"楽しませる","p":[["a","～へ"],["muse","ぼんやりする"]],"i":"ぼんやりしてる人の気をそらして笑わせる","r":"amusement park（遊園地）"}]},{"world":"splatoon","title":"ナワバリバトル","lab":"ex-","labJa":"外へ","icon":"ex","en":"The Turf War starts. Our team {{expands:expand}} our ink fast and {{extends:extend}} it to the center. The ink {{spreads:spread}} everywhere. An enemy tries to {{escape}}, but our bomb {{exposes:expose}} him. \"I {{expected:expect}} that,\" says my friend. After the match, Judge-kun {{examines:examine}} the map. The results are {{displayed:display}} on the big screen like an art {{exhibit}}. The losing team makes an {{excuse}}: \"Our Wi-Fi was bad!\"","ja":"ナワバリバトル開始。ぼくらのチームはインクを素早く広げて、真ん中まで延ばす。インクがあちこちに広がる。敵が逃げようとするけど、ボムでその姿がまる見えになる。「それは予想してた」と友だち。試合のあと、ジャッジくんがマップを調べる。結果は美術の展示みたいに大きな画面に表示される。負けたチームは言い訳する。「Wi-Fiが悪かってん！」","ken":"ex- は<b>「外へ」</b>。インクがブワッと外に広がるイメージで全部いける！ excuse だけちょっとクセあって、「責め（cuse）の外に出る」＝言い訳。accuse（責める）とセットで覚えたら一石二鳥やで。","words":[{"n":"116","w":"expand","m":"広げる、拡大する","p":[["ex","外へ"],["pand","広がる"]],"i":"風船みたいに外へふくらむ","r":"expansion（拡大）"},{"n":"110","w":"extend","m":"延ばす、広げる","p":[["ex","外へ"],["tend","伸ばす"]],"i":"外へ一直線にグーンと伸ばす","r":"extension（延長）"},{"n":"48","w":"spread","m":"広がる、広げる","p":[["spread","広げる"]],"i":"インクがじわっと全方向へ","r":"活用は spread-spread-spread"},{"n":"76","w":"escape","m":"逃げる","p":[["ex","外へ"],["cape","マント"]],"i":"マントを脱ぎ捨てて外へ逃走","r":"escape from ～（～から逃げる）"},{"n":"152","w":"expose","m":"さらす","p":[["ex","外へ"],["pose","置く"]],"i":"外に置いて丸見えにする","r":"be exposed to ～（～にさらされる）"},{"n":"4","w":"expect","m":"予期する、期待する","p":[["ex","外を"],["spect","見る"]],"i":"外をのぞいて来るのを待つ","r":"expectation（期待）"},{"n":"91","w":"examine","m":"調べる","p":[["exam","天秤の針"],["ine","する"]],"i":"天秤の針をじっと見て確かめる","r":"exam（試験）も同じ仲間"},{"n":"124","w":"display","m":"展示する、表示する","p":[["dis","反対"],["play","折りたたむ"]],"i":"たたんであるのを広げて見せる","r":"show, exhibit ≒"},{"n":"167","w":"exhibit","m":"展示する","p":[["ex","外へ"],["hibit","持つ"]],"i":"外に持ち出してみんなに見せる","r":"exhibition（展覧会）"},{"n":"194","w":"excuse","m":"言い訳、許す","p":[["ex","外へ"],["cuse","責め"]],"i":"責めの外に出る","r":"accuse（責める）とセット"}]},{"world":"fortnite","title":"ラスト10人","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"The storm is coming, and only ten players {{remain}}. My shield is low, so I use a med kit to {{recover}}. A wall breaks, and I {{replace}} it fast. The storm {{reduces:reduce}} the safe zone again. My teammate {{responds:respond}}, \"I'm coming!\" I {{rely}} on him. He {{rejects:reject}} my plan to hide. The enemy {{reveals:reveal}} his position and {{releases:release}} a rocket. We win, and I don't {{regret}} anything.","ja":"ストームが迫ってきて、残っているプレイヤーはあと10人。シールドが少ないので、回復キットで回復する。壁が壊れたので、すぐに取り替える。ストームがまた安全地帯を狭める。仲間が「今行く！」と応える。ぼくは彼を頼りにしている。彼はぼくの隠れる作戦を却下する。敵が自分の位置をさらして、ロケットを放つ。ぼくらは勝って、何ひとつ後悔していない。","ken":"re- は<b>「もう一度」</b>か<b>「後ろへ」</b>のどっちか。リスポーンもリビルドも re- やろ？ reject は ject（投げる）を投げ返す、つまり「いらん！」ってこと。project（前に投げる＝計画）と並べると気持ちいいで。","words":[{"n":"10","w":"remain","m":"残る、～のままである","p":[["re","後ろに"],["main","留まる"]],"i":"みんな行ったのに後ろに居残る","r":"remain silent（黙ったまま）"},{"n":"144","w":"recover","m":"回復する、取り戻す","p":[["re","もう一度"],["cover","得る"]],"i":"なくしたものをもう一度手元に","r":"recovery（回復）"},{"n":"77","w":"replace","m":"取り替える","p":[["re","もう一度"],["place","置く"]],"i":"元の場所に別の物を置き直す","r":"replace A with B（AをBに替える）"},{"n":"39","w":"reduce","m":"減らす","p":[["re","後ろへ"],["duce","導く"]],"i":"後ろへ引き戻して小さくする","r":"reduction（減少）"},{"n":"59","w":"respond","m":"応答する、反応する","p":[["re","返す"],["spond","約束する"]],"i":"言われたことに言葉を返す","r":"response（返答）"},{"n":"104","w":"rely","m":"頼る","p":[["re","後ろで"],["ly","結ぶ"]],"i":"後ろでロープを結んで支えにする","r":"rely on ～ ＝ depend on ～"},{"n":"98","w":"reject","m":"拒絶する","p":[["re","返す"],["ject","投げる"]],"i":"投げられたものを投げ返す","r":"project（前に投げる＝計画）"},{"n":"78","w":"reveal","m":"明らかにする","p":[["re","反対"],["veal","ベール"]],"i":"かぶせたベールをめくる","r":"conceal（隠す）が反対語"},{"n":"142","w":"release","m":"放つ、公開する","p":[["re","後ろへ"],["lease","ゆるめる"]],"i":"握ってた手をゆるめて解き放つ","r":"新曲の release ＝ 発売"},{"n":"105","w":"regret","m":"後悔する","p":[["re","後ろを"],["gret"," ["ad","～の方へ"],["opt","選ぶ"]],"i":"選んで自分の方へ迎える","r":"option（選択肢）も opt 仲間"}]},{"world":"splatoon","title":"ブキチの新ブキ","lab":"ex-","labJa":"外へ","icon":"ex","en":"Bukichi {{explains:explain}} a new weapon to me. \"This kind of ink didn't {{exist}} before,\" he says. He can't {{express}} how proud he is. \"Can I {{exchange}} my old weapon for it?\" I ask. \"No {{exceptions:exception}}. It's very {{expensive}},\" he says. He did many {{experiments:experiment}} to make it. I {{explore}} the stage with it, and it's {{excellent}}. To some {{extent}}, the price is fair.","ja":"ブキチがぼくに新しいブキを説明する。「こんなインクは前は存在しなかったでし」と彼。どれだけ誇らしいか言葉で表せないみたい。「古いブキと交換できる？」と聞くと、「例外はなしでし。とても高価なんでし」。彼はこれを作るのにたくさん実験した。それを持ってステージを探検すると、すばらしい性能。ある程度は、その値段もしゃあないかも。","ken":"ex- 第2弾！ exception は「外へ取り出す」から「例外」。<b>to some extent（ある程度）</b>はセットで覚えるやつ★ 長文でめっちゃ出るで。","words":[{"n":"332","w":"explain","m":"説明する","p":[["ex","外へ"],["plain","平らな"]],"i":"しわくちゃなのを外に広げて平らにする","r":"explanation（説明）"},{"n":"335","w":"exist","m":"存在する","p":[["ex","外へ"],["ist","立つ"]],"i":"外に立って見えている","r":"existence（存在）"},{"n":"336","w":"express","m":"表現する、急行の","p":[["ex","外へ"],["press","押す"]],"i":"気持ちを外へ押し出す","r":"expression（表現）"},{"n":"348","w":"exchange","m":"交換する","p":[["ex","外へ"],["change","変える"]],"i":"外へ出して取り替える","r":"exchange A for B（AをBと交換）"},{"n":"935","w":"exception","m":"例外","p":[["ex","外へ"],["cept","取る"]],"i":"グループの外へ取り出したもの","r":"except（～を除いて）"},{"n":"532","w":"expensive","m":"高価な","p":[["ex","外へ"],["pens","はかる"]],"i":"お金がたくさん外に出ていく","r":"cheap が反対語"},{"n":"428","w":"experiment","m":"実験","p":[["ex","外で"],["peri","試す"]],"i":"試して確かめる","r":"expert, experience と仲間"},{"n":"382","w":"explore","m":"探検する","p":[["ex","外へ"],["plore","叫ぶ"]],"i":"叫びながら外の世界を探す","r":"exploration（探検）"},{"n":"552","w":"excellent","m":"すばらしい","p":[["ex","外へ"],["cel","そびえる"]],"i":"みんなより飛び抜けて高い","r":"excel（秀でる）"},{"n":"525","w":"extent","m":"程度、範囲","p":[["ex","外へ"],["tent","伸ばす"]],"i":"どこまで伸びているか","r":"to some extent（ある程度）"}]},{"world":"splatoon","title":"決勝の大イカ","lab":"ex-","labJa":"外へ","icon":"ex","en":"The final match was {{extremely}} close. Our team {{eliminated:eliminate}} three enemies, and then a giant squid {{emerged:emerge}} from the ink. Its power {{exceeded:exceed}} everything. \"Don't {{exaggerate}},\" said Iida, but the {{explosion}} was really huge. Later, an {{executive}} from the game company came to {{evaluate}} the match. He talked about the {{evolution}} of the Inklings. \"Without ink, we would face {{extinction}},\" Hime joked.","ja":"決勝戦はきわめて接戦だった。ぼくらのチームは敵を3人倒して（排除して）、そのとき巨大なイカがインクの中から現れた。そのパワーはすべてを超えていた。「大げさに言わないで」とイイダは言ったけど、爆発は本当に大きかった。あとで、ゲーム会社の重役が試合を評価しに来た。彼はインクリングの進化について話した。「インクがなかったら、ウチら絶滅してるわ」とヒメが冗談を言った。","ken":"emerge（現れる）と emergency（緊急事態）は同じ仲間。「急に外に出てくる」から緊急事態やねん。<b>effect と affect の区別</b>はまた後で出てくるで！","words":[{"n":"587","w":"extremely","m":"きわめて","p":[["ex","外へ"],["treme","はて"]],"i":"はみ出すくらい端っこまで","r":"extreme（極端な）"},{"n":"607","w":"eliminate","m":"取り除く、排除する","p":[["e","外へ"],["limin","しきい"]],"i":"しきいの外へ追い出す","r":"remove ≒"},{"n":"682","w":"emerge","m":"現れる","p":[["e","外へ"],["merge","沈む"]],"i":"沈んでたものが外へ浮かび上がる","r":"emergency（緊急事態）"},{"n":"893","w":"exceed","m":"超える","p":[["ex","外へ"],["ceed","行く"]],"i":"線の外まで行ってしまう","r":"excess（超過）"},{"n":"899","w":"exaggerate","m":"大げさに言う","p":[["ex","強め"],["agger","積み上げる"]],"i":"話をどんどん積み上げて盛る","r":"exaggeration（誇張）"},{"n":"1049","w":"explosion","m":"爆発","p":[["ex","外へ"],["plode","手をたたく"]],"i":"パンッと外にはじける","r":"explode（爆発する）"},{"n":"981","w":"executive","m":"重役、経営者","p":[["ex","外へ"],["secu","ついていく"]],"i":"最後までやり遂げる人","r":"execute（実行する）"},{"n":"906","w":"evaluate","m":"評価する","p":[["e","外へ"],["valu","価値"]],"i":"価値を外に取り出してはかる","r":"value（価値）"},{"n":"939","w":"evolution","m":"進化","p":[["e","外へ"],["volve","巻く"]],"i":"巻物を外へ広げるように発展していく","r":"evolve（進化する）"},{"n":"1046","w":"extinction","m":"絶滅","p":[["ex","外へ"],["stinct","消す"]],"i":"火を消すように消えてしまう","r":"extinct（絶滅した）"}]},{"world":"splatoon","title":"イイダの遠征","lab":"ex-","labJa":"外へ","icon":"ex","en":"Our team went on an {{expedition}} to a new stage. Iida showed {{extraordinary}} skill. \"Wow!\" I {{exclaimed:exclaim}}. She {{exploited:exploit}} a weak spot in the enemy's line and {{executed:execute}} her plan perfectly. Her {{expertise}} comes from practice, not luck. Hime, on the other hand, used an {{excessive}} amount of ink. Iida gave her {{explicit}} advice: \"{{Exert:exert}} less power and save ink.\" Later, we {{extracted:extract}} useful data from the replay.","ja":"ぼくらのチームは新ステージへ遠征した。イイダはなみはずれた腕前を見せた。「すごい！」とぼくは叫んだ。彼女は敵の守りの弱点を利用して、作戦を完ぺきに実行した。その専門的な技術は運じゃなくて練習から来ている。一方ヒメは、過度な量のインクを使った。イイダは彼女にはっきりとアドバイスした。「力を出しすぎないで、インクを節約して」。あとで、ぼくらはリプレイから役に立つデータを引き出した。","ken":"exploit は「利用する」やけど、<b>人を exploit する＝搾取する</b>って悪い意味もある。社会系の長文で出たらこっちやで★","words":[{"n":"1472","w":"expedition","m":"遠征、探検","p":[["ex","外へ"],["ped","足"]],"i":"足を外へ踏み出す","r":"pedestrian（歩行者）も ped"},{"n":"1132","w":"extraordinary","m":"並外れた、異常な","p":[["extra","外の"],["ordinary","ふつうの"]],"i":"ふつうの枠の外","r":"ordinary（ふつうの）"},{"n":"1368","w":"exclaim","m":"叫ぶ","p":[["ex","外へ"],["claim","叫ぶ"]],"i":"声を外に叫び出す","r":"exclamation mark（!）"},{"n":"1212","w":"exploit","m":"利用する、搾取する","p":[["ex","外へ"],["ploit","折りたたむ"]],"i":"たたんであるものを広げて使い倒す","r":"悪い意味の「搾取」も大事"},{"n":"1412","w":"execute","m":"実行する、処刑する","p":[["ex","外へ"],["secute","ついていく"]],"i":"最後までついていってやり遂げる","r":"executive（重役）"},{"n":"1802","w":"expertise","m":"専門知識、専門技術","p":[["expert","専門家"]],"i":"専門家だけが持つ技","r":"expert（熟練した人）"},{"n":"1136","w":"excessive","m":"過度の","p":[["ex","外へ"],["cess","行く"]],"i":"行きすぎてはみ出す","r":"exceed と仲間"},{"n":"1660","w":"explicit","m":"はっきりした","p":[["ex","外へ"],["plic","折る"]],"i":"折りたたまずに外へ広げてある","r":"implicit（暗黙の）が反対語"},{"n":"1369","w":"exert","m":"（力を）発揮する","p":[["ex","外へ"],["sert","つなぐ"]],"i":"力を外へつないで出す","r":"exert oneself（努力する）"},{"n":"1428","w":"extract","m":"引き出す、抽出する","p":[["ex","外へ"],["tract","引く"]],"i":"中から外へ引っぱり出す","r":"attract（引きつける）と仲間"}]},{"world":"splatoon","title":"火山の島ステージ","lab":"ex-","labJa":"外へ","icon":"ex","en":"The new stage looks {{exotic}}, like a tropical island with a volcano. Suddenly, a small {{eruption}} happens, and hot ink comes out. Years of {{erosion}} have made the rocks into strange shapes. The machine there has a high {{emission}} of smoke, so we must {{extinguish}} the fire fast. Hime gives an {{eloquent}} speech, and it {{evokes:evoke}} memories of our first battle. Iida makes an {{elaborate}} plan on the map, then {{erases:erase}} it and starts again. \"Our time will {{expire}} soon!\" I shout.","ja":"新しいステージは火山のある南の島みたいで、異国風に見える。突然小さな噴火が起きて、熱いインクが出てくる。何年もの浸食で、岩は不思議な形になっている。そこの機械は煙の排出が多いので、急いで火を消さないといけない。ヒメは雄弁なスピーチをして、それがぼくらの初バトルの思い出を呼び起こす。イイダはマップに念入りな作戦を書いて、それを消してまたやり直す。「もうすぐ時間切れになる！」とぼくは叫ぶ。","ken":"e- も ex- の仲間！ 次が子音（l, r, v, m など）やと x が消えて e- だけになる。eraser（消しゴム）の erase も「外へこすり出す」やで。","words":[{"n":"1671","w":"exotic","m":"異国風の","p":[["exo","外の"]],"i":"外国から来たっぽい珍しさ","r":"exotic food（エキゾチックな料理）"},{"n":"1912","w":"eruption","m":"噴火","p":[["e","外へ"],["rupt","破れる"]],"i":"山が破れて中身が外へ","r":"erupt（噴火する）、interrupt と仲間"},{"n":"1547","w":"erosion","m":"浸食","p":[["e","外へ"],["rode","かじる"]],"i":"少しずつかじり取られる","r":"erode（浸食する）"},{"n":"1102","w":"emission","m":"排出","p":[["e","外へ"],["mit","送る"]],"i":"外へ送り出す","r":"emit（出す）、CO2 emissions"},{"n":"1771","w":"extinguish","m":"（火を）消す","p":[["ex","外へ"],["stingu","突く"]],"i":"突いて消す","r":"extinct（絶滅した）と仲間"},{"n":"1990","w":"eloquent","m":"雄弁な","p":[["e","外へ"],["loqu","話す"]],"i":"言葉がどんどん外にあふれる","r":"eloquence（雄弁）"},{"n":"1784","w":"evoke","m":"呼び起こす","p":[["e","外へ"],["voke","呼ぶ"]],"i":"心の奥から外へ呼び出す","r":"voice（声）も同じ仲間"},{"n":"1183","w":"elaborate","m":"念入りな、手の込んだ","p":[["e","外へ"],["labor","働く"]],"i":"がんばって働いて仕上げた","r":"labor（労働）"},{"n":"1390","w":"erase","m":"消す","p":[["e","外へ"],["rase","こする"]],"i":"こすり取る","r":"eraser（消しゴム）"},{"n":"1759","w":"expire","m":"期限が切れる","p":[["ex","外へ"],["spire","息をする"]],"i":"最後の息を吐き出す","r":"expiration date（有効期限）"}]},{"world":"splatoon","title":"嵐の日","lab":"ex-","labJa":"外へ","icon":"ex","en":"A big storm came, and people in the city were {{evacuated}} to the stadium. An {{eminent}} scientist said the storm had a strong {{effect}} on the ink. \"We need an {{efficient}} way to clean it,\" she said. She also tried to {{educate}} the kids about safety. It took {{enormous}} {{effort}}, but {{eventually}} the city was safe again. There was no {{evidence}} of serious damage. Everyone was full of {{emotion}}.","ja":"大きな嵐が来て、街の人々はスタジアムに避難させられた。著名な科学者が、嵐がインクに強い影響を与えたと言った。「きれいにする効率のいい方法が必要ね」と彼女。彼女は子どもたちに安全についての教育もしようとした。ものすごい努力がかかったけど、最終的に街はまた安全になった。大きな被害の証拠はなかった。みんな感情があふれていた。","ken":"★<b>effect（名詞：影響）と affect（動詞：影響を与える）</b>は超ひっかけポイント。have an effect on ～ ＝ affect ～ って言いかえも出るで！","words":[{"n":"1740","w":"evacuated","m":"避難させられた","p":[["e","外へ"],["vacu","空っぽ"]],"i":"中を空っぽにして外へ出す","r":"evacuate（避難させる）、vacant（空いている）"},{"n":"2004","w":"eminent","m":"著名な","p":[["e","外へ"],["min","突き出る"]],"i":"人々の中から突き出ている","r":"famous ≒"},{"n":"180","w":"effect","m":"影響、効果","p":[["ef","外へ"],["fect","作る"]],"i":"外に作り出された結果","r":"affect（影響を与える）と区別★"},{"n":"289","w":"efficient","m":"効率のいい","p":[["ef","外へ"],["fic","作る"]],"i":"むだなくどんどん作り出す","r":"efficiency（効率）"},{"n":"358","w":"educate","m":"教育する","p":[["e","外へ"],["duc","導く"]],"i":"才能を外へ引き出す","r":"education（教育）"},{"n":"556","w":"enormous","m":"巨大な","p":[["e","外へ"],["norm","基準"]],"i":"基準からはみ出すほどデカい","r":"huge ≒"},{"n":"399","w":"effort","m":"努力","p":[["ef","外へ"],["fort","力"]],"i":"力を外へ出す","r":"make an effort（努力する）"},{"n":"585","w":"eventually","m":"結局、最終的に","p":[["e","外へ"],["vent","来る"]],"i":"最後に外に出てきた結果","r":"finally ≒"},{"n":"518","w":"evidence","m":"証拠","p":[["e","外へ"],["vid","見る"]],"i":"外からはっきり見える","r":"evident（明らかな）"},{"n":"474","w":"emotion","m":"感情","p":[["e","外へ"],["mot","動く"]],"i":"心が外へ動き出す","r":"emotional（感情的な）"}]},{"world":"splatoon","title":"3連戦のあと","lab":"out","labJa":"外へ","icon":"ex","en":"After three matches, I was {{exhausted}}. The {{outcome}} was two wins and one loss. Our ink {{output}} was {{outstanding}}, but my phone battery was dead, so I looked for an {{outlet}}. Then we heard news about an {{outbreak}} of a strange octopus army. Our team {{uncovered:uncover}} a secret base behind a tall tower that was {{erected:erect}} last year. Our {{outlook}} for tomorrow was dark. \"What's done can't be {{undone}},\" said Iida. \"Let's rest.\"","ja":"3試合のあと、ぼくはへとへとだった。結果は2勝1敗。インクの塗り量はずば抜けていたけど、スマホの電池が切れていたので、コンセントを探した。そのとき、謎のタコ軍団が発生したというニュースが入った。ぼくらのチームは、去年建てられた高い塔の裏に秘密基地を発見した。明日の見通しは暗かった。「やってしまったことは元に戻せない」とイイダ。「休みましょう」。","ken":"out- も「外へ」！ outlet は日本語の「アウトレット」やけど、英語だと<b>コンセント</b>の意味でめっちゃ使う。日本語のコンセントは和製英語やからな笑","words":[{"n":"808","w":"exhausted","m":"疲れ切った","p":[["ex","外へ"],["haust","くみ出す"]],"i":"体力を全部くみ出した","r":"exhaust（使い果たす）"},{"n":"1082","w":"outcome","m":"結果","p":[["out","外へ"],["come","来る"]],"i":"最後に外に出てきたもの","r":"result ≒"},{"n":"776","w":"output","m":"生産高、出力","p":[["out","外へ"],["put","置く"]],"i":"外に出したものの量","r":"input（入力）が反対"},{"n":"1674","w":"outstanding","m":"ずば抜けた","p":[["out","外へ"],["standing","立つ"]],"i":"みんなより外に突き出て立つ","r":"excellent ≒"},{"n":"1844","w":"outlet","m":"コンセント、はけ口、直販店","p":[["out","外へ"],["let","出す"]],"i":"電気や気持ちを外に出す口","r":"アウトレットモール"},{"n":"1598","w":"outbreak","m":"（戦争・病気の）発生","p":[["out","外へ"],["break","破る"]],"i":"突然外へ破って出てくる","r":"break out（起こる）"},{"n":"1413","w":"uncover","m":"明らかにする","p":[["un","取る"],["cover","おおい"]],"i":"おおいをはずす","r":"reveal ≒"},{"n":"1716","w":"erect","m":"建てる、直立した","p":[["e","外へ"],["rect","まっすぐ"]],"i":"まっすぐ上に立てる","r":"correct（正しい）も rect"},{"n":"1314","w":"outlook","m":"見通し、考え方","p":[["out","外を"],["look","見る"]],"i":"外を見渡す","r":"prospect ≒"},{"n":"1741","w":"undone","m":"元に戻された、ほどけた","p":[["un","元に"],["done","した"]],"i":"やったことを取り消す","r":"undo（元に戻す）"}]},{"world":"splatoon","title":"新しい街へ","lab":"trans-","labJa":"向こうへ","icon":"trans","en":"Our team {{transferred:transfer}} to a new city. The {{transition}} was hard. A bus was our only {{transportation}}. Hime {{translated:translate}} the signs for us, and Iida {{interpreted:interpret}} the map. At a shop, I made a {{transaction}} for some {{transparent}} goggles. The shop can {{transmit}} matches live. Bukichi {{transformed:transform}} my weapon into a new type. \"It's like a heart {{transplant}} for a weapon!\" he said.","ja":"ぼくらのチームは新しい街に移った。その移り変わりは大変だった。バスが唯一の交通手段だった。ヒメが看板を訳してくれて、イイダが地図を読み解いた。お店で、透明なゴーグルを買う取引をした。そのお店は試合を生中継で送信できる。ブキチはぼくのブキを新しいタイプに変形させた。「ブキの心臓移植みたいなものでし！」と彼は言った。","ken":"trans- は<b>「向こうへ・越えて」</b>。transfer（乗り換え）は駅のアナウンスでも聞くやろ？ transform はトランスフォーマーのやつ。こういう身近なのとつなげたら忘れへん！","words":[{"n":"670","w":"transfer","m":"移す、乗り換える","p":[["trans","向こうへ"],["fer","運ぶ"]],"i":"こっちから向こうへ運ぶ","r":"suffer, offer も fer 仲間"},{"n":"1461","w":"transition","m":"移り変わり","p":[["trans","向こうへ"],["it","行く"]],"i":"次の状態へ移っていく","r":"transit（通過）"},{"n":"199","w":"transportation","m":"交通機関","p":[["trans","向こうへ"],["port","運ぶ"]],"i":"人や物を向こうへ運ぶ","r":"import, export も port"},{"n":"153","w":"translate","m":"翻訳する","p":[["trans","向こうへ"],["late","運ぶ"]],"i":"言葉を別の言語へ運ぶ","r":"translation（翻訳）"},{"n":"603","w":"interpret","m":"解釈する、通訳する","p":[["inter","間に"],["pret","値をつける"]],"i":"間に入って意味をつける","r":"interpreter（通訳者）"},{"n":"1833","w":"transaction","m":"取引","p":[["trans","向こうへ"],["act","行う"]],"i":"お金と物を向こうとやりとり","r":"business deal ≒"},{"n":"1944","w":"transparent","m":"透明な","p":[["trans","通して"],["par","見える"]],"i":"向こうまで透けて見える","r":"clear ≒"},{"n":"636","w":"transmit","m":"送る、伝える","p":[["trans","向こうへ"],["mit","送る"]],"i":"信号を向こうへ送る","r":"emit, submit も mit"},{"n":"856","w":"transform","m":"変形させる","p":[["trans","向こうへ"],["form","形"]],"i":"形を別のものへ変える","r":"トランスフォーマー"},{"n":"1106","w":"transplant","m":"移植","p":[["trans","向こうへ"],["plant","植える"]],"i":"植物を別の場所へ植え替える","r":"臓器移植にも使う"}]},{"world":"splatoon","title":"交差点の攻防","lab":"inter-","labJa":"あいだ","icon":"trans","en":"During practice, the enemy {{interrupted:interrupt}} our plan again and again. They always {{interfere}} at the {{intersection}} in the middle of the stage. Iida, the most {{intellectual}} member, studied our {{interaction}} with them. \"We need an {{intervention}} at the right {{interval}},\" she said. We practiced {{overnight}}. Our {{overall}} results got better, and we finally {{overcame:overcome}} them.","ja":"練習中、敵がぼくらの作戦を何度も中断させた。彼らはいつもステージ真ん中の交差点で邪魔をしてくる。メンバーで一番知的なイイダが、彼らとのやりとりを研究した。「ちょうどいい間隔で介入する必要があるわ」と彼女。ぼくらは徹夜で練習した。全体の結果は良くなって、ついに彼らに打ち勝った。","ken":"inter- は<b>「あいだ」</b>。インターネットも「ネットとネットの間」。interrupt は「間に入って破る」＝話をさえぎる。interfere with ～（～を邪魔する）は with までセットで★","words":[{"n":"623","w":"interrupt","m":"さえぎる、中断する","p":[["inter","間に"],["rupt","破る"]],"i":"間に割りこんで破る","r":"eruption も rupt"},{"n":"691","w":"interfere","m":"邪魔する","p":[["inter","間に"],["fere","打つ"]],"i":"間に入ってバシッとじゃまする","r":"interfere with ～"},{"n":"1879","w":"intersection","m":"交差点","p":[["inter","間に"],["sect","切る"]],"i":"道と道がおたがいを切る所","r":"section（区切り）"},{"n":"562","w":"intellectual","m":"知的な","p":[["intel","間を"],["lect","選ぶ"]],"i":"物事の間を見分ける力","r":"intelligence（知能）"},{"n":"244","w":"interaction","m":"交流、相互作用","p":[["inter","おたがい"],["act","行う"]],"i":"おたがいに働きかける","r":"interact（交流する）"},{"n":"1576","w":"intervention","m":"介入","p":[["inter","間に"],["vent","来る"]],"i":"間に入ってくる","r":"prevent も vent"},{"n":"1450","w":"interval","m":"間隔","p":[["inter","間"],["val","壁"]],"i":"壁と壁の間のすきま","r":"at intervals（ときどき）"},{"n":"598","w":"overnight","m":"一晩中、一夜にして","p":[["over","越えて"],["night","夜"]],"i":"夜をまたいで","r":"become famous overnight"},{"n":"809","w":"overall","m":"全体の","p":[["over","上から"],["all","全部"]],"i":"上から全部を見わたす","r":"全体的に見て"},{"n":"376","w":"overcome","m":"打ち勝つ","p":[["over","上を"],["come","来る"]],"i":"壁の上を越えていく","r":"get over ≒"}]},{"world":"splatoon","title":"ライバルの弱点","lab":"over / under","labJa":"上と下","icon":"trans","en":"Our rival team was {{overwhelming}}. Their weapons were {{up-to-date}}, and they {{overtook:overtake}} us in the ranking. But Iida found the {{underlying}} problem: they {{overlooked:overlook}} the area {{beneath}} the bridge. \"Let's {{undertake}} a secret plan,\" she said. We had to {{undergo}} hard training. We stayed {{upright}} and calm, and slowly {{undermined:undermine}} their defense.","ja":"ライバルチームは圧倒的だった。彼らのブキは最新で、ランキングでぼくらを追い越した。でもイイダが根本にある問題を見つけた。彼らは橋の下のエリアを見落としていた。「秘密の作戦を引き受けましょう」と彼女。ぼくらはきびしい特訓を受けなければならなかった。背筋をのばして冷静なまま、ゆっくりと彼らの守りを弱らせていった。","ken":"overlook は「見落とす」と「見渡す」の2つ！ 上から目線で通りすぎるイメージ。undermine は「下を掘る」から「こっそり弱らせる」。マイクラで足元掘られたらアウトやろ？","words":[{"n":"1165","w":"overwhelming","m":"圧倒的な","p":[["over","上から"],["whelm","おおう"]],"i":"上からドバッとおおいかぶさる","r":"overwhelm（圧倒する）"},{"n":"1178","w":"up-to-date","m":"最新の","p":[["up to","～まで"],["date","日付"]],"i":"今日の日付まで追いついてる","r":"out-of-date（時代遅れ）が反対"},{"n":"1400","w":"overtake","m":"追い越す","p":[["over","越えて"],["take","取る"]],"i":"後ろから越えて前を取る","r":"pass ≒"},{"n":"825","w":"underlying","m":"根本にある","p":[["under","下に"],["lying","横たわる"]],"i":"表面の下に横たわっている","r":"underlie（根底にある）"},{"n":"649","w":"overlook","m":"見落とす、見渡す","p":[["over","越えて"],["look","見る"]],"i":"視線が上を通りすぎて見落とす","r":"★「見渡す」の意味もある"},{"n":"851","w":"beneath","m":"～の下に","p":[["be","そば"],["neath","下"]],"i":"すぐ下に","r":"under ≒（少しかたい）"},{"n":"673","w":"undertake","m":"引き受ける","p":[["under","下で"],["take","取る"]],"i":"下から支えて引き受ける","r":"undertaking（事業）"},{"n":"905","w":"undergo","m":"経験する、受ける","p":[["under","下を"],["go","行く"]],"i":"つらいことの下をくぐり抜ける","r":"undergo surgery（手術を受ける）"},{"n":"2023","w":"upright","m":"直立した、正直な","p":[["up","上に"],["right","まっすぐ"]],"i":"まっすぐ上に立つ","r":"honest の意味もある"},{"n":"1765","w":"undermine","m":"弱らせる","p":[["under","下を"],["mine","掘る"]],"i":"下からこっそり掘ってくずす","r":"weaken ≒"}]},{"world":"splatoon","title":"フェスの夜","lab":"spect / vis","labJa":"見る","icon":"see","en":"The Splatfest final was a great {{spectacle}}. Cameras for {{surveillance}} were everywhere. The {{supervisor}} of the event came to {{inspect}} the stage. \"Every {{aspect}} must be perfect,\" he said. Colors from the whole {{spectrum}} were {{visible}} from the sky. A scientist took a {{specimen}} of the ink for her {{survey}}. From my {{perspective}}, it was the best night of the year.","ja":"フェスの決勝はすごい見ものだった。監視用のカメラがあちこちにあった。イベントの監督者がステージを点検しに来た。「すべての面が完ぺきでなければならない」と彼。空からはスペクトル全体の色が見えた。ある科学者が調査のためにインクの標本を取った。ぼくの視点からは、それは今年最高の夜だった。","ken":"spect も vis も vey も<b>ぜんぶ「見る」</b>！ supervisor は「上から見る人」、surveillance は「上から見張る」。この3つのパーツ見つけたら「見る系やな」って思えばOK。","words":[{"n":"1303","w":"spectacle","m":"見もの、光景","p":[["spect","見る"]],"i":"思わず見てしまうすごい光景","r":"spectacles（めがね）の意味も"},{"n":"1501","w":"surveillance","m":"監視","p":[["sur","上から"],["veil","見張る"]],"i":"上からずっと見張る","r":"surveillance camera（監視カメラ）"},{"n":"1289","w":"supervisor","m":"監督者","p":[["super","上から"],["vis","見る"]],"i":"上から見て管理する人","r":"supervise（監督する）"},{"n":"1383","w":"inspect","m":"点検する","p":[["in","中を"],["spect","見る"]],"i":"中までじっくり見る","r":"inspector（検査官）"},{"n":"966","w":"aspect","m":"側面、面","p":[["a","～の方へ"],["spect","見る"]],"i":"ある方向から見た姿","r":"面、点"},{"n":"1319","w":"spectrum","m":"範囲、スペクトル","p":[["spect","見る"]],"i":"虹みたいにずらっと並んで見えるもの","r":"a wide spectrum of ～（幅広い～）"},{"n":"1125","w":"visible","m":"目に見える","p":[["vis","見る"],["ible","できる"]],"i":"見ることができる","r":"invisible（目に見えない）"},{"n":"1848","w":"specimen","m":"標本、見本","p":[["spec","見る"]],"i":"見せるために取っておく例","r":"sample ≒"},{"n":"485","w":"survey","m":"調査、見渡す","p":[["sur","上から"],["vey","見る"]],"i":"上から全体を見渡す","r":"調査（アンケート）"},{"n":"721","w":"perspective","m":"視点、遠近法","p":[["per","通して"],["spect","見る"]],"i":"どこを通して見るかの見方","r":"point of view ≒"}]},{"world":"splatoon","title":"夜のステージ","lab":"見る・光","labJa":"テーマ","icon":"see","en":"The night stage is {{dim}}, but our ink seems to {{glow}}. The lights {{illuminate}} only the center. I {{glanced:glance}} at the map and caught a {{glimpse}} of an enemy. Hime {{stared:stare}} at the screen without moving. The {{sight}} of the colors was {{vivid}}. After the match, Iida {{gazed:gaze}} at the stars. My eyes were tired, and everything started to {{blur}}.","ja":"夜のステージは薄暗いけど、ぼくらのインクは光っているみたい。ライトは真ん中だけを照らしている。マップをちらっと見ると、敵の姿がちらりと見えた。ヒメは動かずに画面をじっと見つめた。色の眺めは鮮やかだった。試合のあと、イイダは星をじっと眺めた。ぼくの目は疲れて、すべてがぼやけ始めた。","ken":"「見る」系の使い分け★ <b>glance＝ちらっと見る、glimpse＝ちらっと見えること（catch a glimpse of）、stare＝じーっとガン見、gaze＝うっとり長く見る</b>。テストで選ばされるやつ！","words":[{"n":"1945","w":"dim","m":"薄暗い","p":[["dim","暗い"]],"i":"ライトを落とした感じ","r":"bright が反対語"},{"n":"1366","w":"glow","m":"光る、輝き","p":[["glow","熱で光る"]],"i":"ほんのり光る","r":"glowing（輝く）"},{"n":"1246","w":"illuminate","m":"照らす、明らかにする","p":[["il","中を"],["lumin","光"]],"i":"中まで光を当てる","r":"illumination（イルミネーション）"},{"n":"877","w":"glance","m":"ちらっと見る","p":[["glance","かすめる"]],"i":"視線がサッとかすめる","r":"at a glance（ひと目で）"},{"n":"1481","w":"glimpse","m":"ちらりと見えること","p":[["glimpse","かすか"]],"i":"一瞬だけ見える","r":"catch a glimpse of ～"},{"n":"920","w":"stare","m":"じっと見つめる","p":[["stare","凝視"]],"i":"目を見開いてガン見","r":"stare at ～"},{"n":"201","w":"sight","m":"視力、光景、見ること","p":[["sight","見る"]],"i":"目に入る景色","r":"at first sight（ひと目で）"},{"n":"837","w":"vivid","m":"鮮やかな、生き生きした","p":[["viv","生きる"]],"i":"生きているように鮮やか","r":"vivid memory（鮮明な記憶）"},{"n":"910","w":"gaze","m":"じっと眺める","p":[["gaze","見つめる"]],"i":"うっとり長く見る","r":"gaze at the stars"},{"n":"1726","w":"blur","m":"ぼやける、ぼかす","p":[["blur","しみ"]],"i":"にじんでぼやっとする","r":"blurry（ぼやけた）"}]},{"world":"splatoon","title":"インクもれ事件","lab":"インク","labJa":"テーマ","icon":"theme","en":"Bukichi {{pours:pour}} new ink into a big tank. \"Careful, don't {{spill}} it!\" he says. Too late. The tank starts to {{leak}}, and ink {{scatters:scatter}} everywhere. My shoes are {{soaked:soak}}. I {{dip}} a cloth in water and {{wipe}} the floor. Hime {{sweeps:sweep}} the mess into a corner. We open the {{drain}} to let the ink out. Finally, Bukichi {{polishes:polish}} the tank until it shines.","ja":"ブキチが大きなタンクに新しいインクを注ぐ。「気をつけて、こぼしちゃダメでし！」と彼。もう遅い。タンクが漏れ始めて、インクがあちこちに飛び散る。ぼくの靴はびしょびしょ。布を水に浸して床をふく。ヒメが汚れを隅に掃き集める。インクを流すために排水口を開ける。最後に、ブキチはタンクがピカピカになるまで磨く。","ken":"液体系の動詞まとめ。<b>pour＝注ぐ、spill＝こぼす、leak＝漏れる、soak＝浸す・びしょぬれ</b>。インクまみれの絵を想像しながら読むと一発で入る！","words":[{"n":"923","w":"pour","m":"注ぐ、激しく降る","p":[["pour","流し込む"]],"i":"ドボドボ注ぐ","r":"It's pouring.（どしゃ降りだ）"},{"n":"697","w":"spill","m":"こぼす","p":[["spill","こぼれる"]],"i":"うっかりバシャッ","r":"spill coffee"},{"n":"1257","w":"leak","m":"漏れる、漏らす","p":[["leak","しみ出る"]],"i":"すきまからポタポタ","r":"情報が漏れる、にも使う"},{"n":"904","w":"scatter","m":"まき散らす","p":[["scatter","ばらまく"]],"i":"四方八方に飛び散る","r":"散らばる"},{"n":"1268","w":"soak","m":"浸す、びしょぬれにする","p":[["soak","しみこむ"]],"i":"水がしみこんでぐっしょり","r":"be soaked（ずぶぬれ）"},{"n":"1775","w":"dip","m":"ちょっと浸す","p":[["dip","沈める"]],"i":"サッとつけてすぐ出す","r":"ポテトをソースに dip"},{"n":"894","w":"wipe","m":"ふく","p":[["wipe","ぬぐう"]],"i":"布でサッとぬぐう","r":"wipe out（全滅させる）"},{"n":"917","w":"sweep","m":"掃く、さっと動く","p":[["sweep","ほうきで払う"]],"i":"ほうきでシャッシャッ","r":"swept（過去形）"},{"n":"1365","w":"drain","m":"排水口、水を抜く","p":[["drain","乾かす"]],"i":"水をスーッと抜く","r":"be drained（ヘトヘトになる）"},{"n":"912","w":"polish","m":"磨く","p":[["polish","なめらかにする"]],"i":"ピカピカに磨く","r":"Polish（ポーランドの）とは別"}]},{"world":"splatoon","title":"試合前のストレッチ","lab":"動き","labJa":"テーマ","icon":"theme","en":"Before the match, I {{stretch}} my arms and {{bend}} my knees. Hime {{shakes:shake}} her body to relax. When the match starts, I {{leap}} over a wall and {{bounce}} off a ball. An enemy {{crawls:crawl}} slowly under a bridge. The stage starts to {{rotate}}, and we {{drift}} to the left. I {{twist}} my body to dodge a shot and {{squeeze}} through a small gap.","ja":"試合の前、ぼくは腕を伸ばしてひざを曲げる。ヒメはリラックスするために体をゆらす。試合が始まると、壁を飛び越えてボールで跳ね返る。敵は橋の下をゆっくり這っている。ステージが回転し始めて、ぼくらは左へ流されていく。体をひねって弾をよけ、小さなすきまを無理やり通り抜ける。","ken":"体の動き10個。これは<b>実際に体を動かしながら</b>覚えるのが最強。筋トレのストレッチの時に「stretch, bend, twist...」ってつぶやいてみ笑","words":[{"n":"165","w":"stretch","m":"伸ばす、ストレッチする","p":[["stretch","引っぱる"]],"i":"腕をぐーっと伸ばす","r":"a stretch of ～（ひと続きの～）"},{"n":"907","w":"bend","m":"曲げる","p":[["bend","曲げる"]],"i":"ひざをグッと曲げる","r":"bent（過去形）"},{"n":"107","w":"shake","m":"ふる、ゆらす","p":[["shake","ゆさぶる"]],"i":"ブルブル","r":"shake hands（握手する）"},{"n":"898","w":"leap","m":"跳ぶ","p":[["leap","大ジャンプ"]],"i":"ピョーンと大きく跳ぶ","r":"jump ≒"},{"n":"1241","w":"bounce","m":"跳ね返る","p":[["bounce","はずむ"]],"i":"ボールがポンポン","r":"bounce back（立ち直る）"},{"n":"1376","w":"crawl","m":"はう","p":[["crawl","はう"]],"i":"赤ちゃんのハイハイ","r":"クロール（泳ぎ方）"},{"n":"1394","w":"rotate","m":"回転する、交代する","p":[["rot","車輪"]],"i":"車輪みたいにぐるぐる","r":"rotation（回転）"},{"n":"1424","w":"drift","m":"漂う、流される","p":[["drift","流れ"]],"i":"水に浮いてゆらゆら","r":"drift apart（だんだん疎遠になる）"},{"n":"1427","w":"twist","m":"ねじる","p":[["twist","2つにより合わせる"]],"i":"ぞうきんをギュッとねじる","r":"a twist（意外な展開）"},{"n":"1404","w":"squeeze","m":"しぼる、押しこむ","p":[["squeeze","ギュッ"]],"i":"レモンをしぼる、満員電車に押しこむ","r":"squeeze in"}]},{"world":"splatoon","title":"旗をうばえ","lab":"手の動き","labJa":"テーマ","icon":"theme","en":"Hime {{grabs:grab}} my arm. \"Look!\" A rival has {{seized:seize}} our flag. I {{tap}} my screen to call the team. Iida {{grasps:grasp}} the situation fast. In the fight, I {{bump}} into a wall and {{rub}} my head. Someone {{pokes:poke}} me from behind. It's Hime. She {{slaps:slap}} my back and says, \"Go!\" I {{scratch}} my head and start running. After the win, we all {{hug}}.","ja":"ヒメがぼくの腕をつかむ。「見て！」ライバルがぼくらの旗を奪い取った。画面をトンとたたいてチームを呼ぶ。イイダはすぐに状況を把握する。戦いの中で、ぼくは壁にぶつかって頭をさする。誰かが後ろからつつく。ヒメだ。彼女はぼくの背中をバシッとたたいて「行って！」と言う。ぼくは頭をかいて、走り出す。勝ったあと、みんなで抱き合う。","ken":"★<b>grasp</b> は「しっかりつかむ」から「理解する」の意味もある。grasp the meaning（意味を理解する）。seize は seize the chance（チャンスをつかむ）って形でよく出るで。","words":[{"n":"915","w":"grab","m":"つかむ","p":[["grab","ひっつかむ"]],"i":"サッと乱暴につかむ","r":"grab a bite（軽く食べる）"},{"n":"1415","w":"seize","m":"つかむ、奪う","p":[["seize","押さえる"]],"i":"ガシッと奪い取る","r":"seize the chance（チャンスをつかむ）"},{"n":"700","w":"tap","m":"軽くたたく、蛇口","p":[["tap","トン"]],"i":"指でトントン","r":"tap water（水道水）"},{"n":"647","w":"grasp","m":"しっかりつかむ、理解する","p":[["grasp","握る"]],"i":"ギュッと握る、頭でつかむ","r":"grasp the meaning"},{"n":"1429","w":"bump","m":"ぶつかる","p":[["bump","ドン"]],"i":"ドンとぶつかる","r":"bump into ～（～に偶然会う）"},{"n":"1344","w":"rub","m":"こする","p":[["rub","こする"]],"i":"手でゴシゴシ","r":"rub one's eyes（目をこする）"},{"n":"1742","w":"poke","m":"つつく","p":[["poke","つつく"]],"i":"指でツンツン","r":"「ポケ」っとつつく"},{"n":"1711","w":"slap","m":"平手でたたく","p":[["slap","ピシャッ"]],"i":"手のひらでバシッ","r":"slap on the back"},{"n":"1351","w":"scratch","m":"かく、ひっかく","p":[["scratch","ひっかく"]],"i":"頭をポリポリ","r":"from scratch（ゼロから）"},{"n":"1440","w":"hug","m":"抱きしめる","p":[["hug","抱く"]],"i":"ギュッとハグ","r":"embrace ≒"}]},{"world":"splatoon","title":"スタジアムの音","lab":"声・音","labJa":"テーマ","icon":"theme","en":"The stadium is loud. Fans {{yell}} our names, and some are {{screaming}}. The crowd {{roars:roar}} when Hime scores. Iida {{whispers:whisper}} a plan in my ear. Judge-kun blows a {{whistle}}. I hear the {{rattle}} of an old machine. The enemy team {{sighs:sigh}} and {{murmurs:murmur}} to each other. At the end, everyone starts to {{clap}}. I'm so happy that I can't {{utter}} a word.","ja":"スタジアムはうるさい。ファンがぼくらの名前を叫んで、悲鳴みたいな声を上げている人もいる。ヒメが点を取ると観客がうおーっとどよめく。イイダがぼくの耳に作戦をささやく。ジャッジくんが笛を吹く。古い機械のガタガタいう音が聞こえる。敵チームはため息をついて、ぶつぶつ言い合っている。最後には、みんなが拍手し始める。うれしすぎて、ひと言も言葉を発せない。","ken":"声の大きさ順に並べると覚えやすい！ <b>whisper ＜ murmur ＜ yell ＜ scream ＜ roar</b>。utter は「言葉を口から出す」、形容詞だと「完全な」って別の意味もあるで。","words":[{"n":"1379","w":"yell","m":"叫ぶ","p":[["yell","大声"]],"i":"「おーい！」と大声","r":"shout ≒"},{"n":"909","w":"screaming","m":"悲鳴を上げている","p":[["scream","金切り声"]],"i":"キャーッと叫ぶ","r":"scream（叫ぶ）"},{"n":"1352","w":"roar","m":"ほえる、とどろく","p":[["roar","うなる"]],"i":"ライオンのガオー","r":"a roar of laughter（大爆笑）"},{"n":"918","w":"whisper","m":"ささやく","p":[["whisper","ひそひそ"]],"i":"耳元でこっそり","r":"in a whisper（小声で）"},{"n":"1496","w":"whistle","m":"笛、口笛","p":[["whistle","ピーッ"]],"i":"ピーッと鳴る","r":"blow a whistle"},{"n":"1724","w":"rattle","m":"ガタガタ鳴る","p":[["rattle","ガラガラ"]],"i":"赤ちゃんのガラガラ","r":"ガタガタ音"},{"n":"1256","w":"sigh","m":"ため息をつく","p":[["sigh","はぁ"]],"i":"はぁ〜と息をつく","r":"with a sigh"},{"n":"1751","w":"murmur","m":"つぶやく、ささやき","p":[["murmur","ぶつぶつ"]],"i":"小さな声でぶつぶつ","r":"ささやき声"},{"n":"638","w":"clap","m":"拍手する","p":[["clap","パチパチ"]],"i":"手をパンパン","r":"clap one's hands"},{"n":"1419","w":"utter","m":"（言葉を）発する、完全な","p":[["ut","外へ"]],"i":"口から外へ出す","r":"utterly（完全に）"}]},{"world":"splatoon","title":"ハイカラニュース","lab":"ニュース","labJa":"テーマ","icon":"theme","en":"Hime and Iida run a news show. Tonight, they {{announce}} the new stages. The show is {{broadcast}} live across the city. Iida reads from a {{script}}, but Hime makes jokes. A magazine will {{publish}} an article about it, and the {{headline}} says, \"New Battle Begins!\" There is a {{rumor}} that a secret weapon is coming. Bukichi uses the news for {{publicity}}. He even {{quotes:quote}} Hime in his {{advertising}}. The {{coverage}} of the event is huge.","ja":"ヒメとイイダはニュース番組をやっている。今夜、二人は新しいステージを発表する。番組は街じゅうに生放送される。イイダは台本どおり読むけど、ヒメは冗談を言う。雑誌がそれについての記事を出す予定で、見出しは「新バトル開幕！」。秘密のブキが来るといううわさがある。ブキチはそのニュースを宣伝に使う。広告の中でヒメの言葉を引用までしている。そのイベントの報道はすごい量だ。","ken":"メディア系単語。<b>broadcast（放送する）は活用が broadcast-broadcast-broadcast</b>で変わらへん。coverage は「カバーする範囲」＝報道。ネットやテレビの長文でよく出るで。","words":[{"n":"390","w":"announce","m":"発表する","p":[["an","～へ"],["nounce","知らせる"]],"i":"みんなに向けて知らせる","r":"announcement（発表）"},{"n":"874","w":"broadcast","m":"放送する","p":[["broad","広く"],["cast","投げる"]],"i":"電波を広く投げる","r":"過去形も broadcast"},{"n":"1524","w":"script","m":"台本、文字","p":[["script","書かれたもの"]],"i":"書かれたセリフ","r":"manuscript（原稿）"},{"n":"379","w":"publish","m":"出版する、公表する","p":[["publ","人々"]],"i":"人々（public）に出す","r":"publisher（出版社）"},{"n":"1475","w":"headline","m":"見出し","p":[["head","頭"],["line","行"]],"i":"記事のいちばん上の行","r":"make headlines（大きく報道される）"},{"n":"1587","w":"rumor","m":"うわさ","p":[["rumor","ざわめき"]],"i":"ひそひそ広がる話","r":"Rumor has it that ～（うわさでは～）"},{"n":"1295","w":"publicity","m":"宣伝、注目","p":[["public","人々"]],"i":"人々に知らせること","r":"publicize（宣伝する）"},{"n":"1353","w":"quote","m":"引用する、見積もり","p":[["quote","番号をふる"]],"i":"人の言葉をそのまま使う","r":"quotation（引用）"},{"n":"524","w":"advertising","m":"広告（業）","p":[["ad","～へ"],["vert","向ける"]],"i":"人々の目をこっちへ向ける","r":"advertisement（広告）"},{"n":"1863","w":"coverage","m":"報道、補償範囲","p":[["cover","おおう"]],"i":"ニュースがカバーする範囲","r":"保険の補償範囲にも使う"}]},{"world":"splatoon","title":"イイダの読書","lab":"本","labJa":"テーマ","icon":"theme","en":"Iida loves books. She reads {{literature}} and {{fiction}} every night. Her favorite {{author}} wrote a {{biography}} of a famous Inkling. In the first {{chapter}}, the {{narrative}} starts in a small town. An {{editor}} at a magazine asked Iida to write a short {{text}} about the book. She checked an {{encyclopedia}} and some old {{documents:document}} to make it correct.","ja":"イイダは本が大好き。毎晩、文学と小説を読んでいる。彼女の好きな作家は、有名なインクリングの伝記を書いた。第1章では、物語は小さな町から始まる。雑誌の編集者がイイダに、その本について短い文章を書いてほしいと頼んだ。彼女は内容を正しくするために百科事典や古い文書を調べた。","ken":"<b>fiction（作り話・小説）の反対は nonfiction</b>。biography は bio（命）+ graph（書く）で「人生を書いたもの」＝伝記。auto をつけて autobiography（自伝）もセットで！","words":[{"n":"462","w":"literature","m":"文学","p":[["liter","文字"]],"i":"文字で書かれた芸術","r":"literary（文学の）"},{"n":"467","w":"fiction","m":"小説、作り話","p":[["fict","作る"]],"i":"作られたお話","r":"science fiction（SF）"},{"n":"410","w":"author","m":"作家、著者","p":[["author","生み出す人"]],"i":"本を生み出した人","r":"writer ≒"},{"n":"1578","w":"biography","m":"伝記","p":[["bio","命"],["graph","書く"]],"i":"人の一生を書いたもの","r":"autobiography（自伝）"},{"n":"1594","w":"chapter","m":"章","p":[["chapter","頭"]],"i":"本の区切りのひとつ","r":"a new chapter（新しい局面）"},{"n":"1823","w":"narrative","m":"物語、語り","p":[["narr","語る"]],"i":"お話として語られたもの","r":"narrator（語り手）"},{"n":"1031","w":"editor","m":"編集者","p":[["edit","出す"]],"i":"原稿を整えて世に出す人","r":"edition（版）"},{"n":"393","w":"text","m":"文章、本文、メッセージを送る","p":[["text","織られたもの"]],"i":"言葉で織られた文","r":"textbook（教科書）"},{"n":"1480","w":"encyclopedia","m":"百科事典","p":[["en","中に"],["cyclo","輪"],["pedia","教育"]],"i":"知識をぐるっと全部入れた本","r":"Wikipedia も同じ pedia"},{"n":"471","w":"document","m":"文書、記録する","p":[["doc","教える"]],"i":"証拠として残す書類","r":"documentary（ドキュメンタリー）"}]},{"world":"splatoon","title":"ヒメの方言","lab":"ことば","labJa":"テーマ","icon":"theme","en":"Hime speaks a strong {{dialect}}, and Iida uses a lot of {{slang}}. A {{linguistic}} researcher came to study them. \"Your {{vocabulary}} is amazing,\" she said. Iida is {{bilingual}} and {{fluent}} in two languages. Hime is very {{vocal}} about her opinions. They have an {{oral}} test tomorrow. The teacher will check how they {{pronounce}} words and give {{verbal}} feedback.","ja":"ヒメは強い方言を話して、イイダはスラングをたくさん使う。言語学の研究者が二人を研究しに来た。「あなたたちの語彙はすごいわ」と彼女。イイダはバイリンガルで、2つの言語をすらすら話せる。ヒメは自分の意見をはっきり口に出す。二人は明日、口頭試験がある。先生は二人が単語をどう発音するかをチェックして、口頭でフィードバックをくれる。","ken":"こーちゃん、大阪弁も立派な dialect やで笑 <b>pronounce の名詞は pronunciation（o が消える！）</b>★スペル注意。verbal は「言葉の」、oral は「口の」。","words":[{"n":"1073","w":"dialect","m":"方言","p":[["dia","間で"],["lect","話す"]],"i":"地域の人たちの間の話し方","r":"大阪弁は Osaka dialect"},{"n":"1874","w":"slang","m":"スラング、俗語","p":[["slang","くだけた言葉"]],"i":"友だち同士のくだけた言葉","r":"ヤバい、エモい など"},{"n":"1158","w":"linguistic","m":"言語の","p":[["lingu","舌"]],"i":"舌＝言葉に関する","r":"linguistics（言語学）"},{"n":"486","w":"vocabulary","m":"語彙","p":[["voc","声、呼ぶ"]],"i":"知っている言葉の全体","r":"vocabulary book（単語帳）"},{"n":"260","w":"bilingual","m":"2言語を話す","p":[["bi","2"],["lingu","舌"]],"i":"舌が2本ある感じ","r":"trilingual（3言語）"},{"n":"1182","w":"fluent","m":"流ちょうな","p":[["flu","流れる"]],"i":"言葉がスラスラ流れる","r":"fluently（流ちょうに）"},{"n":"1668","w":"vocal","m":"声の、はっきり主張する","p":[["voc","声"]],"i":"声に出す","r":"vocalist（ボーカル）"},{"n":"1648","w":"oral","m":"口頭の、口の","p":[["or","口"]],"i":"口で言う","r":"oral exam（口頭試験）"},{"n":"679","w":"pronounce","m":"発音する","p":[["pro","前へ"],["nounce","知らせる"]],"i":"口から前へ声を出す","r":"pronunciation（発音）スペル注意"},{"n":"1160","w":"verbal","m":"言葉の、口頭の","p":[["verb","言葉"]],"i":"言葉で表す","r":"nonverbal（言葉を使わない）"}]},{"world":"splatoon","title":"国語の授業","lab":"ことば2","labJa":"テーマ","icon":"theme","en":"In class, Iida explained a {{metaphor}}: \"Life is a Turf War.\" Hime didn't get it, so Iida used an {{analogy}} with ink. The class read some {{prose}} and an old {{proverb}}: \"Practice makes perfect.\" Then they watched a {{cartoon}}. There was some {{irony}} in it: the hero was afraid of water. They had a {{dialogue}} about the story. The teacher also talked about political {{discourse}} and {{rhetoric}}. Finally, Hime told a {{riddle}} that nobody could solve.","ja":"授業でイイダが隠喩（メタファー）を説明した。「人生はナワバリバトルだ」。ヒメがわからなかったので、イイダはインクを使ったたとえ話（類推）をした。クラスは散文と古いことわざを読んだ。「練習が完ぺきを作る」。それからアニメを見た。その中には皮肉があった。主人公が水をこわがっていたのだ。みんなで物語について対話した。先生は政治の言説やレトリック（話術）についても話した。最後に、ヒメが誰も解けないなぞなぞを出した。","ken":"現代文でも出てくる用語やから、国語得意なこーちゃんは楽勝やろ！ <b>metaphor＝隠喩、irony＝皮肉、analogy＝類推</b>。文学部の長文で絶対出るで★","words":[{"n":"1582","w":"metaphor","m":"隠喩、たとえ","p":[["meta","越えて"],["phor","運ぶ"]],"i":"意味を別のものへ運ぶ","r":"simile（直喩）"},{"n":"1861","w":"analogy","m":"類推、たとえ","p":[["ana","～に沿って"],["logy","言葉"]],"i":"似ている点に沿って考える","r":"analogous（類似した）"},{"n":"1787","w":"prose","m":"散文","p":[["prose","まっすぐな"]],"i":"詩じゃないふつうの文章","r":"poetry（詩）が反対"},{"n":"1467","w":"proverb","m":"ことわざ","p":[["pro","前へ"],["verb","言葉"]],"i":"昔から人前で言われてきた言葉","r":"saying ≒"},{"n":"453","w":"cartoon","m":"アニメ、マンガ","p":[["cart","紙"]],"i":"紙に描いた絵","r":"cartoonist（漫画家）"},{"n":"1542","w":"irony","m":"皮肉","p":[["irony","知らないふり"]],"i":"期待と逆になるおかしさ","r":"ironic（皮肉な）"},{"n":"1589","w":"dialogue","m":"対話","p":[["dia","間で"],["logue","話す"]],"i":"二人の間の会話","r":"monologue（ひとり語り）"},{"n":"1841","w":"discourse","m":"言説、談話","p":[["dis","あちこち"],["course","走る"]],"i":"話があちこち走り回る","r":"まとまった話や議論"},{"n":"1856","w":"rhetoric","m":"修辞、話術","p":[["rhetor","話し手"]],"i":"人を動かす話し方","r":"rhetorical question（修辞疑問）"},{"n":"1895","w":"riddle","m":"なぞなぞ","p":[["riddle","考えさせるもの"]],"i":"頭をひねるクイズ","r":"puzzle ≒"}]},{"world":"splatoon","title":"大会で優勝","lab":"試合","labJa":"テーマ","icon":"theme","en":"Our team will {{compete}} in a big tournament. Some players there are top {{athletes:athlete}}. In the first {{match}}, we get a high {{score}}. We {{tackle}} each problem one by one. In the last {{lap}} of the race stage, Hime makes an amazing jump. It is a real {{feat}}. Our team moves up in {{rank}}, and we win an {{award}}. What a {{triumph}}!","ja":"ぼくらのチームは大きな大会で競う。そこにはトップクラスの選手もいる。最初の試合で、ぼくらは高得点を取る。問題にひとつずつ取り組む。レースステージの最終周で、ヒメがすごいジャンプを決める。本当に見事な偉業だ。チームは順位を上げて、賞を取る。なんという大勝利！","ken":"tackle は「タックルする」だけじゃなくて<b>「（問題に）取り組む」</b>が大事！ tackle a problem ＝ deal with a problem。feat（偉業）と feet（足）を間違えんといてな笑","words":[{"n":"388","w":"compete","m":"競う","p":[["com","一緒に"],["pete","求める"]],"i":"みんなで同じものを求める","r":"competition（競争）"},{"n":"429","w":"athlete","m":"運動選手","p":[["athl","競技"]],"i":"競技をする人","r":"athletic（運動の）"},{"n":"96","w":"match","m":"試合、似合う、匹敵する","p":[["match","対になるもの"]],"i":"相手と対になる","r":"be no match for ～（～にかなわない）"},{"n":"395","w":"score","m":"得点、楽譜、20","p":[["score","刻み目"]],"i":"点数を刻む","r":"scores of ～（多数の～）"},{"n":"1384","w":"tackle","m":"取り組む、タックルする","p":[["tackle","道具"]],"i":"問題に正面からぶつかる","r":"tackle a problem"},{"n":"1513","w":"lap","m":"（トラックの）1周、ひざ","p":[["lap","ひざの上"]],"i":"ぐるっと1周","r":"on one's lap（ひざの上に）"},{"n":"1816","w":"feat","m":"偉業","p":[["feat","行い"]],"i":"すごいことをやってのける","r":"feet（足）と区別"},{"n":"709","w":"rank","m":"順位、地位","p":[["rank","列"]],"i":"列の中の位置","r":"rank first（1位になる）"},{"n":"769","w":"award","m":"賞、与える","p":[["a","強め"],["ward","見守る"]],"i":"よく見て与えるごほうび","r":"reward（報酬）とは別"},{"n":"1483","w":"triumph","m":"大勝利","p":[["triumph","凱旋"]],"i":"勝って大喜びで帰る","r":"triumphant（勝ち誇った）"}]},{"world":"splatoon","title":"ヒメの服屋さん","lab":"服","labJa":"テーマ","icon":"theme","en":"Hime opens a fashion shop. Every {{garment}} there is special. She chooses the {{fabric}} from a {{textile}} factory. She uses strong {{thread}} to {{sew}} the shirts. Iida {{knits:knit}} hats and {{weaves:weave}} small bags. They also sell {{leather}} shoes and some cute {{jewelry}}. At night, they {{fold}} all the clothes neatly.","ja":"ヒメがファッションのお店を開く。そこの衣服はどれも特別だ。彼女は布を織物工場から選ぶ。シャツを縫うのに丈夫な糸を使う。イイダは帽子を編み、小さなバッグを織る。革の靴やかわいい宝石類も売っている。夜には、全部の服をきれいにたたむ。","ken":"<b>sew（縫う）は「ソウ」</b>って読む！ so や saw と同じような発音。knit の k は読まへんで（ニット）。","words":[{"n":"1537","w":"garment","m":"衣服（1着）","p":[["garment","身を守るもの"]],"i":"服1枚","r":"clothes ≒"},{"n":"1294","w":"fabric","m":"布、構造","p":[["fabric","作られたもの"]],"i":"服の生地","r":"the fabric of society（社会の構造）"},{"n":"1788","w":"textile","m":"織物","p":[["text","織る"]],"i":"織って作ったもの","r":"text（文章）も「言葉で織ったもの」"},{"n":"1458","w":"thread","m":"糸","p":[["thread","よられたもの"]],"i":"針に通す糸","r":"スレッド（話題のつながり）"},{"n":"174","w":"sew","m":"縫う","p":[["sew","縫う"]],"i":"針と糸でチクチク","r":"発音は「ソウ」"},{"n":"1442","w":"knit","m":"編む","p":[["knit","結ぶ"]],"i":"毛糸で編む","r":"k は読まない"},{"n":"1425","w":"weave","m":"織る","p":[["weave","編む"]],"i":"糸を縦横に組み合わせる","r":"wove, woven"},{"n":"1559","w":"leather","m":"革","p":[["leather","なめし革"]],"i":"牛などの皮を加工したもの","r":"leather shoes"},{"n":"1560","w":"jewelry","m":"宝石類、アクセサリー","p":[["jewel","宝石"]],"i":"身につけるキラキラ","r":"数えられない名詞"},{"n":"916","w":"fold","m":"たたむ、折る","p":[["fold","折る"]],"i":"服をきちんとたたむ","r":"fold one's arms（腕を組む）"}]},{"world":"splatoon","title":"ハイカラ・アート展","lab":"アート","labJa":"テーマ","icon":"theme","en":"Haikara City holds an art show. A {{statue}} of a giant squid stands at the gate. An artist {{carves:carve}} wood to make a {{sculpture}}. One painting {{depicts:depict}} a Turf War, and it {{portrays:portray}} the players as heroes. People call it a {{masterpiece}}. Hime {{decorates:decorate}} the walls with ink. Iida writes a book to {{illustrate}} the history of local {{craft}}. Everyone loves the {{aesthetic}} of the show.","ja":"ハイカラシティでアート展が開かれる。入り口には巨大なイカの像が立っている。ある芸術家は木を彫って彫刻を作る。ある絵はナワバリバトルを描いていて、選手たちを英雄として描いている。人々はそれを傑作と呼ぶ。ヒメは壁をインクで飾る。イイダは地元の工芸の歴史を説明する本を書く。みんながこの展示の美しさ（美的センス）を気に入っている。","ken":"「描く」は3つ！ <b>depict, portray, illustrate</b>。draw（線で描く）、paint（絵の具で描く）とあわせて覚えよう。aesthetic は「美の、美的な」、エステと同じ語源やで。","words":[{"n":"1066","w":"statue","m":"像","p":[["stat","立つ"]],"i":"立っている彫像","r":"the Statue of Liberty（自由の女神）"},{"n":"1381","w":"carve","m":"彫る、切り分ける","p":[["carve","切る"]],"i":"ナイフで彫りこむ","r":"carve a turkey"},{"n":"1569","w":"sculpture","m":"彫刻","p":[["sculpt","彫る"]],"i":"彫って作った作品","r":"sculptor（彫刻家）"},{"n":"1405","w":"depict","m":"描く","p":[["de","下に"],["pict","描く"]],"i":"絵や言葉で描き出す","r":"picture も pict 仲間"},{"n":"1363","w":"portray","m":"描く、演じる","p":[["por","前へ"],["tray","引く"]],"i":"姿を前に引き出して描く","r":"portrait（肖像画）"},{"n":"1790","w":"masterpiece","m":"傑作","p":[["master","名人"],["piece","作品"]],"i":"名人の作品","r":"最高傑作"},{"n":"170","w":"decorate","m":"飾る","p":[["decor","美しさ"]],"i":"美しく飾りつける","r":"decoration（飾り）"},{"n":"625","w":"illustrate","m":"説明する、挿絵を入れる","p":[["il","中を"],["lustr","照らす"]],"i":"例や絵で照らしてわかりやすく","r":"illustration（イラスト）"},{"n":"780","w":"craft","m":"工芸、技術","p":[["craft","力、技"]],"i":"手先の技","r":"aircraft（航空機）、Minecraft も！"},{"n":"1970","w":"aesthetic","m":"美の、美的な","p":[["aesthe","感じる"]],"i":"美しさを感じる心","r":"エステの語源"}]},{"world":"splatoon","title":"フェス10周年","lab":"フェス","labJa":"テーマ","icon":"theme","en":"It's the tenth {{anniversary}} of Splatfest. We {{celebrate}} with a big concert. A huge {{audience}} comes. Hime and Iida sing a new {{tune}} to {{entertain}} the fans. Everyone {{cheers:cheer}} and {{applauds:applaud}}. After the show, I {{congratulate}} them. \"Your voices were great,\" I say. Hime smiles at the {{compliment}}. Their {{fame}} grows bigger every year.","ja":"フェス10周年。ぼくらは大きなコンサートで祝う。大勢の観客が来る。ヒメとイイダはファンを楽しませるために新しい曲を歌う。みんなが歓声を上げて拍手を送る。ショーのあと、ぼくは二人におめでとうと言う。「声、最高だったよ」。ヒメはそのほめ言葉に笑顔になる。二人の名声は毎年大きくなっていく。","ken":"★<b>congratulate 人 on ～（～のことで人を祝う）</b>。on を入れるのがポイント。「おめでとう！」は Congratulations! で、s を忘れずに！","words":[{"n":"1470","w":"anniversary","m":"記念日","p":[["anni","年"],["vers","回る"]],"i":"1年がぐるっと回ってきた日","r":"wedding anniversary"},{"n":"169","w":"celebrate","m":"祝う","p":[["celebr","にぎやか"]],"i":"大勢でにぎやかに祝う","r":"celebration（祝賀）"},{"n":"226","w":"audience","m":"観客、聴衆","p":[["audi","聞く"]],"i":"聞きに来た人たち","r":"audio（音声）"},{"n":"749","w":"tune","m":"曲、調子を合わせる","p":[["tune","音"]],"i":"メロディー","r":"in tune（調子が合って）"},{"n":"871","w":"entertain","m":"楽しませる、もてなす","p":[["enter","間に"],["tain","保つ"]],"i":"人の間をつないで楽しませる","r":"entertainment"},{"n":"35","w":"cheer","m":"歓声、元気づける","p":[["cheer","顔"]],"i":"顔を明るくさせる","r":"Cheer up!（元気出して）"},{"n":"1737","w":"applaud","m":"拍手する、称賛する","p":[["ap","～へ"],["plaud","手をたたく"]],"i":"拍手を送る","r":"applause（拍手）"},{"n":"1226","w":"congratulate","m":"祝う","p":[["con","一緒に"],["grat","喜ぶ"]],"i":"一緒に喜ぶ","r":"congratulate 人 on ～"},{"n":"1468","w":"compliment","m":"ほめ言葉","p":[["com","完全に"],["pli","満たす"]],"i":"相手を満たす言葉","r":"complement（補うもの）とスペル注意★"},{"n":"1444","w":"fame","m":"名声","p":[["fame","うわさ"]],"i":"みんなに知られること","r":"famous（有名な）"}]},{"world":"splatoon","title":"イカ大学","lab":"学校","labJa":"テーマ","icon":"theme","en":"Iida wants to {{graduate}} from Squid University. She attends a {{lecture}} by a famous {{professor}}. He is a {{scholar}} of ink science. The {{curriculum}} is hard, and the {{tuition}} is high. Many {{faculty}} members teach there. Hime says school is like {{kindergarten}}. Before the exam, they {{cram}} all night. There is a study {{session}} at the library every Friday.","ja":"イイダはイカ大学を卒業したい。彼女は有名な教授の講義に出ている。彼はインク科学の学者だ。カリキュラムは難しくて、授業料は高い。たくさんの教員が教えている。ヒメは学校なんて幼稚園みたいだと言う。試験の前、二人は一晩中つめこみ勉強をする。毎週金曜日には図書館で勉強会がある。","ken":"<b>cram（つめこみ勉強する）</b>は受験生の必修単語笑 faculty は「学部」と「教員」と「能力」の3つ。こーちゃんが行きたいのは Faculty of Letters（文学部）やな★","words":[{"n":"87","w":"graduate","m":"卒業する","p":[["grad","段階"]],"i":"段階を上りきる","r":"graduate from ～（～を卒業する）"},{"n":"489","w":"lecture","m":"講義","p":[["lect","読む"]],"i":"先生が読んで聞かせる","r":"give a lecture"},{"n":"435","w":"professor","m":"教授","p":[["pro","前で"],["fess","言う"]],"i":"人前で教える人","r":"profess（公言する）"},{"n":"484","w":"scholar","m":"学者","p":[["schol","学校"]],"i":"学問を深める人","r":"scholarship（奨学金）"},{"n":"1040","w":"curriculum","m":"教育課程","p":[["curr","走る"]],"i":"学びの走るコース","r":"current（流れ）も同じ仲間"},{"n":"1532","w":"tuition","m":"授業料","p":[["tui","見守る"]],"i":"教えてもらうお金","r":"tuition fee"},{"n":"751","w":"faculty","m":"学部、教員、能力","p":[["fac","する"]],"i":"何かができる力","r":"★3つの意味をセットで"},{"n":"1590","w":"kindergarten","m":"幼稚園","p":[["kinder","子ども"],["garten","庭"]],"i":"子どもの庭（ドイツ語）","r":"nursery school ≒"},{"n":"1871","w":"cram","m":"つめこむ、つめこみ勉強","p":[["cram","つめる"]],"i":"頭にギュウギュウにつめる","r":"cram school（塾）"},{"n":"1318","w":"session","m":"会合、期間","p":[["sess","座る"]],"i":"座って集まる時間","r":"study session（勉強会）"}]},{"world":"splatoon","title":"ヒメとイイダの練習量","lab":"副詞：時と回数","labJa":"テーマ","icon":"theme","en":"Hime {{seldom}} practices, but she wins {{frequently}}. Iida practices every day and only loses {{occasionally}}. {{Lately:lately}}, Hime has been getting tired. One day, the music stopped {{abruptly}}, and two enemies attacked {{simultaneously}}. Hime reacted {{instantly}}. {{Meanwhile:meanwhile}}, Iida painted the back area. Our score {{gradually}} went up. {{Afterward:afterward}}, we ate ice cream together.","ja":"ヒメはめったに練習しないけど、しょっちゅう勝つ。イイダは毎日練習して、負けるのはたまにだけ。最近、ヒメは疲れ気味だ。ある日、音楽が突然止まって、敵が二人同時に攻めてきた。ヒメは即座に反応した。その間に、イイダは後ろのエリアを塗った。ぼくらのスコアは徐々に上がった。そのあと、みんなでアイスを食べた。","ken":"頻度の副詞は順番で覚える！ <b>always ＞ frequently ＞ occasionally ＞ seldom</b>。★<b>lately は「最近」</b>で、late（遅い）とは別物。現在完了と一緒によく使うで。","words":[{"n":"319","w":"seldom","m":"めったに～ない","p":[["seld","まれ"]],"i":"ほとんどゼロに近い回数","r":"rarely ≒"},{"n":"586","w":"frequently","m":"しばしば","p":[["frequent","ひんぱんな"]],"i":"何度も何度も","r":"frequency（頻度）"},{"n":"317","w":"occasionally","m":"ときどき","p":[["occasion","機会"]],"i":"機会があればたまに","r":"sometimes ≒"},{"n":"846","w":"lately","m":"最近","p":[["late","遅い→最近"]],"i":"ここ最近ずっと","r":"recently ≒、現在完了とよく使う"},{"n":"2024","w":"abruptly","m":"突然","p":[["ab","離れて"],["rupt","破れる"]],"i":"プツッと切れるように突然","r":"suddenly ≒"},{"n":"1691","w":"simultaneously","m":"同時に","p":[["simul","同じ"]],"i":"同じタイミングで","r":"at the same time ≒"},{"n":"589","w":"instantly","m":"即座に","p":[["instant","すぐの"]],"i":"一瞬で","r":"インスタントラーメンの instant"},{"n":"844","w":"meanwhile","m":"その間に","p":[["mean","中間"],["while","時"]],"i":"同じ時間のあいだに","r":"in the meantime ≒"},{"n":"588","w":"gradually","m":"徐々に","p":[["grad","段階"]],"i":"一段ずつ","r":"gradual（段階的な）"},{"n":"311","w":"afterward","m":"あとで","p":[["after","後"],["ward","方向"]],"i":"そのあとで","r":"afterwards とも書く"}]},{"world":"splatoon","title":"ニセモノのブキ","lab":"本物と偽物","labJa":"テーマ","icon":"theme","en":"A shop sells cheap weapons. \"Are they {{genuine}}?\" I ask. Bukichi looks closely. \"This one is {{fake}}. The ink is {{synthetic}}, not {{pure}}. And this {{artificial}} gold is just {{plain}} plastic.\" The ads were {{misleading}}, and the price tag gave {{false}} information. \"Only buy {{authentic}} weapons from a {{legitimate}} shop,\" says Bukichi.","ja":"あるお店が安いブキを売っている。「本物？」とぼくは聞く。ブキチがじっくり見る。「これはニセモノでし。インクは合成で、純粋じゃないでし。それにこの人工の金はただのプラスチックでし」。広告は誤解をまねくもので、値札もうその情報だった。「本物のブキは正規のお店でだけ買うでし」とブキチ。","ken":"「本物」は <b>genuine と authentic</b>、「ニセ」は <b>fake と false</b>。plain は「ふつうの、無地の」と「わかりやすい」の両方あるで。plain English（わかりやすい英語）。","words":[{"n":"812","w":"genuine","m":"本物の、心からの","p":[["genu","生まれつき"]],"i":"生まれたまんまの本物","r":"real ≒"},{"n":"1630","w":"fake","m":"ニセの、偽物","p":[["fake","ごまかす"]],"i":"見た目だけマネしたもの","r":"fake news"},{"n":"1340","w":"synthetic","m":"合成の","p":[["syn","一緒に"],["thet","置く"]],"i":"いろいろ組み合わせて作った","r":"synthesis（合成）"},{"n":"1140","w":"pure","m":"純粋な","p":[["pure","きれいな"]],"i":"何も混ざってない","r":"purify（浄化する）"},{"n":"558","w":"artificial","m":"人工の","p":[["art","技"],["fic","作る"]],"i":"人の技で作った","r":"natural が反対語、AI＝artificial intelligence"},{"n":"836","w":"plain","m":"ふつうの、わかりやすい、平原","p":[["plain","平ら"]],"i":"飾りのない平ら","r":"explain も plain 仲間"},{"n":"1339","w":"misleading","m":"誤解をまねく","p":[["mis","まちがって"],["lead","導く"]],"i":"まちがった方へ導く","r":"mislead（誤解させる）"},{"n":"841","w":"false","m":"まちがった、偽の","p":[["false","だます"]],"i":"本当じゃない","r":"true が反対語"},{"n":"1959","w":"authentic","m":"本物の","p":[["auth","自分で"]],"i":"本人が作った本物","r":"authentic food（本場の料理）"},{"n":"1946","w":"legitimate","m":"正当な、合法の","p":[["legi","法"]],"i":"法にかなった","r":"legal ≒"}]},{"world":"splatoon","title":"新チームカラー","lab":"すごい","labJa":"テーマ","icon":"theme","en":"Hime has a {{brilliant}} idea. \"Let's make a {{bold}} new team color!\" Iida thinks it's {{intriguing}}. They choose a {{striking}} gold. Their new stage looks {{magnificent}}. Bukichi makes an {{ingenious}} weapon to match it. \"This is my {{favorite}}!\" says Hime. Fans leave {{positive}} comments. It becomes a {{precious}} memory. Even older, {{respectable}} players love it.","ja":"ヒメがすばらしいアイデアを思いつく。「大胆な新しいチームカラーを作ろう！」イイダはそれを興味深いと思う。二人は目を引く金色を選ぶ。新しいステージは壮大に見える。ブキチはそれに合わせて独創的なブキを作る。「これ、いちばんのお気に入り！」とヒメ。ファンは前向きなコメントを残す。それは貴重な思い出になる。年上の立派なプレイヤーたちもそれを気に入る。","ken":"ほめ言葉シリーズ。<b>ingenious（独創的な）と ingenuous（素直な）</b>はスペルが似すぎてるから注意！ respectable（立派な）と respectful（礼儀正しい）も区別してな★","words":[{"n":"830","w":"brilliant","m":"すばらしい、輝く","p":[["brill","輝く"]],"i":"キラッと光るほど優秀","r":"bright ≒"},{"n":"1626","w":"bold","m":"大胆な、太字の","p":[["bold","勇気ある"]],"i":"思いきった","r":"bold type（太字）"},{"n":"2017","w":"intriguing","m":"興味をそそる","p":[["intrigue","からませる"]],"i":"気になって頭にからみつく","r":"interesting ≒"},{"n":"1130","w":"striking","m":"目を引く、著しい","p":[["strike","打つ"]],"i":"目にガツンと飛びこむ","r":"a striking difference"},{"n":"1635","w":"magnificent","m":"壮大な","p":[["magni","大きい"],["fic","作る"]],"i":"大きく立派に作られた","r":"magnify（拡大する）"},{"n":"1996","w":"ingenious","m":"独創的な、巧妙な","p":[["in","中に"],["gen","生まれ"]],"i":"生まれつきの才能で工夫した","r":"ingenuous（素直な）とスペル注意"},{"n":"542","w":"favorite","m":"お気に入りの","p":[["favor","好意"]],"i":"いちばん好き","r":"favor（好意）"},{"n":"278","w":"positive","m":"前向きな、確信して","p":[["posit","置く"]],"i":"しっかり置かれた","r":"negative が反対語"},{"n":"1113","w":"precious","m":"貴重な","p":[["preci","値段"]],"i":"値段がつけられないほど大事","r":"price も同じ仲間"},{"n":"1634","w":"respectable","m":"立派な、ちゃんとした","p":[["respect","尊敬"]],"i":"尊敬されるに値する","r":"respectful（礼儀正しい）と区別"}]},{"world":"splatoon","title":"ヒメの気まぐれ","lab":"あいまい","labJa":"テーマ","icon":"theme","en":"Hime gives a {{vague}} answer: \"Maybe, maybe not.\" Her message is {{ambiguous}}. Iida wants a clear plan, not an {{abstract}} idea. Hime picks weapons at {{random}}. Her choices seem {{arbitrary}}. But she is very {{spontaneous}}, and it sometimes works. Iida stays {{neutral}} when the others argue. Their friendship is {{manifest}}. \"Our enemy is only {{imaginary}},\" Hime laughs.","ja":"ヒメはあいまいな答えをする。「たぶんね、たぶん違うけど」。彼女のメッセージは2通りにとれる。イイダは抽象的なアイデアじゃなくて、はっきりした作戦がほしい。ヒメはブキをでたらめに選ぶ。その選び方は気まぐれに見える。でも彼女はとても自然体で、それがうまくいくこともある。ほかのみんなが言い合うとき、イイダは中立を保つ。二人の友情は明らかだ。「敵なんて想像上のもんやで」とヒメは笑う。","ken":"<b>vague（ぼんやり）と ambiguous（2通りにとれる）</b>の違い大事！ ambi は「両方」。manifest は「明らかな」、マニフェスト（公約）は「はっきり示したもの」やで。","words":[{"n":"1119","w":"vague","m":"あいまいな、ぼんやりした","p":[["vague","さまよう"]],"i":"輪郭がぼやけている","r":"clear が反対語"},{"n":"1647","w":"ambiguous","m":"2通り以上にとれる","p":[["ambi","両方"],["ig","動く"]],"i":"意味が両方にゆれる","r":"ambiguity（あいまいさ）"},{"n":"1134","w":"abstract","m":"抽象的な","p":[["abs","離れて"],["tract","引く"]],"i":"具体的なものから引き離した","r":"concrete（具体的な）が反対語"},{"n":"1176","w":"random","m":"でたらめの、無作為の","p":[["random","勢いまかせ"]],"i":"規則なしにバラバラ","r":"at random（無作為に）"},{"n":"1995","w":"arbitrary","m":"気まぐれな、恣意的な","p":[["arbiter","判断する人"]],"i":"その人の気分しだい","r":"理由がない"},{"n":"1677","w":"spontaneous","m":"自発的な、自然な","p":[["sponte","自分の意志で"]],"i":"自然とわき出る","r":"spontaneously（自然に）"},{"n":"1643","w":"neutral","m":"中立の","p":[["neuter","どちらでもない"]],"i":"どっちの味方もしない","r":"中立国"},{"n":"1980","w":"manifest","m":"明らかな、示す","p":[["mani","手"]],"i":"手でさわれるほどはっきり","r":"マニフェスト（公約）"},{"n":"1174","w":"imaginary","m":"想像上の","p":[["imagine","想像する"]],"i":"頭の中だけにある","r":"imaginative（想像力豊かな）と区別★"}]},{"world":"splatoon","title":"長すぎる会議","lab":"体を動かす","labJa":"テーマ","icon":"theme","en":"The team meeting is long. Hime starts to {{yawn}}. Iida {{draws:draw}} a map on the board and {{raises:raise}} her hand. \"Any questions?\" Bukichi {{nods:nod}}. Hime just {{shrugs:shrug}}. Iida {{frowns:frown}} at her. Hime {{leans:lean}} back in her chair and almost falls. Her legs {{tremble}}. Later, she {{drags:drag}} a heavy box to the stage and {{bows:bow}} to the audience.","ja":"チームの会議が長い。ヒメはあくびを始める。イイダはボードに地図を描いて手を挙げる。「質問は？」ブキチがうなずく。ヒメはただ肩をすくめる。イイダは彼女に顔をしかめる。ヒメはいすの背にもたれかかって、もう少しで倒れそうになる。足がふるえる。そのあと、彼女は重い箱をステージまで引きずって、観客におじぎをする。","ken":"ジェスチャー系！ <b>nod＝うなずく、shrug＝肩をすくめる（「知らんわ」のポーズ）、frown＝顔をしかめる</b>。★raise（上げる）と rise（上がる）の区別も忘れずに！","words":[{"n":"1439","w":"yawn","m":"あくびをする","p":[["yawn","口を開く"]],"i":"ふわぁ〜","r":"眠いときのやつ"},{"n":"57","w":"draw","m":"描く、引く","p":[["draw","引く"]],"i":"線を引いて描く、カーテンを引く","r":"draw a conclusion（結論を出す）"},{"n":"33","w":"raise","m":"上げる、育てる、集める","p":[["raise","起こす"]],"i":"手をグッと上げ ,"r":"ignore ≒"},{"n":"685","w":"urge","m":"強くすすめる、衝動","p":[["urge","せき立てる"]],"i":"背中をグイグイ押す","r":"urge 人 to ～"},{"n":"692","w":"kid","m":"からかう、子ども","p":[["kid","子ヤギ"]],"i":"子どもあつかいしてからかう","r":"Are you kidding?"},{"n":"689","w":"withdraw","m":"引き出す、撤退する","p":[["with","後ろへ"],["draw","引く"]],"i":"後ろへ引っこめる","r":"withdrawal（撤退）"},{"n":"635","w":"fulfill","m":"果たす、実現する","p":[["ful","いっぱい"],["fill","満たす"]],"i":"約束をいっぱいに満たす","r":"fulfill a dream"},{"n":"656","w":"cast","m":"投げる、配役、鋳造する","p":[["cast","投げる"]],"i":"型に投げ入れて形を作る","r":"broadcast も cast 仲間"},{"n":"645","w":"qualify","m":"資格を与える","p":[["qual","どんな種類"]],"i":"その種類にふさわしくする","r":"qualification（資格）"}]},{"world":"splatoon","title":"タコ軍団との戦い","lab":"基本動詞4","labJa":"テーマ","icon":"theme","en":"Two rival teams {{unite}} to fight the octopus army. Hime tries to {{imitate}} Iida's style. They {{strive}} to win together. During the battle, an enemy {{vanishes:vanish}} into the ink. Bukichi {{stirs:stir}} a pot of special ink and pours it into a {{mold}} to make bombs. Hime is so busy that she has to {{skip}} lunch. A giant octopus {{sheds:shed}} its skin. From its footprints, Iida {{inferred}} where it went. After the battle, a strange smell {{lingers:linger}} in the air.","ja":"ライバル同士の2チームが、タコ軍団と戦うために団結する。ヒメはイイダのスタイルをまねしようとする。二人は一緒に勝とうと努力する。戦いの途中、敵がインクの中に消える。ブキチは特製インクの鍋をかきまぜて、それを型に流しこんでボムを作る。ヒメは忙しすぎて昼ごはんを抜かないといけない。巨大なタコが皮を脱ぐ。その足跡から、イイダはそれがどこへ行ったかを推測した。戦いのあと、変なにおいがいつまでも空気中に残っている。","ken":"<b>infer（推測する）</b>は過去形が inferred（r が2つ）。shed は「（涙や血を）流す、脱ぐ」。shed tears（涙を流す）で覚えよう。linger は「なかなか去らない」、においや記憶が残る感じやで。","words":[{"n":"897","w":"unite","m":"団結する、結びつける","p":[["uni","1つ"]],"i":"1つにまとまる","r":"United States"},{"n":"919","w":"imitate","m":"まねる","p":[["imit","似せる"]],"i":"そっくりにする","r":"imitation（模造品）"},{"n":"1437","w":"strive","m":"努力する","p":[["strive","争う"]],"i":"ガンバって目指す","r":"strive for ～（～を求めて努力する）"},{"n":"924","w":"vanish","m":"消える","p":[["van","空っぽ"]],"i":"スッと消えて空っぽに","r":"disappear ≒"},{"n":"1267","w":"stir","m":"かきまぜる、かき立てる","p":[["stir","動かす"]],"i":"スプーンでぐるぐる","r":"stir up（かき立てる）"},{"n":"1388","w":"mold","m":"型、形づくる、カビ","p":[["mold","形"]],"i":"型に入れて形を作る","r":"カビの意味もある"},{"n":"1221","w":"skip","m":"抜かす、とばす","p":[["skip","跳ぶ"]],"i":"ピョンととばす","r":"skip breakfast"},{"n":"1217","w":"shed","m":"流す、脱ぐ","p":[["shed","分ける"]],"i":"涙や皮を落とす","r":"shed tears（涙を流す）"},{"n":"1391","w":"inferred","m":"推測した（infer の過去形）","p":[["in","中へ"],["fer","運ぶ"]],"i":"手がかりから結論を運びこむ","r":"infer（推測する）、inference（推論）"},{"n":"1706","w":"linger","m":"なかなか去らない、残る","p":[["linger","長引く"]],"i":"いつまでもそこにいる","r":"lingering（いつまでも残る）"}]},{"world":"splatoon","title":"担当エリアを決めよう","lab":"範囲","labJa":"テーマ","icon":"theme","en":"The new stage has a wide {{range}} of areas. Iida explains the {{scope}} of our mission. \"Each player has a {{domain}}. Hime, take the left {{segment}}. I'll protect the {{boundary}}.\" I stand at the {{edge}} of the map. We are on the {{verge}} of winning, but the {{margin}} is small. The enemy's {{sphere}} of influence is growing. Hime runs down the {{aisle}} between the seats to surprise them.","ja":"新しいステージには幅広い範囲のエリアがある。イイダがミッションの範囲を説明する。「各プレイヤーには担当領域があるわ。ヒメは左の区画を担当して。私は境界線を守る」。ぼくはマップの端に立つ。ぼくらは勝利の寸前だけど、差はわずかだ。敵の勢力範囲が広がっている。ヒメは座席の間の通路を走って、彼らを驚かせる。","ken":"<b>on the verge of ～（～の寸前で）</b>は熟語で出る！ margin は「余白・差」、by a narrow margin（僅差で）。aisle は s を読まへん（アイル）、飛行機の通路側の席は aisle seat やで。","words":[{"n":"203","w":"range","m":"範囲、並び","p":[["range","列"]],"i":"端から端までの幅","r":"a wide range of ～（幅広い～）"},{"n":"1285","w":"scope","m":"範囲、余地","p":[["scope","見る"]],"i":"見わたせる範囲","r":"telescope も scope 仲間"},{"n":"1510","w":"domain","m":"領域、分野","p":[["dom","家、支配"]],"i":"支配している土地","r":"ネットのドメインもこれ"},{"n":"1824","w":"segment","m":"区切り、部分","p":[["seg","切る"]],"i":"切り分けた一部","r":"section ≒"},{"n":"990","w":"boundary","m":"境界（線）","p":[["bound","限界"]],"i":"ここまでという線","r":"border ≒"},{"n":"482","w":"edge","m":"端、ふち、優位","p":[["edge","刃"]],"i":"ギリギリの端っこ","r":"have an edge over ～（～より優位）"},{"n":"1859","w":"verge","m":"寸前、ふち","p":[["verge","ふち"]],"i":"がけっぷち","r":"on the verge of ～（～の寸前で）"},{"n":"1577","w":"margin","m":"余白、差、利ざや","p":[["marg","境界"]],"i":"ふちの空き","r":"by a narrow margin（僅差で）"},{"n":"1277","w":"sphere","m":"球、領域","p":[["sphere","球"]],"i":"球のように広がる範囲","r":"atmosphere も sphere 仲間"},{"n":"1830","w":"aisle","m":"通路","p":[["aisle","わきの通路"]],"i":"座席の間の通り道","r":"s は読まない（アイル）"}]},{"world":"splatoon","title":"ハイカラシティ散歩","lab":"場所","labJa":"テーマ","icon":"theme","en":"Hime and Iida take a walk around Haikara City. They see a famous {{landmark}}, a tall tower. Behind it is an old {{tomb}} of a legendary hero. They walk down a narrow {{lane}} in the old {{quarter}} of the city. There is a secret {{passage}} under a bridge. A small {{stream}} runs next to the railway {{track}}. Iida takes a photo of the {{scene}} with the sea in the {{background}}. Later, they post it on the {{web}}.","ja":"ヒメとイイダはハイカラシティを散歩する。有名な目印の高い塔を見る。その裏には伝説の英雄の古いお墓がある。二人は街の旧市街地区のせまい小道を歩く。橋の下には秘密の通路がある。線路のとなりを小川が流れている。イイダは海を背景にして景色の写真を撮る。あとでそれをネットに投稿する。","ken":"<b>quarter</b> は「4分の1」と「15分」と「地区」の3つ！ passage は「通路」と「（文章の）一節」。長文問題の passage もこれやで★","words":[{"n":"1551","w":"landmark","m":"目印、画期的な出来事","p":[["land","土地"],["mark","しるし"]],"i":"土地の目印","r":"a landmark decision（画期的な判決）"},{"n":"1556","w":"tomb","m":"墓","p":[["tomb","塚"]],"i":"お墓の建物","r":"b は読まない（トゥーム）"},{"n":"1571","w":"lane","m":"小道、車線","p":[["lane","細い道"]],"i":"せまい道、プールのレーン","r":"a four-lane road"},{"n":"230","w":"quarter","m":"4分の1、15分、地区","p":[["quart","4"]],"i":"4つに分けた1つ","r":"a quarter past six（6時15分）"},{"n":"196","w":"passage","m":"通路、（文章の）一節","p":[["pass","通る"]],"i":"通り抜ける道","r":"長文の passage"},{"n":"498","w":"stream","m":"小川、流れ","p":[["stream","流れ"]],"i":"ちょろちょろ流れる川","r":"ストリーミングも同じ"},{"n":"198","w":"track","m":"線路、跡、追跡する","p":[["track","足跡"]],"i":"通った跡","r":"keep track of ～（～を把握する）"},{"n":"221","w":"scene","m":"景色、場面","p":[["scene","舞台"]],"i":"目の前に広がる場面","r":"scenery（景色）"},{"n":"239","w":"background","m":"背景、経歴","p":[["back","後ろ"],["ground","地面"]],"i":"後ろにあるもの","r":"family background（家庭環境）"},{"n":"513","w":"web","m":"ネット、クモの巣","p":[["web","織物"]],"i":"クモの巣みたいなつながり","r":"website"}]},{"world":"splatoon","title":"満員のスタジアム","lab":"名詞いろいろ","labJa":"テーマ","icon":"theme","en":"Haikara City is growing at a fast {{rate}}. The stadium has a {{capacity}} of ten thousand people. A {{mass}} of fans comes every weekend. It's a new {{trend}}. An {{official}} from the city puts up a big {{sign}}. Thanks to an {{advance}} in technology, the {{service}} is getting better. TV, the main {{medium}} for news, shows the event. The stadium is full of {{laughter}}.","ja":"ハイカラシティは速いペースで成長している。スタジアムの収容人数は1万人だ。毎週末、大勢のファンがやってくる。新しい流行だ。市の役人が大きな看板を立てる。技術の進歩のおかげで、サービスは良くなっている。ニュースの主な媒体であるテレビがそのイベントを映す。スタジアムは笑い声でいっぱいだ。","ken":"<b>medium（媒体）の複数形は media</b>！ mass media もここから来てる。rate は「割合・速度・料金」と意味が広い。birth rate（出生率）とかで出るで。","words":[{"n":"184","w":"rate","m":"割合、速度、料金","p":[["rate","はかったもの"]],"i":"はかった数値","r":"birth rate（出生率）"},{"n":"248","w":"capacity","m":"収容力、能力","p":[["cap","入れる"]],"i":"どれだけ入るか","r":"capable（能力がある）"},{"n":"225","w":"mass","m":"かたまり、大量、大衆","p":[["mass","かたまり"]],"i":"ドーンと大きなかたまり","r":"mass media（マスメディア）"},{"n":"240","w":"trend","m":"流行、傾向","p":[["trend","曲がる"]],"i":"世の中の流れの向き","r":"trendy（流行の）"},{"n":"200","w":"official","m":"役人、公式の","p":[["office","職務"]],"i":"職務についている人","r":"officially（公式に）"},{"n":"185","w":"sign","m":"看板、しるし、署名する","p":[["sign","しるし"]],"i":"目印になるもの","r":"signature（署名）"},{"n":"187","w":"advance","m":"進歩、前進する","p":[["ad","前へ"],["vance","進む"]],"i":"前へ進む","r":"in advance（前もって）"},{"n":"186","w":"service","m":"サービス、奉仕、（交通の）便","p":[["serv","仕える"]],"i":"人のために働く","r":"serve（仕える）"},{"n":"224","w":"medium","m":"媒体、中くらいの","p":[["medi","中間"]],"i":"間をつなぐもの","r":"複数形は media"},{"n":"188","w":"laughter","m":"笑い（声）","p":[["laugh","笑う"]],"i":"ワハハという声","r":"burst into laughter"}]},{"world":"splatoon","title":"丘の上の反省会","lab":"名詞いろいろ5","labJa":"テーマ","icon":"theme","en":"After a big {{loss}}, our team had a meeting at the {{summit}} of a hill. \"It was my {{mistake}},\" said Hime. Iida made a {{pause}}, then spoke on {{behalf}} of the team. \"Don't worry. We have an {{array}} of new weapons.\" Hime told a funny {{tale}} to cheer us up. On the way home, we got stuck in a traffic {{jam}}. Balloons were {{floating}} in the sky, and birds were {{soaring}} high above. We felt better.","ja":"大敗のあと、ぼくらのチームは丘の頂上で会議をした。「ウチのミスやった」とヒメ。イイダはひと呼吸おいてから、チームを代表して話した。「心配しないで。新しいブキがずらりとそろっているから」。ヒメはぼくらを元気づけるためにおもしろい話をした。帰り道、交通渋滞にはまった。空には風船が浮かんでいて、鳥が高く舞い上がっていた。ぼくらは気分が良くなった。","ken":"<b>on behalf of ～（～を代表して）</b>は熟語で出る★ jam は「ジャム」だけじゃなくて traffic jam（渋滞）。summit は「頂上」と「首脳会談」の2つ。","words":[{"n":"431","w":"loss","m":"損失、負け","p":[["lose","失う"]],"i":"なくしたもの","r":"at a loss（途方にくれて）"},{"n":"1296","w":"summit","m":"頂上、首脳会談","p":[["sum","最高"]],"i":"いちばん上","r":"G7 summit"},{"n":"40","w":"mistake","m":"まちがい","p":[["mis","まちがって"],["take","取る"]],"i":"まちがって取る","r":"by mistake（まちがって）"},{"n":"967","w":"pause","m":"一時停止、間","p":[["pause","止まる"]],"i":"ちょっと止まる","r":"一時停止ボタン"},{"n":"1452","w":"behalf","m":"代わり、利益","p":[["be","そば"],["half","側"]],"i":"その人の側に立って","r":"on behalf of ～（～を代表して）"},{"n":"1933","w":"array","m":"ずらりと並んだもの","p":[["ar","～へ"],["ray","並べる"]],"i":"きれいに並んだ","r":"an array of ～（ずらりと並んだ～）"},{"n":"958","w":"tale","m":"話、物語","p":[["tale","語られたもの"]],"i":"昔話のようなお話","r":"fairy tale（おとぎ話）"},{"n":"222","w":"jam","m":"渋滞、ジャム、つめこむ","p":[["jam","押しこむ"]],"i":"ぎゅうぎゅうに詰まる","r":"traffic jam（交通渋滞）"},{"n":"380","w":"floating","m":"浮かんでいる","p":[["float","浮く"]],"i":"ぷかぷか浮く","r":"float（浮く）"},{"n":"1364","w":"soaring","m":"舞い上がる、急上昇する","p":[["soar","舞い上がる"]],"i":"鳥がスーッと高く","r":"soaring prices（急騰する物価）"}]},{"world":"fortnite","title":"建築の名人ジョンジー","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"This season {{requires:require}} new skills. Many players {{regard}} Jonesy as the best builder. When I met him, I {{recognized:recognize}} him at once. I asked for tips, but he {{refused:refuse}}. \"Just {{refer}} to the guide,\" he {{replied:reply}}. The guide {{reminded:remind}} me to {{remove}} useless items. I {{reflected:reflect}} on my mistakes. Now I {{represent}} my school in a tournament.","ja":"今シーズンは新しい技術を必要とする。多くのプレイヤーがジョンジーを最高の建築者だと見なしている。彼に会ったとき、ぼくはすぐに彼だとわかった。コツを聞いたけど、彼は断った。「ガイドを参照しろよ」と彼は答えた。ガイドを見て、いらないアイテムを取り除くことを思い出した。ぼくは自分のミスをふり返った。今では、大会で学校を代表している。","ken":"★<b>regard A as B（AをBと見なす）</b>は超頻出！ remind も <b>remind 人 of ～（人に～を思い出させる）</b>って形で出る。refer to ～（～を参照する、～に言及する）もセットで。","words":[{"n":"17","w":"require","m":"必要とする","p":[["re","くり返し"],["quire","求める"]],"i":"何度も求める","r":"requirement（必要条件）"},{"n":"27","w":"regard","m":"見なす、配慮","p":[["re","くり返し"],["gard","見る"]],"i":"じっと見て判断する","r":"regard A as B（AをBと見なす）"},{"n":"30","w":"recognize","m":"わかる、認める","p":[["re","もう一度"],["cogn","知る"]],"i":"前に知ってた人を見て「あっ！」","r":"recognition（認識）"},{"n":"58","w":"refuse","m":"断る","p":[["re","後ろへ"],["fuse","注ぐ"]],"i":"注がれたものを押し返す","r":"refusal（拒否）"},{"n":"49","w":"refer","m":"参照する、言及する","p":[["re","後ろへ"],["fer","運ぶ"]],"i":"元のところへ持っていく","r":"refer to ～"},{"n":"74","w":"reply","m":"答える","p":[["re","返す"],["ply","折る"]],"i":"折り返して返事","r":"reply to ～（～に返事する）"},{"n":"92","w":"remind","m":"思い出させる","p":[["re","もう一度"],["mind","心"]],"i":"もう一度心に入れる","r":"remind 人 of ～"},{"n":"89","w":"remove","m":"取り除く","p":[["re","後ろへ"],["move","動かす"]],"i":"どかしてどける","r":"removal（除去）"},{"n":"64","w":"reflect","m":"反射する、反映する、よく考える","p":[["re","後ろへ"],["flect","曲げる"]],"i":"光が曲がって返ってくる","r":"reflection（反射）"},{"n":"68","w":"represent","m":"代表する、表す","p":[["re","強め"],["present","示す"]],"i":"みんなの代わりに前に立つ","r":"representative（代表者）"}]},{"world":"fortnite","title":"基地を修理せよ","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"After the storm, my squad had to {{repair}} our base. Wood is an important {{resource}}, so we {{reserve}} some for later. As the leader, I have the {{responsibility}} to make plans. Jonesy {{remarked:remark}}, \"Our old base was weak.\" I can {{relate}} to his feeling. The enemy {{reacted:react}} quickly, but our new walls held. As a {{result}}, we won. Our {{reward}} was a {
