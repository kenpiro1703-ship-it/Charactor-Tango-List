ent（入学）"},{"n":"1156","w":"initial","m":"最初の、頭文字","p":[["init","始め"]],"i":"いちばん最初","r":"initially（最初は）"},{"n":"1254","w":"enclose","m":"囲む、同封する","p":[["en","中に"],["close","閉じる"]],"i":"中に閉じこめる","r":"enclosure（囲い）"},{"n":"1355","w":"insert","m":"さしこむ","p":[["in","中に"],["sert","つなぐ"]],"i":"中につなげて入れる","r":"insertion（挿入）"},{"n":"1359","w":"enrich","m":"豊かにする","p":[["en","～にする"],["rich","豊か"]],"i":"豊かにする","r":"enrichment（豊かにすること）"},{"n":"1224","w":"implement","m":"実行する、道具","p":[["im","中に"],["ple","満たす"]],"i":"中身を満たして実行","r":"implementation（実行）"},{"n":"1232","w":"enforce","m":"（法律などを）守らせる","p":[["en","中に"],["force","力"]],"i":"力を入れて守らせる","r":"law enforcement（法執行）"},{"n":"1184","w":"incredible","m":"信じられない","p":[["in","否定"],["cred","信じる"]],"i":"信じられないほどすごい","r":"credit（信用）"},{"n":"1249","w":"induce","m":"引き起こす、～する気にさせる","p":[["in","中へ"],["duce","導く"]],"i":"中へ導く","r":"induce 人 to ～"},{"n":"1237","w":"indulge","m":"ふける、甘やかす","p":[["indulge","やさしい"]],"i":"好きなことにどっぷり","r":"indulge in ～"}]},{"world":"minecraft","title":"スティーブの船旅","lab":"in- / en-","labJa":"中に","icon":"in","en":"Steve {{embarks:embark}} on a long sea voyage. He is {{immersed}} in the adventure. He {{installs:install}} a new map in his boat. A storm {{inflicts:inflict}} damage on the boat. He must {{endure}} cold nights. Fear can {{inhibit}} your actions, but Steve stays strong. A pirate tries to {{intrude}} on his ship. Steve is {{endowed}} with great courage. He {{embodies:embody}} the spirit of an explorer. He {{incorporates:incorporate}} what he learned into his next trip.","ja":"スティーブは長い船旅に乗り出す。彼は冒険に没頭している。ボートに新しい地図を取りつける。嵐がボートに損害を与える。彼は寒い夜に耐えないといけない。恐怖は行動をさまたげることがあるけど、スティーブは強くいる。海賊が彼の船に押し入ろうとする。スティーブはすばらしい勇気に恵まれている。彼は探検家の精神を体現している。学んだことを次の旅に取り入れる。","ken":"★<b>be endowed with ～（～に恵まれている）</b>、<b>be immersed in ～（～に没頭している）</b>、<b>inflict A on B（AをBに与える）</b>は形ごと！ install はアプリの「インストール」と同じ、「取りつける」やで。","words":[{"n":"1760","w":"embark","m":"乗り出す、乗船する","p":[["em","中に"],["bark","小舟"]],"i":"船の中に乗りこむ","r":"embark on ～（～に乗り出す）"},{"n":"1758","w":"immersed","m":"没頭した","p":[["im","中に"],["merse","ひたす"]],"i":"どっぷりひたる","r":"be immersed in ～"},{"n":"1426","w":"install","m":"取りつける","p":[["in","中に"],["stall","置き場"]],"i":"中に設置する","r":"installation（設置）"},{"n":"1738","w":"inflict","m":"（害を）与える","p":[["in","上に"],["flict","打つ"]],"i":"上からバシッと打つ","r":"inflict A on B"},{"n":"865","w":"endure","m":"耐える","p":[["en","強め"],["dure","固い"]],"i":"固く持ちこたえる","r":"endurance（忍耐）"},{"n":"1753","w":"inhibit","m":"さまたげる、抑える","p":[["in","中に"],["hibit","持つ"]],"i":"中に押しとどめる","r":"inhibition（抑制）"},{"n":"1768","w":"intrude","m":"押し入る、じゃまする","p":[["in","中に"],["trude","押す"]],"i":"むりやり中に押し入る","r":"intruder（侵入者）"},{"n":"1708","w":"endowed","m":"恵まれた","p":[["en","中に"],["dow","与える"]],"i":"才能を与えられた","r":"be endowed with ～"},{"n":"1734","w":"embody","m":"体現する","p":[["em","中に"],["body","体"]],"i":"体の中に入れて形にする","r":"embodiment（具現化）"},{"n":"1399","w":"incorporate","m":"取り入れる","p":[["in","中に"],["corpor","体"]],"i":"体の中に組みこむ","r":"incorporate A into B"}]},{"world":"minecraft","title":"ジャングルの先住民","lab":"in- / en-","labJa":"中に・否定","icon":"in","en":"The {{indigenous}} people of the jungle know many secrets. They believe the forest has {{infinite}} power. There are {{innumerable}} plants there. Some plants are {{indispensable}} for medicine. The people have an {{innate}} sense of direction. Danger is {{inherent}} in the jungle. Steve thinks he sees gold, but it's an {{illusion}}. The chief says everyone is {{entitled}} to fresh water. A daily {{intake}} of fruit keeps them healthy. Steve offers emeralds as an {{incentive}} to trade.","ja":"ジャングルの先住民は多くの秘密を知っている。彼らは森には無限の力があると信じている。そこには数えきれないほどの植物がある。いくつかの植物は薬に欠かせない。人々は生まれつきの方向感覚を持っている。ジャングルにはもともと危険がそなわっている。スティーブは金が見えたと思うけど、それは錯覚だ。族長は、誰もがきれいな水をもらう権利があると言う。毎日果物を摂取することで、彼らは健康でいる。スティーブは取引の動機づけとしてエメラルドを差し出す。","ken":"★<b>be entitled to ～（～の権利がある）</b>、<b>be indispensable to ～（～に欠かせない）</b>は長文頻出！ innate（生まれつきの）は inherent とほぼ同じ。innumerable は in（否定）+ numer（数える）で「数えられない」。","words":[{"n":"2009","w":"indigenous","m":"先住の、土着の","p":[["indi","中で"],["gen","生まれる"]],"i":"その土地で生まれた","r":"indigenous people（先住民）"},{"n":"1636","w":"infinite","m":"無限の","p":[["in","否定"],["fin","終わり"]],"i":"終わりがない","r":"finite（有限の）が反対"},{"n":"1968","w":"innumerable","m":"数えきれない","p":[["in","否定"],["numer","数える"]],"i":"数えられないほど多い","r":"countless ≒"},{"n":"1619","w":"indispensable","m":"欠かせない","p":[["in","否定"],["dispense","なしですます"]],"i":"なしではすまない","r":"essential ≒"},{"n":"1688","w":"innate","m":"生まれつきの","p":[["in","中に"],["nate","生まれる"]],"i":"生まれた時から中にある","r":"natural ≒"},{"n":"1681","w":"inherent","m":"本来そなわっている","p":[["in","中に"],["here","くっつく"]],"i":"もともと中にくっついている","r":"inherently（本来）"},{"n":"1457","w":"illusion","m":"錯覚、幻想","p":[["il","上で"],["lus","遊ぶ"]],"i":"目がだまされて遊ばれる","r":"optical illusion（目の錯覚）"},{"n":"1324","w":"entitled","m":"権利がある、題された","p":[["en","～にする"],["title","称号"]],"i":"資格を与えられた","r":"be entitled to ～"},{"n":"1459","w":"intake","m":"摂取（量）","p":[["in","中に"],["take","取る"]],"i":"体に取り入れる量","r":"calorie intake"},{"n":"1574","w":"incentive","m":"動機づけ、報奨","p":[["in","中に"],["cent","歌う"]],"i":"心の中で歌わせる","r":"motivation ≒"}]},{"world":"minecraft","title":"地下の古代都市","lab":"in- / en-","labJa":"中に・否定","icon":"in","en":"Steve finds an ancient city deep underground. Its walls are still {{intact}}. The design is {{intricate}}. It must have taken {{immense}} effort to build. The city's {{intrinsic}} beauty amazes him. Light is an {{integral}} part of its design. Alex {{emphasizes:emphasize}} the danger: \"The Warden can't see, but loud noise can {{impair}} your escape.\" They {{endeavor}} to move quietly. To {{ensure}} their safety, they wear soft shoes. After the trip, Steve feels {{enlightened}}.","ja":"スティーブは地下深くに古代都市を見つける。壁はまだ無傷のままだ。デザインは入り組んでいる。建てるのにものすごい努力が必要だったにちがいない。都市が本来持つ美しさが彼を驚かせる。光はそのデザインに欠かせない一部だ。アレックスは危険を強調する。「ウォーデンは目が見えないけど、大きな音を立てると逃げるのに支障が出るわ」。二人は静かに動こうと努める。安全を確実にするため、やわらかい靴をはく。旅のあと、スティーブは目が開かれた気分になる。","ken":"★<b>ensure（確実にする）</b>は ensure that ～ の形でよく出る！ intrinsic（本質的な）⇔ extrinsic（外的な）。intact（無傷の）は in（否定）+ tact（さわる）で「さわられてない」やで。","words":[{"n":"2015","w":"intact","m":"無傷の","p":[["in","否定"],["tact","さわる"]],"i":"誰にもさわられていない","r":"remain intact（無傷のままである）"},{"n":"2012","w":"intricate","m":"入り組んだ","p":[["in","中に"],["tric","もつれ"]],"i":"中でもつれてる","r":"complicated ≒"},{"n":"1652","w":"immense","m":"ものすごい、巨大な","p":[["im","否定"],["mense","はかる"]],"i":"はかれないほど大きい","r":"huge ≒"},{"n":"2000","w":"intrinsic","m":"本質的な、本来の","p":[["intr","内側の"]],"i":"内側からの","r":"extrinsic（外的な）が反対"},{"n":"2011","w":"integral","m":"不可欠な","p":[["integr","完全な"]],"i":"それがないと完全にならない","r":"be integral to ～"},{"n":"921","w":"emphasize","m":"強調する","p":[["em","中に"],["phas","見せる"]],"i":"はっきり見せる","r":"emphasis（強調）"},{"n":"1728","w":"impair","m":"損なう","p":[["im","中に"],["pair","悪化"]],"i":"悪くする","r":"impaired（障害のある）"},{"n":"1315","w":"endeavor","m":"努力する、努力","p":[["en","中に"],["deavor","義務"]],"i":"義務として力を入れる","r":"try hard ≒"},{"n":"602","w":"ensure","m":"確実にする","p":[["en","～にする"],["sure","確かな"]],"i":"確かにする","r":"ensure that ～"},{"n":"1958","w":"enlightened","m":"啓発された、目が開かれた","p":[["en","中に"],["light","光"]],"i":"心に光を入れられた","r":"enlighten（啓発する）"}]},{"world":"minecraft","title":"超高層ビルを建てる","lab":"建築","labJa":"テーマ","icon":"theme","en":"Alex studies {{architecture}}. She wants to build a {{skyscraper}} in the city. First, she builds the steel {{frame}} of the {{structure}}. She uses a {{ladder}} to reach the top. Inside, she puts {{furniture}} and a big {{shelf}} in each room. Outside, she makes a stone {{pavement}}. Near the building, there is a {{canal}} with boats. In the center of the city, she builds a {{monument}} to the first villagers.","ja":"アレックスは建築学を勉強している。彼女は街に超高層ビルを建てたい。まず、建物の鉄骨の骨組みを作る。てっぺんに届くようにはしごを使う。中では、それぞれの部屋に家具と大きな棚を置く。外には石の歩道を作る。建物の近くには、ボートが通る運河がある。街の中心には、最初の村人たちをたたえる記念碑を建てる。","ken":"建物の単語！ <b>furniture（家具）は数えられない名詞</b>やから a furniture はダメ、a piece of furniture って言う★ 文法問題で超出る。structure は「構造」の意味でも大事。","words":[{"n":"1022","w":"architecture","m":"建築（学）","p":[["archi","主な"],["tect","建てる人"]],"i":"建物をデザインすること","r":"architect（建築家）"},{"n":"1930","w":"skyscraper","m":"超高層ビル","p":[["sky","空"],["scrape","こする"]],"i":"空をこするほど高い","r":"摩天楼"},{"n":"734","w":"frame","m":"枠、骨組み","p":[["frame","作る"]],"i":"形を支える枠","r":"framework（枠組み）"},{"n":"447","w":"structure","m":"構造、建物","p":[["struct","積む"]],"i":"積み上げて作ったもの","r":"structural（構造の）"},{"n":"477","w":"ladder","m":"はしご","p":[["ladder","立てかけるもの"]],"i":"上り下りの道具","r":"the career ladder（出世の階段）"},{"n":"231","w":"furniture","m":"家具","p":[["furnish","備えつける"]],"i":"部屋に置く物","r":"数えられない名詞★"},{"n":"508","w":"shelf","m":"棚","p":[["shelf","板"]],"i":"物を置く板","r":"複数形は shelves"},{"n":"1522","w":"pavement","m":"歩道、舗装","p":[["pave","舗装する"]],"i":"固めた道","r":"sidewalk（米）≒"},{"n":"1447","w":"canal","m":"運河","p":[["canal","管"]],"i":"人が作った水の道","r":"the Panama Canal"},{"n":"1477","w":"monument","m":"記念碑","p":[["mon","思い出させる"]],"i":"思い出すために建てるもの","r":"monumental（記念碑的な）"}]},{"world":"minecraft","title":"素材集めと実験","lab":"素材","labJa":"テーマ","icon":"theme","en":"Steve collects building {{material}}. He cuts trees for {{timber}}. In a deep cave, he finds {{petroleum}}, a kind of oil. He uses coal as {{fuel}} for his furnace. Coal is mostly {{carbon}}. Fire needs {{oxygen}} to burn. In the lab, Alex mixes a {{chemical}} with water. It's a strong {{acid}}, so she wears gloves. When she heats it, it turns into {{vapor}}. The leftover {{fluid}} is green.","ja":"スティーブは建築の材料を集める。木を切って材木にする。深い洞窟で、石油という油の一種を見つける。かまどの燃料として石炭を使う。石炭はほとんどが炭素だ。火が燃えるには酸素が必要だ。研究室で、アレックスは化学物質を水と混ぜる。強い酸なので、手袋をはめる。熱すると、それは蒸気に変わる。残った液体は緑色だ。","ken":"理科の単語は長文の科学テーマで出る！ <b>carbon dioxide（二酸化炭素）</b>はセットで覚えよう。fluid は「液体」、fluent（流ちょうな）と同じ flu（流れる）やで。","words":[{"n":"189","w":"material","m":"材料、物質","p":[["matter","物"]],"i":"物を作るもとになるもの","r":"raw material（原料）"},{"n":"1789","w":"timber","m":"材木","p":[["timber","建物"]],"i":"建築用の木","r":"wood ≒"},{"n":"1798","w":"petroleum","m":"石油","p":[["petr","岩"],["oleum","油"]],"i":"岩から出る油","r":"oil ≒"},{"n":"502","w":"fuel","m":"燃料","p":[["fuel","炉"]],"i":"燃やすもの","r":"fossil fuel（化石燃料）"},{"n":"414","w":"carbon","m":"炭素","p":[["carb","炭"]],"i":"炭のもと","r":"carbon dioxide（二酸化炭素）"},{"n":"987","w":"oxygen","m":"酸素","p":[["oxy","酸"],["gen","生む"]],"i":"生き物に必要な気体","r":"hydrogen（水素）"},{"n":"282","w":"chemical","m":"化学物質、化学の","p":[["chem","化学"]],"i":"化学で作ったもの","r":"chemistry（化学）"},{"n":"1186","w":"acid","m":"酸、酸性の","p":[["acid","すっぱい"]],"i":"すっぱくて溶かすもの","r":"acid rain（酸性雨）"},{"n":"1800","w":"vapor","m":"蒸気","p":[["vapor","湯気"]],"i":"湯気、もや","r":"evaporate（蒸発する）"},{"n":"1573","w":"fluid","m":"液体、流動的な","p":[["flu","流れる"]],"i":"サラサラ流れるもの","r":"fluent も同じ仲間"}]},{"world":"minecraft","title":"村の畑しごと","lab":"農業","labJa":"テーマ","icon":"theme","en":"The villagers depend on {{agriculture}}. In spring, they {{plow}} the fields and plant {{seeds:seed}}. The main {{crop}} is {{wheat}}. They build a canal for {{irrigation}}. In fall, they {{reap}} the wheat. It's a great {{harvest}}. They store the {{grain}} in a big barn. Some villagers raise {{cattle}} for milk and other {{dairy}} products. Alex has a sugar cane {{plantation}} near the river.","ja":"村人たちは農業に頼っている。春には畑を耕して種をまく。主な作物は小麦だ。かんがいのために水路を作る。秋には小麦を刈り取る。すばらしい収穫だ。穀物を大きな納屋にたくわえる。牛乳やほかの乳製品のために牛を育てる村人もいる。アレックスは川の近くにサトウキビの大農園を持っている。","ken":"農業セット！ マイクラで畑やったことあるなら一発やろ？ <b>cattle（牛）はいつも複数あつかい</b>で、cattles にはならへん★ dairy（乳製品）と diary（日記）はスペル注意！","words":[{"n":"516","w":"agriculture","m":"農業","p":[["agri","畑"],["culture","耕す"]],"i":"畑を耕すこと","r":"agricultural（農業の）"},{"n":"1920","w":"plow","m":"耕す、すき","p":[["plow","すき"]],"i":"土をすいて耕す","r":"plough（英）"},{"n":"972","w":"seed","m":"種","p":[["seed","種"]],"i":"まくと育つもの","r":"sow seeds（種をまく）"},{"n":"493","w":"crop","m":"作物、収穫高","p":[["crop","穂"]],"i":"畑でとれるもの","r":"a good crop（豊作）"},{"n":"1042","w":"wheat","m":"小麦","p":[["wheat","白い"]],"i":"パンの材料","r":"flour（小麦粉）"},{"n":"1862","w":"irrigation","m":"かんがい","p":[["ir","中に"],["rig","水をやる"]],"i":"畑に水を引くこと","r":"irrigate（水を引く）"},{"n":"1756","w":"reap","m":"刈り取る、得る","p":[["reap","刈る"]],"i":"実ったものを刈る","r":"reap the benefits（利益を得る）"},{"n":"1027","w":"harvest","m":"収穫","p":[["harvest","秋"]],"i":"秋にとり入れる","r":"harvest festival（収穫祭）"},{"n":"740","w":"grain","m":"穀物、粒","p":[["grain","粒"]],"i":"米や麦の粒","r":"a grain of sand（砂粒）"},{"n":"1109","w":"cattle","m":"牛（集合的に）","p":[["cattle","財産"]],"i":"牛の群れ","r":"cattles とは言わない★"},{"n":"1842","w":"dairy","m":"乳製品の、酪農の","p":[["dairy","乳しぼり場"]],"i":"牛乳からできたもの","r":"diary（日記）とスペル注意"},{"n":"1919","w":"plantation","m":"大農園","p":[["plant","植える"]],"i":"大規模な畑","r":"コーヒー農園など"}]},{"world":"minecraft","title":"荒野の花畑","lab":"自然","labJa":"テーマ","icon":"theme","en":"Alex walks through the {{wilderness}}. The {{landscape}} is beautiful. She finds a green {{meadow}} where flowers {{bloom}}. Cherry trees are in full {{blossom}}. The {{soil}} here is {{fertile}}, so the {{vegetation}} is rich. A cool {{breeze}} blows, and the plants are {{flourishing}}. But in another area, {{deforestation}} has destroyed the forest. There, flowers {{wither}} in the dry soil.","ja":"アレックスは荒野を歩く。景色は美しい。花が咲いている緑の牧草地を見つける。桜の木は満開だ。ここの土は肥えているので、植物が豊かだ。すずしいそよ風がふいて、植物は生い茂っている。でも別のエリアでは、森林伐採で森が破壊されてしまった。そこでは、乾いた土の中で花がしおれている。","ken":"<b>bloom（花が咲く）と blossom（果樹の花）</b>。flourish は「栄える、生い茂る」、植物にも国にも使えるで。deforestation（森林伐採）は環境問題の長文の常連★","words":[{"n":"1505","w":"wilderness","m":"荒野","p":[["wild","野生の"]],"i":"人の手が入ってない土地","r":"wild ≒"},{"n":"956","w":"landscape","m":"景色、風景","p":[["land","土地"],["scape","形"]],"i":"土地の見た目","r":"scenery ≒"},{"n":"1815","w":"meadow","m":"牧草地","p":[["meadow","草地"]],"i":"草がしげる野原","r":"field ≒"},{"n":"1354","w":"bloom","m":"（花が）咲く、花","p":[["bloom","花"]],"i":"パッと花ひらく","r":"in bloom（咲いて）"},{"n":"950","w":"blossom","m":"（果樹の）花","p":[["blossom","花"]],"i":"桜やリンゴの花","r":"cherry blossoms（桜の花）"},{"n":"504","w":"soil","m":"土","p":[["soil","地面"]],"i":"植物が育つ土","r":"fertile soil（肥えた土）"},{"n":"1617","w":"fertile","m":"肥えた","p":[["fer","運ぶ"]],"i":"たくさん実を運ぶ","r":"fertilizer（肥料）"},{"n":"1924","w":"vegetation","m":"植物（全体）","p":[["veget","育つ"]],"i":"その土地に生える植物","r":"vegetable（野菜）"},{"n":"1805","w":"breeze","m":"そよ風","p":[["breeze","北東の風"]],"i":"気持ちいい風","r":"It's a breeze.（楽勝だよ）"},{"n":"1433","w":"flourishing","m":"栄えている、生い茂った","p":[["flour","花"]],"i":"花がいっぱい咲く","r":"flourish（栄える）"},{"n":"1881","w":"deforestation","m":"森林伐採","p":[["de","取り去る"],["forest","森"]],"i":"森をなくすこと","r":"reforestation（再植林）"},{"n":"1746","w":"wither","m":"しおれる","p":[["wither","天気にさらす"]],"i":"カラカラに枯れる","r":"withered（しおれた）"}]},{"world":"minecraft","title":"山の上の地理の授業","lab":"地球","labJa":"テーマ","icon":"theme","en":"Steve is learning {{geography}}. He looks at a map of the world. There are seven {{continents:continent}}. The {{equator}} divides the earth into the northern and southern {{hemispheres:hemisphere}}. Japan is at a higher {{latitude}} than Brazil. Steve climbs a mountain. At high {{altitude}}, the air is thin. He finds a {{fossil}} in a rock {{layer}}. A {{geological}} map shows the rocks are very old. From the top, he sees a beautiful {{bay}}.","ja":"スティーブは地理を学んでいる。世界地図を見る。大陸は7つある。赤道が地球を北半球と南半球に分けている。日本はブラジルより高緯度にある。スティーブは山に登る。標高が高いところでは空気が薄い。岩の層の中に化石を見つける。地質図によると、岩はとても古い。頂上から、美しい湾が見える。","ken":"<b>latitude（緯度）と longitude（経度）</b>はセット★ altitude（高度）も似てるから混ぜんといてな。hemi は「半分」で、hemisphere は「半分の球」やで。","words":[{"n":"1062","w":"geography","m":"地理","p":[["geo","地球"],["graph","書く"]],"i":"地球のことを書いたもの","r":"geographical（地理的な）"},{"n":"929","w":"continent","m":"大陸","p":[["con","一緒に"],["tin","保つ"]],"i":"つながっている大きな陸","r":"continental（大陸の）"},{"n":"1797","w":"equator","m":"赤道","p":[["equa","等しい"]],"i":"地球を等しく分ける線","r":"equal（等しい）"},{"n":"1033","w":"hemisphere","m":"半球","p":[["hemi","半分"],["sphere","球"]],"i":"球の半分","r":"the Northern Hemisphere"},{"n":"1903","w":"latitude","m":"緯度","p":[["lati","幅"]],"i":"赤道からの南北の距離","r":"longitude（経度）"},{"n":"1530","w":"altitude","m":"高度、標高","p":[["alt","高い"]],"i":"どれだけ高いか","r":"high altitude（高地）"},{"n":"1016","w":"fossil","m":"化石","p":[["foss","掘られた"]],"i":"地面から掘り出された","r":"fossil fuel（化石燃料）"},{"n":"975","w":"layer","m":"層","p":[["lay","置く"]],"i":"重ねて置いたもの","r":"the ozone layer（オゾン層）"},{"n":"1686","w":"geological","m":"地質の","p":[["geo","地球"],["logy","学"]],"i":"地球の岩や地層の","r":"geology（地質学）"},{"n":"1057","w":"bay","m":"湾","p":[["bay","入り江"]],"i":"海が陸に入りこんだ所","r":"Tokyo Bay"}]},{"world":"minecraft","title":"望遠鏡で見る夜空","lab":"宇宙","labJa":"テーマ","icon":"theme","en":"At night, Alex looks at the sky with a {{telescope}}. She loves {{astronomy}}. She can see a bright {{planet}}. It moves in an {{orbit}} around the sun. The {{solar}} system is part of the Milky Way {{galaxy}}. The {{universe}} has billions of galaxies. People also call it the {{cosmos}}. She sees a {{satellite}} moving fast across the sky. Steve jumps off a tall tower. \"{{Gravity:gravity}} always wins,\" he says.","ja":"夜、アレックスは望遠鏡で空を見る。彼女は天文学が大好きだ。明るい惑星が見える。それは太陽のまわりを軌道に乗って回っている。太陽系は天の川銀河の一部だ。宇宙には何十億もの銀河がある。人々はそれをコスモスとも呼ぶ。人工衛星が空を速く横切っていくのが見える。スティーブは高い塔から飛び降りる。「重力にはいつも勝てないな」と彼。","ken":"<b>astronomy（天文学）と astrology（星占い）</b>は別物★ gravity は「重力」と「重大さ」の2つの意味があるで。","words":[{"n":"1085","w":"telescope","m":"望遠鏡","p":[["tele","遠く"],["scope","見る"]],"i":"遠くを見る道具","r":"microscope（顕微鏡）"},{"n":"1074","w":"astronomy","m":"天文学","p":[["astro","星"],["nomy","法則"]],"i":"星の法則を調べる学問","r":"astrology（星占い）と区別"},{"n":"466","w":"planet","m":"惑星","p":[["planet","さまよう"]],"i":"空をさまよう星","r":"the planet（地球）"},{"n":"1506","w":"orbit","m":"軌道、回る","p":[["orbit","輪"]],"i":"ぐるぐる回る道","r":"in orbit（軌道に乗って）"},{"n":"1146","w":"solar","m":"太陽の","p":[["sol","太陽"]],"i":"太陽に関する","r":"solar power（太陽光発電）"},{"n":"1512","w":"galaxy","m":"銀河","p":[["gala","ミルク"]],"i":"ミルクの道（天の川）","r":"the Milky Way"},{"n":"510","w":"universe","m":"宇宙","p":[["uni","1つ"],["verse","回る"]],"i":"全部が1つに回る世界","r":"universal（普遍的な）"},{"n":"1829","w":"cosmos","m":"宇宙","p":[["cosmos","秩序"]],"i":"秩序ある宇宙","r":"cosmic（宇宙の）"},{"n":"1009","w":"satellite","m":"衛星、人工衛星","p":[["satell","付き人"]],"i":"惑星のお供","r":"satellite TV"},{"n":"787","w":"gravity","m":"重力、重大さ","p":[["grav","重い"]],"i":"重さを生む力","r":"gravitation（引力）"}]},{"world":"minecraft","title":"アレックスの研究室","lab":"科学","labJa":"テーマ","icon":"theme","en":"Alex builds a science lab. She studies tiny {{particles:particle}}. Everything is made of {{molecules:molecule}}. She measures the {{density}} of different blocks. When two blocks rub together, there is {{friction}}. In a {{vacuum}}, there is no air. She uses {{electricity}} from redstone to run machines. She checks the {{temperature}} of the lava. The sun gives off {{ultraviolet}} light. Too much {{radiation}} is dangerous, so she protects herself from every {{ray}}.","ja":"アレックスは科学の研究室を作る。彼女はとても小さな粒子を研究している。すべてのものは分子でできている。いろいろなブロックの密度を測る。2つのブロックをこすり合わせると、摩擦が生まれる。真空の中には空気がない。機械を動かすためにレッドストーンの電気を使う。溶岩の温度を調べる。太陽は紫外線を出している。放射線を浴びすぎるのは危険なので、彼女はあらゆる光線から身を守る。","ken":"<b>ultraviolet（紫外線）は UV</b> のこと、日焼け止めに書いてあるやつ！ vacuum は「真空」で、vacuum cleaner（掃除機）も同じ。friction（摩擦）は人間関係の「あつれき」にも使うで。","words":[{"n":"1089","w":"particle","m":"粒子","p":[["part","部分"]],"i":"ものすごく小さなかけら","r":"tiny particles"},{"n":"1104","w":"molecule","m":"分子","p":[["mole","かたまり"],["cule","小さい"]],"i":"物質の小さなかたまり","r":"molecular（分子の）"},{"n":"1110","w":"density","m":"密度","p":[["dens","こい"]],"i":"ぎっしりつまり具合","r":"dense（密集した）"},{"n":"1904","w":"friction","m":"摩擦","p":[["frict","こする"]],"i":"こすれ合う力","r":"trade friction（貿易摩擦）"},{"n":"1891","w":"vacuum","m":"真空","p":[["vac","空っぽ"]],"i":"何もない空間","r":"vacuum cleaner（掃除機）"},{"n":"511","w":"electricity","m":"電気","p":[["electr","琥珀"]],"i":"こすると電気をおびた琥珀から","r":"electric（電気の）"},{"n":"459","w":"temperature","m":"温度、体温","p":[["temper","混ぜる"]],"i":"熱さのぐあい","r":"take one's temperature（体温を測る）"},{"n":"1942","w":"ultraviolet","m":"紫外線の","p":[["ultra","越えて"],["violet","紫"]],"i":"紫の向こう側","r":"UV"},{"n":"1463","w":"radiation","m":"放射線、放射","p":[["radi","光線"]],"i":"まわりに出る光やエネルギー","r":"radioactive（放射性の）"},{"n":"984","w":"ray","m":"光線","p":[["ray","棒"]],"i":"まっすぐの光","r":"X-ray（レントゲン）"}]},{"world":"minecraft","title":"ジャングルから雪山へ","lab":"天気","labJa":"テーマ","icon":"theme","en":"Steve travels to a {{tropical}} jungle. The {{climate}} is hot and {{humid}}. There is a lot of {{moisture}} in the air, and his clothes feel {{damp}}. His {{thermometer}} shows 35 degrees. Then he goes to a snowy mountain. The {{atmosphere}} is cold and clear. A {{chill}} runs down his back. The lake starts to {{freeze}}. When the sun comes out, the snow begins to {{melt}}.","ja":"スティーブは熱帯のジャングルへ旅する。気候は暑くて湿気が多い。空気中に水分がたくさんあって、服がしめっぽく感じる。温度計は35度を示している。それから雪山へ行く。空気は冷たくて澄んでいる。寒気が背中を走る。湖がこおり始める。太陽が出ると、雪が溶け始める。","ken":"<b>climate（長い期間の気候）と weather（その日の天気）</b>の違い★ climate change（気候変動）は長文の超定番テーマ。atmosphere は「大気」と「雰囲気」の2つやで。","words":[{"n":"1117","w":"tropical","m":"熱帯の","p":[["trop","回る"]],"i":"太陽が真上を回るあたり","r":"tropics（熱帯地方）"},{"n":"228","w":"climate","m":"気候","p":[["clima","傾き"]],"i":"地域ごとの長い天気の傾向","r":"climate change（気候変動）"},{"n":"1673","w":"humid","m":"湿気の多い","p":[["hum","しめった"]],"i":"ムシムシ","r":"humidity（湿度）"},{"n":"1528","w":"moisture","m":"湿気、水分","p":[["moist","しめった"]],"i":"空気や物にふくまれる水","r":"moist（しっとりした）"},{"n":"1964","w":"damp","m":"しめっぽい","p":[["damp","霧"]],"i":"じめっとした","r":"wet より弱い"},{"n":"1531","w":"thermometer","m":"温度計","p":[["thermo","熱"],["meter","はかる"]],"i":"熱さをはかる道具","r":"thermos（魔法びん）"},{"n":"233","w":"atmosphere","m":"大気、雰囲気","p":[["atmo","蒸気"],["sphere","球"]],"i":"地球を包む空気","r":"a friendly atmosphere（なごやかな雰囲気）"},{"n":"1818","w":"chill","m":"寒気、冷やす","p":[["chill","冷たさ"]],"i":"ゾクッとする冷え","r":"chilly（肌寒い）、chill out（くつろぐ）"},{"n":"159","w":"freeze","m":"こおる","p":[["freeze","こおる"]],"i":"カチコチ","r":"freeze-froze-frozen"},{"n":"901","w":"melt","m":"溶ける","p":[["melt","やわらかくなる"]],"i":"とろ〜り溶ける","r":"melting pot（人種のるつぼ）"}]},{"world":"minecraft","title":"村のごちそう","lab":"料理","labJa":"テーマ","icon":"theme","en":"Alex finds an old {{recipe}} book. She wants to cook a {{feast}} for the village. She collects every {{ingredient}}. She doesn't use {{raw}} chicken, because it's dangerous. Steve brings an apple, but it's {{rotten}}. The lemon is {{sour}}, and the tea is {{bitter}}. She adds honey for a sweet {{flavor}}. The village {{cuisine}} is simple but tasty. For a {{beverage}}, she serves milk.","ja":"アレックスは古いレシピの本を見つける。村のためにごちそうを作りたい。材料を全部集める。危ないので、生の鶏肉は使わない。スティーブがリンゴを持ってくるけど、腐っている。レモンはすっぱくて、お茶は苦い。甘い風味のためにハチミツを加える。村の料理はシンプルだけどおいしい。飲み物としては、牛乳を出す。","ken":"味は <b>sweet（あまい）、sour（すっぱい）、bitter（苦い）、salty（しょっぱい）、spicy（からい）</b>でセット。bitter は「つらい」の意味もある、a bitter experience（苦い経験）やで。","words":[{"n":"1548","w":"recipe","m":"レシピ、秘けつ","p":[["recipe","受け取れ"]],"i":"作り方","r":"a recipe for success（成功の秘けつ）"},{"n":"1460","w":"feast","m":"ごちそう、祝宴","p":[["feast","祭り"]],"i":"豪華な食事","r":"a feast for the eyes（目の保養）"},{"n":"1028","w":"ingredient","m":"材料、要素","p":[["in","中に"],["gred","進む"]],"i":"中に入るもの","r":"the key ingredient（重要な要素）"},{"n":"1126","w":"raw","m":"生の","p":[["raw","生"]],"i":"加工してない","r":"raw material（原料）"},{"n":"1650","w":"rotten","m":"腐った","p":[["rot","腐る"]],"i":"ぐちゃっと腐る","r":"rot（腐る）"},{"n":"1664","w":"sour","m":"すっぱい","p":[["sour","すっぱい"]],"i":"レモンの味","r":"go sour（悪くなる）"},{"n":"818","w":"bitter","m":"苦い、つらい","p":[["bitter","かむ"]],"i":"苦い、つらい","r":"bitterly（ひどく）"},{"n":"1088","w":"flavor","m":"風味、味","p":[["flavor","香り"]],"i":"食べ物の味わい","r":"flavor of the month（一時的な人気者）"},{"n":"1864","w":"cuisine","m":"料理（法）","p":[["cuisine","台所"]],"i":"その地域の料理","r":"Japanese cuisine（日本料理）"},{"n":"1610","w":"beverage","m":"飲み物","p":[["bever","飲む"]],"i":"ジュースやお茶など","r":"drink ≒"}]},{"world":"minecraft","title":"はらぺこスティーブ","lab":"食べる","labJa":"テーマ","icon":"theme","en":"Steve's {{appetite}} is huge after a long day. Bread is the {{staple}} food in his village. He also eats meat for {{protein}}. Good {{nutrition}} helps {{nourish}} his body. He loves the {{taste}} of baked potatoes. The {{scent}} of fresh bread fills the house. Alex says, \"{{Chew:chew}} slowly. It helps you {{digest}}.\" Sugar can make your teeth {{decay}}, so Steve brushes his teeth.","ja":"スティーブは長い1日のあと、食欲がすごい。パンは彼の村の主食だ。タンパク質のために肉も食べる。いい栄養は体を育てるのを助けてくれる。彼はベイクドポテトの味が大好きだ。焼きたてのパンの香りが家を満たす。アレックスは言う。「ゆっくりかんで。消化を助けるから」。砂糖は歯を虫歯にすることがあるので、スティーブは歯をみがく。","ken":"<b>staple（主食、主要な）</b>は staple food で覚える！ ホッチキスの針も staple やで笑 nutrition（栄養）と nourish（栄養を与える）は同じ仲間。decay は「腐る」と「衰える」、tooth decay（虫歯）。","words":[{"n":"1003/1005","w":"appetite","m":"食欲","p":[["ap","～へ"],["pet","求める"]],"i":"食べ物を求める気持ち","r":"have a good appetite"},{"n":"2007","w":"staple","m":"主要な、主食","p":[["staple","市場"]],"i":"いつも置いてある大事なもの","r":"staple food（主食）"},{"n":"1099","w":"protein","m":"タンパク質","p":[["prot","第一の"]],"i":"体を作るいちばん大事な栄養","r":"肉や豆にふくまれる"},{"n":"1100","w":"nutrition","m":"栄養","p":[["nutri","育てる"]],"i":"体を育てるもの","r":"nutritious（栄養のある）"},{"n":"1403","w":"nourish","m":"栄養を与える、育てる","p":[["nour","育てる"]],"i":"栄養で育てる","r":"nourishment（栄養）"},{"n":"202","w":"taste","m":"味、味わう","p":[["taste","さわる"]],"i":"舌でさわって感じる","r":"have good taste（センスがいい）"},{"n":"1613","w":"scent","m":"香り","p":[["scent","感じる"]],"i":"ふわっといいにおい","r":"perfume ≒"},{"n":"1386","w":"chew","m":"かむ","p":[["chew","かむ"]],"i":"もぐもぐ","r":"chewing gum"},{"n":"1220","w":"digest","m":"消化する","p":[["di","離れて"],["gest","運ぶ"]],"i":"食べ物を分けて運ぶ","r":"digestion（消化）"},{"n":"1546","w":"decay","m":"腐る、衰える","p":[["de","下へ"],["cay","落ちる"]],"i":"ボロボロになる","r":"tooth decay（虫歯）"}]},{"world":"minecraft","title":"アレックス先生の算数","lab":"数","labJa":"テーマ","icon":"theme","en":"Alex teaches {{arithmetic}} to the village kids. \"A {{dozen}} eggs is twelve,\" she says. \"What is the {{sum}} of five and seven?\" The kids {{calculate}} the answer. She writes an {{equation}} on the board: x + 3 = 10. She explains a {{fraction}}, like one half. \"The {{ratio}} of boys to girls in this class is 1 to 1.\" She shows a {{formula}} for the area of a circle. \"A {{billion}} has ten {{digits:digit}}.\"","ja":"アレックスは村の子どもたちに算数を教える。「卵1ダースは12個よ」と彼女。「5と7の合計は？」子どもたちは答えを計算する。彼女は黒板に方程式を書く。x+3=10。2分の1のような分数を説明する。「このクラスの男の子と女の子の比率は1対1ね」。円の面積の公式を見せる。「10億は10けたの数字よ」。","ken":"<b>billion（10億）、million（100万）、thousand（千）</b>の3つは長文の数字問題で絶対出る★ dozen は12、「たくさんの」は dozens of ～ やで。","words":[{"n":"1484","w":"arithmetic","m":"算数","p":[["arithm","数"]],"i":"数の計算","r":"math ≒"},{"n":"1026","w":"dozen","m":"ダース（12）","p":[["duo","2"],["decem","10"]],"i":"12のまとまり","r":"dozens of ～（何十もの～）"},{"n":"708","w":"sum","m":"合計、金額","p":[["sum","最高"]],"i":"全部足した数","r":"a large sum of money（大金）"},{"n":"879","w":"calculate","m":"計算する","p":[["calc","小石"]],"i":"小石で数えた","r":"calculation（計算）"},{"n":"1599","w":"equation","m":"方程式、同一視","p":[["equa","等しい"]],"i":"イコールでつなぐ式","r":"equal（等しい）"},{"n":"1541","w":"fraction","m":"分数、わずか","p":[["fract","割る"]],"i":"割った一部","r":"a fraction of ～（ほんのわずかの～）"},{"n":"1494","w":"ratio","m":"比率","p":[["ratio","計算"]],"i":"2つの数の割合","r":"ratio of A to B"},{"n":"1283","w":"formula","m":"公式、方式","p":[["form","形"]],"i":"決まった形の式","r":"formulate（考え出す）"},{"n":"478","w":"billion","m":"10億","p":[["bi","2"],["million","百万"]],"i":"millionの上の単位","r":"million（100万）"},{"n":"1938","w":"digit","m":"（数字の）けた、指","p":[["digit","指"]],"i":"指で数える数字","r":"digital（デジタルの）"}]},{"world":"minecraft","title":"丸い塔の設計","lab":"はかる","labJa":"テーマ","icon":"theme","en":"Steve wants to build a round tower. He measures its {{diameter}} and {{height}}. \"Each block is one {{unit}},\" he says. He has to {{multiply}} the numbers to find the {{volume}}. He needs a large {{quantity}} of stone. Alex checks the {{proportion}} of stone to glass. The tower has three {{dimensions:dimension}}: width, depth, and height. A large {{portion}} of the budget goes to glass. Alex keeps {{statistics}} on every build.","ja":"スティーブは丸い塔を建てたい。直径と高さを測る。「ブロック1つが1単位だ」と彼。体積を出すには数をかけ算しないといけない。大量の石が必要だ。アレックスは石とガラスの割合をチェックする。塔には3つの次元がある。幅、奥行き、高さだ。予算の大部分はガラスに使われる。アレックスはすべての建築について統計をとっている。","ken":"<b>proportion（割合、つり合い）と portion（部分、一人前）</b>は似てるけど違う！ in proportion to ～（～に比例して）は熟語で出るで★ volume は「体積、量、音量、（本の）巻」と意味が多い。","words":[{"n":"1490","w":"diameter","m":"直径","p":[["dia","横切って"],["meter","はかる"]],"i":"円を横切る長さ","r":"radius（半径）"},{"n":"750","w":"height","m":"高さ","p":[["high","高い"]],"i":"どれだけ高いか","r":"発音「ハイト」"},{"n":"942","w":"unit","m":"単位、1個","p":[["unit","1つ"]],"i":"ひとまとまり","r":"a unit of length（長さの単位）"},{"n":"1263","w":"multiply","m":"かける、増やす","p":[["multi","多くの"],["ply","折る"]],"i":"何倍にも増やす","r":"multiplication（かけ算）"},{"n":"949","w":"volume","m":"体積、量、音量、巻","p":[["volume","巻物"]],"i":"中身の量","r":"turn up the volume"},{"n":"252","w":"quantity","m":"量","p":[["quant","どれだけ"]],"i":"どのくらいの量","r":"quality（質）とセット"},{"n":"702","w":"proportion","m":"割合、つり合い","p":[["pro","～に対して"],["portion","部分"]],"i":"全体に対する部分の割合","r":"in proportion to ～"},{"n":"753","w":"dimension","m":"次元、寸法、側面","p":[["di","離れて"],["mens","はかる"]],"i":"はかった大きさ","r":"3D＝three dimensions"},{"n":"1050","w":"portion","m":"部分、一人前","p":[["portion","分け前"]],"i":"分けた一部","r":"a large portion of ～"},{"n":"736","w":"statistics","m":"統計","p":[["stat","国家"]],"i":"国の状態を数で表す","r":"statistical（統計の）"}]},{"world":"minecraft","title":"果てしない世界","lab":"大きさ","labJa":"テーマ","icon":"theme","en":"The Minecraft world is {{vast}}. There are {{huge}} mountains and {{gigantic}} trees. There are {{numerous}} caves and {{countless}} villages. Food is {{abundant}}, and there is {{plenty}} of water. Steve has {{ample}} time to explore. But some things are {{tiny}}, like a single seed. Even a {{slight}} mistake, like digging straight down, can be dangerous.","ja":"マインクラフトの世界は広大だ。巨大な山や、ものすごく大きな木がある。数多くの洞窟と、数えきれないほどの村がある。食べ物は豊富で、水もたっぷりある。スティーブには探検する時間が十分ある。でも、1粒の種のようにとても小さいものもある。真下に掘るようなわずかなミスでさえ危険なことがある。","ken":"「大きい」いろいろ：<b>huge, vast（広大な）, gigantic, enormous, immense</b>。「たくさん」は <b>numerous, countless, abundant, plenty of</b>。slight は「わずかな」で、not in the slightest（少しも～ない）って熟語もあるで。","words":[{"n":"1120","w":"vast","m":"広大な","p":[["vast","からっぽの"]],"i":"果てしなく広い","r":"a vast amount of ～"},{"n":"538","w":"huge","m":"巨大な","p":[["huge","大きい"]],"i":"めっちゃデカい","r":"big ≒"},{"n":"1977","w":"gigantic","m":"ものすごく大きい","p":[["giant","巨人"]],"i":"巨人サイズ","r":"giant（巨人）"},{"n":"1121","w":"numerous","m":"数多くの","p":[["numer","数"]],"i":"数がいっぱい","r":"many ≒"},{"n":"1687","w":"countless","m":"数えきれない","p":[["count","数える"],["less","ない"]],"i":"数えられない","r":"innumerable ≒"},{"n":"1166","w":"abundant","m":"豊富な","p":[["ab","外へ"],["und","波"]],"i":"波があふれるほど","r":"abundance（豊富さ）"},{"n":"515","w":"plenty","m":"たくさん","p":[["plen","いっぱい"]],"i":"十分すぎるほど","r":"plenty of ～"},{"n":"1986","w":"ample","m":"十分な、広い","p":[["ample","広い"]],"i":"たっぷりある","r":"enough ≒"},{"n":"559","w":"tiny","m":"とても小さい","p":[["tiny","ちっちゃい"]],"i":"ちっちゃい","r":"small ≒"},{"n":"1190","w":"slight","m":"わずかな","p":[["slight","細い"]],"i":"ちょっとだけ","r":"not in the slightest（少しも～ない）"}]},{"world":"minecraft","title":"がけの上の基地","lab":"形","labJa":"テーマ","icon":"theme","en":"Alex builds a mountain base. The cliff is very {{steep}}, almost {{vertical}}. She builds two {{parallel}} walls. Between them is a {{narrow}} path. She puts a {{row}} of torches along the path. A stone {{column}} holds up the roof. The rock is {{rough}} and has {{sharp}} edges. At the bottom, there is a {{shallow}} river. The ice on the river is {{solid}}.","ja":"アレックスは山の基地を作る。がけはとても険しくて、ほとんど垂直だ。2つの平行な壁を作る。その間はせまい道になっている。道にそってたいまつを1列に並べる。石の柱が屋根を支えている。岩はざらざらしていて、とがったふちがある。下には浅い川がある。川の氷はかたい。","ken":"形の形容詞は反対語でセット！ <b>narrow ⇔ wide</b>、<b>shallow ⇔ deep</b>、<b>vertical（垂直の）⇔ horizontal（水平の）</b>。row は「列」と「こぐ」の2つの意味やで。","words":[{"n":"1638","w":"steep","m":"険しい、急な","p":[["steep","高い"]],"i":"角度が急","r":"a steep rise（急上昇）"},{"n":"1955","w":"vertical","m":"垂直の","p":[["vert","回る→てっぺん"]],"i":"まっすぐ上下","r":"horizontal（水平の）が反対"},{"n":"755","w":"parallel","m":"平行の、似た","p":[["para","そばに"],["allel","おたがい"]],"i":"ならんで同じ向き","r":"parallel lines（平行線）"},{"n":"291","w":"narrow","m":"せまい","p":[["narrow","細い"]],"i":"幅がせまい","r":"a narrow escape（危機一髪）"},{"n":"717","w":"row","m":"列、こぐ","p":[["row","列"]],"i":"横にならんだもの","r":"in a row（連続して）"},{"n":"1586","w":"column","m":"柱、（新聞の）コラム","p":[["column","柱"]],"i":"縦にのびたもの","r":"コラム記事"},{"n":"255","w":"rough","m":"ざらざらした、大まかな","p":[["rough","荒い"]],"i":"でこぼこ","r":"a rough idea（大まかな考え）"},{"n":"531","w":"sharp","m":"鋭い、急な","p":[["sharp","切る"]],"i":"とがってる","r":"a sharp increase（急増）"},{"n":"1629","w":"shallow","m":"浅い","p":[["shallow","浅い"]],"i":"底が近い","r":"deep が反対"},{"n":"579","w":"solid","m":"固体の、しっかりした","p":[["sol","固い"]],"i":"カチッと固い","r":"liquid（液体）、gas（気体）"}]},{"world":"minecraft","title":"散らかった家","lab":"家","labJa":"テーマ","icon":"theme","en":"Steve's house is a {{mess}}. There is {{junk}} everywhere and {{dust}} on the shelves. Alex says, \"Let's do the {{chores:chore}}.\" Steve does the {{laundry}}. Alex takes out the {{garbage}} and the {{trash}}. They {{dump}} the old items into a lava pit. Every {{household}} should be clean, Alex says. Now the house is {{neat}} and {{tidy}}.","ja":"スティーブの家はめちゃくちゃだ。あちこちにがらくたがあって、棚にはほこりがある。アレックスが言う。「家事をしよう」。スティーブは洗濯をする。アレックスは生ゴミとゴミを出す。二人は古いアイテムを溶岩の穴に捨てる。どの家庭もきれいであるべきだ、とアレックス。今では家はきちんと片づいている。","ken":"ゴミの言い方いろいろ！ <b>garbage（生ゴミ）、trash（ゴミ・紙くず）、junk（がらくた）</b>。tidy と neat はどっちも「きちんとした」。household chores（家事）はセットで覚えよう★","words":[{"n":"1445","w":"mess","m":"散らかった状態","p":[["mess","料理の皿"]],"i":"ぐちゃぐちゃ","r":"messy（散らかった）"},{"n":"1320","w":"junk","m":"がらくた","p":[["junk","古いロープ"]],"i":"いらない物","r":"junk food（ジャンクフード）"},{"n":"1588","w":"dust","m":"ほこり","p":[["dust","煙"]],"i":"小さなチリ","r":"dusty（ほこりっぽい）"},{"n":"1498","w":"chore","m":"雑用、家事","p":[["chore","仕事"]],"i":"毎日のめんどうな仕事","r":"household chores（家事）"},{"n":"1596","w":"laundry","m":"洗濯（物）","p":[["laund","洗う"]],"i":"洗う服","r":"do the laundry（洗濯する）"},{"n":"526","w":"garbage","m":"生ゴミ、ゴミ","p":[["garbage","内臓"]],"i":"食べ残しのゴミ","r":"garbage can"},{"n":"1502","w":"trash","m":"ゴミ","p":[["trash","くず"]],"i":"いらなくなった物","r":"trash can（ゴミ箱）"},{"n":"1750","w":"dump","m":"捨てる、ゴミ捨て場","p":[["dump","ドサッと落とす"]],"i":"ドサッと捨てる","r":"dump truck"},{"n":"483","w":"household","m":"家庭、家族の","p":[["house","家"],["hold","持つ"]],"i":"一つの家に住む人","r":"household goods（家庭用品）"},{"n":"1628","w":"neat","m":"きちんとした","p":[["neat","きれいな"]],"i":"すっきり整った","r":"tidy ≒"},{"n":"1981","w":"tidy","m":"片づいた","p":[["tidy","時間どおりの"]],"i":"きちんと整理された","r":"tidy up（片づける）"}]},{"world":"minecraft","title":"いなかと都会","lab":"村","labJa":"テーマ","icon":"theme","en":"Steve visits different {{regions:region}} of his world. In the {{rural}} area, villagers live on farms. Each house has a {{yard}}. In the {{urban}} area, there is a big city. It's a {{metropolitan}} area with tall buildings. The city is divided into five {{districts:district}}. A {{resident}} shows Steve around. In another {{province}}, he finds an old {{colony}} of builders. They chose this {{site}} because it's near the sea.","ja":"スティーブは自分の世界のいろいろな地域を訪ねる。田舎の地域では、村人たちは農場に住んでいる。どの家にも庭がある。都会の地域には大きな都市がある。高いビルが立ちならぶ大都市圏だ。都市は5つの地区に分かれている。住人がスティーブを案内してくれる。別の地方では、建築者たちの古い植民地を見つける。彼らは海に近いのでこの場所を選んだ。","ken":"<b>urban（都会の）⇔ rural（田舎の）</b>は反対語セットで超頻出★ site は「場所、用地」で、website もこれ。colony は「植民地」と「（生き物の）群れ」の2つの意味があるで。","words":[{"n":"213","w":"region","m":"地域","p":[["reg","支配"]],"i":"治められている範囲","r":"regional（地域の）"},{"n":"1122","w":"rural","m":"田舎の","p":[["rur","田舎"]],"i":"のどかな田園の","r":"urban（都会の）が反対"},{"n":"500","w":"yard","m":"庭、ヤード","p":[["yard","囲い"]],"i":"家のまわりの庭","r":"backyard（裏庭）"},{"n":"568","w":"urban","m":"都会の","p":[["urb","都市"]],"i":"まちの","r":"suburban（郊外の）"},{"n":"1653","w":"metropolitan","m":"大都市の","p":[["metro","母"],["polis","都市"]],"i":"母なる大都市","r":"metropolis（大都市）"},{"n":"978","w":"district","m":"地区","p":[["di","離れて"],["strict","しばる"]],"i":"区切られた区域","r":"business district（ビジネス街）"},{"n":"211","w":"resident","m":"住人","p":[["re","後ろに"],["sid","座る"]],"i":"そこに座り続ける人","r":"reside（住む）"},{"n":"1526","w":"province","m":"州、地方","p":[["province","征服した土地"]],"i":"国の中の区分","r":"カナダの州"},{"n":"963","w":"colony","m":"植民地、群れ","p":[["colon","耕す人"]],"i":"移り住んだ人たちの土地","r":"colonial（植民地の）"},{"n":"455","w":"site","m":"場所、用地","p":[["site","置かれた所"]],"i":"何かがある場所","r":"website, construction site"}]},{"world":"minecraft","title":"地下深くの採掘","lab":"採掘","labJa":"テーマ","icon":"theme","en":"Steve goes deep into a {{mine}}. He wants to reach the {{core}} of the world. He finds a {{cluster}} of diamonds. He also finds a {{lump}} of gold. He makes a {{pile}} of stones near the entrance. His bag is full, so the {{load}} is heavy. He finds a {{fragment}} of an old sword. It's covered in {{rust}}. Near a lava lake, there is gray {{ash}}. On the way out, he uses a knife to {{strip}} the bark from a tree.","ja":"スティーブは採掘場の奥深くへ進む。世界の中心核まで届きたい。ダイヤモンドの集まりを見つける。金のかたまりも見つける。入り口の近くに石の山を作る。かばんがいっぱいなので、荷物が重い。古い剣のかけらを見つける。それはさびでおおわれている。溶岩の湖の近くには、灰色の灰がある。帰り道、ナイフで木から皮をはぎ取る。","ken":"「かたまり」いろいろ★ <b>lump（ごろっとしたかたまり）、cluster（群れ・房）、pile（積み重なった山）、fragment（かけら）</b>。core は「中心、核心」で、the core of the problem（問題の核心）って使うで。","words":[{"n":"779","w":"mine","m":"鉱山、採掘する、私のもの","p":[["mine","鉱山"]],"i":"地面を掘る所","r":"miner（鉱夫）"},{"n":"781","w":"core","m":"中心、核","p":[["core","心臓"]],"i":"いちばん真ん中","r":"core value（中心となる価値）"},{"n":"1813","w":"cluster","m":"集まり、房","p":[["cluster","かたまり"]],"i":"ぶどうの房みたい","r":"a cluster of stars（星団）"},{"n":"1814","w":"lump","m":"かたまり","p":[["lump","かたまり"]],"i":"ごろっとしたかたまり","r":"a lump of sugar（角砂糖1個）"},{"n":"729","w":"pile","m":"積み重ね、山","p":[["pile","柱"]],"i":"どさっと積んだ山","r":"a pile of ～（山積みの～）"},{"n":"739","w":"load","m":"荷物、積む","p":[["load","道"]],"i":"運ぶ荷","r":"download（ダウンロード）"},{"n":"1511","w":"fragment","m":"かけら","p":[["frag","割れる"]],"i":"割れた破片","r":"fragile（こわれやすい）"},{"n":"1897","w":"rust","m":"さび","p":[["rust","赤"]],"i":"鉄が赤茶色に","r":"rusty（さびた）"},{"n":"1917","w":"ash","m":"灰","p":[["ash","灰"]],"i":"燃えたあとの粉","r":"ashtray（灰皿）"},{"n":"770","w":"strip","m":"はぎ取る、細長い切れ","p":[["strip","はぐ"]],"i":"ペリッとはがす","r":"a strip of paper（紙切れ）"}]},{"world":"minecraft","title":"乗り物と道具","lab":"乗り物","labJa":"テーマ","icon":"theme","en":"Steve builds a new {{vehicle}}. It has four big {{wheels:wheel}}. Alex builds a {{carriage}} for horses. At the port, a large {{vessel}} carries {{cargo}} across the sea. {{Shipping:shipping}} is an important business. In the kitchen, there is a new {{appliance}} that makes bread. Steve uses a {{device}} to find diamonds. His mining {{equipment}} is heavy. Alex makes a strange {{apparatus}} with pipes and wires.","ja":"スティーブは新しい乗り物を作る。4つの大きな車輪がある。アレックスは馬のための馬車を作る。港では、大きな船が海を越えて貨物を運ぶ。海運は大事な商売だ。台所には、パンを作る新しい家電製品がある。スティーブはダイヤモンドを見つけるのに装置を使う。彼の採掘用の道具は重い。アレックスはパイプとワイヤーで奇妙な器具を作る。","ken":"<b>equipment（装置・備品）は数えられない名詞</b>！ furniture と同じで、a piece of equipment って言う★ 機械いろいろ：device（小さな装置）、appliance（家電）、apparatus（実験器具）。","words":[{"n":"714","w":"vehicle","m":"乗り物","p":[["veh","運ぶ"]],"i":"人や物を運ぶもの","r":"発音「ヴィークル」"},{"n":"178","w":"wheel","m":"車輪、ハンドル","p":[["wheel","回る"]],"i":"くるくる回る輪","r":"steering wheel（ハンドル）"},{"n":"1792","w":"carriage","m":"馬車、運送","p":[["carry","運ぶ"]],"i":"運ぶもの","r":"baby carriage（ベビーカー）"},{"n":"785","w":"vessel","m":"（大きな）船、容器、血管","p":[["vessel","入れ物"]],"i":"物を入れて運ぶもの","r":"blood vessel（血管）"},{"n":"1910","w":"cargo","m":"貨物","p":[["cargo","荷"]],"i":"船や飛行機の荷物","r":"cargo ship（貨物船）"},{"n":"1887","w":"shipping","m":"海運、発送","p":[["ship","船"]],"i":"船や便で送ること","r":"free shipping（送料無料）"},{"n":"1819","w":"appliance","m":"家電製品、器具","p":[["apply","使う"]],"i":"家で使う機械","r":"home appliances（家電）"},{"n":"495","w":"device","m":"装置","p":[["devise","考え出す"]],"i":"工夫して作ったもの","r":"mobile device（携帯端末）"},{"n":"463","w":"equipment","m":"装置、備品","p":[["equip","備える"]],"i":"そなえつけの道具","r":"数えられない名詞★"},{"n":"1793","w":"apparatus","m":"器具、装置","p":[["ap","～へ"],["parat","準備"]],"i":"準備された道具","r":"実験器具など"}]},{"world":"minecraft","title":"クリーパーの爆発","lab":"副詞：どのくらい","labJa":"テーマ","icon":"theme","en":"Steve's base is {{nearly}} finished. It's {{mostly}} made of stone. The plan was {{largely}} Alex's idea. The house is {{relatively}} small, but it's {{somewhat}} cozy. \"It's {{merely}} a box,\" a passing villager says. Then a creeper explodes. The wall is {{utterly}} destroyed. The house is {{virtually}} gone. The situation changes {{drastically}}. \"{{Altogether:altogether}}, we lost three days of work,\" Steve sighs.","ja":"スティーブの基地はほぼ完成だ。ほとんど石でできている。計画は主にアレックスのアイデアだった。家は比較的小さいけど、いくぶん居心地がいい。「ただの箱じゃないか」と通りかかった村人が言う。そのとき、クリーパーが爆発する。壁は完全に破壊される。家は事実上なくなってしまう。状況は劇的に変わる。「全部で3日分の作業を失ったよ」とスティーブはため息をつく。","ken":"「どのくらい」の副詞。<b>nearly（ほとんど）、virtually（事実上）、largely（主に）、merely（単に）</b>。virtually は「仮想的に」より「事実上、ほぼ」の意味が大事★ altogether は「全部で」と「まったく」の2つ。","words":[{"n":"312","w":"nearly","m":"ほとんど","p":[["near","近い"]],"i":"もう少しで","r":"almost ≒"},{"n":"596","w":"mostly","m":"たいてい、主に","p":[["most","いちばん多い"]],"i":"ほとんどの部分が","r":"mainly ≒"},{"n":"595","w":"largely","m":"主に、大部分は","p":[["large","大きい"]],"i":"大部分は","r":"mainly ≒"},{"n":"592","w":"relatively","m":"比較的","p":[["relate","関係"]],"i":"ほかと比べると","r":"comparatively ≒"},{"n":"1195","w":"somewhat","m":"いくぶん","p":[["some","いくらか"],["what","何"]],"i":"ちょっとだけ","r":"a little ≒"},{"n":"1196","w":"merely","m":"単に","p":[["mere","ただの"]],"i":"それだけ","r":"only ≒"},{"n":"1692","w":"utterly","m":"完全に","p":[["utter","完全な"]],"i":"まったく","r":"completely ≒"},{"n":"1194","w":"virtually","m":"事実上、ほとんど","p":[["virtual","実質的な"]],"i":"ほぼ100％","r":"★「事実上」の意味が大事"},{"n":"1693","w":"drastically","m":"劇的に、大幅に","p":[["drastic","思い切った"]],"i":"ガラッと大きく","r":"drastic（徹底的な）"},{"n":"845","w":"altogether","m":"全部で、まったく","p":[["all","すべて"],["together","一緒に"]],"i":"全部まとめて","r":"in all ≒"}]},{"world":"minecraft","title":"へんてこな村","lab":"ふつうと特別","labJa":"テーマ","icon":"theme","en":"In {{general}}, Minecraft villages look {{similar}}. A {{typical}} village has a well and some farms. But this village is {{peculiar}}. The houses are made of {{various}} colors of wool. One house has an {{odd}} shape, like a fish. Steve likes one {{particular}} house near the river. It's his {{ideal}} home. Alex says, \"Be more {{specific}}. Which one?\" There are only {{minor}} problems, like a small hole in the roof.","ja":"一般に、マイクラの村は似たように見える。典型的な村には井戸といくつかの畑がある。でもこの村は変わっている。家はいろいろな色の羊毛でできている。ある家は魚のような奇妙な形をしている。スティーブは川の近くのある特定の家が好きだ。それは彼の理想の家だ。アレックスは言う。「もっと具体的に言って。どれ？」屋根の小さな穴のような、ささいな問題しかない。","ken":"<b>in general（一般に）⇔ in particular（特に）</b>はセット★ peculiar は「変わった」と「特有の」の2つ、be peculiar to ～（～に特有の）って形も出るで。odd は「奇妙な」と「奇数の」。","words":[{"n":"527","w":"general","m":"一般的な","p":[["gener","種類"]],"i":"全体的な","r":"in general（一般に）"},{"n":"529","w":"similar","m":"似ている","p":[["simil","同じ"]],"i":"よく似た","r":"be similar to ～"},{"n":"545","w":"typical","m":"典型的な","p":[["type","型"]],"i":"いかにもそれっぽい","r":"be typical of ～（～に典型的な）"},{"n":"819","w":"peculiar","m":"変わった、特有の","p":[["peculi","自分の財産"]],"i":"その人だけの","r":"be peculiar to ～"},{"n":"528","w":"various","m":"さまざまな","p":[["vary","変わる"]],"i":"いろいろな","r":"variety（種類）"},{"n":"1133","w":"odd","m":"奇妙な、奇数の","p":[["odd","三角"]],"i":"半端でへん","r":"odd number（奇数）"},{"n":"258","w":"particular","m":"特定の、好みがうるさい","p":[["part","部分"]],"i":"その一つの","r":"in particular（特に）"},{"n":"546","w":"ideal","m":"理想的な","p":[["idea","考え"]],"i":"頭の中の最高","r":"ideally（理想的には）"},{"n":"286","w":"specific","m":"具体的な、特定の","p":[["spec","種類"]],"i":"はっきり決まった","r":"specifically（具体的に）"},{"n":"544","w":"minor","m":"小さい、重要でない","p":[["min","小さい"]],"i":"ちょっとした","r":"major（主要な）が反対"}]},{"world":"minecraft","title":"マイクラの歴史","lab":"時の形容詞","labJa":"テーマ","icon":"theme","en":"Steve reads about the history of his world. In {{ancient}} times, people built pyramids in the desert. In the {{medieval}} period, they built castles. In {{recent}} years, villages have grown. The {{latest}} update added new animals. There are two ways to travel: by boat or by horse. The {{former}} is faster on water, and the {{latter}} is faster on land. Alex built a {{temporary}} shelter for the night. Every year, the village holds an {{annual}} festival. Summer is {{brief}}, and Steve wishes the fun were {{eternal}}.","ja":"スティーブは自分の世界の歴史について読む。古代には、人々は砂漠にピラミッドを建てた。中世の時代には、城を建てた。最近の数年で、村は大きくなった。最新のアップデートで新しい動物が追加された。移動の方法は2つある。ボートか馬だ。前者は水の上で速く、後者は陸の上で速い。アレックスは夜のための一時的な避難所を作った。毎年、村は年に一度のお祭りを開く。夏は短く、スティーブは楽しい時間が永遠ならいいのにと思う。","ken":"★<b>the former（前者）と the latter（後者）</b>は長文で超大事！ 2つのものを指すときに使う。temporary（一時的な）⇔ permanent（永久の）もセットで覚えよう。","words":[{"n":"535","w":"ancient","m":"古代の","p":[["anci","前の"]],"i":"ずっとずっと昔の","r":"ancient Rome"},{"n":"1188","w":"medieval","m":"中世の","p":[["medi","中間"],["ev","時代"]],"i":"古代と近代の間","r":"the medieval period"},{"n":"309","w":"recent","m":"最近の","p":[["recent","新しい"]],"i":"ついこの前の","r":"recently（最近）"},{"n":"576","w":"latest","m":"最新の","p":[["late","遅い"]],"i":"いちばん新しい","r":"the latest news"},{"n":"281","w":"former","m":"前者の、前の","p":[["fore","前"]],"i":"前のほう","r":"the former（前者）★"},{"n":"817","w":"latter","m":"後者の、後半の","p":[["late","遅い"]],"i":"あとのほう","r":"the latter（後者）★"},{"n":"569","w":"temporary","m":"一時的な","p":[["tempor","時"]],"i":"しばらくの間だけ","r":"permanent（永久の）が反対"},{"n":"796","w":"annual","m":"年に一度の","p":[["ann","年"]],"i":"毎年の","r":"annually（毎年）"},{"n":"574","w":"brief","m":"短い","p":[["brief","短い"]],"i":"あっという間","r":"in brief（手短に）"},{"n":"1662","w":"eternal","m":"永遠の","p":[["etern","永遠"]],"i":"終わりがない","r":"eternity（永遠）"}]},{"world":"minecraft","title":"音楽マシン","lab":"形容詞いろいろ3","labJa":"テーマ","icon":"theme","en":"Alex has a {{keen}} interest in redstone. She reads the {{manual}} carefully. The instructions are {{straightforward}}. Wearing a helmet is {{mandatory}} in her lab. If something goes wrong, she is {{liable}} for the damage. She is {{intent}} on building a music machine. It will play {{classical}} music. Her friends wear {{casual}} clothes and come to listen. The machine has great {{potential}}. Her work is very future-{{oriented}}.","ja":"アレックスはレッドストーンに強い興味を持っている。彼女は説明書を注意深く読む。説明はわかりやすい。彼女の研究室ではヘルメットをかぶるのが義務だ。何かうまくいかなかったら、彼女が損害の責任を負う。彼女は音楽マシンを作ることに集中している。それはクラシック音楽を流す予定だ。友だちはふだん着でやって来て聞く。そのマシンには大きな可能性がある。彼女の仕事はとても未来志向だ。","ken":"★<b>be liable to ～（～しがちだ）、be keen on ～（～に夢中だ）、be intent on ～（～に集中している）</b>は形ごと！ manual は「説明書」と「手動の」。manual car（マニュアル車）やで。","words":[{"n":"800","w":"keen","m":"熱心な、鋭い","p":[["keen","鋭い"]],"i":"気持ちがとがってる","r":"be keen on ～（～に夢中だ）"},{"n":"1153","w":"manual","m":"説明書、手動の","p":[["man","手"]],"i":"手でやる、手引き","r":"automatic（自動の）が反対"},{"n":"1624","w":"straightforward","m":"わかりやすい、率直な","p":[["straight","まっすぐ"],["forward","前へ"]],"i":"まっすぐで迷わない","r":"simple ≒"},{"n":"2022","w":"mandatory","m":"義務的な","p":[["mand","命じる"]],"i":"命令されていてやらなあかん","r":"compulsory ≒"},{"n":"1335","w":"liable","m":"責任がある、～しがちな","p":[["li","しばる"]],"i":"責任でしばられる","r":"be liable to ～（～しがちだ）"},{"n":"2016","w":"intent","m":"集中した、意図","p":[["in","中へ"],["tent","伸ばす"]],"i":"気持ちがそっちに伸びる","r":"be intent on ～"},{"n":"1341","w":"classical","m":"古典的な、クラシックの","p":[["class","階級"]],"i":"昔からの一流の","r":"classic（一流の）と区別"},{"n":"804","w":"casual","m":"ふだんの、気軽な","p":[["casu","偶然"]],"i":"特に準備しない","r":"casual clothes（ふだん着）"},{"n":"554","w":"potential","m":"可能性、潜在的な","p":[["pot","できる"]],"i":"中に眠っている力","r":"potentially（潜在的に）"},{"n":"1620","w":"oriented","m":"～志向の","p":[["orient","東"]],"i":"東を向く→方向づけられた","r":"family-oriented（家族志向の）"}]},{"world":"minecraft","title":"エンドの冒険","lab":"形容詞いろいろ4","labJa":"テーマ","icon":"theme","en":"Steve finds a {{rare}} item: a dragon egg. He searched the {{entire}} End to find it. He is {{aware}} of the danger. The End looks like an {{alien}} world. The Endermen are usually {{passive}}, but they get angry if you look at them. Steve moves with the {{utmost}} care. He brought only the {{minimum}} amount of food. He sees an island {{sinking}} into the void. A robot villager moves on its own because it's {{autonomous}}. The {{gross}} weight of Steve's bag is 50 kg.","ja":"スティーブはめずらしいアイテムを見つける。ドラゴンの卵だ。それを見つけるためにエンド全体を探した。彼は危険に気づいている。エンドは異星の世界みたいだ。エンダーマンはふだんはおとなしいけど、目を合わせると怒る。スティーブは最大限の注意をはらって動く。食べ物は最小限の量しか持ってきていない。島が奈落に沈んでいくのが見える。ロボットの村人は自律型なので、自分で動いている。スティーブのかばんの総重量は50キロだ。","ken":"<b>be aware of ～（～に気づいている）</b>は超頻出★ gross は「総計の」と「気持ち悪い」の2つ、GDP の G（Gross）やで！ passive（受け身の）⇔ active（積極的な）。","words":[{"n":"557","w":"rare","m":"めずらしい、（肉が）生焼けの","p":[["rare","まばらな"]],"i":"めったにない","r":"rarely（めったに～ない）"},{"n":"541","w":"entire","m":"全体の","p":[["en","否定"],["tire","さわる"]],"i":"欠けてない全部","r":"entirely（完全に）"},{"n":"534","w":"aware","m":"気づいている","p":[["a","強め"],["ware","注意する"]],"i":"ちゃんとわかってる","r":"be aware of ～★"},{"n":"826","w":"alien","m":"異質な、外国人、宇宙人","p":[["ali","ほかの"]],"i":"よそから来た","r":"alienate（遠ざける）"},{"n":"820","w":"passive","m":"受け身の、おとなしい","p":[["pass","苦しむ"]],"i":"される側","r":"active（積極的な）が反対"},{"n":"2010","w":"utmost","m":"最大限の","p":[["ut","外"],["most","いちばん"]],"i":"いちばん外側まで","r":"do one's utmost（全力をつくす）"},{"n":"815","w":"minimum","m":"最小限（の）","p":[["mini","小さい"]],"i":"いちばん少ない","r":"maximum（最大限）が反対"},{"n":"880","w":"sinking","m":"沈んでいる","p":[["sink","沈む"]],"i":"ずぶずぶ沈む","r":"sink（沈む、流し台）"},{"n":"1690","w":"autonomous","m":"自律した","p":[["auto","自分"],["nomy","法"]],"i":"自分のルールで動く","r":"autonomy（自治）"},{"n":"1639","w":"gross","m":"総計の、気持ち悪い","p":[["gross","大きい"]],"i":"全部まとめた","r":"GDP＝Gross Domestic Product"}]},{"world":"minecraft","title":"変わりゆく村","lab":"増える減る","labJa":"テーマ","icon":"theme","en":"The village population {{increases:increase}} every year. Alex wants to {{boost}} food production. She {{modifies:modify}} the farm design. She {{alters:alter}} the water system too. The village {{gains:gain}} new members. After the rain, the river starts to {{swell}}. Then in summer, the lake begins to {{shrink}}. The weather {{varies:vary}} a lot. The villagers {{shift}} their work to the night. As the sun goes down, the colors in the sky slowly {{fade}}.","ja":"村の人口は毎年増えている。アレックスは食料生産を押し上げたい。彼女は農場のデザインを修正する。水のシステムも変える。村は新しいメンバーを得る。雨のあと、川がふくらみ始める。それから夏には、湖が縮み始める。天気はとても変わりやすい。村人たちは仕事を夜に移す。日が沈むにつれて、空の色はゆっくりと薄れていく。","ken":"「変える」は <b>change, alter, modify, shift</b>。alter は部分的に変える、modify は少し手直し。★<b>vary（変わる、さまざまである）</b>の形容詞は various、名詞は variety。この3つセットで！","words":[{"n":"3","w":"increase","m":"増える、増やす","p":[["in","上に"],["crease","育つ"]],"i":"どんどん育つ","r":"decrease（減る）が反対"},{"n":"1348","w":"boost","m":"押し上げる","p":[["boost","押し上げ"]],"i":"グイッと上げる","r":"ブースト"},{"n":"903","w":"modify","m":"修正する","p":[["mod","型"]],"i":"型を少し変える","r":"modification（修正）"},{"n":"854","w":"alter","m":"変える","p":[["alter","ほかの"]],"i":"ほかの形にする","r":"alternative（代わりの）"},{"n":"51","w":"gain","m":"得る、増す","p":[["gain","手に入れる"]],"i":"プラスになる","r":"gain weight（太る）"},{"n":"1216","w":"swell","m":"ふくらむ","p":[["swell","ふくらむ"]],"i":"ぷくっとふくれる","r":"swollen（はれた）"},{"n":"1234","w":"shrink","m":"縮む","p":[["shrink","しわが寄る"]],"i":"小さく縮む","r":"shrink-shrank-shrunk"},{"n":"88","w":"vary","m":"変わる、さまざまである","p":[["vary","変化する"]],"i":"いろいろに変わる","r":"various, variety"},{"n":"161","w":"shift","m":"移す、変化、交代勤務","p":[["shift","動かす"]],"i":"位置や向きを変える","r":"night shift（夜勤）"},{"n":"888","w":"fade","m":"薄れる","p":[["fade","色あせる"]],"i":"だんだん消えていく","r":"fade away（消えていく）"}]},{"world":"minecraft","title":"新しい町の誕生","lab":"始める・やめる","labJa":"テーマ","icon":"theme","en":"Alex and Steve {{found}} a new town. They {{establish}} a market and a school. They {{launch}} a festival to celebrate. Their redstone machine {{generates:generate}} power. But one day, a spark {{triggers:trigger}} a fire. Problems {{arise}} quickly. They {{halt}} all work. The fire finally {{ceases:cease}}. Steve wants to {{quit}}, but Alex encourages him. In their report, they {{omit}} the boring details.","ja":"アレックスとスティーブは新しい町を設立する。市場と学校を作る。お祝いにお祭りを始める。二人のレッドストーン装置は電力を生み出す。でもある日、火花が火事を引き起こす。問題が次々と起こる。二人はすべての作業を停止する。火はついにおさまる。スティーブはやめたくなるけど、アレックスが彼をはげます。報告書では、つまらない細かいことは省く。","ken":"★<b>found（設立する）は find の過去形とは別の動詞</b>！ found-founded-founded。活用問題でひっかけになる。arise（起こる）と rise（上がる）と raise（上げる）の区別も大事やで。","words":[{"n":"637","w":"found","m":"設立する","p":[["found","土台"]],"i":"土台を作る","r":"found-founded-founded★"},{"n":"45","w":"establish","m":"設立する、確立する","p":[["stabl","しっかり"]],"i":"しっかり立てる","r":"establishment（設立）"},{"n":"693","w":"launch","m":"始める、発射する","p":[["launch","やりを投げる"]],"i":"ドーンと打ち上げる","r":"launch a product（製品を発売）"},{"n":"394","w":"generate","m":"生み出す","p":[["gener","生む"]],"i":"作り出す","r":"generation（世代、発生）"},{"n":"1247","w":"trigger","m":"引き起こす、引き金","p":[["trigger","引く"]],"i":"引き金を引く","r":"trigger a reaction"},{"n":"855","w":"arise","m":"起こる","p":[["a","上に"],["rise","上がる"]],"i":"問題がわき上がる","r":"arise-arose-arisen"},{"n":"1382","w":"halt","m":"停止する、停止","p":[["halt","止まる"]],"i":"ピタッと止まる","r":"come to a halt（止まる）"},{"n":"604","w":"cease","m":"やむ、やめる","p":[["cease","止まる"]],"i":"終わる","r":"ceasefire（停戦）"},{"n":"389","w":"quit","m":"やめる","p":[["quit","自由になる"]],"i":"すっぱりやめる","r":"quit smoking"},{"n":"1385","w":"omit","m":"省く","p":[["o","離れて"],["mit","送る"]],"i":"外へ送り出して抜かす","r":"omission（省略）"}]},{"world":"minecraft","title":"アレックスの工場","lab":"扱う","labJa":"テーマ","icon":"theme","en":"Alex opens a factory to {{manufacture}} tools. She {{equips:equip}} it with new machines. She {{operates:operate}} the machines herself. She knows how to {{handle}} dangerous lava. She {{utilizes:utilize}} redstone for automation. She can {{manipulate}} pistons to move blocks. She {{classifies:classify}} items into groups. Later, she {{merges:merge}} her factory with Steve's company, and they {{integrate}} their systems. She {{treats:treat}} her workers kindly.","ja":"アレックスは道具を製造する工場を開く。そこに新しい機械を備えつける。機械は自分で操作する。危険な溶岩の扱い方を知っている。自動化のためにレッドストーンを利用する。ピストンを操ってブロックを動かせる。アイテムをグループに分類する。のちに、彼女は自分の工場をスティーブの会社と合併させ、二人はシステムを統合する。彼女は従業員にやさしく接する。","ken":"★<b>treat</b> は「扱う」「治療する」「おごる」の3つ！ It's my treat.（ぼくのおごり）。manipulate は「うまく操る」で、人を操る悪い意味でも使うで。","words":[{"n":"149","w":"manufacture","m":"製造する","p":[["manu","手"],["fact","作る"]],"i":"手で作る→工場で作る","r":"manufacturer（メーカー）"},{"n":"680","w":"equip","m":"備えつける","p":[["equip","船に装備"]],"i":"必要な道具をそろえる","r":"be equipped with ～"},{"n":"109","w":"operate","m":"操作する、手術する","p":[["oper","働く"]],"i":"機械を動かす","r":"operation（操作、手術）"},{"n":"372","w":"handle","m":"扱う、取っ手","p":[["hand","手"]],"i":"手で処理する","r":"handle a problem"},{"n":"1250","w":"utilize","m":"利用する","p":[["util","役に立つ"]],"i":"うまく使う","r":"use ≒"},{"n":"1402","w":"manipulate","m":"操る","p":[["mani","手"],["pul","満たす"]],"i":"手でうまく動かす","r":"manipulation（操作）"},{"n":"913","w":"classify","m":"分類する","p":[["class","種類"]],"i":"種類ごとに分ける","r":"classification（分類）"},{"n":"1739","w":"merge","m":"合併する","p":[["merge","しずめる"]],"i":"溶け合って1つに","r":"merger（合併）"},{"n":"1373","w":"integrate","m":"統合する","p":[["integr","完全な"]],"i":"まとめて1つにする","r":"integration（統合）"},{"n":"44","w":"treat","m":"扱う、治療する、おごる","p":[["treat","引っぱる"]],"i":"人や物にどう接するか","r":"treatment（治療）"}]},{"world":"minecraft","title":"ハードコアモード","lab":"生きる","labJa":"テーマ","icon":"theme","en":"In hardcore mode, Steve must {{cope}} with many dangers. He needs to {{avoid}} creepers. Underwater, he can't {{breathe}}, so he might {{drown}}. Without food, he will {{starve}}. He {{adds:add}} a torch to every room. He needs to get {{rid}} of the zombies. He {{solves:solve}} each problem one by one. At the end of the day, he is {{satisfied:satisfy}}. He {{buries:bury}} his treasure under a tree.","ja":"ハードコアモードでは、スティーブは多くの危険にうまく対処しないといけない。クリーパーをさける必要がある。水中では息ができないので、おぼれるかもしれない。食べ物がなければ、飢えてしまう。すべての部屋にたいまつを加える。ゾンビを取り除く必要がある。問題をひとつずつ解決する。1日の終わりに、彼は満足している。木の下に宝物を埋める。","ken":"★<b>cope with ～（～にうまく対処する）</b>、<b>get rid of ～（～を取り除く）</b>、<b>avoid ～ing（～するのをさける）</b>は超頻出！ avoid to ～ はダメやで。bury は「ベリー」と読む、発音注意★","words":[{"n":"861","w":"cope","m":"うまく対処する","p":[["cope","打つ"]],"i":"なんとか乗り切る","r":"cope with ～"},{"n":"338","w":"avoid","m":"さける","p":[["a","外へ"],["void","空っぽ"]],"i":"そこから離れる","r":"avoid ～ing（to不定詞はダメ）"},{"n":"374","w":"breathe","m":"呼吸する","p":[["breath","息"]],"i":"息をする","r":"breath（名詞）と発音が違う"},{"n":"674","w":"drown","m":"おぼれる","p":[["drown","水に沈む"]],"i":"水の中で息ができない","r":"drown oneself"},{"n":"659","w":"starve","m":"飢える","p":[["starve","死ぬ"]],"i":"食べ物がなくて苦しむ","r":"starvation（飢餓）"},{"n":"337","w":"add","m":"加える","p":[["add","与える"]],"i":"プラスする","r":"addition（追加）"},{"n":"922","w":"rid","m":"取り除く","p":[["rid","片づける"]],"i":"すっきりなくす","r":"get rid of ～"},{"n":"343","w":"solve","m":"解決する","p":[["solve","ゆるめる"]],"i":"もつれをほどく","r":"solution（解決）"},{"n":"349","w":"satisfy","m":"満足させる","p":[["satis","十分"],["fy","する"]],"i":"十分にする","r":"be satisfied with ～"},{"n":"860","w":"bury","m":"埋める","p":[["bury","隠す"]],"i":"土の中に入れる","r":"発音「ベリー」、burial（埋葬）"}]},{"world":"minecraft","title":"町を守る組織","lab":"組織","labJa":"テーマ","icon":"theme","en":"The villagers form an {{organization}} to protect the town. It has a clear {{hierarchy}}: leaders, guards, and workers. A {{bureaucrat}} handles all the paperwork. The town's main {{industry}} is mining. They build a new {{facility}} for training. There is a {{branch}} office in the next village. The workers form a {{union}} to ask for better pay. At the meeting, the first item on the {{agenda}} is safety. They follow a strict {{protocol}} in emergencies. Alex takes the {{initiative}} and proposes a new plan.","ja":"村人たちは町を守るための組織を作る。そこにははっきりした階層がある。リーダー、警備員、作業員だ。官僚がすべての書類仕事を担当している。町の主な産業は採掘だ。訓練のための新しい施設を建てる。となりの村には支店がある。作業員たちはより良い給料を求めて組合を作る。会議では、議題の最初の項目は安全だ。緊急時には厳しい手順に従う。アレックスが主導権をとって新しい計画を提案する。","ken":"<b>take the initiative（率先してやる、主導権をとる）</b>は熟語で出る★ agenda は「議題（リスト）」、会議の予定表やで。branch は「枝」と「支店」の2つ。","words":[{"n":"439","w":"organization","m":"組織","p":[["organ","道具"]],"i":"ひとつにまとまった集団","r":"organize（組織する）"},{"n":"1831","w":"hierarchy","m":"階層、上下関係","p":[["hier","神聖な"],["archy","支配"]],"i":"上から下へのピラミッド","r":"hierarchical（階層的な）"},{"n":"1932","w":"bureaucrat","m":"官僚","p":[["bureau","机"],["crat","支配"]],"i":"机で仕事をする役人","r":"bureaucracy（官僚制）"},{"n":"190","w":"industry","m":"産業、勤勉","p":[["industr","勤勉"]],"i":"一生けんめい作る仕事","r":"industrial（産業の）、industrious（勤勉な）"},{"n":"707","w":"facility","m":"施設、設備","p":[["facil","簡単"]],"i":"物事を楽にする場所","r":"facilities（施設）"},{"n":"253","w":"branch","m":"枝、支店","p":[["branch","足"]],"i":"本体から分かれた部分","r":"branch office（支店）"},{"n":"947","w":"union","m":"組合、結合","p":[["uni","1つ"]],"i":"1つにまとまったもの","r":"labor union（労働組合）"},{"n":"1939","w":"agenda","m":"議題","p":[["agend","するべきこと"]],"i":"やることリスト","r":"on the agenda（議題に上がって）"},{"n":"1929","w":"protocol","m":"手順、決まり、外交儀礼","p":[["proto","最初"],["col","のり"]],"i":"最初に貼られた決まり","r":"safety protocol"},{"n":"1293","w":"initiative","m":"主導権、新たな取り組み","p":[["init","始め"]],"i":"最初に始める力","r":"take the initiative"}]},{"world":"minecraft","title":"魔女のたくらみ","lab":"方法","labJa":"テーマ","icon":"theme","en":"Steve tries a new {{method}} of farming. His {{technique}} is simple but smart. Alex explains the {{mechanism}} of his machine. Each part has a {{function}}. Steve writes a {{draft}} of his plan. Meanwhile, a witch has a {{scheme}} to attack the village. It's a secret {{plot}}. Alex says, \"We have two {{options:option}}: fight or hide.\" \"Is there an {{alternative}}?\" asks Steve. The {{usage}} of TNT is not allowed in the village.","ja":"スティーブは新しい農業の方法を試す。彼の技術はシンプルだけどかしこい。アレックスが彼の機械の仕組みを説明する。それぞれの部品には機能がある。スティーブは計画の下書きを書く。その間、魔女は村を襲う計画を持っている。それは秘密の陰謀だ。アレックスは言う。「選択肢は2つ。戦うか隠れるか」。「ほかの選択肢はないの？」とスティーブ。村ではTNTの使用は禁止されている。","ken":"<b>scheme と plot</b> はどっちも「計画」やけど、悪だくみのニュアンスがあることが多い。plot は「（物語の）筋」の意味もあるで★ alternative は「代わりの（もの）」、alternative energy（代替エネルギー）。","words":[{"n":"417","w":"method","m":"方法","p":[["meta","後に"],["hod","道"]],"i":"あとをたどる道筋","r":"methodical（きちょうめんな）"},{"n":"473","w":"technique","m":"技術","p":[["techn","技"]],"i":"コツのある技","r":"technical（技術的な）"},{"n":"1034","w":"mechanism","m":"仕組み","p":[["mechan","機械"]],"i":"動く仕組み","r":"mechanical（機械の）"},{"n":"436","w":"function","m":"機能、働く","p":[["funct","行う"]],"i":"役目としての働き","r":"functional（機能的な）"},{"n":"1302","w":"draft","m":"下書き、徴兵","p":[["draft","引く"]],"i":"さっと線を引いた原稿","r":"a rough draft（下書き）"},{"n":"1013","w":"scheme","m":"計画、たくらみ","p":[["scheme","形"]],"i":"計画、悪だくみ","r":"a pension scheme（年金制度）"},{"n":"1284","w":"plot","m":"陰謀、（物語の）筋","p":[["plot","小さな土地"]],"i":"話の筋、たくらみ","r":"plot against ～"},{"n":"1032","w":"option","m":"選択肢","p":[["opt","選ぶ"]],"i":"選べるもの","r":"optional（自由に選べる）"},{"n":"245","w":"alternative","m":"代わりの（もの）","p":[["alter","ほかの"]],"i":"別の選び道","r":"alternative energy（代替エネルギー）"},{"n":"1043","w":"usage","m":"使用（法）","p":[["use","使う"]],"i":"使い方","r":"word usage（語法）"}]},{"world":"minecraft","title":"世界の歴史年表","lab":"時代","labJa":"テーマ","icon":"theme","en":"Alex studies the history of her world. In {{antiquity}}, people lived in caves. The {{dawn}} of the iron age changed everything. Each {{era}} has its own style. The castle {{period}} lasted for a {{decade}}. The {{onset}} of winter brings snow. The {{duration}} of each day is 20 minutes. Her new project has three {{phases:phase}}, and the {{deadline}} is next Friday. A villager's life {{span}} is short.","ja":"アレックスは自分の世界の歴史を学ぶ。古代には、人々は洞窟に住んでいた。鉄器時代の夜明けがすべてを変えた。それぞれの時代に独自のスタイルがある。城の時代は10年続いた。冬の始まりは雪を運んでくる。1日の長さは20分だ。彼女の新しいプロジェクトには3つの段階があって、締め切りは次の金曜日だ。村人の寿命は短い。","ken":"<b>decade（10年）、century（100年）、era（時代）</b>。dawn は「夜明け」と「始まり」、at dawn（夜明けに）で覚えよう。life span（寿命）、attention span（集中力の続く時間）も出るで。","words":[{"n":"1540","w":"antiquity","m":"古代","p":[["anti","前の"]],"i":"ずっと昔","r":"antique（骨とう品）"},{"n":"719","w":"dawn","m":"夜明け、始まり","p":[["dawn","日が出る"]],"i":"朝のはじまり","r":"from dawn till dusk（朝から晩まで）"},{"n":"951","w":"era","m":"時代","p":[["era","数"]],"i":"ある特徴をもつ時代","r":"the Edo era（江戸時代）"},{"n":"400","w":"period","m":"期間、時代、ピリオド","p":[["peri","まわり"],["od","道"]],"i":"ひと回りする時間","r":"period of time"},{"n":"430","w":"decade","m":"10年間","p":[["deca","10"]],"i":"10年ひとくくり","r":"for decades（何十年も）"},{"n":"1940","w":"onset","m":"始まり","p":[["on","上に"],["set","置く"]],"i":"始まりの時","r":"the onset of winter"},{"n":"1880","w":"duration","m":"（続く）期間","p":[["dur","続く"]],"i":"どれだけ続くか","r":"during（～の間）"},{"n":"1566","w":"phase","m":"段階、局面","p":[["phase","現れ"]],"i":"移り変わりの1つ","r":"the first phase（第1段階）"},{"n":"1514","w":"deadline","m":"締め切り","p":[["dead","死"],["line","線"]],"i":"越えたらアウトの線","r":"meet the deadline（締め切りに間に合う）"},{"n":"752","w":"span","m":"期間、幅","p":[["span","伸ばす"]],"i":"始まりから終わりまで","r":"life span（寿命）"}]},{"world":"minecraft","title":"洞窟の宝箱","lab":"物","labJa":"テーマ","icon":"theme","en":"Steve finds an old {{chest}} in a cave. Inside is {{treasure}}: gold and jewels. There is also an {{envelope}} with a letter. He finds a {{token}} with a strange mark. \"What's all this {{stuff}}?\" he says. He cleans the items with an old {{rag}}. Outside, he cuts a {{log}} and makes a fishing {{pole}}. He picks a {{bunch}} of flowers. He grows carrots in a small {{patch}} of land.","ja":"スティーブは洞窟で古い宝箱を見つける。中には宝物がある。金と宝石だ。手紙の入った封筒もある。不思議なしるしのついたコインを見つける。「このいろんな物はいったい何だ？」と彼。古いぼろ布でアイテムをふく。外で丸太を切って、釣りざおを作る。花を一束つむ。小さな区画の土地でニンジンを育てる。","ken":"chest は「宝箱」と「胸」の2つ！ マイクラのチェストは宝箱やな。stuff は「物、こと」で、会話でめっちゃ使う万能単語。token は「しるし、代用硬貨」で、as a token of ～（～のしるしとして）って熟語もあるで。","words":[{"n":"704","w":"chest","m":"宝箱、胸","p":[["chest","箱"]],"i":"大きな箱、胸の箱","r":"chest pain（胸の痛み）"},{"n":"705","w":"treasure","m":"宝物、大切にする","p":[["treas","宝"]],"i":"宝物","r":"treasure hunt（宝探し）"},{"n":"438","w":"envelope","m":"封筒","p":[["en","中に"],["velop","包む"]],"i":"手紙を包むもの","r":"develop も velop 仲間"},{"n":"1852","w":"token","m":"しるし、代用硬貨","p":[["token","しるし"]],"i":"何かの印","r":"as a token of ～（～のしるしとして）"},{"n":"716","w":"stuff","m":"物、こと","p":[["stuff","材料"]],"i":"いろんな物","r":"会話の万能単語"},{"n":"1896","w":"rag","m":"ぼろ布","p":[["rag","ぼろ"]],"i":"古い布切れ","r":"rags to riches（貧乏から大金持ちへ）"},{"n":"1464","w":"log","m":"丸太、記録","p":[["log","丸太"]],"i":"切った木","r":"logbook（航海日誌）、ログイン"},{"n":"1313","w":"pole","m":"棒、極","p":[["pole","棒"]],"i":"長い棒","r":"the North Pole（北極）"},{"n":"1883","w":"bunch","m":"束、房","p":[["bunch","こぶ"]],"i":"まとまった一束","r":"a bunch of ～（たくさんの～）"},{"n":"1529","w":"patch","m":"区画、つぎあて","p":[["patch","布切れ"]],"i":"小さな部分","r":"a vegetable patch（家庭菜園）"}]},{"world":"minecraft","title":"村のくらしと決まり","lab":"名詞いろいろ4","labJa":"テーマ","icon":"theme","en":"The villagers sign a peace {{treaty}} with the pillagers. Alex writes a secret {{code}} to protect the base. In the {{midst}} of a storm, a {{flame}} lights up the night. A villager does a good {{deed}} and saves a child. The farmers stop using {{pesticide}} because it harms bees. The town builds a new {{sewage}} system. A {{vending}} machine sells bread at the station. The village is now a legal {{entity}}. It also starts a program to prevent {{suicide}} and support people who feel alone.","ja":"村人たちは略奪者と平和条約を結ぶ。アレックスは基地を守るための秘密の暗号を書く。嵐のまっただ中で、炎が夜を照らす。ある村人が善い行いをして、子どもを救う。農家はハチに害があるので農薬を使うのをやめる。町は新しい下水のシステムを作る。駅では自動販売機がパンを売っている。村は今では法的な実体（法人）だ。さらに、自殺を防ぎ、孤独を感じている人を支えるプログラムも始める。","ken":"<b>in the midst of ～（～のまっただ中に）</b>は熟語で出る★ vending machine（自動販売機）は日本の名物やな。code は「暗号、規則」で、dress code（服装規定）も大事やで。","words":[{"n":"1476","w":"treaty","m":"条約","p":[["treat","扱う"]],"i":"国どうしで取り決めたこと","r":"peace treaty（平和条約）"},{"n":"1087","w":"code","m":"暗号、規則、コード","p":[["code","法典"]],"i":"決まった記号やルール","r":"dress code（服装規定）"},{"n":"1899","w":"midst","m":"まっただ中","p":[["mid","真ん中"]],"i":"真ん中","r":"in the midst of ～"},{"n":"1469","w":"flame","m":"炎","p":[["flam","燃える"]],"i":"ゆらめく火","r":"flammable（燃えやすい）"},{"n":"1466","w":"deed","m":"行い、証書","p":[["deed","したこと"]],"i":"実際の行動","r":"a good deed（善い行い）"},{"n":"1585","w":"pesticide","m":"殺虫剤、農薬","p":[["pest","害虫"],["cide","殺す"]],"i":"害虫を殺す薬","r":"pest（害虫）"},{"n":"1927","w":"sewage","m":"下水","p":[["sew","排水"]],"i":"使った水","r":"sewer（下水道）"},{"n":"1921","w":"vending","m":"販売の","p":[["vend","売る"]],"i":"売ること","r":"vending machine（自動販売機）"},{"n":"1821","w":"entity","m":"実体、存在","p":[["ent","存在する"]],"i":"ひとつのまとまった存在","r":"legal entity（法人）"},{"n":"1091","w":"suicide","m":"自殺","p":[["sui","自分"],["cide","殺す"]],"i":"自分の命を絶つこと","r":"suicide prevention（自殺予防）"}]},{"world":"pokemon","title":"ポケモンリーグに申しこみ","lab":"ad-","labJa":"～の方へ","icon":"ad","en":"Satoshi wants to {{apply}} for the Pokémon League. Professor Okido {{arranges:arrange}} an {{appointment}} for him. \"Your {{attitude}} is good,\" says the professor. \"But your Pokémon's {{appearance}} doesn't show its power.\" Satoshi {{admits:admit}} that Pikachu is tired. The weather can {{affect}} a battle. Electric types have an {{advantage}} over water types. The league {{accepts:accept}} Satoshi, but it doesn't {{allow}} more than six Pokémon. Satoshi wants to {{achieve}} his dream.","ja":"サトシはポケモンリーグに申しこみたい。オーキド博士が彼のために面会の約束を取りつける。「君の態度はいい」と博士。「でも君のポケモンの見た目は、その力を表していない」。サトシはピカチュウが疲れていることを認める。天気はバトルに影響を与えることがある。でんきタイプはみずタイプに対して有利だ。リーグはサトシを受け入れるけど、7匹以上のポケモンは許していない。サトシは夢を実現したい。","ken":"ad- 第2弾！ ★<b>allow 人 to ～（人が～するのを許す）</b>、<b>apply for ～（～に申しこむ）と apply to ～（～に当てはまる）</b>の区別が大事！ appointment は「（人と会う）約束」で、promise とは違うで。","words":[{"n":"53","w":"apply","m":"申しこむ、当てはまる","p":[["ap","～へ"],["ply","折りたたむ"]],"i":"自分をそこにくっつける","r":"apply for ～ / apply to ～★"},{"n":"119","w":"arrange","m":"手配する、並べる","p":[["ar","～へ"],["range","列"]],"i":"きちんと並べる","r":"arrangement（手配）"},{"n":"204","w":"appointment","m":"（会う）約束、任命","p":[["ap","～へ"],["point","指さす"]],"i":"日時を指定した約束","r":"make an appointment"},{"n":"409","w":"attitude","m":"態度","p":[["apt","合う"]],"i":"心の構え","r":"attitude toward ～"},{"n":"208","w":"appearance","m":"見た目、出現","p":[["ap","～へ"],["pear","見える"]],"i":"目の前に現れること","r":"appear（現れる）"},{"n":"63","w":"admit","m":"認める","p":[["ad","～へ"],["mit","送る"]],"i":"入れてあげる→認める","r":"admit ～ing"},{"n":"341","w":"affect","m":"影響を与える","p":[["af","～へ"],["fect","作用"]],"i":"相手に作用する","r":"effect（名詞）と区別★"},{"n":"416","w":"advantage","m":"有利な点","p":[["ad","～へ"],["vant","前"]],"i":"前にいること","r":"take advantage of ～（～を利用する）"},{"n":"333","w":"accept","m":"受け入れる","p":[["ac","～へ"],["cept","取る"]],"i":"受け取る","r":"acceptance（受け入れ）"},{"n":"12","w":"allow","m":"許す","p":[["al","～へ"],["low","ほめる"]],"i":"いいよと認める","r":"allow 人 to ～"},{"n":"351","w":"achieve","m":"達成する","p":[["a","～へ"],["chieve","頭"]],"i":"頭（てっぺん）まで行く","r":"achievement（達成）"}]},{"world":"pokemon","title":"タケシ、リーダーになる","lab":"ad-","labJa":"～の方へ","icon":"ad","en":"Takeshi {{accompanies:accompany}} Satoshi on his trip. Professor Okido {{appoints:appoint}} Takeshi as team leader. He {{assigns:assign}} tasks to everyone. Kasumi {{attaches:attach}} a badge to her bag. Pikachu {{accumulates:accumulate}} electricity in its cheeks. When it runs, it {{accelerates:accelerate}} quickly. The hotel can {{accommodate}} all their Pokémon. \"Don't worry,\" Takeshi {{assures:assure}} them. Satoshi {{attributes:attribute}} his success to his friends. He {{acknowledges:acknowledge}} their help. Together, they {{accomplish}} their goal.","ja":"タケシはサトシの旅に同行する。オーキド博士はタケシをチームリーダーに任命する。彼はみんなに仕事を割り当てる。カスミはバッジをかばんにくっつける。ピカチュウはほっぺに電気をためる。走るとすぐに加速する。ホテルは彼らのポケモン全部を収容できる。「心配ない」とタケシは二人に請け合う。サトシは自分の成功は友だちのおかげだと考えている。彼は二人の助けを認めている。一緒に、彼らは目標を成しとげる。","ken":"★<b>attribute A to B（AをBのおかげ・せいだと考える）</b>は超頻出！ accompany は「一緒に行く」で、with はつけへん（accompany him）。accommodate は「収容する」、ホテル業界の accommodation（宿泊施設）もこれやで。","words":[{"n":"609","w":"accompany","m":"同行する","p":[["ac","～へ"],["company","仲間"]],"i":"仲間として一緒に行く","r":"accompany with はダメ"},{"n":"665","w":"appoint","m":"任命する、指定する","p":[["ap","～へ"],["point","指さす"]],"i":"「君だ！」と指さす","r":"appointment（任命）"},{"n":"667","w":"assign","m":"割り当てる","p":[["as","～へ"],["sign","しるし"]],"i":"しるしをつけて渡す","r":"assignment（宿題、割り当て）"},{"n":"616","w":"attach","m":"くっつける","p":[["at","～へ"],["tach","くい"]],"i":"くいでとめる","r":"be attached to ～（～に愛着がある）"},{"n":"1347","w":"accumulate","m":"ためる","p":[["ac","～へ"],["cumul","積み重ねる"]],"i":"どんどん積み上げる","r":"accumulation（蓄積）"},{"n":"1371","w":"accelerate","m":"加速する","p":[["ac","～へ"],["celer","速い"]],"i":"どんどん速く","r":"accelerator（アクセル）"},{"n":"1389","w":"accommodate","m":"収容する、適応させる","p":[["ac","～へ"],["commod","ちょうどいい"]],"i":"ちょうど入るようにする","r":"accommodation（宿泊施設）"},{"n":"628","w":"assure","m":"保証する、請け合う","p":[["as","～へ"],["sure","確か"]],"i":"確かだと伝える","r":"assure 人 that ～"},{"n":"657","w":"attribute","m":"～のせいにする、特性","p":[["at","～へ"],["tribute","与える"]],"i":"原因を与える","r":"attribute A to B★"},{"n":"1215","w":"acknowledge","m":"認める","p":[["ac","～へ"],["knowledge","知識"]],"i":"知っていると認める","r":"acknowledgement（謝辞）"},{"n":"863","w":"accomplish","m":"成しとげる","p":[["ac","～へ"],["compl","完全"]],"i":"完全にやり切る","r":"accomplishment（業績）"}]},{"world":"pokemon","title":"オーキド研究所の新人たち","lab":"ad-","labJa":"～の方へ","icon":"ad","en":"Professor Okido {{assembles:assemble}} young trainers in his lab. Many are {{adolescents:adolescent}}. He {{assesses:assess}} each trainer's skills. He {{asserts:assert}} that hard work is the key. He {{advocates:advocate}} kind treatment of Pokémon. Trainers must {{adhere}} to the rules. He {{allocates:allocate}} one Pokémon to each trainer. \"Is the food {{adequate}}?\" he asks. Satoshi's mom {{approves:approve}} of his plan. The professor {{affirms:affirm}} that Satoshi can {{attain}} his goal.","ja":"オーキド博士は研究所に若いトレーナーたちを集める。多くは十代の若者だ。彼はそれぞれのトレーナーの腕前を評価する。努力が鍵だと断言する。ポケモンをやさしく扱うことを提唱する。トレーナーはルールを守らないといけない。博士はそれぞれのトレーナーにポケモンを1匹ずつ割り当てる。「食べ物は十分かね？」と彼は聞く。サトシのママは彼の計画に賛成する。博士はサトシが目標を達成できると断言する。","ken":"★<b>approve of ～（～に賛成する）</b>、<b>adhere to ～（～を守る、～にくっつく）</b>は前置詞とセット！ adolescent（思春期の若者）は、こーちゃんもまさにこれやで笑","words":[{"n":"1206","w":"assemble","m":"集める、組み立てる","p":[["as","～へ"],["semble","一緒に"]],"i":"一か所に集める","r":"assembly（集会、組み立て）"},{"n":"1177","w":"adolescent","m":"思春期の若者","p":[["ad","～へ"],["olesc","育つ"]],"i":"大人へと育っている途中","r":"adolescence（思春期）"},{"n":"1380","w":"assess","m":"評価する","p":[["as","～のそば"],["sess","座る"]],"i":"そばに座って見きわめる","r":"assessment（評価）"},{"n":"914","w":"assert","m":"断言する","p":[["as","～へ"],["sert","つなぐ"]],"i":"自分の意見をつなぎとめる","r":"assertion（主張）"},{"n":"1208","w":"advocate","m":"提唱する、支持者","p":[["ad","～へ"],["voc","呼ぶ"]],"i":"みんなに呼びかける","r":"advocate for ～"},{"n":"1744","w":"adhere","m":"守る、くっつく","p":[["ad","～へ"],["here","くっつく"]],"i":"ぴったりくっつく","r":"adhere to ～"},{"n":"1710","w":"allocate","m":"割り当てる","p":[["al","～へ"],["loc","場所"]],"i":"場所に置いて配る","r":"allocation（配分）"},{"n":"1131","w":"adequate","m":"十分な","p":[["ad","～へ"],["equ","等しい"]],"i":"必要な量と等しい","r":"enough ≒、inadequate（不十分な）"},{"n":"163","w":"approve","m":"賛成する、承認する","p":[["ap","～へ"],["prove","試す"]],"i":"試して良いと認める","r":"approve of ～"},{"n":"1757","w":"affirm","m":"断言する","p":[["af","～へ"],["firm","固い"]],"i":"固く言い切る","r":"affirmative（肯定の）"},{"n":"1418","w":"attain","m":"達成する","p":[["at","～へ"],["tain","さわる"]],"i":"手が届く","r":"achieve ≒"}]},{"world":"pokemon","title":"謎の新ポケモン","lab":"ad-","labJa":"～の方へ","icon":"ad","en":"{{Apparently:apparently}}, a new Pokémon has appeared. It's {{approximately}} two meters tall. Satoshi {{accidentally}} steps on its tail. Oops. The {{advent}} of this Pokémon changes everything. People {{associate}} it with good luck. Scientists need {{accurate}} data. Only trainers with special {{access}} can see it. Bad weather has an {{adverse}} effect on its health. Kasumi {{adores:adore}} it. Satoshi is {{addicted}} to battling it. Wearing proper clothes is {{appropriate}} for the visit. In {{accord}} with the rules, everyone keeps quiet.","ja":"どうやら、新しいポケモンが現れたらしい。高さはおよそ2メートルだ。サトシはうっかりそのしっぽをふんでしまう。おっと。このポケモンの出現がすべてを変える。人々はそれを幸運と結びつける。科学者たちは正確なデータが必要だ。特別な立ち入り許可を持つトレーナーだけがそれを見られる。悪天候はそのポケモンの健康に悪影響をおよぼす。カスミはそのポケモンが大好きだ。サトシはそのポケモンとのバトルに夢中になっている。訪問にはきちんとした服を着るのが適切だ。ルールに従って、みんなは静かにしている。","ken":"★<b>associate A with B（AとBを結びつけて考える）</b>は超頻出！ apparently は「どうやら～らしい」、appear（～らしい）の仲間やで。be addicted to ～（～に依存している）も出る。","words":[{"n":"593","w":"apparently","m":"どうやら～らしい","p":[["ap","～へ"],["par","見える"]],"i":"見たところ","r":"seemingly ≒"},{"n":"597","w":"approximately","m":"およそ","p":[["ap","～へ"],["proxim","近い"]],"i":"近い数","r":"about ≒"},{"n":"599","w":"accidentally","m":"うっかり、偶然","p":[["ac","～へ"],["cid","落ちる"]],"i":"ふいに落ちてきた","r":"by accident ≒"},{"n":"1860","w":"advent","m":"出現、到来","p":[["ad","～へ"],["vent","来る"]],"i":"やって来ること","r":"the advent of the Internet"},{"n":"100","w":"associate","m":"結びつける、仲間","p":[["as","～へ"],["soci","仲間"]],"i":"仲間としてつなげる","r":"associate A with B★"},{"n":"565","w":"accurate","m":"正確な","p":[["ac","～へ"],["cur","注意"]],"i":"注意をはらった","r":"accuracy（正確さ）"},{"n":"251","w":"access","m":"立ち入り、利用（する権利）","p":[["ac","～へ"],["cess","行く"]],"i":"そこへ行けること","r":"have access to ～"},{"n":"1947","w":"adverse","m":"不利な、有害な","p":[["ad","～へ"],["verse","向ける"]],"i":"反対に向かってくる","r":"adverse effect（悪影響）"},{"n":"1763","w":"adore","m":"大好きである","p":[["ad","～へ"],["ore","祈る"]],"i":"あがめるほど好き","r":"adorable（かわいい）"},{"n":"1675","w":"addicted","m":"依存した、夢中の","p":[["ad","～へ"],["dict","言う"]],"i":"言いなりになる","r":"be addicted to ～"},{"n":"548","w":"appropriate","m":"適切な","p":[["ap","～へ"],["propri","自分の"]],"i":"その場にふさわしい","r":"inappropriate（不適切な）"},{"n":"1931","w":"accord","m":"一致、合意","p":[["ac","～へ"],["cord","心"]],"i":"心が合う","r":"in accord with ～（～と一致して）"}]},{"world":"pokemon","title":"ジム戦の準備","lab":"pre- / pro-","labJa":"前に・前へ","icon":"pre","en":"Satoshi {{prepares:prepare}} for the Gym battle. He {{prefers:prefer}} fast Pokémon. In the {{previous}} battle, he lost. Since then, he has made great {{progress}}. Takeshi {{proposes:propose}} a new plan. \"Let's {{prevent}} the enemy from attacking first.\" Professor Okido is working on a big {{project}}. He wants to {{preserve}} rare Pokémon. He also {{produces:produce}} special food for them. Later, the league {{promotes:promote}} Satoshi to the next level.","ja":"サトシはジム戦の準備をする。彼は素早いポケモンのほうが好きだ。前回のバトルでは負けた。それ以来、彼は大きく進歩した。タケシが新しい作戦を提案する。「敵が先に攻撃するのを防ごう」。オーキド博士は大きなプロジェクトに取り組んでいる。めずらしいポケモンを保護したいのだ。ポケモンのために特別なフードも生産している。のちに、リーグはサトシを次のレベルに昇格させる。","ken":"pre-/pro- は<b>「前に・前へ」</b>。ポケモンが進化して前へ進むイメージ！ ★<b>prevent A from ～ing（Aが～するのを防ぐ）</b>、<b>prefer A to B（BよりAが好き）</b>は形ごと覚えよう。than じゃなくて to やで！","words":[{"n":"41","w":"prepare","m":"準備する","p":[["pre","前に"],["pare","整える"]],"i":"本番の前に整える","r":"prepare for ～"},{"n":"34","w":"prefer","m":"～のほうを好む","p":[["pre","前に"],["fer","運ぶ"]],"i":"前へ運んで選ぶ","r":"prefer A to B★"},{"n":"284","w":"previous","m":"前の","p":[["pre","前に"],["vi","道"]],"i":"前に通った道","r":"previously（以前に）"},{"n":"193","w":"progress","m":"進歩","p":[["pro","前へ"],["gress","進む"]],"i":"前へ進む","r":"make progress（進歩する）"},{"n":"373","w":"propose","m":"提案する、プロポーズする","p":[["pro","前に"],["pose","置く"]],"i":"相手の前に置く","r":"proposal（提案）"},{"n":"38","w":"prevent","m":"防ぐ","p":[["pre","前に"],["vent","来る"]],"i":"先回りして立ちふさがる","r":"prevent A from ～ing★"},{"n":"206","w":"project","m":"計画、映し出す","p":[["pro","前に"],["ject","投げる"]],"i":"前に投げる","r":"projector（プロジェクター）"},{"n":"117","w":"preserve","m":"保存する、保護する","p":[["pre","前に"],["serve","守る"]],"i":"前もって守る","r":"preservation（保存）"},{"n":"334","w":"produce","m":"生産する","p":[["pro","前に"],["duce","導く"]],"i":"前に出す","r":"product（製品）、production（生産）"},{"n":"361","w":"promote","m":"昇進させる、促進する","p":[["pro","前へ"],["mote","動かす"]],"i":"前へ動かす","r":"promotion（昇進）"}]},{"world":"pokemon","title":"ニセ医者ロケット団","lab":"pre- / pro-","labJa":"前に・前へ","icon":"pre","en":"Musashi and Kojiro {{pretend}} to be Pokémon doctors. They make a fake {{profile}}. Satoshi {{pursues:pursue}} them. Professor Okido explains the right {{procedure}} for healing. Being a doctor is a serious {{profession}}. The weatherman {{predicts:predict}} rain. \"Let's {{proceed}} to the next town,\" says Takeshi. A {{prompt}} decision is needed. The {{prospect}} of a new badge excites Satoshi. The town's {{prosperity}} depends on Pokémon tourism.","ja":"ムサシとコジロウはポケモンの医者のふりをする。ニセのプロフィールを作る。サトシは二人を追いかける。オーキド博士は回復のための正しい手順を説明する。医者は真剣な職業だ。天気予報士は雨を予測する。「次の町へ進もう」とタケシ。すばやい決断が必要だ。新しいバッジを手に入れる見込みがサトシをわくわくさせる。町の繁栄はポケモン観光にかかっている。","ken":"★<b>pretend to ～（～するふりをする）</b>、<b>proceed to ～（～へ進む）</b>。prompt は「すばやい」と「うながす」の2つ、プロンプト（AIへの指示）もこれ！ prospect は「見込み、見通し」やで。","words":[{"n":"383","w":"pretend","m":"ふりをする","p":[["pre","前に"],["tend","伸ばす"]],"i":"前に見せかけを広げる","r":"pretend to ～"},{"n":"718","w":"profile","m":"人物紹介、横顔","p":[["pro","前に"],["file","線"]],"i":"輪郭線","r":"keep a low profile（目立たないようにする）"},{"n":"611","w":"pursue","m":"追う、追い求める","p":[["pur","前へ"],["sue","ついていく"]],"i":"前へ追いかける","r":"pursuit（追求）"},{"n":"983","w":"procedure","m":"手順","p":[["pro","前へ"],["cede","進む"]],"i":"進め方の順番","r":"procedural（手続きの）"},{"n":"965","w":"profession","m":"（専門的な）職業","p":[["pro","前で"],["fess","言う"]],"i":"人前で宣言する仕事","r":"professional（プロの）"},{"n":"378","w":"predict","m":"予測する","p":[["pre","前に"],["dict","言う"]],"i":"前もって言う","r":"prediction（予測）"},{"n":"601","w":"proceed","m":"進む、続ける","p":[["pro","前へ"],["ceed","行く"]],"i":"前へ進む","r":"proceed to ～"},{"n":"688","w":"prompt","m":"すばやい、うながす","p":[["pro","前へ"],["mpt","取る"]],"i":"すぐに取り出す","r":"promptly（すぐに）"},{"n":"961","w":"prospect","m":"見込み、見通し","p":[["pro","前を"],["spect","見る"]],"i":"前を見わたす","r":"prospective（見込みのある）"},{"n":"970","w":"prosperity","m":"繁栄","p":[["pro","前へ"],["sper","希望"]],"i":"希望どおりに進む","r":"prosper（栄える）"}]},{"world":"pokemon","title":"延期された決勝戦","lab":"pre- / pro-","labJa":"前に・前へ","icon":"pre","en":"The Pokémon League {{postpones:postpone}} the final because of a storm. Many fans {{protest}}. \"Why {{prolong}} the waiting?\" they shout. Joy {{prescribes:prescribe}} medicine for a sick Pokémon. As a {{precaution}}, she keeps it warm. The new champion's {{predecessor}} was Wataru. A big parade {{precedes:precede}} the final match. Satoshi {{presumes:presume}} that he will face Shigeru. The {{premise}} of the league is fair play. In the end, fair play {{prevails:prevail}}.","ja":"ポケモンリーグは嵐のために決勝を延期する。多くのファンが抗議する。「なんで待ち時間を長引かせるんだ？」と彼らは叫ぶ。ジョーイさんは病気のポケモンに薬を処方する。用心として、そのポケモンを温かくしておく。新チャンピオンの前任者はワタルだった。大きなパレードが決勝戦に先立って行われる。サトシはシゲルと戦うことになるだろうと推測する。リーグの前提はフェアプレーだ。最後には、フェアプレーが勝つ。","ken":"★<b>postpone（延期する）＝ put off</b>は言いかえ問題の定番！ predecessor（前任者）⇔ successor（後継者）。prevail は「広く行きわたる、勝つ」で、長文でよく見るで。","words":[{"n":"1423","w":"postpone","m":"延期する","p":[["post","後に"],["pone","置く"]],"i":"後ろに置く","r":"put off ≒★"},{"n":"712","w":"protest","m":"抗議する、抗議","p":[["pro","前で"],["test","証言する"]],"i":"人前で反対を言う","r":"protest against ～"},{"n":"1411","w":"prolong","m":"長引かせる","p":[["pro","前へ"],["long","長い"]],"i":"前へ長くのばす","r":"prolonged（長期の）"},{"n":"1243","w":"prescribe","m":"処方する","p":[["pre","前に"],["scribe","書く"]],"i":"前もって書いて指示","r":"prescription（処方箋）"},{"n":"1882","w":"precaution","m":"用心","p":[["pre","前に"],["caution","注意"]],"i":"前もって注意","r":"as a precaution（用心のため）"},{"n":"1820","w":"predecessor","m":"前任者","p":[["pre","前に"],["decess","去る"]],"i":"前に去った人","r":"successor（後継者）が反対"},{"n":"1271","w":"precede","m":"先立つ","p":[["pre","前に"],["cede","行く"]],"i":"前に行く","r":"preceding（前の）"},{"n":"1229","w":"presume","m":"推測する、仮定する","p":[["pre","前に"],["sume","取る"]],"i":"前もって取っておく考え","r":"presumably（たぶん）"},{"n":"1304","w":"premise","m":"前提","p":[["pre","前に"],["mise","送る"]],"i":"前に置かれた考え","r":"premises（敷地）"},{"n":"1255","w":"prevail","m":"勝つ、広まる","p":[["pre","前に"],["vail","強い"]],"i":"ほかより強い","r":"prevalent（広まっている）"}]},{"world":"pokemon","title":"有望なトレーナー","lab":"pre- / pro-","labJa":"前に・前へ","icon":"pre","en":"Satoshi is a {{promising}} young trainer. His {{proficiency}} in battle is g
