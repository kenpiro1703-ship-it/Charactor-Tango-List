{remarkable}} gold weapon.","ja":"ストームのあと、ぼくらのスクワッドは基地を修理しなければならなかった。木材は大事な資源なので、あとのためにいくらか取っておく。リーダーとして、ぼくには計画を立てる責任がある。ジョンジーが「前の基地は弱かった」と言った。ぼくも彼の気持ちに共感できる。敵はすばやく反応したけど、新しい壁は持ちこたえた。結果として、ぼくらは勝った。報酬は注目すべき金色のブキだった。","ken":"relate は「関係づける」やけど、<b>relate to ～ で「～に共感する」</b>って意味も最近よく出る。as a result（結果として）は長文のつなぎで超大事★","words":[{"n":"134","w":"repair","m":"修理する","p":[["re","もう一度"],["pair","整える"]],"i":"もう一度整え直す","r":"prepare も pare 仲間"},{"n":"441","w":"resource","m":"資源","p":[["re","また"],["source","わき出る"]],"i":"何度もわき出るもの","r":"natural resources（天然資源）"},{"n":"139","w":"reserve","m":"取っておく、予約する","p":[["re","後ろに"],["serve","保つ"]],"i":"後ろにキープしておく","r":"reservation（予約）"},{"n":"427","w":"responsibility","m":"責任","p":[["respond","応える"]],"i":"ちゃんと応える義務","r":"responsible（責任がある）"},{"n":"138","w":"remark","m":"述べる、発言","p":[["re","強め"],["mark","しるし"]],"i":"気づいたことを口に出す","r":"remarkable（注目すべき）"},{"n":"46","w":"relate","m":"関係づける、共感する","p":[["re","後ろへ"],["late","運ぶ"]],"i":"話を結びつける","r":"relate to ～（～に共感する）"},{"n":"391","w":"react","m":"反応する","p":[["re","返す"],["act","動く"]],"i":"動かされて動き返す","r":"reaction（反応）"},{"n":"175","w":"result","m":"結果、結果として生じる","p":[["re","後ろへ"],["sult","跳ぶ"]],"i":"はね返ってきたもの","r":"as a result（結果として）"},{"n":"235","w":"reward","m":"報酬、ほうび","p":[["re","強め"],["ward","見守る"]],"i":"よくやったと見て与える","r":"award と区別"},{"n":"299","w":"remarkable","m":"注目すべき","p":[["remark","気づく"],["able","できる"]],"i":"思わず口に出すほどすごい","r":"notable ≒"}]},{"world":"fortnite","title":"ベテランの引退","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"An old player {{recalls:recall}} the first season. He wants to {{retire}} from the game, but his fans want him to stay. He decides to {{resign}} as team leader but {{retain}} his position as a coach. He {{recommends:recommend}} a new strategy. \"We should {{reform}} our team.\" In the next match, we {{rescue}} a player who lost his base. He is like a {{refugee}} with no home. We help him {{restore}} his base. We try to {{reproduce}} the same design.","ja":"ベテランのプレイヤーが最初のシーズンを思い出す。彼はゲームから引退したいけど、ファンは残ってほしいと思っている。彼はチームリーダーを辞任するけど、コーチの立場は保つことに決める。彼は新しい作戦を勧める。「チームを改革するべきだ」。次の試合で、基地を失ったプレイヤーを救助する。彼は家のない難民のようだ。ぼくらは彼が基地を元に戻すのを手伝う。同じデザインを再現しようとする。","ken":"<b>retire（引退する）と resign（辞任する）</b>の違い★ retire は年齢とかで仕事をやめる、resign は自分から職を辞める。reform は「改革する」で、家のリフォームは英語だと renovate やで！","words":[{"n":"381","w":"recall","m":"思い出す、回収する","p":[["re","もう一度"],["call","呼ぶ"]],"i":"記憶を呼び戻す","r":"リコール（回収）"},{"n":"363","w":"retire","m":"引退する","p":[["re","後ろへ"],["tire","引く"]],"i":"後ろへ引っこむ","r":"retirement（引退）"},{"n":"1203","w":"resign","m":"辞任する","p":[["re","元へ"],["sign","署名"]],"i":"サインしたのを取り消す","r":"resignation（辞任）"},{"n":"878","w":"retain","m":"保つ","p":[["re","後ろで"],["tain","持つ"]],"i":"しっかり持ち続ける","r":"keep ≒"},{"n":"365","w":"recommend","m":"勧める","p":[["re","強め"],["commend","任せる"]],"i":"「これいいよ」と任せる","r":"recommendation（推薦）"},{"n":"959","w":"reform","m":"改革する","p":[["re","もう一度"],["form","形作る"]],"i":"形を作り直す","r":"家のリフォームは renovate"},{"n":"881","w":"rescue","m":"救助する","p":[["re","強め"],["scue","振り落とす"]],"i":"危険から振り離す","r":"rescue team"},{"n":"1086","w":"refugee","m":"難民","p":[["re","後ろへ"],["fug","逃げる"]],"i":"逃げてきた人","r":"refuge（避難所）"},{"n":"925","w":"restore","m":"元に戻す、修復する","p":[["re","もう一度"],["store","立てる"]],"i":"もう一度立て直す","r":"restoration（修復）"},{"n":"1214","w":"reproduce","m":"再現する、繁殖する","p":[["re","もう一度"],["produce","作る"]],"i":"もう一度作る","r":"reproduction（繁殖）"}]},{"world":"fortnite","title":"新メンバー募集","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"Our squad needs to {{recruit}} a new member. We hold a {{reception}} to meet players. One girl wants to join, but she can't {{restrain}} her anger when she loses. We ask her to {{refrain}} from shouting. In a match, she tells us to {{retreat}} at the right time. Her skill {{renders:render}} our team stronger. \"Don't worry,\" she {{reassures:reassure}} us. We {{revise}} our plan together and {{refine}} our building. Even during the economic {{recession}}, the game stays popular.","ja":"ぼくらのスクワッドは新しいメンバーを募集する必要がある。プレイヤーに会うために歓迎会を開く。ある女の子が入りたがっているけど、負けると怒りを抑えられない。叫ぶのを控えるようお願いする。試合で、彼女はちょうどいいタイミングで退却しようと言う。彼女の腕前はぼくらのチームを強くする。「心配しないで」と彼女はぼくらを安心させる。一緒に作戦を見直し、建築を磨き上げる。経済の不景気の間でも、このゲームは人気のままだ。","ken":"★<b>render＝make（～にする）</b>。render 人 speechless（人を言葉を失わせる）みたいに使う。<b>refrain from ～ing（～するのを控える）</b>も熟語で出るで！","words":[{"n":"1230","w":"recruit","m":"募集する、新人","p":[["re","もう一度"],["cruit","育つ"]],"i":"新しく育てる人を集める","r":"リクルート"},{"n":"1308","w":"reception","m":"歓迎会、受付、受け取ること","p":[["re","後ろに"],["cept","取る"]],"i":"受け取ること","r":"receive（受け取る）"},{"n":"1377","w":"restrain","m":"抑える","p":[["re","後ろへ"],["strain","しばる"]],"i":"後ろへ引っぱってしばる","r":"restraint（抑制）"},{"n":"1346","w":"refrain","m":"控える","p":[["re","後ろへ"],["frain","手綱"]],"i":"手綱を引いて止める","r":"refrain from ～ing"},{"n":"1274","w":"retreat","m":"退却する","p":[["re","後ろへ"],["treat","引く"]],"i":"後ろへ引き下がる","r":"advance（前進）が反対"},{"n":"1272","w":"render","m":"～にする、与える","p":[["re","返す"],["der","与える"]],"i":"お返しを与える","r":"render 人 ～（人を～にする）"},{"n":"1375","w":"reassure","m":"安心させる","p":[["re","もう一度"],["assure","保証する"]],"i":"もう一度大丈夫と言う","r":"reassurance（安心）"},{"n":"1350","w":"revise","m":"見直す、改訂する","p":[["re","もう一度"],["vise","見る"]],"i":"もう一度見直す","r":"revision（改訂）"},{"n":"1269","w":"refine","m":"磨き上げる、精製する","p":[["re","もう一度"],["fine","きれいな"]],"i":"さらにきれいにする","r":"refined（洗練された）"},{"n":"1312","w":"recession","m":"不景気","p":[["re","後ろへ"],["cess","行く"]],"i":"経済が後退する","r":"depression（大不況）"}]},{"world":"fortnite","title":"ケンカと仲直り","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"Jonesy {{resents:resent}} his teammate for leaving him in the storm. They stop talking. One day, a {{rebel}} group attacks. As a last {{resort}}, they work together. Jonesy {{revives:revive}} his teammate and {{reinforces:reinforce}} the walls. They {{retrieve}} their lost weapons. After the battle, they {{reconcile}}. Jonesy {{recites:recite}} their old team motto. He has a happy {{recollection}} of their first win. They {{resume}} playing together.","ja":"ジョンジーは、ストームの中に置いていかれたことでチームメイトに腹を立てている。二人は口をきかなくなる。ある日、反逆グループが攻めてくる。最後の手段として、二人は協力する。ジョンジーはチームメイトを復活させて、壁を補強する。二人はなくしたブキを取り戻す。戦いのあと、二人は仲直りする。ジョンジーはチームの昔のモットーを暗唱する。初勝利の幸せな思い出がある。二人はまた一緒にプレイを再開する。","ken":"<b>as a last resort（最後の手段として）</b>は熟語で出るで！ resort は「リゾート地」もあるけど、「頼るもの」の意味が大事。resent（腹を立てる）は re + sent（感じる）で、何度も思い出してムカムカするイメージ。","words":[{"n":"1378","w":"resent","m":"腹を立てる","p":[["re","何度も"],["sent","感じる"]],"i":"思い出してはムカムカ","r":"resentment（恨み）"},{"n":"1581","w":"rebel","m":"反逆者、反抗する","p":[["re","もう一度"],["bel","戦う"]],"i":"もう一度戦いをいどむ","r":"rebellion（反乱）"},{"n":"676","w":"resort","m":"手段、リゾート地、頼る","p":[["re","何度も"],["sort","出かける"]],"i":"何度も行く場所、頼る先","r":"as a last resort（最後の手段として）"},{"n":"1392","w":"revive","m":"生き返らせる、復活する","p":[["re","もう一度"],["vive","生きる"]],"i":"もう一度生きる","r":"revival（復活）"},{"n":"1436","w":"reinforce","m":"強化する","p":[["re","もう一度"],["in","中に"],["force","力"]],"i":"もう一度力を入れる","r":"reinforcement（強化）"},{"n":"1782","w":"retrieve","m":"取り戻す","p":[["re","もう一度"],["trieve","見つける"]],"i":"見つけて取り返す","r":"retrieval（回収）"},{"n":"1725","w":"reconcile","m":"仲直りさせる、調和させる","p":[["re","もう一度"],["concil","集める"]],"i":"また一緒に集まる","r":"reconciliation（和解）"},{"n":"1776","w":"recite","m":"暗唱する","p":[["re","もう一度"],["cite","呼ぶ"]],"i":"覚えたことを声に出す","r":"recital（リサイタル）"},{"n":"1902","w":"recollection","m":"思い出、記憶","p":[["re","もう一度"],["collect","集める"]],"i":"記憶をかき集める","r":"recollect（思い出す）"},{"n":"1387","w":"resume","m":"再開する","p":[["re","もう一度"],["sume","取る"]],"i":"もう一度取りかかる","r":"履歴書の résumé とは発音が違う"}]},{"world":"fortnite","title":"有名プレイヤーの復讐","lab":"re-","labJa":"後ろへ・もう一度","icon":"re","en":"A {{renowned}} player wants {{revenge}} after losing to us. He {{registers:register}} for the next tournament. We {{review}} his old matches to find {{relevant}} information. He always hides in {{remote}} areas. \"We can {{resist}} his attacks,\" says Jonesy. We {{restrict}} his moves by building walls. When he tries to {{reverse}} the situation, we stay calm. In the end, we {{resolve}} the problem and win again.","ja":"有名なプレイヤーが、ぼくらに負けたあとで復讐をねらっている。彼は次の大会に登録する。ぼくらは関連する情報を見つけるために彼の昔の試合を見直す。彼はいつも人里離れたエリアに隠れている。「あいつの攻撃には抵抗できる」とジョンジー。ぼくらは壁を建てて彼の動きを制限する。彼が状況を逆転させようとしても、ぼくらは冷静なまま。最後には問題を解決して、また勝つ。","ken":"resolve は「解決する」と「決心する」の2つ！ New Year's resolution（新年の抱負）って言うやろ？ relevant（関連のある）の反対は irrelevant。","words":[{"n":"1943","w":"renowned","m":"有名な","p":[["re","何度も"],["nown","名前"]],"i":"名前が何度も呼ばれる","r":"famous ≒"},{"n":"1854","w":"revenge","m":"復讐","p":[["re","返す"],["venge","罰する"]],"i":"やられたらやり返す","r":"take revenge on ～"},{"n":"654","w":"register","m":"登録する","p":[["re","後ろへ"],["gister","運ぶ"]],"i":"記録として運びこむ","r":"レジ（cash register）"},{"n":"741","w":"review","m":"見直す、批評","p":[["re","もう一度"],["view","見る"]],"i":"もう一度見る","r":"レビュー"},{"n":"827","w":"relevant","m":"関連のある","p":[["re","強め"],["lev","上げる"]],"i":"話に関係して持ち上がる","r":"irrelevant（無関係な）"},{"n":"1127","w":"remote","m":"遠く離れた","p":[["re","後ろへ"],["mote","動かす"]],"i":"遠くへ動かされた","r":"remote control（リモコン）"},{"n":"608","w":"resist","m":"抵抗する","p":[["re","反対に"],["sist","立つ"]],"i":"向かって立ちはだかる","r":"resistance（抵抗）"},{"n":"618","w":"restrict","m":"制限する","p":[["re","後ろへ"],["strict","しばる"]],"i":"ギュッとしばって制限","r":"restriction（制限）"},{"n":"617","w":"reverse","m":"逆にする","p":[["re","後ろへ"],["verse","向ける"]],"i":"向きを反対にする","r":"in reverse（逆に）"},{"n":"660","w":"resolve","m":"解決する、決心する","p":[["re","強め"],["solve","解く"]],"i":"ほどいて解決","r":"resolution（決心）"}]},{"world":"fortnite","title":"砂漠のデパート","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"The Battle Bus was {{delayed:delay}} because of the storm. I landed in a {{desert}} area. A building there was {{destroyed:destroy}}. I found a {{department}} store and went inside. An enemy {{disturbed:disturb}} my search. I can't {{describe}} how scared I was. I {{declined:decline}} to fight and hid. My plan {{depends:depend}} on my squad. They {{delivered:deliver}} supplies to me. Later, we {{discussed:discuss}} what happened.","ja":"ストームのせいでバトルバスが遅れた。ぼくは砂漠エリアに着地した。そこの建物は破壊されていた。デパートを見つけて中に入った。敵がぼくの探索を邪魔した。どれだけこわかったか言葉で説明できない。ぼくは戦うのを断って隠れた。ぼくの作戦はスクワッド次第だ。仲間がぼくに補給品を届けてくれた。あとで、何があったかを話し合った。","ken":"dis-/de- は<b>「離れる・下へ・否定」</b>。破壊系がそろってるフォートナイトにぴったり。★<b>discuss は他動詞</b>やから discuss about はダメ！ desert（砂漠）と dessert（デザート）のスペル違いも出る。","words":[{"n":"133","w":"delay","m":"遅らせる、遅れ","p":[["de","離れて"],["lay","置く"]],"i":"後ろへ置いて遅らせる","r":"without delay（すぐに）"},{"n":"238","w":"desert","m":"砂漠、見捨てる","p":[["de","離れて"],["sert","つなぐ"]],"i":"つながりを切って放置","r":"dessert（デザート）とスペル注意"},{"n":"52","w":"destroy","m":"破壊する","p":[["de","下へ"],["stroy","建てる"]],"i":"建てたものを下へくずす","r":"destruction（破壊）"},{"n":"219","w":"department","m":"部門、売り場","p":[["de","離れて"],["part","分ける"]],"i":"分けられた部分","r":"department store（デパート）"},{"n":"120","w":"disturb","m":"邪魔する","p":[["dis","バラバラ"],["turb","かき乱す"]],"i":"かき乱してバラバラに","r":"Do not disturb（起こさないで）"},{"n":"37","w":"describe","m":"説明する、描写する","p":[["de","下に"],["scribe","書く"]],"i":"書き下ろして説明","r":"description（描写）"},{"n":"84","w":"decline","m":"断る、減少する","p":[["de","下へ"],["cline","傾く"]],"i":"下に傾く","r":"★「減少する」も大事"},{"n":"22","w":"depend","m":"頼る、～次第である","p":[["de","下に"],["pend","ぶら下がる"]],"i":"下にぶら下がる","r":"depend on ～"},{"n":"146","w":"deliver","m":"配達する、（演説を）する","p":[["de","離れて"],["liver","自由にする"]],"i":"手から離して届ける","r":"delivery（配達）"},{"n":"345","w":"discuss","m":"話し合う","p":[["dis","バラバラ"],["cuss","ふる"]],"i":"意見をふり分けて検討","r":"discuss about はダメ★"}]},{"world":"fortnite","title":"丘の上の敵","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"The storm {{deprived:deprive}} us of half our shields. Our radar {{detected:detect}} enemies on the hill. I {{determined:determine}} to win. Jonesy {{divided:divide}} the team into two groups. Our opinions {{differed:differ}}, but we finally agreed. We {{descended:descend}} the hill quietly. Jonesy {{demonstrated:demonstrate}} a new trick. Losing the last game had {{depressed:depress}} me, but I {{dismissed:dismiss}} the bad thoughts. I {{devote}} all my free time to this game.","ja":"ストームでシールドの半分を奪われた。レーダーが丘の上に敵を探知した。ぼくは勝つと決心した。ジョンジーはチームを2つのグループに分けた。意見は異なったけど、最後は合意した。ぼくらは静かに丘を下った。ジョンジーが新しい技を実演してみせた。前の試合に負けて落ちこんでいたけど、悪い考えは捨て去った。ぼくは自由な時間を全部このゲームにささげている。","ken":"★<b>deprive 人 of ～（人から～を奪う）</b>は rob と同じ形で超頻出！ devote は devote oneself to ～（～に身をささげる）。to の後ろは名詞か ～ing やで。","words":[{"n":"652","w":"deprive","m":"奪う","p":[["de","完全に"],["prive","取り去る"]],"i":"すっかり取り上げる","r":"deprive 人 of ～★"},{"n":"690","w":"detect","m":"探知する、見つける","p":[["de","外す"],["tect","おおう"]],"i":"おおいを外して見つける","r":"detective（探偵）"},{"n":"342","w":"determine","m":"決心する、決定する","p":[["de","完全に"],["termine","境界"]],"i":"境界線をはっきり決める","r":"be determined to ～"},{"n":"355","w":"divide","m":"分ける","p":[["di","離れて"],["vide","分ける"]],"i":"バラバラに分ける","r":"division（分割）"},{"n":"357","w":"differ","m":"異なる","p":[["dif","離れて"],["fer","運ぶ"]],"i":"別々の方へ運ぶ","r":"differ from ～"},{"n":"677","w":"descend","m":"下る","p":[["de","下へ"],["scend","登る"]],"i":"下に向かって行く","r":"ascend（登る）が反対"},{"n":"612","w":"demonstrate","m":"実演する、証明する","p":[["de","完全に"],["monstr","示す"]],"i":"はっきり見せる","r":"デモ（demonstration）"},{"n":"630","w":"depress","m":"落ちこませる","p":[["de","下へ"],["press","押す"]],"i":"気持ちを下に押しつける","r":"depression（うつ、不況）"},{"n":"641","w":"dismiss","m":"退ける、解雇する","p":[["dis","離れて"],["miss","送る"]],"i":"遠くへ送り出す","r":"fire ≒（解雇する）"},{"n":"683","w":"devote","m":"ささげる","p":[["de","完全に"],["vote","誓う"]],"i":"全部をささげると誓う","r":"devote oneself to ～"}]},{"world":"fortnite","title":"ニセの救難信号","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"The safe zone {{diminishes:diminish}} every minute. One player sends a {{distress}} signal. It's a trick to {{deceive}} us. We {{defend}} our position. Jonesy {{distributes:distribute}} ammo to everyone. \"First, {{define}} your role,\" he says. I can {{distinguish}} friends from enemies by their skins. Our power {{derives:derive}} from teamwork. We {{defeat}} the last team, and Jonesy {{declares:declare}} victory.","ja":"安全地帯は1分ごとに小さくなる。あるプレイヤーが救難信号を送ってくる。それはぼくらをだますワナだ。ぼくらは自分の位置を守る。ジョンジーが弾薬をみんなに配る。「まず、自分の役割をはっきりさせろ」と彼。ぼくはスキンで味方と敵を見分けられる。ぼくらの力はチームワークから生まれている。最後のチームを倒して、ジョンジーが勝利を宣言する。","ken":"★<b>distinguish A from B（AとBを区別する）</b>と<b>derive from ～（～に由来する）</b>は両方とも前置詞までセット！ deceive は「だます」、名詞は deception やで。","words":[{"n":"696","w":"diminish","m":"小さくなる、減らす","p":[["di","強め"],["mini","小さい"]],"i":"どんどん小さくなる","r":"decrease ≒"},{"n":"771","w":"distress","m":"苦痛、困っている状態","p":[["di","離れて"],["stress","引っぱる"]],"i":"引き裂かれるような苦しさ","r":"distress signal（救難信号）"},{"n":"884","w":"deceive","m":"だます","p":[["de","離れて"],["ceive","取る"]],"i":"うまく取り上げてだます","r":"deception（だますこと）"},{"n":"872","w":"defend","m":"守る","p":[["de","離れて"],["fend","打つ"]],"i":"攻撃を打ち払う","r":"defense（防御）"},{"n":"890","w":"distribute","m":"配る","p":[["dis","バラバラ"],["tribute","与える"]],"i":"あちこちに与える","r":"distribution（分配）"},{"n":"883","w":"define","m":"定義する、明確にする","p":[["de","完全に"],["fine","限界"]],"i":"境界をきっちり決める","r":"definition（定義）"},{"n":"859","w":"distinguish","m":"区別する","p":[["di","離れて"],["sting","突く"]],"i":"突いて分ける","r":"distinguish A from B"},{"n":"908","w":"derive","m":"由来する、引き出す","p":[["de","離れて"],["rive","川"]],"i":"川から水を引く","r":"derive from ～（～に由来する）"},{"n":"857","w":"defeat","m":"負かす、敗北","p":[["de","離れて"],["feat","する"]],"i":"相手の行いをくずす","r":"victory が反対"},{"n":"853","w":"declare","m":"宣言する","p":[["de","完全に"],["clare","明らかな"]],"i":"はっきり言い切る","r":"declaration（宣言）"}]},{"world":"fortnite","title":"出発前の言い争い","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"Before {{departure}}, our squad has a {{dispute}}. Jonesy says my weapon has a {{defect}}. \"{{Discard:discard}} it,\" he says. I feel {{detached}} from the team. He seems to {{despise}} my choices. Then a loud noise {{distracts:distract}} us. After that, Jonesy {{discloses:disclose}} a secret: he has a {{deficiency}} in building skills. I laugh. \"You {{deserve}} a break,\" I say.","ja":"出発の前、ぼくらのスクワッドは言い争いをする。ジョンジーはぼくのブキに欠陥があると言う。「捨てろ」と彼。ぼくはチームから切り離された気分になる。彼はぼくの選択を軽べつしているみたいだ。そのとき、大きな音がぼくらの気をそらす。そのあと、ジョンジーが秘密を打ち明ける。彼は建築の腕が足りていないのだ。ぼくは笑う。「お前は休むに値するよ」と言う。","ken":"<b>deserve（～に値する）</b>は「それにふさわしい」。You deserve it! ＝ 当然の結果やで！（ほめるときも、ざまあみろのときも笑）。despise は look down on と同じ「見下す」。","words":[{"n":"1565","w":"departure","m":"出発","p":[["de","離れて"],["part","分かれる"]],"i":"ここから離れる","r":"arrival（到着）が反対"},{"n":"952","w":"dispute","m":"言い争い、論争","p":[["dis","バラバラ"],["pute","考える"]],"i":"考えがバラバラでぶつかる","r":"argument ≒"},{"n":"1544","w":"defect","m":"欠陥","p":[["de","離れて"],["fect","作る"]],"i":"作りそこない","r":"defective（欠陥のある）"},{"n":"1398","w":"discard","m":"捨てる","p":[["dis","離れて"],["card","カード"]],"i":"カードを捨てる","r":"throw away ≒"},{"n":"1972","w":"detached","m":"切り離された、無関心な","p":[["de","離れて"],["tach","くっつく"]],"i":"くっついていたのが離れる","r":"attached（くっついた）が反対"},{"n":"1430","w":"despise","m":"軽べつする","p":[["de","下を"],["spise","見る"]],"i":"上から下を見る","r":"look down on ～ ≒"},{"n":"1406","w":"distract","m":"気をそらす","p":[["dis","離れて"],["tract","引く"]],"i":"注意を別の方へ引っぱる","r":"distraction（気を散らすもの）"},{"n":"1407","w":"disclose","m":"打ち明ける、公開する","p":[["dis","反対"],["close","閉じる"]],"i":"閉じていたものを開ける","r":"disclosure（公開）"},{"n":"1795","w":"deficiency","m":"不足、欠陥","p":[["de","離れて"],["fic","作る"]],"i":"作りが足りない","r":"vitamin deficiency（ビタミン不足）"},{"n":"926","w":"deserve","m":"～に値する","p":[["de","完全に"],["serve","仕える"]],"i":"ちゃんと仕えたからもらって当然","r":"deserve to ～"}]},{"world":"fortnite","title":"酸性雨のストーム","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"A new kind of storm {{disrupts:disrupt}} the whole map. It {{devastates:devastate}} the city, and players are {{displaced:displace}} from their homes. The weather {{deteriorates:deteriorate}} fast. Some players {{disregard}} the warnings. The game {{designates:designate}} a safe area. An enemy {{disguises:disguise}} himself as a bush. The acid rain {{dissolves:dissolve}} metal and {{degrades:degrade}} our walls. We need to {{dispose}} of the broken items.","ja":"新しい種類のストームがマップ全体を混乱させる。それは街を壊滅させて、プレイヤーたちは家から追い出される。天気は急速に悪化する。警告を無視するプレイヤーもいる。ゲームが安全なエリアを指定する。敵がしげみに変装している。酸性雨が金属を溶かし、壁を劣化させる。壊れたアイテムを処分しないといけない。","ken":"★<b>dispose of ～（～を処分する）</b>は of とセット！ deteriorate（悪化する）は get worse の言いかえで長文に出るで。","words":[{"n":"1395","w":"disrupt","m":"混乱させる、中断させる","p":[["dis","バラバラ"],["rupt","破る"]],"i":"破ってバラバラに","r":"disruption（混乱）"},{"n":"1239","w":"devastate","m":"壊滅させる","p":[["de","完全に"],["vast","荒れた"]],"i":"完全に荒れ地にする","r":"devastating（壊滅的な）"},{"n":"1233","w":"displace","m":"追い出す、取って代わる","p":[["dis","離れて"],["place","場所"]],"i":"今の場所からどかす","r":"displaced people（避難民）"},{"n":"1749","w":"deteriorate","m":"悪化する","p":[["deterior","より悪い"]],"i":"どんどん悪くなる","r":"get worse ≒"},{"n":"1434","w":"disregard","m":"無視する","p":[["dis","否定"],["regard","気にかける"]],"i":"気にかけない","r":"ignore ≒"},{"n":"1227","w":"designate","m":"指定する","p":[["de","はっきり"],["sign","しるし"]],"i":"しるしをつけて決める","r":"designated（指定された）"},{"n":"1370","w":"disguise","m":"変装する、変装","p":[["dis","離れて"],["guise","姿"]],"i":"いつもの姿から離れる","r":"in disguise（変装して）"},{"n":"1223","w":"dissolve","m":"溶かす、解散する","p":[["dis","バラバラ"],["solve","ゆるめる"]],"i":"ほどけて溶ける","r":"dissolve the Diet（国会を解散）"},{"n":"1715","w":"degrade","m":"劣化させる、品位を下げる","p":[["de","下へ"],["grade","段階"]],"i":"段階を下げる","r":"degradation（劣化）"},{"n":"1345","w":"dispose","m":"処分する","p":[["dis","離れて"],["pose","置く"]],"i":"遠くへ置く","r":"dispose of ～★"}]},{"world":"fortnite","title":"ストームに逆らう男","lab":"dis- / de-","labJa":"離れて・下へ","icon":"dis","en":"{{Despite:despite}} the danger, a player {{defies:defy}} the storm and stays outside. He {{deliberately}} {{diverts:divert}} the enemies' attention. A rocket explodes, and {{debris}} falls everywhere. The screen {{distorts:distort}} for a second. I can't {{discern}} who is who. Our team has a great {{diversity}} of skills, so we survive. After the match, I {{delete}} the bad replay. Then the game {{discharges:discharge}} the last players from the island.","ja":"危険にもかかわらず、あるプレイヤーがストームに逆らって外にいる。彼はわざと敵の注意をそらす。ロケットが爆発して、がれきがあちこちに落ちる。画面が一瞬ゆがむ。誰が誰だか見分けられない。ぼくらのチームはいろんなスキルがそろっているので、生き残る。試合のあと、ぼくはダメなリプレイを削除する。そしてゲームは最後のプレイヤーたちを島から解放する。","ken":"★<b>despite ＝ in spite of（～にもかかわらず）</b>。despite of はダメ！ 並べかえ問題で頻出。deliberately は「わざと」、on purpose と同じやで。","words":[{"n":"600","w":"despite","m":"～にもかかわらず","p":[["de","下に"],["spite","見る"]],"i":"見下してでも","r":"★despite of はまちがい"},{"n":"1722","w":"defy","m":"逆らう","p":[["de","離れて"],["fy","信じる"]],"i":"信頼をやめて逆らう","r":"defiance（反抗）"},{"n":"850","w":"deliberately","m":"わざと、慎重に","p":[["de","完全に"],["liber","はかる"]],"i":"しっかりはかってから","r":"on purpose ≒"},{"n":"1754","w":"divert","m":"そらす","p":[["di","離れて"],["vert","向ける"]],"i":"別の方へ向ける","r":"diversion（気晴らし）"},{"n":"1454","w":"debris","m":"がれき","p":[["de","離れて"],["bris","壊す"]],"i":"壊れて散らばったもの","r":"s は読まない（デブリ）"},{"n":"1770","w":"distort","m":"ゆがめる","p":[["dis","バラバラ"],["tort","ねじる"]],"i":"ねじって形をゆがめる","r":"distortion（ゆがみ）"},{"n":"1714","w":"discern","m":"見分ける","p":[["dis","離れて"],["cern","ふるいにかける"]],"i":"ふるいで分ける","r":"distinguish ≒"},{"n":"1060","w":"diversity","m":"多様性","p":[["di","離れて"],["vers","向ける"]],"i":"いろんな方向を向いている","r":"diverse（多様な）"},{"n":"1752","w":"delete","m":"削除する","p":[["delete","消す"]],"i":"データを消す","r":"deletion（削除）"},{"n":"1780","w":"discharge","m":"解放する、放出する","p":[["dis","取り除く"],["charge","荷"]],"i":"荷物を下ろす","r":"退院させる、にも使う"}]},{"world":"fortnite","title":"塔をうばえ","lab":"ob-","labJa":"向かって・じゃまする","icon":"ob","en":"Our {{objective}} is to {{occupy}} the tower. It's {{obvious}} that the enemy is waiting there. Jonesy says, \"{{Obey:obey}} my orders.\" We {{obtain}} a map from a chest. On this rare {{occasion}}, we have no shields. A big {{obstacle}} blocks the road. An idea {{occurs:occur}} to me: we can climb over it. The fog makes everything {{obscure}}. I feel {{obliged:oblige}} to protect my team.","ja":"ぼくらの目的は塔を占領することだ。敵がそこで待ちかまえているのは明らかだ。ジョンジーが言う。「オレの命令に従え」。ぼくらは宝箱から地図を手に入れる。今回はめずらしい機会で、シールドがひとつもない。大きな障害物が道をふさいでいる。ある考えがぼくの頭に浮かぶ。登って越えればいい。霧ですべてがぼんやりしている。ぼくはチームを守らなきゃいけないと感じる。","ken":"ob- は<b>「～に向かって・反対に・じゃまする」</b>。obstacle は「前に立ちはだかる」障害物。★<b>An idea occurred to me.（考えが浮かんだ）</b>は人が主語じゃないから注意！","words":[{"n":"728","w":"objective","m":"目的、客観的な","p":[["ob","～に向かって"],["ject","投げる"]],"i":"目がけて投げる目標","r":"subjective（主観的な）が反対"},{"n":"150","w":"occupy","m":"占領する、占める","p":[["oc","～に向かって"],["cupy","つかむ"]],"i":"場所をつかみ取る","r":"occupation（職業、占領）"},{"n":"269","w":"obvious","m":"明らかな","p":[["ob","前に"],["via","道"]],"i":"道の前にあってすぐ見える","r":"clear ≒"},{"n":"606","w":"obey","m":"従う","p":[["ob","～に"],["ey","聞く"]],"i":"言うことを聞く","r":"obedient（従順な）"},{"n":"354","w":"obtain","m":"手に入れる","p":[["ob","～に"],["tain","持つ"]],"i":"しっかり持つ","r":"get ≒"},{"n":"217","w":"occasion","m":"機会、場合","p":[["oc","～に向かって"],["cas","落ちる"]],"i":"ちょうど落ちてきたタイミング","r":"on occasion（ときどき）"},{"n":"1002","w":"obstacle","m":"障害物","p":[["ob","前に"],["sta","立つ"]],"i":"前に立ちふさがる","r":"barrier ≒"},{"n":"862","w":"occur","m":"起こる、思い浮かぶ","p":[["oc","～に向かって"],["cur","走る"]],"i":"走ってきて起こる","r":"occur to 人（人に思い浮かぶ）★"},{"n":"1328","w":"obscure","m":"ぼんやりした、無名の","p":[["ob","上に"],["scure","おおう"]],"i":"おおわれて見えない","r":"clear が反対"},{"n":"644","w":"oblige","m":"義務を負わせる","p":[["ob","～に"],["lige","しばる"]],"i":"義務でしばる","r":"be obliged to ～（～せざるをえない）"}]},{"world":"fortnite","title":"いじめっ子チーム","lab":"ob- / ab-","labJa":"反対に・離れて","icon":"ob","en":"A strong team {{oppresses:oppress}} new players. They {{abuse}} their power. Our squad {{opposes:oppose}} them. This is our {{opportunity}}. Our {{opponent}} {{offers:offer}} a deal: \"{{Abandon:abandon}} your base, and we'll let you go.\" We refuse. Our shields {{absorb}} their attacks, and in the end, we win. Later, the game decides to {{abolish}} the unfair rule. The {{offending}} players get a warning.","ja":"ある強いチームが新しいプレイヤーたちを抑圧している。彼らは力を乱用している。ぼくらのスクワッドは彼らに反対する。これはぼくらのチャンスだ。相手が取引を持ちかけてくる。「基地を捨てれば、見逃してやる」。ぼくらは断る。シールドが彼らの攻撃を吸収して、最後にはぼくらが勝つ。のちに、ゲームはその不公平なルールを廃止することに決める。違反したプレイヤーたちは警告を受ける。","ken":"op- も ob- が変身した形（次が p やから）。★<b>be opposed to ～（～に反対している）</b>。opportunity は「港（port）に向かう追い風」＝チャンスって語源、かっこいいやろ？","words":[{"n":"1244","w":"oppress","m":"抑圧する","p":[["op","～に対して"],["press","押す"]],"i":"上から押しつぶす","r":"oppression（抑圧）"},{"n":"791","w":"abuse","m":"乱用する、虐待","p":[["ab","離れて"],["use","使う"]],"i":"正しい使い方から外れる","r":"drug abuse（薬物乱用）"},{"n":"368","w":"oppose","m":"反対する","p":[["op","反対に"],["pose","置く"]],"i":"反対側に置く","r":"be opposed to ～"},{"n":"412","w":"opportunity","m":"機会","p":[["op","～に向かって"],["port","港"]],"i":"港へ向かう追い風","r":"chance ≒"},{"n":"1080","w":"opponent","m":"相手、敵","p":[["op","反対に"],["pon","置く"]],"i":"反対側にいる人","r":"rival ≒"},{"n":"14","w":"offer","m":"申し出る、提供する","p":[["of","～に向かって"],["fer","運ぶ"]],"i":"相手の方へ運ぶ","r":"offer to ～"},{"n":"123","w":"abandon","m":"捨てる、あきらめる","p":[["a","～に"],["bandon","支配"]],"i":"相手の支配にまかせる","r":"give up ≒"},{"n":"384","w":"absorb","m":"吸収する","p":[["ab","離れて"],["sorb","吸う"]],"i":"吸いこんで取る","r":"be absorbed in ～（～に夢中）"},{"n":"1416","w":"abolish","m":"廃止する","p":[["ab","離れて"],["olish","育つ"]],"i":"育つのをやめさせる","r":"abolition（廃止）"},{"n":"1421","w":"offending","m":"違反した、不快にさせる","p":[["of","～に対して"],["fend","打つ"]],"i":"相手を打つ","r":"offend（怒らせる）"}]},{"world":"fortnite","title":"戦場イベント","lab":"戦い","labJa":"テーマ","icon":"theme","en":"In a special event, the island turns into a battlefield. A {{troop}} of soldiers lands on the beach. The {{navy}} sends ships, and the {{military}} sends tanks. I pick up a {{weapon}}: a golden {{sword}}. My {{ally}}, Jonesy, carries a {{bomb}}. A {{bullet}} flies past my head. \"The {{enemy}} is behind the rocks!\" Jonesy shouts. We fight like true {{warriors:warrior}}.","ja":"特別イベントで、島は戦場に変わる。兵士の一団が浜辺に上陸する。海軍が船を送り、軍隊が戦車を送る。ぼくはブキを拾う。金色の剣だ。味方のジョンジーは爆弾を持っている。弾丸がぼくの頭のそばを飛んでいく。「敵は岩の後ろだ！」とジョンジーが叫ぶ。ぼくらは本物の戦士のように戦う。","ken":"戦い系の名詞！ <b>bomb の最後の b、sword の w は読まない</b>（ボム、ソード）。ally（味方）と enemy（敵）は反対語セットで。troop はふつう troops と複数形で「軍隊」やで。","words":[{"n":"1533","w":"troop","m":"（軍の）一団、部隊","p":[["troop","群れ"]],"i":"兵士の群れ","r":"ふつう troops で「軍隊」"},{"n":"1523","w":"navy","m":"海軍","p":[["nav","船"]],"i":"船の軍隊","r":"navigate（航海する）"},{"n":"577","w":"military","m":"軍の、軍隊","p":[["milit","兵士"]],"i":"兵士たちの","r":"army ≒"},{"n":"494","w":"weapon","m":"武器","p":[["weapon","武器"]],"i":"戦うための道具","r":"nuclear weapons（核兵器）"},{"n":"1495","w":"sword","m":"剣","p":[["sword","剣"]],"i":"ズバッと斬る刀","r":"w は読まない（ソード）"},{"n":"1301","w":"ally","m":"味方、同盟国","p":[["al","～に"],["ly","結ぶ"]],"i":"結ばれた仲間","r":"alliance（同盟）"},{"n":"1000","w":"bomb","m":"爆弾","p":[["bomb","ブーン"]],"i":"ドカーン！","r":"最後の b は読まない"},{"n":"1515","w":"bullet","m":"弾丸","p":[["bullet","小さな玉"]],"i":"ピストルの弾","r":"bullet train（新幹線）"},{"n":"487","w":"enemy","m":"敵","p":[["en","否定"],["emy","友"]],"i":"友じゃない人","r":"ally の反対"},{"n":"1925","w":"warrior","m":"戦士","p":[["war","戦争"]],"i":"戦う人","r":"soldier ≒"}]},{"world":"fortnite","title":"悪党の侵略","lab":"攻撃","labJa":"テーマ","icon":"theme","en":"A villain wants to {{conquer}} the island. His army {{invades:invade}} the north. \"Surrender, or I'll destroy your town!\" he {{threatens:threaten}}. People in the town start a {{riot}}. The villain is a {{menace}} to everyone. He uses {{violence}} to scare people. We face great {{peril}}. The storm is also a {{hazard}}. We train for {{combat}} and plan an {{assault}} on his base.","ja":"悪党が島を征服したがっている。彼の軍隊が北部に侵入する。「降伏しろ、さもないと町を破壊するぞ！」と彼は脅す。町の人々は暴動を起こす。悪党はみんなにとっての脅威だ。彼は暴力を使って人々をこわがらせる。ぼくらは大きな危険に直面する。ストームも危険要因だ。ぼくらは戦闘のために訓練して、彼の基地への襲撃を計画する。","ken":"「危険」の言い方いろいろ！ <b>danger（ふつう）, risk（自分で選ぶ危険）, peril（大きな危険）, hazard（危険の原因）, menace（脅威）</b>。並べて覚えたら長文で迷わへん。","words":[{"n":"900","w":"conquer","m":"征服する","p":[["con","完全に"],["quer","求める"]],"i":"全部を自分のものに","r":"conquest（征服）"},{"n":"902","w":"invade","m":"侵入する","p":[["in","中に"],["vade","行く"]],"i":"中へ攻めこむ","r":"invasion（侵略）"},{"n":"615","w":"threaten","m":"脅す","p":[["threat","脅威"]],"i":"「やるぞ」とおどす","r":"threat（脅威）"},{"n":"1791","w":"riot","m":"暴動","p":[["riot","騒ぎ"]],"i":"人々が暴れる騒ぎ","r":"暴動を起こす"},{"n":"1865","w":"menace","m":"脅威","p":[["men","突き出る"]],"i":"危険が目の前に突き出る","r":"threat ≒"},{"n":"457","w":"violence","m":"暴力","p":[["viol","力"]],"i":"むりやりの力","r":"violent（暴力的な）"},{"n":"1866","w":"peril","m":"（大きな）危険","p":[["peril","試す"]],"i":"命がけの試練","r":"in peril（危険にさらされて）"},{"n":"1555","w":"hazard","m":"危険（の原因）","p":[["hazard","サイコロ遊び"]],"i":"運しだいの危なさ","r":"ハザードマップ"},{"n":"1441","w":"combat","m":"戦闘","p":[["com","一緒に"],["bat","打つ"]],"i":"打ち合う","r":"battle ≒"},{"n":"1868","w":"assault","m":"襲撃、暴行","p":[["as","～に"],["sault","跳ぶ"]],"i":"飛びかかる","r":"attack ≒"}]},{"world":"fortnite","title":"夜を生き延びろ","lab":"守り","labJa":"テーマ","icon":"theme","en":"To {{survive}} the night, we build a {{shelter}}. Our {{strategy}} is simple: {{protect}} the base. Jonesy sets a {{trap}} at the {{border}} of our {{territory}}. His {{tactics}} are smart. We add walls for extra {{security}}. An enemy steps into the trap, and we {{capture}} him.","ja":"夜を生き延びるために、ぼくらは避難所を建てる。作戦はシンプル。基地を守ることだ。ジョンジーはなわばりの境界にワナをしかける。彼の戦術はかしこい。さらなる安全のために壁を追加する。敵がワナに足をふみ入れて、ぼくらは彼を捕まえる。","ken":"<b>strategy（全体の戦略）と tactics（その場の戦術）</b>の違い★ 「勝つための全体プラン」が strategy、「その場でどう動くか」が tactics。サッカー部やったからわかるやろ？","words":[{"n":"67","w":"survive","m":"生き延びる","p":[["sur","越えて"],["vive","生きる"]],"i":"危機を越えて生きる","r":"survival（生存）"},{"n":"730","w":"shelter","m":"避難所、守る","p":[["shelter","盾"]],"i":"雨風から守る場所","r":"take shelter（避難する）"},{"n":"1078","w":"strategy","m":"戦略","p":[["strat","軍"],["egy","導く"]],"i":"軍全体を導く計画","r":"strategic（戦略的な）"},{"n":"340","w":"protect","m":"守る","p":[["pro","前に"],["tect","おおう"]],"i":"前をおおって守る","r":"protection（保護）"},{"n":"744","w":"trap","m":"ワナ","p":[["trap","落とし穴"]],"i":"しかけて捕まえる","r":"be trapped（閉じこめられる）"},{"n":"735","w":"border","m":"国境、境界","p":[["border","ふち"]],"i":"国と国の境目","r":"cross the border"},{"n":"733","w":"territory","m":"領土、なわばり","p":[["terr","土地"]],"i":"自分の土地","r":"terrain（地形）も同じ仲間"},{"n":"1850","w":"tactics","m":"戦術","p":[["tact","並べる"]],"i":"その場での駒の並べ方","r":"tactical（戦術的な）"},{"n":"236","w":"security","m":"安全、警備","p":[["se","離れて"],["cur","心配"]],"i":"心配から離れる","r":"secure（安全な）"},{"n":"672","w":"capture","m":"捕まえる","p":[["capt","つかむ"]],"i":"ガシッと捕まえる","r":"スクリーンキャプチャ"}]},{"world":"fortnite","title":"災害シーズン","lab":"災害","labJa":"テーマ","icon":"theme","en":"This season, the island is hit by every kind of {{disaster}}. First, a {{storm}} comes with {{lightning}}. Then a {{flood}} covers the lowlands. The {{tide}} rises higher than ever. A sudden {{earthquake}} shakes the ground, and a {{volcano}} starts to smoke. In the desert, a long {{drought}} dries up the rivers, and there is a {{famine}}. It's a total {{catastrophe}}.","ja":"今シーズン、島はあらゆる種類の災害に見舞われる。まず、雷を伴う嵐が来る。次に洪水が低地をおおう。潮はかつてないほど高く満ちる。突然の地震が地面をゆらし、火山が煙を上げ始める。砂漠では長い干ばつで川が干上がり、飢饉が起きる。完全な大惨事だ。","ken":"災害単語はニュース系長文でめっちゃ出る！ <b>drought（干ばつ）は「ドラウト」</b>って読む、gh は読まへん。famine（飢饉）は hunger とセットで覚えよう。","words":[{"n":"1101","w":"disaster","m":"災害","p":[["dis","悪い"],["aster","星"]],"i":"悪い星まわり","r":"natural disaster（自然災害）"},{"n":"514","w":"storm","m":"嵐","p":[["storm","嵐"]],"i":"風と雨が暴れる","r":"stormy（嵐の）"},{"n":"1584","w":"lightning","m":"稲妻","p":[["light","光"]],"i":"ピカッと光る雷","r":"thunder（雷鳴）とセット"},{"n":"443","w":"flood","m":"洪水","p":[["flood","流れ"]],"i":"水があふれ出す","r":"be flooded with ～（～が殺到する）"},{"n":"790","w":"tide","m":"潮、流れ","p":[["tide","時"]],"i":"満ち引きする海","r":"the tide of history（歴史の流れ）"},{"n":"497","w":"earthquake","m":"地震","p":[["earth","地面"],["quake","ゆれる"]],"i":"地面がゆれる","r":"quake ≒"},{"n":"1580","w":"volcano","m":"火山","p":[["Vulcan","火の神"]],"i":"火の神の山","r":"volcanic（火山の）"},{"n":"1448","w":"drought","m":"干ばつ","p":[["dry","かわく"]],"i":"雨が降らずカラカラ","r":"gh は読まない"},{"n":"1045","w":"famine","m":"飢饉","p":[["fam","飢え"]],"i":"食べ物がなくなる","r":"hunger ≒"},{"n":"1825","w":"catastrophe","m":"大惨事","p":[["cata","下へ"],["strophe","回る"]],"i":"ひっくり返るほどの大災害","r":"disaster より大きい"}]},{"world":"fortnite","title":"巨大ロボット襲来","lab":"破壊","labJa":"テーマ","icon":"theme","en":"A giant robot attacks the city. A tower {{collapses:collapse}}. A car {{crashes:crash}} into a wall. A water pipe {{bursts:burst}}. The robot {{smashes:smash}} windows, and the glass {{shatters:shatter}}. It {{crushes:crush}} a truck with its foot. The old castle is now in {{ruins:ruin}}. The bridge {{splits:split}} in two. The whole city is {{wrecked}}. \"We're {{doomed}}!\" someone cries.","ja":"巨大ロボットが街を襲う。塔が崩れ落ちる。車が壁に激突する。水道管が破裂する。ロボットは窓をたたき割り、ガラスが粉々に砕け散る。足でトラックを押しつぶす。古い城は今や廃墟だ。橋は真っ二つに割れる。街全体がめちゃくちゃに壊されている。「もうおしまいだ！」と誰かが叫ぶ。","ken":"壊れ方のちがい！ <b>shatter（粉々）、smash（たたき割る）、crush（押しつぶす）、burst（破裂）、collapse（崩れ落ちる）</b>。全部「壊れる」やけど、絵が違うやろ？ 絵で覚えたら勝ち。","words":[{"n":"648","w":"collapse","m":"崩れ落ちる","p":[["col","一緒に"],["lapse","すべる"]],"i":"全部いっしょにすべり落ちる","r":"倒れる、にも使う"},{"n":"631","w":"crash","m":"激突する、墜落","p":[["crash","ガシャン"]],"i":"ドカーンとぶつかる","r":"plane crash（飛行機事故）"},{"n":"639","w":"burst","m":"破裂する","p":[["burst","はじける"]],"i":"パーンとはじける","r":"burst into tears（わっと泣き出す）"},{"n":"1702","w":"smash","m":"たたき割る","p":[["smash","ガツン"]],"i":"強く打って割る","r":"スマッシュ（テニス）"},{"n":"1705","w":"shatter","m":"粉々に砕く","p":[["shatter","散らばる"]],"i":"ガラスがバリーン","r":"shatter one's hopes（希望を打ち砕く）"},{"n":"1259","w":"crush","m":"押しつぶす","p":[["crush","つぶす"]],"i":"グシャッとつぶす","r":"have a crush on ～（～に夢中）"},{"n":"614","w":"ruin","m":"破滅させる、廃墟","p":[["ruin","くずれる"]],"i":"ボロボロに荒れる","r":"in ruins（廃墟になって）"},{"n":"675","w":"split","m":"割る、分ける","p":[["split","裂く"]],"i":"パカッと割れる","r":"split up（別れる）"},{"n":"1973","w":"wrecked","m":"めちゃくちゃに壊れた","p":[["wreck","難破"]],"i":"船がバラバラに難破","r":"wreck（破壊する）"},{"n":"1966","w":"doomed","m":"運が尽きた","p":[["doom","運命"]],"i":"悪い運命が決まっている","r":"be doomed to ～"}]},{"world":"fortnite","title":"大ケガとチームの危機","lab":"ケガ","labJa":"テーマ","icon":"theme","en":"After a huge battle, many players are {{hurt}}. One {{victim}} has a deep {{wound}}. In a real {{emergency}}, we would call an ambulance. I am {{injured:injure}} too, and the {{pain}} is terrible. \"Don't take such a big {{risk}} again,\" Jonesy says. \"You {{endangered:endanger}} the whole team.\" Without our medic, the team is in {{crisis}}. Luckily, the storm can't {{harm}} us here.","ja":"大きな戦いのあと、多くのプレイヤーがケガをしている。ある被害者は深い傷を負っている。本当の緊急事態なら、救急車を呼ぶところだ。ぼくもケガをしていて、痛みがひどい。「もうあんな大きな危険をおかすなよ」とジョンジーが言う。「お前はチーム全体を危険にさらしたんだ」。衛生兵がいないので、チームは危機におちいっている。幸い、ここではストームはぼくらに害を与えられない。","ken":"「ケガする」は <b>be injured / be hurt / be wounded</b>。wounded は刃物や銃でのケガ、injured は事故のケガが多い。★<b>do harm to ～（～に害を与える）</b>も熟語で出るで。","words":[{"n":"108","w":"hurt","m":"傷つける、痛む","p":[["hurt","打つ"]],"i":"体や心が痛む","r":"活用は hurt-hurt-hurt"},{"n":"501","w":"victim","m":"被害者、犠牲者","p":[["victim","いけにえ"]],"i":"被害を受けた人","r":"fall victim to ～"},{"n":"747","w":"wound","m":"傷、傷つける","p":[["wound","傷"]],"i":"刃物などの傷","r":"発音は「ウーンド」"},{"n":"711","w":"emergency","m":"緊急事態","p":[["e","外へ"],["merge","沈む"]],"i":"急に浮かび上がる事態","r":"emergency exit（非常口）"},{"n":"173","w":"injure","m":"ケガをさせる","p":[["in","否定"],["jure","正しい"]],"i":"正しくないことをする","r":"injury（ケガ）"},{"n":"215","w":"pain","m":"痛み","p":[["pain","罰"]],"i":"ズキズキ","r":"take pains（苦労する）"},{"n":"209","w":"risk","m":"危険（性）","p":[["risk","がけ"]],"i":"自分から飛びこむ危険","r":"take a risk（危険をおかす）"},{"n":"694","w":"endanger","m":"危険にさらす","p":[["en","中に"],["danger","危険"]],"i":"危険の中に入れる","r":"endangered species（絶滅危惧種）"},{"n":"491","w":"crisis","m":"危機","p":[["crisis","分かれ目"]],"i":"運命の分かれ目","r":"複数形は crises"},{"n":"246","w":"harm","m":"害、害を与える","p":[["harm","傷"]],"i":"ダメージ","r":"harmful（有害な）"}]},{"world":"fortnite","title":"スキンを買いたい","lab":"お金","labJa":"テーマ","icon":"theme","en":"I want to {{purchase}} a new skin with V-Bucks. My monthly {{income}} is small. I get a {{wage}} from a part-time job, but the government takes {{tax}}. I made a {{budget}} so I won't fall into {{debt}}. The skin is on sale, a real {{bargain}}. Jonesy says, \"{{Invest:invest}} in skills, not skins.\" He started a {{fund}} for our team. The game company makes a big {{profit}} anyway.","ja":"V-Bucksで新しいスキンを購入したい。ぼくの毎月の収入は少ない。バイトで賃金をもらっているけど、政府が税金を取っていく。借金におちいらないように予算を立てた。スキンはセール中で、本当にお買い得だ。ジョンジーは言う。「スキンじゃなくて腕前に投資しろよ」。彼はチームのための資金を始めた。どっちにしろ、ゲーム会社は大きな利益を出している。","ken":"お金の英単語！ <b>income（収入）、wage（時給・日給の賃金）、salary（月給）</b>のちがい。bargain は「お買い得品」、バーゲンセールの語源やで。経済の長文で全部出る★","words":[{"n":"887","w":"purchase","m":"購入する、購入","p":[["pur","～のために"],["chase","追う"]],"i":"追いかけて手に入れる","r":"buy ≒"},{"n":"458","w":"income","m":"収入","p":[["in","中に"],["come","来る"]],"i":"中に入ってくるお金","r":"outcome（結果）と区別"},{"n":"936","w":"wage","m":"賃金","p":[["wage","誓約"]],"i":"働いた分のお金（時給・日給）","r":"salary（月給）"},{"n":"938","w":"tax","m":"税金","p":[["tax","見積もる"]],"i":"国に払うお金","r":"tax-free（免税の）"},{"n":"1006","w":"budget","m":"予算","p":[["budget","小さな財布"]],"i":"使っていいお金の計画","r":"on a budget（予算内で）"},{"n":"1039","w":"debt","m":"借金","p":[["debt","借り"]],"i":"返さないといけないお金","r":"b は読まない（デット）"},{"n":"1509","w":"bargain","m":"お買い得品、取引","p":[["bargain","値切る"]],"i":"値切って得したもの","r":"バーゲンセール"},{"n":"646","w":"invest","m":"投資する","p":[["in","中に"],["vest","服を着せる"]],"i":"お金を着せて育てる","r":"investment（投資）"},{"n":"988","w":"fund","m":"資金、基金","p":[["fund","底"]],"i":"土台になるお金","r":"fundamental（基本的な）"},{"n":"472","w":"profit","m":"利益","p":[["pro","前に"],["fit","作る"]],"i":"前に進んで作ったもうけ","r":"loss（損失）が反対"}]},{"world":"fortnite","title":"ジョンジーの昔","lab":"お金2","labJa":"テーマ","icon":"theme","en":"Jonesy grew up in {{poverty}}. He couldn't {{afford}} a gaming PC. Now he {{earns:earn}} money as a pro player. He lives in {{luxury}}, but he still knows the {{cost}} of everything. \"The bus {{fare}} was my biggest worry,\" he says. He pays a {{fee}} to join tournaments. The game {{economy}} is huge. Some players get {{financial}} help from sponsors. For Jonesy, {{wealth}} is not everything.","ja":"ジョンジーは貧困の中で育った。ゲーミングPCを買う余裕がなかった。今はプロプレイヤーとしてお金を稼いでいる。ぜいたくな暮らしをしているけど、今でもあらゆるものの値段を知っている。「バスの運賃がいちばんの心配だった」と彼。大会に出るために参加費を払う。ゲームの経済はとても大きい。スポンサーから経済的な援助を受けるプレイヤーもいる。ジョンジーにとって、富がすべてではない。","ken":"「料金」の使い分け★ <b>fee（サービスへの料金・授業料）、fare（乗り物の運賃）、cost（かかる費用）、price（値段）</b>。★<b>can afford to ～（～する余裕がある）</b>も超頻出やで。","words":[{"n":"932","w":"poverty","m":"貧困","p":[["poor","貧しい"]],"i":"お金がない状態","r":"wealth が反対"},{"n":"85","w":"afford","m":"～する余裕がある","p":[["af","～へ"],["ford","進める"]],"i":"お金を出して前に進める","r":"can afford to ～"},{"n":"83","w":"earn","m":"稼ぐ、得る","p":[["earn","収穫する"]],"i":"働いて手に入れる","r":"earn a living（生計を立てる）"},{"n":"986","w":"luxury","m":"ぜいたく","p":[["lux","光"]],"i":"キラキラした暮らし","r":"luxurious（豪華な）"},{"n":"20","w":"cost","m":"費用、（費用が）かかる","p":[["co","一緒に"],["st","立つ"]],"i":"そのぶん必要になる","r":"at all costs（何としても）"},{"n":"1038","w":"fare","m":"運賃","p":[["fare","行く"]],"i":"乗り物に乗る料金","r":"bus fare"},{"n":"183","w":"fee","m":"料金、謝礼","p":[["fee","財産"]],"i":"サービスに払うお金","r":"entrance fee（入場料）"},{"n":"197","w":"economy","m":"経済、節約","p":[["eco","家"],["nomy","管理"]],"i":"家のやりくり","r":"economical（節約になる）と economic（経済の）の区別★"},{"n":"555","w":"financial","m":"財政の、金融の","p":[["finance","お金のやりくり"]],"i":"お金に関する","r":"financial crisis（金融危機）"},{"n":"470","w":"wealth","m":"富","p":[["weal","幸せ"]],"i":"たくさんの財産","r":"wealthy（裕福な）"}]},{"world":"fortnite","title":"島の商人","lab":"商売","labJa":"テーマ","icon":"theme","en":"A {{merchant}} on the island runs a {{retail}} shop. He sells every {{commodity}} you can imagine. {{Trade:trade}} between islands is growing, and online {{commerce}} is popular too. But last year, his shop's {{revenue}} fell, and he had a big {{deficit}}. He almost went {{bankrupt}}. The government gave him a {{subsidy}}. Now he wants to save money for his {{pension}}.","ja":"島のある商人が小売店を経営している。思いつくかぎりの商品を売っている。島どうしの貿易は増えていて、ネットの商取引も人気だ。でも去年、店の収入が落ちて、大きな赤字が出た。彼はもう少しで破産するところだった。政府が彼に補助金を出した。今、彼は年金のためにお金を貯めたいと思っている。","ken":"経済の長文単語！ <b>deficit（赤字）⇔ surplus（黒字）</b>はセット。bankrupt は bank（両替商の台）+ rupt（壊れる）で「破産」。昔のイタリアでは台を壊されたらしいで笑","words":[{"n":"1052","w":"merchant","m":"商人","p":[["merc","商売"]],"i":"商売をする人","r":"merchandise（商品）"},{"n":"1608","w":"retail","m":"小売り","p":[["re","再び"],["tail","切る"]],"i":"小さく切り分けて売る","r":"wholesale（卸売り）が反対"},{"n":"1564","w":"commodity","m":"商品、日用品","p":[["com","一緒に"],["mod","ちょうどいい"]],"i":"ちょうど便利なもの","r":"product ≒"},{"n":"192","w":"trade","m":"貿易、取引","p":[["trade","道"]],"i":"物を交換して進む道","r":"trade A for B（AとBを交換する）"},{"n":"1539","w":"commerce","m":"商業","p":[["com","一緒に"],["merce","商品"]],"i":"商品をやりとり","r":"e-commerce（ネット通販）"},{"n":"1603","w":"revenue","m":"収入、歳入","p":[["re","戻る"],["venue","来る"]],"i":"戻ってくるお金","r":"income ≒"},{"n":"1914","w":"deficit","m":"赤字、不足","p":[["de","離れて"],["fic","作る"]],"i":"作りが足りない","r":"surplus（黒字）が反対"},{"n":"1661","w":"bankrupt","m":"破産した","p":[["bank","台"],["rupt","壊れる"]],"i":"商売の台が壊れる","r":"go bankrupt（破産する）"},{"n":"1872","w":"subsidy","m":"補助金","p":[["sub","下から"],["sid","座る"]],"i":"下から支える助け","r":"subsidize（補助金を出す）"},{"n":"1525","w":"pension","m":"年金","p":[["pens","支払う"]],"i":"老後に払われるお金","r":"ペンション（宿）も同じ語源"}]},{"world":"fortnite","title":"ゲーム会社の成長","lab":"会社","labJa":"テーマ","icon":"theme","en":"A young {{entrepreneur}} starts a new gaming {{enterprise}}. Soon it grows into a big {{corporation}}. Its {{headquarters}} is in a tall building. It has a {{monopoly}} on game skins. Every year it has a {{surplus}}. Its greatest {{asset}} is its team. It buys real {{estate}} and pays for {{insurance}}. Its biggest {{client}} is a famous streamer.","ja":"若い起業家が新しいゲーム企業を始める。すぐにそれは大きな会社に成長する。本社は高いビルの中にある。その会社はゲームスキンを独占している。毎年黒字が出る。いちばんの資産はチームだ。不動産を買い、保険料を払う。いちばんの顧客は有名な配信者だ。","ken":"<b>real estate（不動産）</b>はセットで覚える！ client は弁護士とか専門家の「依頼人」っぽいお客。headquarters は s がついてても単数あつかいOKやで。","words":[{"n":"1857","w":"entrepreneur","m":"起業家","p":[["entre","間に"],["pren","取る"]],"i":"チャンスをつかむ人","r":"フランス語から"},{"n":"737","w":"enterprise","m":"企業、事業","p":[["enter","間に"],["prise","つかむ"]],"i":"チャンスをつかむ事業","r":"small enterprises（中小企業）"},{"n":"962","w":"corporation","m":"会社","p":[["corp","体"]],"i":"ひとつの体になった組織","r":"corporate（会社の）"},{"n":"1504","w":"headquarters","m":"本社、本部","p":[["head","頭"],["quarters","宿"]],"i":"組織の頭のある場所","r":"HQ と略す"},{"n":"1851","w":"monopoly","m":"独占","p":[["mono","1つ"],["poly","売る"]],"i":"1社だけが売る","r":"モノポリー（ゲーム）"},{"n":"1527","w":"surplus","m":"黒字、余り","p":[["sur","越えて"],["plus","多く"]],"i":"必要より多く余る","r":"deficit（赤字）が反対"},{"n":"1305","w":"asset","m":"資産、強み","p":[["asset","十分な"]],"i":"価値のある持ち物","r":"an asset to the team（チームの宝）"},{"n":"1563","w":"estate","m":"地所、財産","p":[["estate","状態"]],"i":"持っている土地や財産","r":"real estate（不動産）"},{"n":"930","w":"insurance","m":"保険","p":[["in","中に"],["sure","安全"]],"i":"安全にする仕組み","r":"insure（保険をかける）"},{"n":"775","w":"client","m":"依頼人、顧客","p":[["client","もたれる人"]],"i":"専門家に頼る人","r":"customer ≒"}]},{"world":"fortnite","title":"おこづかいの悩み","lab":"おこづかい","labJa":"テーマ","icon":"theme","en":"My parents give me a monthly {{allowance}}. It's not much. My friend's family is {{affluent}}, so he always buys new {{goods}}. I {{owe}} him 500 yen because I {{borrowed:borrow}} money for a skin. I dream of winning the {{lottery}} and becoming a {{millionaire}}. Then I could {{rent}} a big house. For now, I help my mom at the {{grocery}} store. I keep my coins in a small {{purse}}.","ja":"両親が毎月おこづかいをくれる。多くはない。友だちの家は裕福なので、彼はいつも新しい品物を買っている。スキンのためにお金を借りたので、ぼくは彼に500円の借りがある。宝くじに当たって大金持ちになるのが夢だ。そうしたら大きな家を借りられる。今は、食料品店でお母さんを手伝っている。小銭は小さな財布に入れている。","ken":"★<b>borrow（借りる）⇔ lend（貸す）</b>、<b>rent（お金を払って借りる）</b>。owe は「借りがある」、owe A to B（AはBのおかげ）って意味もあるで。I owe my success to you.","words":[{"n":"1474","w":"allowance","m":"おこづかい、手当","p":[["allow","許す"]],"i":"使っていいと許されたお金","r":"pocket money ≒"},{"n":"1666","w":"affluent","m":"裕福な","p":[["af","～へ"],["flu","流れる"]],"i":"お金があふれて流れこむ","r":"rich ≒"},{"n":"445","w":"goods","m":"商品、品物","p":[["good","良い"]],"i":"良い物＝品物","r":"常に複数形"},{"n":"168","w":"owe","m":"借りがある、～のおかげ","p":[["owe","持つ"]],"i":"返すべきものを持っている","r":"owe A to B"},{"n":"359","w":"borrow","m":"借りる","p":[["borrow","保証"]],"i":"返す約束で借りる","r":"lend（貸す）が反対"},{"n":"1491","w":"lottery","m":"宝くじ","p":[["lot","くじ"]],"i":"くじ引き","r":"win the lottery"},{"n":"1916","w":"millionaire","m":"大金持ち","p":[["million","100万"]],"i":"100万ドル持ってる人","r":"billionaire（億万長者）"},{"n":"143","w":"rent","m":"（お金を払って）借りる、家賃","p":[["rent","支払う"]],"i":"お金を払って使う","r":"for rent（貸します）"},{"n":"1071","w":"grocery","m":"食料品店、食料雑貨","p":[["grocer","まとめ売り"]],"i":"食料品を売る店","r":"groceries（食料品）"},{"n":"1047","w":"purse","m":"財布（小銭入れ）","p":[["purse","皮袋"]],"i":"小さなお財布","r":"wallet（札入れ）"}]},{"world":"fortnite","title":"レアアイテムの値打ち","lab":"価値","labJa":"テーマ","icon":"theme","en":"Jonesy found a rare item. \"What's its {{value}}?\" I ask. \"It's {{worth}} a lot,\" he says. It's his {{property}}, and he will never sell it. Some players {{bet}} V-Bucks on matches. The {{stake}} is high, but the {{odds}} are against us. A shop sells {{secondhand}} weapons in {{bulk}}. It has lots of {{stock}}. To cross the bridge, we must pay a {{toll}}.","ja":"ジョンジーがレアアイテムを見つけた。「それの価値は？」とぼくは聞く。「すごい値打ちがある」と彼。それは彼の所有物で、絶対に売らない。試合にV-Bucksを賭けるプレイヤーもいる。賭け金は高いけど、勝ち目はぼくらに不利だ。ある店は中古のブキを大量に売っている。在庫がたくさんある。橋を渡るには通行料を払わないといけない。","ken":"★<b>be worth ～ing（～する価値がある）</b>は超頻出！ This book is worth reading. odds は「見込み」、The odds are that ～（たぶん～だろう）って形も出るで。","words":[{"n":"179","w":"value","m":"価値","p":[["valu","強い"]],"i":"それが持つ力","r":"valuable（価値のある）"},{"n":"265","w":"worth","m":"～の価値がある","p":[["worth","値打ち"]],"i":"それだけの値打ち","r":"be worth ～ing★"},{"n":"234","w":"property","m":"所有物、財産、性質","p":[["proper","自分の"]],"i":"自分のもの","r":"★「性質」の意味もある"},{"n":"613","w":"bet","m":"賭ける","p":[["bet","賭け"]],"i":"お金を賭ける","r":"I bet ～（きっと～だ）"},{"n":"1810","w":"stake","m":"賭け金、利害関係","p":[["stake","くい"]],"i":"地面にくいを打って賭ける","r":"at stake（危うくなって）"},{"n":"1487","w":"odds","m":"見込み、勝ち目","p":[["odd","半端な"]],"i":"勝つ見込み","r":"against all odds（あらゆる困難をこえて）"},{"n":"2008","w":"secondhand","m":"中古の","p":[["second","2番目"],["hand","手"]],"i":"2番目の人の手に渡った","r":"used ≒"},{"n":"1915","w":"bulk","m":"大量、大部分","p":[["bulk","荷"]],"i":"どっさり","r":"in bulk（大量に）"},{"n":"706","w":"stock","m":"在庫、株","p":[["stock","幹"]],"i":"ストックしてあるもの","r":"in stock（在庫あり）"},{"n":"1832","w":"toll","m":"通行料、犠牲","p":[["toll","税"]],"i":"通るためのお金","r":"death toll（死者数）"}]},{"world":"fortnite","title":"秘密のトンネル","lab":"前置詞","labJa":"テーマ","icon":"theme","en":"The storm grows {{throughout}} the match. {{Unlike:unlike}} other players, Jonesy stays calm. \"The safe zone is {{within}} 100 meters,\" he says. Everyone {{except}} me has a shield. We travel {{via}} a secret tunnel. {{Owing:owing}} to the bad weather, we can't see far. {{In spite of:in spite of}} the danger, we keep going. \"Keep moving, {{regardless}} of the risk,\" says Jonesy. The mountains {{beyond}} the lake hide two enemies, {{namely}} the best players in the game.","ja":"試合を通してずっとストームは大きくなる。ほかのプレイヤーと違って、ジョンジーは冷静だ。「安全地帯は100メートル以内だ」と彼。ぼく以外のみんながシールドを持っている。ぼくらは秘密のトンネルを経由して移動する。悪天候のせいで、遠くまで見えない。危険にもかかわらず、ぼくらは進み続ける。「危険に関係なく、動き続けろ」とジョンジー。湖の向こうの山には二人の敵が隠れている。すなわち、このゲームで最強のプレイヤーたちだ。","ken":"前置詞はセットで覚える！ ★<b>owing to ～ ＝ because of ～</b>、<b>regardless of ～（～に関係なく）</b>、<b>in spite of ～ ＝ despite</b>。並べかえ問題の常連やで。","words":[{"n":"321","w":"throughout","m":"～の間ずっと、～のいたる所に","p":[["through","通して"],["out","完全に"]],"i":"はじめから終わりまでずっと","r":"throughout the year（1年中）"},{"n":"322","w":"unlike","m":"～と違って","p":[["un","否定"],["like","似ている"]],"i":"似ていない","r":"alike（似ている）が反対"},{"n":"325","w":"within","m":"～以内に","p":[["with","ともに"],["in","中"]],"i":"中に収まって","r":"within an hour（1時間以内に）"},{"n":"328","w":"except","m":"～を除いて","p":[["ex","外へ"],["cept","取る"]],"i":"外へ取り出して","r":"except for ～ も同じ"},{"n":"1699","w":"via","m":"～経由で","p":[["via","道"]],"i":"～の道を通って","r":"via email（メールで）"},{"n":"1700","w":"owing","m":"～のために（owing to）","p":[["owe","おかげ"]],"i":"～のおかげで","r":"owing to ～ ＝ because of ～"},{"n":"330","w":"in spite of","m":"～にもかかわらず","p":[["spite","悪意"]],"i":"悪意をものともせず","r":"despite ≒"},{"n":"1199","w":"regardless","m":"関係なく","p":[["regard","気にかける"],["less","ない"]],"i":"気にかけずに","r":"regardless of ～"},{"n":"324","w":"beyond","m":"～の向こうに、～を超えて","p":[["be","そば"],["yond","向こう"]],"i":"向こう側","r":"beyond description（言葉にできない）"},{"n":"1697","w":"namely","m":"すなわち","p":[["name","名前"]],"i":"名前を挙げると","r":"that is ≒"}]},{"world":"fortnite","title":"動き続ける作戦","lab":"速さと固さ","labJa":"テーマ","icon":"theme","en":"The new map changes at a {{rapid}} pace. You need {{swift}} moves and a {{flexible}} plan. A {{mobile}} base on a truck is useful. Jonesy says, \"Don't stay {{static}}. A {{rigid}} plan won't work.\" My neck is {{stiff}} after hours of play, and my shoelace is {{loose}}. I take a short break to stay {{stable}}. Slow and {{steady}} wins the race.","ja":"新しいマップは急速なペースで変化する。すばやい動きと柔軟な作戦が必要だ。トラックの上の移動式の基地が便利だ。ジョンジーは言う。「じっとしているな。固い作戦はうまくいかない」。何時間もプレイしたあとで首がこっていて、靴ひもがゆるんでいる。安定を保つために少し休憩する。ゆっくり着実なほうが勝つ。","ken":"反対語ペアで覚えよう！ <b>flexible ⇔ rigid</b>（柔軟 ⇔ 固い）、<b>mobile ⇔ static</b>（動く ⇔ 動かない）。loose は「ルース」、lose（失う）と区別★","words":[{"n":"550","w":"rapid","m":"急速な","p":[["rapid","つかみ取る"]],"i":"ものすごい速さ","r":"rapidly（急速に）"},{"n":"1948","w":"swift","m":"すばやい","p":[["swift","すばやく動く"]],"i":"サッと動く","r":"quick ≒"},{"n":"1162","w":"flexible","m":"柔軟な","p":[["flex","曲げる"]],"i":"曲げられる","r":"rigid が反対語"},{"n":"575","w":"mobile","m":"移動式の、動きやすい","p":[["mob","動く"]],"i":"動かせる","r":"mobile phone（携帯電話）"},{"n":"1965","w":"static","m":"動かない、静的な","p":[["stat","立つ"]],"i":"立ち止まったまま","r":"static electricity（静電気）"},{"n":"1672","w":"rigid","m":"固い、厳格な","p":[["rig","固い"]],"i":"曲がらない","r":"strict ≒"},{"n":"1327","w":"stiff","m":"こわばった、固い","p":[["stiff","固い"]],"i":"カチカチ","r":"a stiff neck（首のこり）"},{"n":"801","w":"loose","m":"ゆるい","p":[["loose","ほどけた"]],"i":"ほどけてゆるゆる","r":"発音は「ルース」、lose と区別"},{"n":"1141","w":"stable","m":"安定した","p":[["sta","立つ"]],"i":"しっかり立っている","r":"stability（安定）"},{"n":"798","w":"steady","m":"着実な、安定した","p":[["stead","場所"]],"i":"しっかり同じ場所に","r":"steadily（着実に）"}]},{"world":"fortnite","title":"ラスボスのドラゴン","lab":"強い","labJa":"テーマ","icon":"theme","en":"The final boss is {{tough}}. It's a {{mighty}} dragon with {{potent}} fire. The battle is {{intense}}. The dragon gives a {{fierce}} roar. Jonesy fights with {{vigorous}} energy. The damage is {{severe}}, and I feel {{acute}} pain in my hand from pressing buttons. It takes {{sheer}} willpower to keep going. We win with {{tremendous}} effort.","ja":"ラスボスは手ごわい。強力な炎を持つ力強いドラゴンだ。戦いは激しい。ドラゴンはどう猛なほえ声を上げる。ジョンジーは活発なエネルギーで戦う。ダメージは深刻で、ボタンを押しすぎて手に鋭い痛みを感じる。続けるにはまったくの気力が必要だ。ぼくらはものすごい努力で勝つ。","ken":"「強い・激しい」いろいろ！ <b>severe（深刻な・きびしい）、acute（鋭い・急性の）、fierce（どう猛な）、intense（強烈な）</b>。sheer は「まったくの」、sheer luck（まったくの運）って使う。","words":[{"n":"304","w":"tough","m":"手ごわい、たくましい","p":[["tough","固い"]],"i":"かみきれないほど固い","r":"a tough question（難問）"},{"n":"2014","w":"mighty","m":"強力な","p":[["might","力"]],"i":"力がみなぎる","r":"might（力）"},{"n":"2005","w":"potent","m":"強力な、効き目がある","p":[["pot","できる"]],"i":"力を持っている","r":"potential（潜在的な）"},{"n":"1151","w":"intense","m":"強烈な、激しい","p":[["in","中へ"],["tense","張る"]],"i":"ピンと張りつめた","r":"intensity（強さ）"},{"n":"1329","w":"fierce","m":"どう猛な、激しい","p":[["fierce","野生の"]],"i":"野生動物みたいに荒い","r":"fierce competition（激しい競争）"},{"n":"1651","w":"vigorous","m":"活発な、精力的な","p":[["vig","元気"]],"i":"元気いっぱい","r":"vigor（活力）"},{"n":"573","w":"severe","m":"深刻な、きびしい","p":[["severe","きびしい"]],"i":"ずっしり重い","r":"severe pain（激痛）"},{"n":"1330","w":"acute","m":"鋭い、急性の","p":[["acu","針"]],"i":"針みたいに鋭い","r":"chronic（慢性の）が反対"},{"n":"1962","w":"sheer","m":"まったくの、切り立った","p":[["sheer","純粋な"]],"i":"混じりけなしの","r":"sheer luck（まったくの運）"},{"n":"1138","w":"tremendous","m":"ものすごい","p":[["trem","ふるえる"]],"i":"ふるえるほどすごい","r":"tremble（ふるえる）と仲間"}]},{"world":"fortnite","title":"ひとりぼっちの島","lab":"ひとり","labJa":"テーマ","icon":"theme","en":"I land on a small, {{isolated}} island. It's completely {{empty}}. An old house there is {{vacant}}. People say it's {{haunted}}. I'm the {{sole}} player here. I stay {{awake}} and {{alert}} all night. Living a {{solitary}} life is hard. Then an {{anonymous}} message appears: \"I'm coming.\" It's from a {{notorious}} hacker.","ja":"ぼくは小さな孤立した島に着地する。完全に空っぽだ。そこの古い家は空き家になっている。幽霊が出るといううわさだ。ここにいるプレイヤーはぼくだけだ。一晩中、目を覚まして油断せずにいる。ひとりぼっちの生活はつらい。そのとき、匿名のメッセージが表示される。「今から行く」。悪名高いハッカーからだ。","ken":"<b>empty（中身が空）と vacant（人が使ってない空き）</b>の違い★ トイレの「空き」は vacant。notorious（悪名高い）と famous（有名な）は良い悪いで使い分けるで。","words":[{"n":"1115","w":"isolated","m":"孤立した","p":[["isol","島"]],"i":"島みたいにぽつんと","r":"isolate（孤立させる）"},{"n":"549","w":"empty","m":"空の","p":[["empty","何もない"]],"i":"中身がからっぽ","r":"full が反対"},{"n":"1670","w":"vacant","m":"空いている","p":[["vac","空っぽ"]],"i":"誰も使っていない","r":"vacation（休暇）も仲間"},{"n":"1743","w":"haunted","m":"幽霊の出る","p":[["haunt","よく行く"]],"i":"幽霊がうろつく","r":"haunted house（お化け屋敷）"},{"n":"1663","w":"sole","m":"唯一の、靴底","p":[["sole","ひとつ"]],"i":"たったひとつ","r":"solely（もっぱら）"},{"n":"301","w":"awake","m":"目が覚めて","p":[["a","強め"],["wake","起きる"]],"i":"パッチリ起きている","r":"asleep が反対"},{"n":"1689","w":"alert","m":"油断のない、警報","p":[["alert","見張り"]],"i":"ピリッと気を張る","r":"be alert to ～"},{"n":"1655","w":"solitary","m":"ひとりの、孤独な","p":[["sol","ひとり"]],"i":"ひとりぼっち","r":"solitude（孤独）"},{"n":"1984","w":"anonymous","m":"匿名の","p":[["an","ない"],["onym","名前"]],"i":"名前がない","r":"anonymously（匿名で）"},{"n":"1983","w":"notorious","m":"悪名高い","p":[["not","知られた"]],"i":"悪い意味で有名","r":"infamous ≒"}]},{"world":"fortnite","title":"ツルのモンスター","lab":"つかむ","labJa":"テーマ","icon":"theme","en":"A strange vine monster appears. Jonesy goes to {{fetch}} a weapon. The vines {{wind}} around my legs and {{bind}} my arms. I {{cling}} to a tree. The monster tries to {{suck}} my energy. I {{thrust}} my sword into it, and the blade {{pierces:pierce}} its skin. I {{tear}} the vines off. One vine {{snaps:snap}} in half. Smoke fills the air, and I start to {{choke}}.","ja":"奇妙なツルのモンスターが現れる。ジョンジーはブキを取りに行く。ツルがぼくの足に巻きついて、腕をしばる。ぼくは木にしがみつく。モンスターはぼくのエネルギーを吸い取ろうとする。ぼくは剣を突き刺し、刃がその皮をつらぬく。ぼくはツルを引きちぎる。1本のツルがパキッと半分に折れる。煙が空気を満たし、ぼくは息がつまり始める。","ken":"<b>wind は「ワインド」と読むと「巻く」</b>、「ウィンド」は「風」！ 発音問題で出る★ tear も「テア」は「破る」、「ティア」は「涙」。読み方で意味が変わる単語セットやで。","words":[{"n":"1785","w":"fetch","m":"取ってくる","p":[["fetch","取りに行く"]],"i":"行って持ってくる","r":"go and get ≒"},{"n":"1218","w":"wind","m":"巻く","p":[["wind","巻く"]],"i":"ぐるぐる巻きつく","r":"発音「ワインド」。過去形は wound"},{"n":"1222","w":"bind","m":"しばる","p":[["bind","結ぶ"]],"i":"ひもでしばる","r":"bound（過去形）"},{"n":"1360","w":"cling","m":"しがみつく","p":[["cling","くっつく"]],"i":"ギュッとしがみつく","r":"cling to ～"},{"n":"1766","w":"suck","m":"吸う","p":[["suck","すする"]],"i":"チューッと吸う","r":"ストローで吸う"},{"n":"1777","w":"thrust","m":"突き刺す、押しこむ","p":[["thrust","押す"]],"i":"グッと突き出す","r":"活用は thrust-thrust-thrust"},{"n":"1730","w":"pierce","m":"つらぬく","p":[["pierce","穴をあける"]],"i":"ブスッと穴をあける","r":"ピアス"},{"n":"386","w":"tear","m":"引き裂く、涙","p":[["tear","裂く"]],"i":"ビリッと破る","r":"「テア」＝破る、「ティア」＝涙"},{"n":"1251","w":"snap","m":"パキッと折れる、パチンと鳴らす","p":[["snap","パチッ"]],"i":"一瞬でパキッ","r":"snapshot（スナップ写真）"},{"n":"1748","w":"choke","m":"息がつまる、窒息させる","p":[["choke","のど"]],"i":"のどがつまる","r":"choke on ～"}]},{"world":"fortnite","title":"ジョンジーの宝物","lab":"持つ・探す","labJa":"テーマ","icon":"theme","en":"Jonesy {{owns:own}} a rare skin. He also {{possesses:possess}} a legendary weapon. \"Does this {{belong}} to you?\" I ask about a box. We {{search}} the area and {{seek}} more loot. Jonesy {{selects:select}} the best items and {{shares:share}} them with me. He {{donates:donate}} his extra V-Bucks to new players. He {{dedicates:dedicate}} his time to helping others. In the final battle, he {{sacrifices:sacrifice}} himself to save me.","ja":"ジョンジーはレアなスキンを所有している。伝説のブキも所持している。「これ、君のもの？」とぼくは箱について聞く。ぼくらはエリアを探索して、さらに戦利品を探し求める。ジョンジーは最高のアイテムを選んで、ぼくと分け合う。彼は余ったV-Bucksを新しいプレイヤーに寄付する。他人を助けることに時間をささげている。最後の戦いで、彼はぼくを救うために自分を犠牲にする。","ken":"★<b>search A for B（Bを求めてAを探す）</b>。search the room for the key ＝ カギを求めて部屋を探す。search the key だと「カギの中を探す」になるで笑 belong to ～ は進行形にしないのもポイント。","words":[{"n":"151","w":"own","m":"所有する、自分の","p":[["own","持つ"]],"i":"自分のものとして持つ","r":"owner（持ち主）"},{"n":"377","w":"possess","m":"所有する","p":[["pos","できる"],["sess","座る"]],"i":"力を持って座っている","r":"possession（所有）"},{"n":"72","w":"belong","m":"属する","p":[["be","強め"],["long","ふさわしい"]],"i":"そこにぴったり属する","r":"belong to ～（進行形にしない）"},{"n":"55","w":"search","m":"探す","p":[["search","円を描いて回る"]],"i":"ぐるぐる回って探す","r":"search A for B"},{"n":"54","w":"seek","m":"求める","p":[["seek","探す"]],"i":"ほしいものを求める","r":"seek-sought-sought"},{"n":"370","w":"select","m":"選ぶ","p":[["se","離れて"],["lect","選ぶ"]],"i":"中から選び分ける","r":"selection（選択）"},{"n":"23","w":"share","m":"分け合う、共有する、割合","p":[["share","分ける"]],"i":"みんなで分ける","r":"market share（市場占有率）"},{"n":"1252","w":"donate","m":"寄付する","p":[["don","与える"]],"i":"ただで与える","r":"donation（寄付）"},{"n":"1207","w":"dedicate","m":"ささげる","p":[["de","完全に"],["dic","言う"]],"i":"全部ささげると宣言","r":"be dedicated to ～"},{"n":"875","w":"sacrifice","m":"犠牲にする、犠牲","p":[["sacri","神聖な"],["fice","作る"]],"i":"神にささげる","r":"at the sacrifice of ～"}]},{"world":"fortnite","title":"大イベントの反省","lab":"基本動詞2","labJa":"テーマ","icon":"theme","en":"Our team {{participates:participate}} in a big event. The stadium {{seats:seat}} ten thousand people. I {{struggle}} to find our base on the map. Finally, I {{locate}} it. Jonesy {{resembles:resemble}} his older brother. He tries to {{ignore}} the noise. I {{weigh}} the good and bad points of each plan. When we lose, I {{blame}} myself. \"Don't let one mistake {{spoil}} the day,\" Jonesy says. Still, I {{lament}} our loss.","ja":"ぼくらのチームは大きなイベントに参加する。スタジアムは1万人を収容できる。マップでぼくらの基地を見つけるのに苦労する。ついにその場所をつきとめる。ジョンジーはお兄さんに似ている。彼は騒音を無視しようとする。ぼくはそれぞれの作戦の良い点と悪い点を比較検討する。負けたとき、ぼくは自分を責める。「ひとつのミスで1日を台無しにするなよ」とジョンジー。それでも、ぼくは負けを嘆く。","ken":"★<b>blame A for B（BのことでAを責める）</b>、<b>be located in ～（～に位置する）</b>、<b>resemble は他動詞</b>（resemble to はダメ！）。seat は動詞だと「収容できる」になるのも出るで。","words":[{"n":"166","w":"participate","m":"参加する","p":[["part","部分"],["cip","取る"]],"i":"自分の役を取る","r":"participate in ～"},{"n":"172","w":"seat","m":"収容する、席","p":[["seat","座る場所"]],"i":"席の数だけ座らせる","r":"be seated（座る）"},{"n":"118","w":"struggle","m":"苦労する、もがく","p":[["struggle","もがく"]],"i":"じたばたがんばる","r":"struggle to ～"},{"n":"148","w":"locate","m":"見つける、位置させる","p":[["loc","場所"]],"i":"場所をつきとめる","r":"be located in ～"},{"n":"385","w":"resemble","m":"似ている","p":[["re","強め"],["semble","似た"]],"i":"そっくりに見える","r":"resemble to はまちがい★"},{"n":"346","w":"ignore","m":"無視する","p":[["i","否定"],["gno","知る"]],"i":"知らないふり","r":"ignorant（無知な）"},{"n":"164","w":"weigh","m":"重さをはかる、よく考える","p":[["weigh","重さ"]],"i":"天秤にかけて比べる","r":"weight（重さ）"},{"n":"111","w":"blame","m":"責める","p":[["blame","非難"]],"i":"悪いのは君だ","r":"blame A for B"},{"n":"160","w":"spoil","m":"台無しにする、甘やかす","p":[["spoil","はぎとる"]],"i":"ダメにする","r":"spoil a child（子どもを甘やかす）"},{"n":"1707","w":"lament","m":"嘆く","p":[["lament","泣く"]],"i":"悲しんで泣く","r":"mourn ≒"}]},{"world":"fortnite","title":"チーム崩壊の危機","lab":"ピンチ","labJa":"テーマ","icon":"theme","en":"Our team faces real {{hardship}}. There is a {{shortage}} of wood and a {{lack}} of good players. The new rules are a heavy {{burden}}. The {{strain}} is too much for Jonesy. One loud player is a real {{nuisance}}. He makes a {{fuss}} about everything. A {{breakdown}} in communication causes {{chaos}}. Language is also a {{barrier}}, because some players speak only English.","ja":"ぼくらのチームは本当の苦難に直面している。木材が不足していて、うまいプレイヤーもいない。新しいルールは重い負担だ。ジョンジーにはそのプレッシャーが大きすぎる。ある騒がしいプレイヤーは本当に迷惑だ。彼は何でも大騒ぎする。コミュニケーションの崩壊が大混乱を引き起こす。英語しか話さないプレイヤーもいるので、言葉も障壁だ。","ken":"<b>lack（欠如）と shortage（不足）</b>：lack は「全然ない」寄り、shortage は「足りない」。★lack は動詞だと前置詞なし！ He lacks experience.（lack of は名詞のとき）","words":[{"n":"1520","w":"hardship","m":"苦難","p":[["hard","つらい"],["ship","状態"]],"i":"つらい状態","r":"困難"},{"n":"933","w":"shortage","m":"不足","p":[["short","足りない"]],"i":"量が足りない","r":"water shortage（水不足）"},{"n":"404","w":"lack","m":"欠如、欠いている","p":[["lack","ない"]],"i":"あるべきものがない","r":"lack of ～（名詞）、lacks ～（動詞）"},{"n":"758","w":"burden","m":"負担、重荷","p":[["bear","運ぶ"]],"i":"背中の重い荷物","r":"a burden on ～"},{"n":"743","w":"strain","m":"緊張、負担、引っぱる","p":[["strain","張る"]],"i":"ピンと引っぱられる","r":"stress ≒"},{"n":"1518","w":"nuisance","m":"迷惑なもの","p":[["nuis","害する"]],"i":"うっとうしいもの","r":"What a nuisance!"},{"n":"1794","w":"fuss","m":"大騒ぎ","p":[["fuss","騒ぎ"]],"i":"どうでもいいことで騒ぐ","r":"make a fuss about ～"},{"n":"1292","w":"breakdown","m":"故障、崩壊","p":[["break","壊れる"],["down","下へ"]],"i":"壊れて止まる","r":"a nervous breakdown（神経衰弱）"},{"n":"1488","w":"chaos","m":"大混乱","p":[["chaos","すき間"]],"i":"めちゃくちゃな状態","r":"カオス"},{"n":"940","w":"barrier","m":"障壁","p":[["bar","棒"]],"i":"行く手をふさぐ棒","r":"language barrier（言葉の壁）"}]},{"world":"fortnite","title":"スクワッドの口論","lab":"けんか","labJa":"テーマ","icon":"theme","en":"There was an {{incident}} in our squad. Two members had a {{quarrel}} about the plan. It became a big {{clash}}. Then it turned into a public {{debate}}. One member said, \"Playing with him is {{torture}}.\" That sounds like {{bullying}}. The team leader made a {{statement}}: \"This is a private {{affair}}.\" It's a {{paradox}}: we love the game, but it makes us fight. Losing a friend would be a {{tragedy}}.","ja":"ぼくらのスクワッドで事件があった。二人のメンバーが作戦について口論した。それは大きな衝突になった。そのあと、それはみんなの前での討論に変わった。あるメンバーが言った。「あいつとプレイするのは拷問だ」。それはいじめのように聞こえる。チームリーダーが声明を出した。「これは個人的な問題だ」。逆説的だ。ぼくらはゲームが大好きなのに、それがぼくらをケンカさせる。友だちを失うのは悲劇だろう。","ken":"<b>debate（ルールのある討論）と quarrel（口ゲンカ）</b>の違い。paradox は「逆説」、現代文の用語と同じ。affair は「出来事・問題」で、foreign affairs（外交問題）って使うで。","words":[{"n":"1054","w":"incident","m":"出来事、事件","p":[["in","上に"],["cid","落ちる"]],"i":"ふりかかってきた出来事","r":"accident と区別"},{"n":"964","w":"quarrel","m":"口ゲンカ","p":[["quarrel","不平"]],"i":"言い合い","r":"have a quarrel with ～"},{"n":"1934","w":"clash","m":"衝突","p":[["clash","ガシャン"]],"i":"意見がぶつかる","r":"clash with ～"},{"n":"505","w":"debate","m":"討論","p":[["de","下へ"],["bate","打つ"]],"i":"打ち負かし合う議論","r":"ディベート"},{"n":"1935","w":"torture","m":"拷問、ひどい苦しみ","p":[["tort","ねじる"]],"i":"体をねじって苦しめる","r":"distort も tort 仲間"},{"n":"1093","w":"bullying","m":"いじめ","p":[["bully","いじめっ子"]],"i":"弱い者をいじめる","r":"cyberbullying（ネットいじめ）"},{"n":"434","w":"statement","m":"声明、発言","p":[["state","述べる"]],"i":"はっきり述べたこと","r":"make a statement"},{"n":"934","w":"affair","m":"出来事、問題","p":[["af","～に"],["fair","する"]],"i":"やるべきこと","r":"foreign affairs（外交問題）"},{"n":"1290","w":"paradox","m":"逆説、矛盾","p":[["para","反して"],["dox","考え"]],"i":"常識に反する考え","r":"paradoxical（逆説的な）"},{"n":"1036","w":"tragedy","m":"悲劇","p":[["trag","ヤギ"]],"i":"ギリシャ悲劇から","r":"comedy（喜劇）が反対"}]},{"world":"fortnite","title":"優勝の特典","lab":"ごほうび","labJa":"テーマ","icon":"theme","en":"The winners get a special {{privilege}}. Jonesy receives a {{certificate}} and a {{novelty}} trophy. One {{benefit}} is early access to the new {{version}} of the game. \"Can you do me a {{favor}}?\" a fan asks. A company holds a {{patent}} on a new {{hybrid}} controller. Jonesy puts his prize money in a bank {{deposit}}. The prize is {{equivalent}} to a year of allowance.","ja":"勝者は特別な特権をもらえる。ジョンジーは証明書とめずらしいトロフィーを受け取る。特典のひとつは、ゲームの新しいバージョンに先に入れることだ。「お願いがあるんだけど」とファンが聞く。ある会社は新しいハイブリッドのコントローラーの特許を持っている。ジョンジーは賞金を銀行に預金する。賞金は1年分のおこづかいに相当する。","ken":"★<b>do 人 a favor（人のお願いを聞く）</b>。Could you do me a favor? は超定番。<b>be equivalent to ～（～に相当する）</b>も前置詞までセットで！","words":[{"n":"969","w":"privilege","m":"特権","p":[["privi","個人の"],["lege","法"]],"i":"その人だけのルール","r":"privileged（特権のある）"},{"n":"1545","w":"certificate","m":"証明書","p":[["cert","確かな"]],"i":"確かだと証明する紙","r":"certify（証明する）"},{"n":"1847","w":"novelty","m":"目新しさ、めずらしい物","p":[["nov","新しい"]],"i":"新しくてめずらしい","r":"novel（新しい、小説）"},{"n":"210","w":"benefit","m":"利益、恩恵","p":[["bene","良い"],["fit","する"]],"i":"良いことをしてくれるもの","r":"beneficial（有益な）"},{"n":"754","w":"version","m":"版、型","p":[["vers","向ける"]],"i":"形を変えたもの","r":"latest version（最新版）"},{"n":"207","w":"favor","m":"親切な行為、好意","p":[["favor","好意"]],"i":"好意でしてあげること","r":"do 人 a favor"},{"n":"1593","w":"patent","m":"特許","p":[["patent","開いた"]],"i":"発明を公開して守る権利","r":"patent office（特許庁）"},{"n":"1612","w":"hybrid","m":"雑種、混成","p":[["hybrid","混ざった"]],"i":"2つを混ぜたもの","r":"ハイブリッドカー"},{"n":"1279","w":"deposit","m":"預金、預ける、たい積物","p":[["de","下に"],["posit","置く"]],"i":"下に置いておく","r":"withdraw（引き出す）が反対"},{"n":"727","w":"equivalent","m":"同等の、相当するもの","p":[["equi","等しい"],["val","価値"]],"i":"価値が等しい","r":"be equivalent to ～"}]},{"world":"fortnite","title":"ひまな日の秘密任務","lab":"名詞いろいろ3","labJa":"テーマ","icon":"theme","en":"In our {{leisure}} time, Jonesy and I take on a secret {{mission}}. It's a risky {{venture}}. We must move with {{caution}}. \"Don't act in {{haste}},\" says Jonesy. My internet has a {{lag}}, which is a problem. We rest in the {{shade}} of a tree. Near an old {{grave}}, we find a bottle of {{poison}}. A strange map is in {{circulation}} among players.","ja":"余暇の時間に、ジョンジーとぼくは秘密の任務を引き受ける。それは危険な挑戦だ。注意して動かないといけない。「急いで行動するな」とジョンジー。ぼくのネットにはラグ（遅れ）があって、それが問題だ。木陰で休む。古いお墓の近くで、毒のビンを見つける。奇妙な地図がプレイヤーの間で出回っている。","ken":"<b>shade（日陰）と shadow（影）</b>の違い★ shade は日が当たらない場所、shadow は形のある影。grave は「墓」と「重大な」の2つ！ a grave mistake（重大なミス）。","words":[{"n":"521","w":"leisure","m":"余暇","p":[["leis","許される"]],"i":"自由にしていい時間","r":"at leisure（ひまで）"},{"n":"767","w":"mission","m":"任務、使命","p":[["miss","送る"]],"i":"送り出されてやること","r":"missionary（宣教師）"},{"n":"766","w":"venture","m":"冒険的事業、思い切ってやる","p":[["venture","adventure"]],"i":"危険をおかす挑戦","r":"venture business（ベンチャー企業）"},{"n":"1281","w":"caution","m":"注意、警告","p":[["caution","用心"]],"i":"気をつけて","r":"cautious（用心深い）"},{"n":"1299","w":"haste","m":"急ぎ","p":[["haste","急ぐ"]],"i":"あわてること","r":"Haste makes waste.（急いては事を仕損じる）"},{"n":"1306","w":"lag","m":"遅れ","p":[["lag","のろのろ"]],"i":"ズレて遅れる","r":"time lag（時間のズレ）、jet lag（時差ぼけ）"},{"n":"773","w":"shade","m":"日陰、色合い","p":[["shade","暗がり"]],"i":"日が当たらない場所","r":"shadow（影）と区別"},{"n":"1616","w":"grave","m":"墓、重大な","p":[["grave","重い"]],"i":"重い石の墓","r":"a grave mistake（重大なミス）"},{"n":"760","w":"poison","m":"毒","p":[["poison","飲み物"]],"i":"体に悪い飲み物","r":"poisonous（有毒な）"},{"n":"772","w":"circulation","m":"循環、流通","p":[["circ","円"]],"i":"ぐるっと回る","r":"blood circulation（血液循環）"}]},{"world":"mario","title":"クッパJr.のいたずら","lab":"感情","labJa":"させる動詞","icon":"feel","en":"Koopa Jr. loves to {{annoy}} his father. He hides behind a door and {{startles:startle}} Koopa. Then he puts a fake spider on his bed to {{scare}} him. Koopa is {{irritated:irritate}}. When Mario beats him again, Koopa is {{frustrated:frustrate}}. Falling in front of everyone {{humiliates:humiliate}} him. Mario's jump {{astonishes:astonish}} the Kinopio. The smell of the poison swamp {{disgusts:disgust}} Luigi. A big explosion {{stuns:stun}} everyone. Peach sings a song to {{soothe}} them.","ja":"クッパJr.は父親をイライラさせるのが大好き。ドアの後ろに隠れてクッパをびっくりさせる。それからベッドにニセのクモを置いてこわがらせる。クッパはいらだつ。マリオにまた負けると、クッパはくやしくてたまらない。みんなの前で転んだことは彼に恥をかかせる。マリオのジャンプはキノピオたちを仰天させる。毒の沼のにおいはルイージをむかつかせる。大爆発がみんなを呆然とさせる。ピーチはみんなを落ち着かせるために歌を歌う。","ken":"感情動詞パート2！ 全部「人を〇〇させる」やから、<b>be annoyed / be frustrated / be disgusted</b> って -ed で使うのがメイン。startle は一瞬の驚き、astonish は大きな驚きやで。","words":[{"n":"356","w":"annoy","m":"イライラさせる","p":[["annoy","いやな"]],"i":"ちょこちょこうるさい","r":"annoying（うっとうしい）"},{"n":"1275","w":"startle","m":"びくっとさせる","p":[["start","飛び上がる"]],"i":"急にびっくりさせる","r":"startled（びっくりした）"},{"n":"663","w":"scare","m":"こわがらせる","p":[["scare","おどす"]],"i":"ワッとおどかす","r":"scared（こわがって）"},{"n":"678","w":"irritate","m":"いらだたせる","p":[["irrit","刺激する"]],"i":"神経をチクチク","r":"irritation（いらだち）"},{"n":"651","w":"frustrate","m":"欲求不満にさせる","p":[["frustr","むだに"]],"i":"がんばってもうまくいかずイライラ","r":"frustration（欲求不満）"},{"n":"1779","w":"humiliate","m":"恥をかかせる","p":[["humil","低い"]],"i":"プライドを低く落とす","r":"humble（謙虚な）と仲間"},{"n":"653","w":"astonish","m":"仰天させる","p":[["as","外へ"],["ton","雷"]],"i":"雷に打たれたほど驚かす","r":"astonishing（驚くべき）"},{"n":"1287","w":"disgust","m":"むかつかせる、嫌悪","p":[["dis","否定"],["gust","味"]],"i":"味が合わない","r":"disgusting（気持ち悪い）"},{"n":"1747","w":"stun","m":"呆然とさせる","p":[["stun","気絶させる"]],"i":"ガーンと頭が真っ白","r":"stunning（驚くほど美しい）"},{"n":"1727","w":"soothe","m":"なだめる、和らげる","p":[["soothe","本当の"]],"i":"やさしく落ち着かせる","r":"soothing（心が落ち着く）"}]},{"world":"mario","title":"心配性のルイージ","lab":"感情","labJa":"させる動詞","icon":"feel","en":"Luigi {{worries:worry}} about everything. \"I {{wonder}} if Koopa is coming,\" he says. Wario likes to {{tease}} him and {{mock}} his green hat. Luigi tries not to let it {{bother}} him. When Wario talks to Peach, he {{flatters:flatter}} her, but she looks at him with {{scorn}}. Suddenly, a loud noise {{alarms:alarm}} the town. It's only Yoshi, and that {{delights:delight}} everyone. The whole kingdom {{rejoices:rejoice}}.","ja":"ルイージは何でも心配する。「クッパが来るんじゃないかなぁ」と彼。ワリオは彼をからかって、緑の帽子をバカにするのが好きだ。ルイージはそれを気にしないようにしている。ワリオはピーチに話しかけるとき、お世辞を言うけど、彼女は軽べつの目で彼を見る。突然、大きな音が町を不安にさせる。でもそれはヨッシーだけで、それがみんなを大喜びさせる。王国全体が喜ぶ。","ken":"<b>tease（からかう）と mock（バカにする）</b>：tease は軽いいじり、mock はもっと意地悪。flatter は「お世辞を言う」、I'm flattered.（光栄です）って返しはめっちゃ使えるで。","words":[{"n":"18","w":"worry","m":"心配する、心配させる","p":[["worry","しめつける"]],"i":"胸がギュッとなる","r":"worry about ～"},{"n":"19","w":"wonder","m":"～かなと思う、驚き","p":[["wonder","不思議"]],"i":"頭に「？」が浮かぶ","r":"no wonder（当然だ）"},{"n":"1435","w":"tease","m":"からかう","p":[["tease","引っぱる"]],"i":"ちょっかいを出す","r":"teasing（からかい）"},{"n":"1733","w":"mock","m":"バカにする","p":[["mock","まねる"]],"i":"まねしてあざける","r":"mock exam（模試）の意味もある"},{"n":"127","w":"bother","m":"悩ませる、わざわざ～する","p":[["bother","騒がせる"]],"i":"気になってうっとうしい","r":"Don't bother.（おかまいなく）"},{"n":"1786","w":"flatter","m":"お世辞を言う","p":[["flatter","なでる"]],"i":"なでて持ち上げる","r":"I'm flattered.（光栄です）"},{"n":"1803","w":"scorn","m":"軽べつ","p":[["scorn","あざける"]],"i":"フンッと見下す","r":"contempt ≒"},{"n":"157","w":"alarm","m":"不安にさせる、警報","p":[["al","～へ"],["arm","武器"]],"i":"「武器を取れ！」の警報","r":"alarm clock"},{"n":"237","w":"delight","m":"大喜びさせる、喜び","p":[["de","完全に"],["light","光"]],"i":"心がパッと明るく","r":"delighted（大喜びの）"},{"n":"1709","w":"rejoice","m":"喜ぶ","p":[["re","強め"],["joice","喜び"]],"i":"みんなで大喜び","r":"joy（喜び）"}]},{"world":"mario","title":"ピーチのいない王国","lab":"気持ち名詞","labJa":"テーマ","icon":"feel","en":"When Peach is taken again, the kingdom is full of {{sorrow}}. Kinopio cries in {{grief}}. Luigi falls into {{despair}}. Life without Peach is pure {{misery}}. Mario shakes with {{rage}}. In Koopa's castle, Peach sees ghosts and screams in {{horror}}. Koopa looks at Mario with {{envy}}. Peach feels {{sympathy}} for Koopa's lonely life. But her {{affection}} is for her people, and her {{passion}} is to protect them.","ja":"ピーチがまたさらわれると、王国は悲しみでいっぱいになる。キノピオは深い悲しみで泣く。ルイージは絶望におちいる。ピーチのいない生活はまったくのみじめさだ。マリオは激しい怒りでふるえる。クッパ城で、ピーチはおばけを見て恐怖で叫ぶ。クッパはうらやましそうにマリオを見る。ピーチはクッパのさびしい生活に同情する。でも彼女の愛情は国民に向いていて、彼女の情熱は国民を守ることなのだ。","ken":"「悲しみ」レベル：<b>sorrow ＜ grief ＜ despair（絶望）</b>。envy（うらやみ）は「いいなぁ」寄り、jealousy（しっと）はもっとドロドロ。sympathy は「同情、共感」やで。","words":[{"n":"1008","w":"sorrow","m":"悲しみ","p":[["sorrow","悩み"]],"i":"しみじみ悲しい","r":"sad ≒"},{"n":"1570","w":"grief","m":"深い悲しみ","p":[["grief","重い"]],"i":"心が重くなる悲しみ","r":"grieve（深く悲しむ）"},{"n":"1449","w":"despair","m":"絶望","p":[["de","離れて"],["spair","希望"]],"i":"希望から離れる","r":"in despair（絶望して）"},{"n":"1462","w":"misery","m":"みじめさ","p":[["miser","不幸な"]],"i":"ひどく不幸な状態","r":"miserable（みじめな）"},{"n":"1282","w":"rage","m":"激しい怒り","p":[["rage","狂気"]],"i":"カッとなる怒り","r":"outrage（激怒）"},{"n":"476","w":"horror","m":"恐怖","p":[["horr","毛が逆立つ"]],"i":"ゾッとする恐怖","r":"ホラー映画"},{"n":"686","w":"envy","m":"うらやみ","p":[["in","上を"],["vy","見る"]],"i":"うらやましく見る","r":"envious（うらやましい）"},{"n":"946","w":"sympathy","m":"同情、共感","p":[["sym","一緒に"],["pathy","感じる"]],"i":"一緒に感じる","r":"sympathize（同情する）"},{"n":"998","w":"affection","m":"愛情","p":[["af","～へ"],["fect","作用"]],"i":"心が相手に向く","r":"affectionate（愛情深い）"},{"n":"1023","w":"passion","m":"情熱","p":[["pass","苦しむ"]],"i":"苦しいほど熱い思い","r":"passionate（情熱的な）"}]},{"world":"mario","title":"マリオの情け","lab":"気持ち名詞2","labJa":"テーマ","icon":"feel","en":"Mario faces Koopa with {{courage}}. His {{confidence}} comes from years of practice. Luigi is full of {{enthusiasm}} today too. But Koopa feels {{hatred}} for the brothers. He shows {{contempt}} for anyone weaker than him. Deep down, though, he has a strange {{melancholy}}. Luigi has {{empathy}} for him. When Koopa falls, Mario shows {{mercy}}. Koopa doesn't say it, but the {{sentiment}} touches him. Still, the Kinopio live in {{dread}} of his next attack.","ja":"マリオは勇気をもってクッパに立ち向かう。その自信は何年もの練習から来ている。ルイージも今日は熱意にあふれている。でもクッパは兄弟に憎しみを感じている。自分より弱い者には軽べつを見せる。それでも、心の奥では不思議な憂うつを抱えている。ルイージは彼に共感している。クッパが倒れると、マリオは情けをかける。クッパは口には出さないけど、その気持ちに心を動かされる。それでも、キノピオたちは彼の次の攻撃を恐れて暮らしている。","ken":"<b>sympathy（同情）と empathy（共感）</b>の違い★ empathy は「相手の立場になって感じる」。最近の長文でよく出る単語やで。contempt（軽べつ）は scorn とほぼ同じ。","words":[{"n":"945","w":"courage","m":"勇気","p":[["cour","心"]],"i":"心の強さ","r":"encourage（勇気づける）"},{"n":"481","w":"confidence","m":"自信、信頼","p":[["con","完全に"],["fid","信じる"]],"i":"自分を信じる","r":"confident（自信のある）"},{"n":"722","w":"enthusiasm","m":"熱意","p":[["en","中に"],["thus","神"]],"i":"神が入ったような熱さ","r":"enthusiastic（熱心な）"},{"n":"1869","w":"hatred","m":"憎しみ","p":[["hate","憎む"]],"i":"大きらい","r":"hate より強い名詞"},{"n":"1907","w":"contempt","m":"軽べつ","p":[["con","強め"],["tempt","見下す"]],"i":"心から見下す","r":"contemptuous（軽べつした）"},{"n":"1846","w":"melancholy","m":"憂うつ","p":[["melan","黒い"],["choly","胆汁"]],"i":"黒い胆汁のせいで気分が暗い","r":"gloomy ≒"},{"n":"1873","w":"empathy","m":"共感","p":[["em","中に"],["pathy","感じる"]],"i":"相手の中に入って感じる","r":"sympathy と区別"},{"n":"1316","w":"mercy","m":"慈悲、情け","p":[["mercy","ほうび"]],"i":"ゆるしてあげる心","r":"at the mercy of ～（～のなすがままに）"},{"n":"1497","w":"sentiment","m":"感情、気持ち","p":[["sent","感じる"]],"i":"しみじみした気持ち","r":"sentimental（感傷的な）"},{"n":"1357","w":"dread","m":"恐怖、ひどく恐れる","p":[["dread","恐れる"]],"i":"来るのがこわい","r":"dreadful（恐ろしい）"}]},{"world":"mario","title":"マリオカートの前","lab":"気持ち名詞3","labJa":"テーマ","icon":"feel","en":"Koopa has a short {{temper}}. Luigi has a gentle {{temperament}}. Today, Luigi feels some {{apprehension}} before the race. There is {{tension}} in the air. Wario has a strong {{desire}} to win. His {{motive}} is the prize money. Koopa's {{ambition}} is to rule the world. Luigi's {{aspiration}} is to be a hero like Mario. On {{impulse}}, Luigi jumps out first. Winning the race raises his {{self-esteem}}.","ja":"クッパは短気だ。ルイージはおだやかな気質を持っている。今日、ルイージはレース前に少し不安を感じている。空気には緊張感がただよっている。ワリオは勝ちたいという強い欲望がある。彼の動機は賞金だ。クッパの野望は世界を支配することだ。ルイージの強い願いはマリオのようなヒーローになることだ。衝動的に、ルイージは最初に飛び出す。レースに勝ったことで、彼の自尊心が高まる。","ken":"<b>temper（その場の機嫌・かんしゃく）と temperament（生まれつきの気質）</b>の違い★ lose one's temper（カッとなる）は熟語で出る。ambition は「野心」、Boys, be ambitious! のあれやで。","words":[{"n":"745","w":"temper","m":"機嫌、かんしゃく","p":[["temper","混ぜる"]],"i":"その時の気分","r":"lose one's temper（カッとなる）"},{"n":"1817","w":"temperament","m":"気質","p":[["temper","混ぜる"],["ment","もの"]],"i":"生まれつきの性格の混ざり具合","r":"personality ≒"},{"n":"1845","w":"apprehension","m":"不安、理解","p":[["ap","～へ"],["prehend","つかむ"]],"i":"先のことをつかんで心配","r":"apprehensive（不安な）"},{"n":"1004","w":"tension","m":"緊張","p":[["tens","張る"]],"i":"ピンと張りつめた","r":"tense（緊張した）"},{"n":"423","w":"desire","m":"欲望、強く望む","p":[["de","～から"],["sire","星"]],"i":"星に願う","r":"desirable（望ましい）"},{"n":"1017","w":"motive","m":"動機","p":[["mot","動く"]],"i":"心を動かすもの","r":"motivation（やる気）"},{"n":"991","w":"ambition","m":"野心、大望","p":[["amb","回る"]],"i":"名誉を求めて歩き回る","r":"ambitious（野心的な）"},{"n":"1885","w":"aspiration","m":"強い願い、熱望","p":[["a","～へ"],["spire","息をする"]],"i":"そこへ向かって息をはずませる","r":"aspire to ～（～を熱望する）"},{"n":"1453","w":"impulse","m":"衝動","p":[["im","中へ"],["pulse","押す"]],"i":"内側からグッと押される","r":"on impulse（衝動的に）"},{"n":"1485","w":"self-esteem","m":"自尊心","p":[["self","自分"],["esteem","尊敬"]],"i":"自分を大切に思う気持ち","r":"low self-esteem（自己肯定感が低い）"}]},{"world":"mario","title":"キノピオのいいところ","lab":"いい性格","labJa":"テーマ","icon":"feel","en":"Kinopio is a {{loyal}} servant of Peach. He is {{polite}} to everyone and very {{diligent}}. He is always {{eager}} to help and {{willing}} to work late. He is {{generous}} and shares his mushrooms. He is not strong, but he is {{brave}}. When people praise him, he stays {{humble}}. \"It's nothing,\" he says. He is {{modest}} about his success and {{sincere}} in his words.","ja":"キノピオはピーチの忠実な家来だ。誰に対しても礼儀正しく、とても勤勉だ。いつも熱心に手伝おうとして、遅くまで働くこともいとわない。気前がよくて、キノコを分けてくれる。強くはないけど、勇敢だ。人にほめられても、謙虚なままだ。「たいしたことないです」と彼。成功しても控えめで、言葉は誠実だ。","ken":"★<b>be willing to ～（～するのをいとわない）</b>と<b>be eager to ～（～したくてたまらない）</b>はセット！ humble と modest はどっちも「謙虚な」。キノピオみたいな人になろな笑","words":[{"n":"1114","w":"loyal","m":"忠実な","p":[["loyal","法を守る"]],"i":"裏切らない","r":"loyalty（忠誠）"},{"n":"564","w":"polite","m":"礼儀正しい","p":[["polite","磨かれた"]],"i":"ピカピカに磨かれたマナー","r":"rude が反対語"},{"n":"1644","w":"diligent","m":"勤勉な","p":[["dilig","大切にする"]],"i":"コツコツまじめ","r":"hardworking ≒"},{"n":"298","w":"eager","m":"熱心な、～したがる","p":[["eager","鋭い"]],"i":"やる気がとがっている","r":"be eager to ～"},{"n":"272","w":"willing","m":"快く～する","p":[["will","意志"]],"i":"いやがらずにやる","r":"be willing to ～"},{"n":"1116","w":"generous","m":"気前のいい","p":[["gener","生まれ"]],"i":"生まれの良い人のふるまい","r":"generosity（気前のよさ）"},{"n":"1150","w":"brave","m":"勇敢な","p":[["brave","勇ましい"]],"i":"こわくても立ち向かう","r":"bravery（勇気）"},{"n":"1323","w":"humble","m":"謙虚な、身分の低い","p":[["hum","地面"]],"i":"地面に近い低い姿勢","r":"humility（謙虚さ）"},{"n":"813","w":"modest","m":"控えめな","p":[["mod","ほどよい"]],"i":"ほどほどにする","r":"modesty（謙虚さ）"},{"n":"1641","w":"sincere","m":"誠実な","p":[["sincere","混じりけのない"]],"i":"うそがない","r":"Sincerely,（手紙の結び）"}]},{"world":"mario","title":"ピーチとヨッシー","lab":"いい性格2","labJa":"テーマ","icon":"feel","en":"Peach is a {{noble}} princess with a {{tender}} heart. She is {{punctual}} and always arrives on time. She stays {{calm}} even in danger. Yoshi is {{optimistic}}. \"Everything will be fine!\" he says. He is {{lively}} and {{merry}}. Luigi is an {{earnest}} young man. He is {{grateful}} for Mario's help. Koopa is not exactly {{decent}}, but he loves his son.","ja":"ピーチはやさしい心を持った気高い王女だ。時間を守り、いつも時間どおりに来る。危険な時でも落ち着いている。ヨッシーは楽観的だ。「全部うまくいくよ！」と彼。元気で陽気だ。ルイージはまじめな青年だ。マリオの助けに感謝している。クッパはまともとは言えないけど、息子を愛している。","ken":"★<b>be grateful to 人 for ～（～のことで人に感謝している）</b>。optimistic（楽観的な）⇔ pessimistic（悲観的な）は反対語セットで！ punctual（時間を守る）は日本人の得意技やな笑","words":[{"n":"822","w":"noble","m":"気高い、貴族の","p":[["noble","知られた"]],"i":"身分も心も高い","r":"nobility（貴族）"},{"n":"1998","w":"tender","m":"やさしい、柔らかい","p":[["tend","伸ばす"]],"i":"ふんわり柔らかい","r":"tender meat（柔らかい肉）"},{"n":"1654","w":"punctual","m":"時間を守る","p":[["punct","点"]],"i":"約束の時間にピタッと","r":"on time ≒"},{"n":"285","w":"calm","m":"落ち着いた","p":[["calm","暑さで休む"]],"i":"波がない静けさ","r":"calm down（落ち着く）"},{"n":"1161","w":"optimistic","m":"楽観的な","p":[["optim","最善の"]],"i":"何でもいい方に考える","r":"pessimistic（悲観的な）が反対"},{"n":"1164","w":"lively","m":"元気な","p":[["live","生きる"]],"i":"生き生きしている","r":"発音「ライヴリー」"},{"n":"2018","w":"merry","m":"陽気な","p":[["merry","楽しい"]],"i":"ウキウキ楽しい","r":"Merry Christmas"},{"n":"1953","w":"earnest","m":"まじめな","p":[["earnest","真剣"]],"i":"一生けんめい本気","r":"in earnest（本気で）"},{"n":"1163","w":"grateful","m":"感謝している","p":[["grat","喜び"]],"i":"ありがたい","r":"be grateful for ～"},{"n":"1337","w":"decent","m":"まともな、きちんとした","p":[["dec","ふさわしい"]],"i":"ちゃんとしている","r":"a decent job（まともな仕事）"}]},{"world":"mario","title":"ワリオとワルイージ","lab":"悪い性格","labJa":"テーマ","icon":"feel","en":"Wario is {{greedy}}. He wants all the coins for himself. He is {{selfish}} and {{rude}} to everyone. He is also {{lazy}} and sleeps all day. He is {{jealous}} of Mario's fame. He is {{arrogant}} and thinks he is the best. He is {{stubborn}} and never listens. Sometimes he is even {{cruel}} to small animals. Waluigi is {{naive}} and believes everything Wario says. He is {{clumsy}} and often falls down.","ja":"ワリオは欲ばりだ。全部のコインを自分のものにしたい。自分勝手で、誰に対しても失礼だ。それに怠け者で、一日中寝ている。マリオの名声に嫉妬している。傲慢で、自分が最高だと思っている。頑固で、絶対に人の話を聞かない。小さな動物に残酷なことさえある。ワルイージは世間知らずで、ワリオの言うことを何でも信じる。不器用で、よく転ぶ。","ken":"★<b>naive は「ナイーブ（繊細）」じゃなくて「世間知らず、だまされやすい」</b>！ 日本語とズレてる単語は要注意。<b>be jealous of ～（～に嫉妬する）</b>も of がポイント。","words":[{"n":"1678","w":"greedy","m":"欲ばりな","p":[["greed","どん欲"]],"i":"全部ほしい！","r":"greed（どん欲）"},{"n":"1167","w":"selfish","m":"自分勝手な","p":[["self","自分"],["ish","っぽい"]],"i":"自分のことばっかり","r":"selfless（無私の）"},{"n":"566","w":"rude","m":"失礼な","p":[["rude","荒い"]],"i":"マナーが荒っぽい","r":"polite が反対語"},{"n":"842","w":"lazy","m":"怠けた","p":[["lazy","だらけた"]],"i":"ゴロゴロ","r":"laziness（怠惰）"},{"n":"1333","w":"jealous","m":"嫉妬した","p":[["jeal","熱心"]],"i":"人の幸せが気になってしまう","r":"be jealous of ～"},{"n":"1975","w":"arrogant","m":"傲慢な","p":[["ar","～へ"],["rog","求める"]],"i":"えらそうに要求する","r":"arrogance（傲慢）"},{"n":"1336","w":"stubborn","m":"頑固な","p":[["stub","切り株"]],"i":"切り株みたいに動かない","r":"obstinate ≒"},{"n":"1154","w":"cruel","m":"残酷な","p":[["cru","生の、荒い"]],"i":"血も涙もない","r":"cruelty（残酷さ）"},{"n":"1949","w":"naive","m":"世間知らずの","p":[["naive","生まれたまま"]],"i":"子どもみたいにだまされやすい","r":"★日本語の「ナイーブ」とズレる"},{"n":"1969","w":"clumsy","m":"不器用な","p":[["clumsy","かじかんだ"]],"i":"手がうまく動かない","r":"awkward ≒"}]},{"world":"mario","title":"クッパ軍団の手下たち","lab":"悪い性格2","labJa":"テーマ","icon":"feel","en":"Koopa's minions are not very smart. One is {{reckless}} and runs into walls. Another is {{shy}} and hides behind trees. Some are just {{silly}}, and some are truly {{stupid}}. Koopa Jr. is {{naughty}} and plays tricks on everyone. Kamek is a {{wicked}} magician with an {{evil}} plan. Koopa is {{vain}} and looks at his face in the mi
