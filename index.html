rowing. Pikachu is {{prone}} to get angry when someone pulls its tail. Musashi {{provokes:provoke}} Pikachu on purpose. Satoshi's friends are {{predominantly}} water-type trainers. One day, he meets a {{prominent}} Pokémon master. Her words have a {{profound}} effect on him. \"Battle with your heart,\" she says. Winning the league brings great {{prestige}}. At noon, or more {{precisely}} 12:01, the champion {{proclaims:proclaim}} Satoshi the winner.","ja":"サトシは将来有望な若いトレーナーだ。バトルの熟練度が上がってきている。ピカチュウはしっぽを引っぱられると怒りやすい。ムサシはわざとピカチュウを挑発する。サトシの友だちは主にみずタイプのトレーナーだ。ある日、彼は著名なポケモンマスターに会う。彼女の言葉は彼に深い影響を与える。「心でバトルしなさい」と彼女。リーグで優勝するとすばらしい名声が手に入る。正午、もっと正確に言うと12時1分に、チャンピオンはサトシを勝者だと宣言する。","ken":"★<b>be prone to ～（～しがちだ）</b>は be likely to と同じ意味で出る！ profound（深い）は deep の上品版。promising は「有望な」、promise（約束）の ing やけど意味が違うで。","words":[{"n":"1682","w":"promising","m":"有望な","p":[["promise","約束"]],"i":"将来を約束されてる","r":"a promising player"},{"n":"1901","w":"proficiency","m":"熟練、上達","p":[["pro","前へ"],["fic","作る"]],"i":"前へ進んでできるようになる","r":"English proficiency（英語力）"},{"n":"1994","w":"prone","m":"～しがちな","p":[["prone","前に傾いた"]],"i":"そっちに傾きやすい","r":"be prone to ～★"},{"n":"1210","w":"provoke","m":"挑発する、引き起こす","p":[["pro","前へ"],["voke","呼ぶ"]],"i":"わざと呼び出す","r":"provocative（挑発的な）"},{"n":"2026","w":"predominantly","m":"主に","p":[["pre","前に"],["dominant","支配的な"]],"i":"いちばん多くを占めて","r":"mainly ≒"},{"n":"1170","w":"prominent","m":"著名な、目立つ","p":[["pro","前へ"],["min","突き出る"]],"i":"前に突き出た","r":"famous ≒"},{"n":"1147","w":"profound","m":"深い","p":[["pro","前へ"],["found","底"]],"i":"底の底まで","r":"deep ≒"},{"n":"1503","w":"prestige","m":"名声","p":[["pre","前に"],["stige","しばる"]],"i":"人を前にしばりつける魅力","r":"prestigious（名門の）"},{"n":"843","w":"precisely","m":"正確に","p":[["pre","前で"],["cise","切る"]],"i":"ピタッと切りそろえた","r":"exactly ≒"},{"n":"1736","w":"proclaim","m":"宣言する","p":[["pro","前で"],["claim","叫ぶ"]],"i":"人前で叫ぶ","r":"proclamation（宣言）"}]},{"world":"pokemon","title":"オーキド博士の信条","lab":"prim- / fore-","labJa":"第一の・前に","icon":"pre","en":"Professor Okido's {{prime}} goal is to protect Pokémon. His {{principal}} research is about their origins. His {{principle}} is \"Never hurt a Pokémon.\" Long ago, {{primitive}} Pokémon lived in caves. Some looked like a {{primate}}, such as Okorizaru. {{Prior:prior}} to the trip, Satoshi checks the weather {{forecast}}. Safety is his top {{priority}}. The Pokémon Center will {{provide}} food and water. But nobody can {{foresee}} what will happen next.","ja":"オーキド博士のいちばんの目標はポケモンを守ることだ。彼の主な研究はポケモンの起源についてだ。彼の信条は「ポケモンを絶対に傷つけないこと」だ。ずっと昔、原始的なポケモンが洞窟に住んでいた。オコリザルのように霊長類に似たものもいた。旅の前に、サトシは天気予報を確認する。安全が彼の最優先事項だ。ポケモンセンターは食べ物と水を提供してくれる。でも次に何が起こるかは誰にも予見できない。","ken":"<b>principal（主な、校長）と principle（原理、信条）</b>は発音が同じで超まぎらわしい★ prim は「第一の」。prior to ～（～より前に）は before のかたい言い方。<b>provide A with B（AにBを与える）</b>も超大事！","words":[{"n":"811","w":"prime","m":"最も重要な、最高の","p":[["prim","第一の"]],"i":"いちばんの","r":"prime minister（首相）"},{"n":"547","w":"principal","m":"主な、校長","p":[["prin","第一の"],["cip","取る"]],"i":"いちばん最初に来る","r":"principle（原理）と区別★"},{"n":"218","w":"principle","m":"原理、信条","p":[["prin","第一の"]],"i":"いちばんの根本","r":"in principle（原則として）"},{"n":"570","w":"primitive","m":"原始的な","p":[["prim","最初の"]],"i":"いちばん最初の時代の","r":"primitive tools"},{"n":"1534","w":"primate","m":"霊長類","p":[["prim","第一の"]],"i":"動物の中でトップのグループ","r":"サル、ゴリラ、人間など"},{"n":"1180","w":"prior","m":"前の、優先する","p":[["prior","より前の"]],"i":"～より先に","r":"prior to ～（～より前に）"},{"n":"992","w":"forecast","m":"予報","p":[["fore","前に"],["cast","投げる"]],"i":"先のことを投げかける","r":"weather forecast（天気予報）"},{"n":"1001","w":"priority","m":"優先（事項）","p":[["prior","前の"]],"i":"先にやるべきこと","r":"top priority（最優先事項）"},{"n":"7","w":"provide","m":"提供する","p":[["pro","前もって"],["vide","見る"]],"i":"先を見て用意する","r":"provide A with B★"},{"n":"1762","w":"foresee","m":"予見する","p":[["fore","前に"],["see","見る"]],"i":"先を見通す","r":"foreseeable（予見できる）"}]},{"world":"pokemon","title":"ポケモンの生き物図鑑","lab":"生き物","labJa":"テーマ","icon":"theme","en":"Professor Okido studies every {{species}} of Pokémon. He calls them amazing {{creatures:creature}}. Butterfree is like an {{insect}}. Pikachu is like a mouse, which is a {{mammal}}. Okorizaru looks like an {{ape}}. Pijon is a {{predator}} in the forest, and Kyatapi is its {{prey}}. Kyatapi looks like a green {{worm}}. Parasect has a mushroom {{parasite}} on its back. Kabigon is a huge but gentle {{beast}}.","ja":"オーキド博士はポケモンのあらゆる種を研究している。彼はポケモンを驚くべき生き物と呼ぶ。バタフリーは昆虫のようだ。ピカチュウはネズミのようで、ネズミは哺乳類だ。オコリザルは類人猿のように見える。ピジョンは森の捕食者で、キャタピーはそのえじきだ。キャタピーは緑色の芋虫のように見える。パラセクトは背中にキノコの寄生生物がいる。カビゴンは巨大だけどおだやかな獣だ。","ken":"<b>predator（捕食者）⇔ prey（えじき）</b>は生物の長文でセットで出る★ species は単数も複数も species（s で終わるけど同じ形）。an endangered species（絶滅危惧種）やで。","words":[{"n":"1107","w":"species","m":"（生物の）種","p":[["spec","種類"]],"i":"生き物の種類","r":"単数も複数も species★"},{"n":"446","w":"creature","m":"生き物","p":[["create","作る"]],"i":"作られたもの","r":"living creatures"},{"n":"512","w":"insect","m":"昆虫","p":[["in","中に"],["sect","切る"]],"i":"体に切れ目がある","r":"bug ≒"},{"n":"1084","w":"mammal","m":"哺乳類","p":[["mamma","乳房"]],"i":"乳で子を育てる動物","r":"reptile（は虫類）"},{"n":"1103","w":"ape","m":"類人猿","p":[["ape","サル"]],"i":"しっぽのない大きなサル","r":"monkey より人に近い"},{"n":"1572","w":"predator","m":"捕食者","p":[["pred","奪う"]],"i":"ほかの動物をとって食べる","r":"predatory（捕食性の）"},{"n":"765","w":"prey","m":"えじき","p":[["prey","つかまえられたもの"]],"i":"食べられる側","r":"fall prey to ～（～のえじきになる）"},{"n":"1478","w":"worm","m":"虫（ミミズ、芋虫など）","p":[["worm","はうもの"]],"i":"にょろにょろ","r":"The early bird catches the worm.（早起きは三文の徳）"},{"n":"1836","w":"parasite","m":"寄生生物","p":[["para","そばに"],["site","食べ物"]],"i":"人のそばで食べる","r":"parasitic（寄生の）"},{"n":"1455","w":"beast","m":"獣","p":[["beast","動物"]],"i":"大きくて野生の動物","r":"Beauty and the Beast"}]},{"world":"pokemon","title":"ポケモン保護区","lab":"生き物2","labJa":"テーマ","icon":"theme","en":"Satoshi visits a Pokémon reserve. It's a natural {{habitat}} for {{wildlife}}. A {{flock}} of Poppo flies overhead. A Pokémon egg is about to {{hatch}}. Kasumi {{feeds:feed}} the baby Pokémon. Takeshi wants to {{breed}} Pokémon in the future. A wild Pokémon is hard to {{tame}}. A mother Pokémon protects her {{offspring}}. Fossil Pokémon like Amaruruga look like a {{dinosaur}}. A Persian {{stalks:stalk}} a small Pokémon in the grass.","ja":"サトシはポケモン保護区を訪れる。そこは野生生物の自然の生息地だ。ポッポの群れが頭上を飛んでいく。ポケモンのタマゴがもうすぐかえる。カスミは赤ちゃんポケモンにえさをやる。タケシは将来ポケモンを繁殖させて育てたい。野生のポケモンは手なずけるのが難しい。お母さんポケモンは自分の子どもを守る。アマルルガのような化石ポケモンは恐竜のように見える。ペルシアンが草むらの中で小さなポケモンに忍び寄る。","ken":"<b>offspring（子孫、子）</b>は単数でも複数でも offspring！ habitat（生息地）は環境問題の長文で超よく出るで★ stalk は「忍び寄る」と「（植物の）茎」。ストーカーの語源もこれ。","words":[{"n":"1092","w":"habitat","m":"生息地","p":[["habit","住む"]],"i":"生き物が住む場所","r":"natural habitat"},{"n":"1055","w":"wildlife","m":"野生生物","p":[["wild","野生"],["life","生命"]],"i":"自然の中の動植物","r":"wildlife protection"},{"n":"1297","w":"flock","m":"（鳥・羊の）群れ","p":[["flock","群れ"]],"i":"わさわさ集まる","r":"flock together（群がる）"},{"n":"1253","w":"hatch","m":"（卵が）かえる","p":[["hatch","ひっかく"]],"i":"殻を割って出てくる","r":"hatch a plan（計画を企てる）"},{"n":"75","w":"feed","m":"えさをやる、養う","p":[["feed","食べ物"]],"i":"食べ物を与える","r":"be fed up with ～（～にうんざり）"},{"n":"642","w":"breed","m":"繁殖させる、品種","p":[["breed","育てる"]],"i":"子どもを産ませて育てる","r":"breed-bred-bred"},{"n":"1755","w":"tame","m":"飼いならす、おとなしい","p":[["tame","家の"]],"i":"人に慣れさせる","r":"wild が反対"},{"n":"1473","w":"offspring","m":"子孫、子","p":[["off","離れて"],["spring","生まれる"]],"i":"親から生まれ出たもの","r":"単数も複数も offspring"},{"n":"1094","w":"dinosaur","m":"恐竜","p":[["dino","おそろしい"],["saur","トカゲ"]],"i":"おそろしいトカゲ","r":"恐竜"},{"n":"1735","w":"stalk","m":"忍び寄る、茎","p":[["stalk","こっそり歩く"]],"i":"そーっと近づく","r":"stalker（ストーカー）"}]},{"world":"pokemon","title":"色違いの秘密","lab":"生物学","labJa":"テーマ","icon":"theme","en":"Professor Okido studies Pokémon biology. Every {{organism}} is made of {{cells:cell}}. Each cell has {{genes:gene}} inside. {{Heredity:heredity}} explains why baby Pokémon look like their parents. Sometimes, a {{mutation}} creates a shiny Pokémon. In the brain, a {{neuron}} sends signals. Under the microscope, he sees a {{microbe}}. Some {{germs:germ}} make Pokémon sick, and a {{virus}} is spreading in town. He takes a small piece of {{tissue}} to study it.","ja":"オーキド博士はポケモンの生物学を研究している。すべての生物は細胞でできている。それぞれの細胞の中には遺伝子がある。遺伝は、なぜ赤ちゃんポケモンが親に似ているのかを説明する。ときどき、突然変異で色違いのポケモンが生まれる。脳の中では、神経細胞が信号を送る。顕微鏡の下で、彼は微生物を見る。ポケモンを病気にする細菌もいて、町ではウイルスが広がっている。彼は調べるために組織を少し取る。","ken":"<b>gene（遺伝子）、heredity（遺伝）、mutation（突然変異）</b>はセット。色違いポケモンはまさに mutation のイメージやな笑 tissue は「ティッシュ」だけじゃなくて「（体の）組織」の意味が大事やで★","words":[{"n":"1051","w":"organism","m":"生物","p":[["organ","器官"]],"i":"体の仕組みを持つもの","r":"living organism"},{"n":"522","w":"cell","m":"細胞、小部屋","p":[["cell","小部屋"]],"i":"生き物の小さな部屋","r":"cell phone（携帯電話）"},{"n":"517","w":"gene","m":"遺伝子","p":[["gen","生む"]],"i":"親から子へ伝わる情報","r":"genetic（遺伝の）"},{"n":"1906","w":"heredity","m":"遺伝","p":[["her","相続"]],"i":"親から受けつぐこと","r":"hereditary（遺伝的な）"},{"n":"1926","w":"mutation","m":"突然変異","p":[["mut","変わる"]],"i":"遺伝子が変わること","r":"mutate（変異する）"},{"n":"1923","w":"neuron","m":"神経細胞","p":[["neur","神経"]],"i":"脳の情報を伝える細胞","r":"neural（神経の）"},{"n":"1486","w":"microbe","m":"微生物","p":[["micro","小さい"],["be","命"]],"i":"目に見えない小さな生き物","r":"microscope（顕微鏡）"},{"n":"1602","w":"germ","m":"細菌","p":[["germ","芽"]],"i":"病気のもとになる小さな菌","r":"germ-free（無菌の）"},{"n":"1065","w":"virus","m":"ウイルス","p":[["virus","毒"]],"i":"体に入って病気を起こす","r":"viral（ウイルスの、バズった）"},{"n":"1291","w":"tissue","m":"（体の）組織、ティッシュ","p":[["tissue","織物"]],"i":"細胞が集まった布みたいなもの","r":"★「組織」の意味が大事"}]},{"world":"pokemon","title":"町に広がる病気","lab":"病気","labJa":"テーマ","icon":"theme","en":"An {{epidemic}} spreads among the Pokémon in town. The first {{symptom}} is a high {{fever}}. Then comes a bad {{cough}}. The disease can {{infect}} any Pokémon. Joy says it's a new {{syndrome}}. Some Pokémon are {{immune}} to it. In history, a {{plague}} killed many people. Thanks to modern medicine, {{mortality}} is low now. Joy gives the sick Pokémon an {{antibiotic}}.","ja":"町のポケモンの間で伝染病が広がる。最初の症状は高熱だ。それからひどいせきが出る。その病気はどんなポケモンにも感染しうる。ジョーイさんは、それは新しい症候群だと言う。それに免疫があるポケモンもいる。歴史の中では、疫病が多くの人を死なせた。現代医学のおかげで、今は死亡率は低い。ジョーイさんは病気のポケモンに抗生物質をあたえる。","ken":"病気の単語は医療系の長文で出る！ <b>be immune to ～（～に免疫がある）</b>、immune system（免疫システム）はセットで★ epidemic（流行病）は epi（上に）+ demic（人々）、人々の上に広がる病気やで。","words":[{"n":"1605","w":"epidemic","m":"伝染病、流行","p":[["epi","上に"],["dem","人々"]],"i":"人々の間に広がる","r":"pandemic（世界的流行）"},{"n":"973","w":"symptom","m":"症状","p":[["sym","一緒に"],["ptom","落ちる"]],"i":"病気と一緒に出てくるもの","r":"symptoms of a cold（かぜの症状）"},{"n":"432","w":"fever","m":"熱","p":[["fever","熱"]],"i":"体が熱い","r":"have a fever（熱がある）"},{"n":"1011","w":"cough","m":"せき","p":[["cough","ゴホッ"]],"i":"ゴホゴホ","r":"発音「コフ」"},{"n":"698","w":"infect","m":"感染させる","p":[["in","中に"],["fect","作る"]],"i":"体の中に入りこむ","r":"infection（感染）"},{"n":"1607","w":"syndrome","m":"症候群","p":[["syn","一緒に"],["drome","走る"]],"i":"一緒に起こる症状のまとまり","r":"Down syndrome"},{"n":"1157","w":"immune","m":"免疫がある","p":[["im","否定"],["mune","義務"]],"i":"病気にかかる義務がない","r":"immune system（免疫システム）"},{"n":"1298","w":"plague","m":"疫病、悩ます","p":[["plague","打撃"]],"i":"昔の恐ろしい伝染病","r":"be plagued by ～（～に悩まされる）"},{"n":"1606","w":"mortality","m":"死亡率","p":[["mort","死"]],"i":"死ぬ割合","r":"mortal（死すべき運命の）"},{"n":"1037","w":"antibiotic","m":"抗生物質","p":[["anti","反対"],["bio","命"]],"i":"細菌の命に反対する薬","r":"ペニシリンなど"}]},{"world":"pokemon","title":"ジョーイさんの健康講座","lab":"病気2","labJa":"テーマ","icon":"theme","en":"Joy gives a health talk at the Pokémon Center. \"Humans get sick too,\" she says. \"{{Cancer:cancer}} can start as a small {{tumor}}. Eating too much sugar can lead to {{obesity}} and {{diabetes}}. Some old people get {{dementia}}.\" She shows a {{clinical}} study. \"An early {{diagnosis}} is important.\" Some diseases are {{chronic}} and last for years. An {{inflammation}} makes skin red and hot. She also talks about how to support people with a {{disability}}.","ja":"ジョーイさんがポケモンセンターで健康についての話をする。「人間も病気になるのよ」と彼女。「がんは小さな腫瘍から始まることがあるわ。砂糖をとりすぎると肥満や糖尿病につながることがある。お年寄りの中には認知症になる人もいるの」。彼女は臨床研究を見せる。「早い診断が大切よ」。何年も続く慢性の病気もある。炎症は皮膚を赤く熱くする。彼女は障がいのある人をどう支えるかについても話す。","ken":"<b>chronic（慢性の）⇔ acute（急性の）</b>は反対語セット★ 医療系の長文はこのへんがわかると一気に読みやすくなる。diagnosis（診断）は動詞が diagnose やで。","words":[{"n":"1024","w":"cancer","m":"がん","p":[["cancer","カニ"]],"i":"カニの足のように広がる","r":"cancer cells（がん細胞）"},{"n":"1878","w":"tumor","m":"腫瘍","p":[["tum","ふくれる"]],"i":"体の中のできもの","r":"brain tumor（脳腫瘍）"},{"n":"1592","w":"obesity","m":"肥満","p":[["obese","太りすぎの"]],"i":"体重が多すぎる状態","r":"obese（肥満の）"},{"n":"1591","w":"diabetes","m":"糖尿病","p":[["dia","通して"],["betes","行く"]],"i":"水が体を素通りする病気","r":"diabetic（糖尿病の）"},{"n":"1552","w":"dementia","m":"認知症","p":[["de","離れて"],["ment","心"]],"i":"記憶や判断が弱くなる病気","r":"Alzheimer's disease ≒"},{"n":"1684","w":"clinical","m":"臨床の","p":[["clinic","病床"]],"i":"実際の患者さんでの","r":"clinical trial（臨床試験）"},{"n":"1538","w":"diagnosis","m":"診断","p":[["dia","通して"],["gnosis","知る"]],"i":"調べて病気を見きわめる","r":"diagnose（診断する）"},{"n":"1685","w":"chronic","m":"慢性の","p":[["chron","時間"]],"i":"長い時間続く","r":"acute（急性の）が反対"},{"n":"1614","w":"inflammation","m":"炎症","p":[["in","中に"],["flam","炎"]],"i":"体の中が燃えるように赤くはれる","r":"inflame（炎症を起こす）"},{"n":"786","w":"disability","m":"障がい","p":[["dis","否定"],["ability","能力"]],"i":"何かをするのが難しい状態","r":"disabled（障がいのある）"}]},{"world":"pokemon","title":"タケシの病院見学","lab":"病院","labJa":"テーマ","icon":"theme","en":"Takeshi wants to study {{nursing}}. He visits a hospital. An {{ambulance}} arrives with a hurt trainer. A {{physician}} examines him. \"He needs {{surgery}},\" she says. He stays in the children's {{ward}}. A nurse gives him an {{injection}}. He takes one {{pill}} after each meal. The {{dose}} is small. A {{psychiatrist}} talks with him about his fears. Music {{therapy}} helps him relax.","ja":"タケシは看護を勉強したい。彼は病院を訪れる。救急車がケガをしたトレーナーを乗せて着く。内科医が彼を診察する。「手術が必要ね」と彼女。彼は小児病棟に入院する。看護師が彼に注射をする。彼は毎食後に錠剤を1錠飲む。服用量は少ない。精神科医が彼と、彼がこわいと思っていることについて話す。音楽療法が彼をリラックスさせる。","ken":"病院の単語セット！ <b>physician（内科医）と physicist（物理学者）</b>は似てるけど全然違う★ 外科医は surgeon。ward は「病棟」と「区（行政）」の2つの意味があるで。","words":[{"n":"1090","w":"nursing","m":"看護、介護","p":[["nurse","育てる"]],"i":"患者さんの世話","r":"nursing home（老人ホーム）"},{"n":"1562","w":"ambulance","m":"救急車","p":[["ambul","歩く"]],"i":"動き回る病院","r":"call an ambulance"},{"n":"996","w":"physician","m":"医者、内科医","p":[["physic","医学"]],"i":"内科のお医者さん","r":"physicist（物理学者）と区別★"},{"n":"1097","w":"surgery","m":"手術","p":[["surg","手の仕事"]],"i":"体を切って治す","r":"surgeon（外科医）"},{"n":"1597","w":"ward","m":"病棟、区","p":[["ward","見張る"]],"i":"見守られる部屋","r":"a children's ward（小児病棟）"},{"n":"1557","w":"injection","m":"注射","p":[["in","中に"],["ject","投げる"]],"i":"体の中に入れる","r":"inject（注射する）"},{"n":"1615","w":"pill","m":"錠剤","p":[["pill","小さな玉"]],"i":"飲み薬のつぶ","r":"sleeping pill（睡眠薬）"},{"n":"1609","w":"dose","m":"（薬の）1回分","p":[["dose","与えるもの"]],"i":"1回に飲む量","r":"overdose（過剰摂取）"},{"n":"1886","w":"psychiatrist","m":"精神科医","p":[["psych","心"],["iatr","治す"]],"i":"心の病気を治す医者","r":"psychology（心理学）"},{"n":"1307","w":"therapy","m":"療法、治療","p":[["therap","世話をする"]],"i":"体や心を治す方法","r":"therapist（セラピスト）"}]},{"world":"pokemon","title":"旅の疲れ","lab":"回復","labJa":"テーマ","icon":"theme","en":"After a long trip, Satoshi feels {{fatigue}}. His legs {{ache}}, and his throat is {{sore}}. He {{sweats:sweat}} a lot in the heat. Joy says, \"Rest will {{heal}} your body.\" There is no magic {{cure}}, but honey and lemon is a good home {{remedy}}. Good {{hygiene}} is important, so wash your hands. The town has good {{sanitation}}, so the water is safe. Exercise also speeds up your {{metabolism}}.","ja":"長い旅のあと、サトシは疲労を感じている。足が痛み、のどがヒリヒリする。暑さでたくさん汗をかく。ジョーイさんは言う。「休めば体は治るわ」。魔法の治療法はないけど、ハチミツとレモンはいい家庭療法だ。清潔にすることは大切なので、手を洗いなさい。町の公衆衛生がしっかりしているので、水は安全だ。運動は新陳代謝も速めてくれる。","ken":"<b>heal（傷が治る）と cure（病気を治す）</b>のちがい★ cure A of B（AのBを治す）は rob A of B と同じ形やで。sore は「ヒリヒリ痛い」、sore throat（のどの痛み）はかぜの定番。","words":[{"n":"1443","w":"fatigue","m":"疲労","p":[["fatig","疲れる"]],"i":"ぐったりした疲れ","r":"tiredness ≒"},{"n":"1397","w":"ache","m":"痛む、痛み","p":[["ache","痛み"]],"i":"ズキズキ","r":"headache（頭痛）、stomachache（腹痛）"},{"n":"1645","w":"sore","m":"ヒリヒリ痛い","p":[["sore","痛い"]],"i":"こすれて痛い","r":"sore throat（のどの痛み）"},{"n":"1105","w":"sweat","m":"汗、汗をかく","p":[["sweat","汗"]],"i":"ダラダラ汗","r":"発音「スウェット」"},{"n":"684","w":"heal","m":"（傷などが）治る、治す","p":[["heal","全体"]],"i":"元どおりにする","r":"healing（いやし）"},{"n":"154","w":"cure","m":"治す、治療法","p":[["cure","世話"]],"i":"病気をなおす","r":"cure A of B"},{"n":"1479","w":"remedy","m":"治療法、解決策","p":[["re","もう一度"],["medy","治す"]],"i":"治すための方法","r":"a remedy for ～"},{"n":"1849","w":"hygiene","m":"清潔、衛生","p":[["hygie","健康"]],"i":"体を清潔に保つこと","r":"hygienic（衛生的な）"},{"n":"1898","w":"sanitation","m":"公衆衛生","p":[["sanit","健康"]],"i":"水道や下水の衛生","r":"sanitary（衛生の）"},{"n":"1611","w":"metabolism","m":"新陳代謝","p":[["meta","変化"],["bol","投げる"]],"i":"食べ物をエネルギーに変える","r":"metabolic（代謝の）"}]},{"world":"pokemon","title":"オーキド博士の人体講座","lab":"からだ","labJa":"テーマ","icon":"theme","en":"Professor Okido teaches about the body. \"Kairiky has strong {{muscles:muscle}},\" he says. \"Its four arms are its {{limbs:limb}}.\" He points to a picture. \"The heart is an important {{organ}}. Blood flows through each {{vein}}. Your {{lungs:lung}} help you breathe. They are part of the {{respiratory}} system.\" Garagara holds up a bone. \"Our {{skeleton}} is made of bones, and the {{spinal}} cord runs inside the back. {{Flesh:flesh}} covers the bones.\" Satoshi gives him two {{thumbs:thumb}} up.","ja":"オーキド博士が体について教える。「カイリキーは強い筋肉を持っている」と彼。「4本の腕は手足だ」。彼は図を指さす。「心臓は大切な臓器だ。血液はそれぞれの静脈を流れている。肺は呼吸を助ける。肺は呼吸器系の一部だ」。ガラガラが骨をかかげる。「私たちの骨格は骨でできていて、背中の中には脊髄が通っている。肉が骨をおおっている」。サトシは博士に両手の親指を立ててみせる。","ken":"体の単語！ <b>organ（臓器）</b>は「オルガン（楽器）」の意味もあるで。limb は「手足」、b は読まへん（リム）★ thumb（親指）の b も読まへん。サムズアップの thumb やで。","words":[{"n":"960","w":"muscle","m":"筋肉","p":[["mus","小さなネズミ"]],"i":"筋肉の動きがネズミみたい","r":"c は読まない（マッスル）"},{"n":"1867","w":"limb","m":"手足","p":[["limb","手足"]],"i":"腕や脚","r":"b は読まない"},{"n":"764","w":"organ","m":"臓器、オルガン","p":[["organ","道具"]],"i":"体の中の道具","r":"organ transplant（臓器移植）"},{"n":"1840","w":"vein","m":"静脈、血管","p":[["vein","血管"]],"i":"青く見える血の通り道","r":"artery（動脈）"},{"n":"1079","w":"lung","m":"肺","p":[["lung","軽い"]],"i":"息をする器官","r":"lung cancer（肺がん）"},{"n":"1967","w":"respiratory","m":"呼吸の","p":[["re","くり返し"],["spir","息をする"]],"i":"息を吸ったり吐いたり","r":"respiration（呼吸）"},{"n":"1549","w":"skeleton","m":"骨格","p":[["skelet","干からびた"]],"i":"体の骨組み","r":"skeletal（骨格の）"},{"n":"2020","w":"spinal","m":"脊髄の、背骨の","p":[["spine","背骨"]],"i":"背骨の","r":"spinal cord（脊髄）"},{"n":"1553","w":"flesh","m":"肉","p":[["flesh","肉"]],"i":"体の肉","r":"flesh and blood（血の通った人間）"},{"n":"1061","w":"thumb","m":"親指","p":[["thumb","ふくらんだ"]],"i":"ずんぐりした指","r":"b は読まない、thumbs up"}]},{"world":"pokemon","title":"三世代の村","lab":"一生","labJa":"テーマ","icon":"theme","en":"Satoshi visits a village where three {{generations:generation}} live together. A mother is {{pregnant}} with her second child. Her {{infant}} son is sleeping. In his {{youth}}, the grandfather was a great trainer. He is {{aged}} 80 now. The {{elderly}} people tell stories about their {{ancestors:ancestor}}. A {{juvenile}} Pokémon is still small, but it will become {{mature}} soon. Sadly, there is a {{funeral}} for an old Pokémon today.","ja":"サトシは三世代が一緒に暮らす村を訪れる。あるお母さんは2人目の子どもを妊娠している。彼女の幼い息子は眠っている。若いころ、おじいさんはすばらしいトレーナーだった。今は80歳だ。お年寄りたちは自分たちの祖先についての話をする。幼いポケモンはまだ小さいけど、すぐに成熟するだろう。悲しいことに、今日は年老いたポケモンのお葬式がある。","ken":"人生の単語！ <b>infant（赤ちゃん）→ juvenile（少年少女）→ youth（若者）→ mature（大人）→ elderly（お年寄り）</b>の順番で覚えよう★ ancestor（祖先）⇔ descendant（子孫）もセットやで。","words":[{"n":"426","w":"generation","m":"世代","p":[["gener","生む"]],"i":"同じころに生まれた人たち","r":"generation gap（世代間ギャップ）"},{"n":"1334","w":"pregnant","m":"妊娠している","p":[["pre","前に"],["gnant","生まれる"]],"i":"生まれる前","r":"pregnancy（妊娠）"},{"n":"520","w":"infant","m":"赤ちゃん、幼児","p":[["in","否定"],["fant","話す"]],"i":"まだ話せない子","r":"infancy（幼年期）"},{"n":"480","w":"youth","m":"若さ、若者","p":[["young","若い"]],"i":"若いころ","r":"in one's youth（若いころに）"},{"n":"302","w":"aged","m":"～歳の、年老いた","p":[["age","年"]],"i":"年をとった","r":"aged 80（80歳の）"},{"n":"572","w":"elderly","m":"お年寄りの","p":[["elder","年上の"]],"i":"年をとった（ていねいな言い方）","r":"the elderly（お年寄り）"},{"n":"503","w":"ancestor","m":"祖先","p":[["ante","前に"],["cess","行く"]],"i":"前に生きていた人","r":"descendant（子孫）が反対"},{"n":"1992","w":"juvenile","m":"少年少女の、未成年の","p":[["juven","若い"]],"i":"若い、子どもっぽい","r":"juvenile crime（少年犯罪）"},{"n":"805","w":"mature","m":"成熟した","p":[["mature","熟した"]],"i":"大人になった","r":"immature（未熟な）"},{"n":"1913","w":"funeral","m":"葬式","p":[["funer","死"]],"i":"亡くなった人を送る儀式","r":"attend a funeral"}]},{"world":"pokemon","title":"進化の研究","lab":"研究","labJa":"テーマ","icon":"theme","en":"Professor Okido does {{research}} on Pokémon evolution in his {{laboratory}}. He has a {{theory}} about why Pokémon evolve. His {{hypothesis}} is that love helps them grow. He {{probes:probe}} deeper with new tests. His {{analysis}} of the data shows something new. One {{finding}} is surprising: Pikachu's happiness affects its power. A strange stone gives him a {{clue}}. This is a big {{breakthrough}}. His student writes a {{thesis}} about it.","ja":"オーキド博士は研究所でポケモンの進化について研究している。ポケモンがなぜ進化するのかについての理論を持っている。彼の仮説は、愛情が成長を助けるというものだ。新しい実験でさらに深く探る。データの分析が何か新しいことを示している。ある発見は驚くべきものだ。ピカチュウの幸せ度がその力に影響するのだ。不思議な石が彼に手がかりを与える。これは大きな飛躍的進歩だ。彼の学生がそれについて論文を書く。","ken":"研究の単語は大学の長文で毎回出る！ <b>theory（理論）と hypothesis（仮説）</b>の違い★ hypothesis は「まだ証明されてない予想」。breakthrough は「壁を突き破る」、大発見やで。","words":[{"n":"411","w":"research","m":"研究、研究する","p":[["re","強め"],["search","探す"]],"i":"くり返し深く探す","r":"do research on ～"},{"n":"927","w":"laboratory","m":"研究所、実験室","p":[["labor","働く"]],"i":"研究のために働く場所","r":"lab と略す"},{"n":"433","w":"theory","m":"理論","p":[["theor","見る"]],"i":"物事の見方の体系","r":"in theory（理論上は）"},{"n":"1029","w":"hypothesis","m":"仮説","p":[["hypo","下に"],["thesis","置く"]],"i":"下に仮に置いた考え","r":"複数形は hypotheses"},{"n":"1801","w":"probe","m":"探る、調査","p":[["probe","試す"]],"i":"奥まで調べる","r":"space probe（宇宙探査機）"},{"n":"509","w":"analysis","m":"分析","p":[["ana","バラバラ"],["lysis","ほどく"]],"i":"バラバラにして調べる","r":"analyze（分析する）"},{"n":"1077","w":"finding","m":"発見、研究結果","p":[["find","見つける"]],"i":"調べてわかったこと","r":"findings（研究結果）"},{"n":"976","w":"clue","m":"手がかり","p":[["clue","糸玉"]],"i":"迷路の出口へ導く糸","r":"have no clue（さっぱりわからない）"},{"n":"1558","w":"breakthrough","m":"飛躍的進歩","p":[["break","破る"],["through","通って"]],"i":"壁を突き破る","r":"make a breakthrough"},{"n":"1937","w":"thesis","m":"論文、主張","p":[["thesis","置く"]],"i":"置かれた主張","r":"graduation thesis（卒業論文）"}]},{"world":"pokemon","title":"科学者チームの訪問","lab":"学問","labJa":"テーマ","icon":"theme","en":"A team of scientists visits Professor Okido. A {{botanist}} studies the plants Pokémon eat. An {{anthropologist}} studies how people and Pokémon live together. An {{archaeologist}} digs for ancient ruins. A {{psychology}} expert studies Pokémon feelings. They discuss the {{philosophy}} of friendship and the {{notion}} that Pokémon can think. They use {{logic}} to test it. Pokémon have {{cognitive}} skills, like memory. Then a strange {{phenomenon}} appears in the sky. It changes the scientists' {{paradigm}}.","ja":"科学者たちのチームがオーキド博士を訪れる。植物学者はポケモンが食べる植物を研究している。人類学者は人とポケモンがどのように一緒に暮らしているかを研究している。考古学者は古代の遺跡を掘っている。心理学の専門家はポケモンの気持ちを研究している。彼らは友情の哲学と、ポケモンは考えることができるという考えについて議論する。それを確かめるのに論理を使う。ポケモンには記憶のような認知能力がある。そのとき、不思議な現象が空に現れる。それは科学者たちの物の見方（パラダイム）を変える。","ken":"学問の名前！ <b>-ist は「～の人」、-logy は「～学」</b>。anthropo（人間）+ logy で人類学、archaeo（古代）+ logy で考古学。phenomenon（現象）の複数形は phenomena やで★","words":[{"n":"1905","w":"botanist","m":"植物学者","p":[["botan","植物"]],"i":"植物を研究する人","r":"botany（植物学）"},{"n":"1035","w":"anthropologist","m":"人類学者","p":[["anthropo","人間"],["logist","学者"]],"i":"人間と文化を研究する人","r":"anthropology（人類学）"},{"n":"1600","w":"archaeologist","m":"考古学者","p":[["archaeo","古代"],["logist","学者"]],"i":"大昔の遺跡を研究する人","r":"archaeology（考古学）"},{"n":"993","w":"psychology","m":"心理学","p":[["psycho","心"],["logy","学"]],"i":"心の学問","r":"psychological（心理的な）"},{"n":"997","w":"philosophy","m":"哲学","p":[["philo","愛する"],["sophy","知恵"]],"i":"知恵を愛すること","r":"philosopher（哲学者）"},{"n":"499","w":"notion","m":"考え、観念","p":[["not","知る"]],"i":"頭にある考え","r":"idea ≒"},{"n":"1025","w":"logic","m":"論理","p":[["log","言葉、理性"]],"i":"筋道の通った考え方","r":"logical（論理的な）"},{"n":"1192","w":"cognitive","m":"認知の","p":[["cogn","知る"]],"i":"知ること、考えることに関する","r":"cognition（認知）"},{"n":"475","w":"phenomenon","m":"現象","p":[["phen","見える"]],"i":"目に見える出来事","r":"複数形は phenomena★"},{"n":"1928","w":"paradigm","m":"物の見方、典型","p":[["para","そばに"],["digm","見せる"]],"i":"考え方の枠組み","r":"paradigm shift（パラダイムシフト）"}]},{"world":"pokemon","title":"仲間たちの得意なこと","lab":"頭","labJa":"テーマ","icon":"theme","en":"Satoshi's friend Serena has a {{talent}} for performing. Takeshi has great {{knowledge}} about Pokémon food. Professor Okido has the {{wisdom}} of a long life. Fuudin is a {{genius}} Pokémon with a big {{brain}}. Satoshi's best {{skill}} is never giving up. Kasumi has a quick {{wit}} and makes funny jokes. Satoshi trusts his {{intuition}} in battle. Before a match, he does {{meditation}} to keep his {{mental}} strength.","ja":"サトシの友だちのセレナにはパフォーマンスの才能がある。タケシはポケモンフードについての知識がすごい。オーキド博士には長い人生で得た知恵がある。フーディンは大きな脳を持った天才ポケモンだ。サトシのいちばんの技能は決してあきらめないことだ。カスミは頭の回転が速くて、おもしろい冗談を言う。サトシはバトルでは自分の直感を信じている。試合の前、彼は精神的な強さを保つために瞑想をする。","ken":"<b>knowledge（知識）と wisdom（知恵）</b>の違い★ knowledge は「知っていること」、wisdom は「それをうまく使う力」。knowledge は数えられない名詞やから a knowledge はダメやで！","words":[{"n":"523","w":"talent","m":"才能","p":[["talent","重さ（お金の単位）"]],"i":"神様からもらった才能","r":"talented（才能のある）"},{"n":"397","w":"knowledge","m":"知識","p":[["know","知る"]],"i":"知っていること","r":"数えられない名詞★"},{"n":"937","w":"wisdom","m":"知恵","p":[["wise","かしこい"]],"i":"うまく判断する力","r":"wise（かしこい）"},{"n":"971","w":"genius","m":"天才、才能","p":[["gen","生まれる"]],"i":"生まれつきの才能","r":"a genius for ～"},{"n":"232","w":"brain","m":"脳、頭脳","p":[["brain","脳"]],"i":"考える場所","r":"brainstorming（ブレインストーミング）"},{"n":"405","w":"skill","m":"技能","p":[["skill","区別"]],"i":"練習で身につけた技","r":"skilled（熟練した）"},{"n":"1517","w":"wit","m":"機知、頭の回転","p":[["wit","知る"]],"i":"気の利いた頭の良さ","r":"witty（機知に富んだ）"},{"n":"1837","w":"intuition","m":"直感","p":[["in","中を"],["tuit","見る"]],"i":"心の中で見ぬく","r":"intuitive（直感的な）"},{"n":"1893","w":"meditation","m":"瞑想","p":[["medit","考える"]],"i":"静かに心を落ち着ける","r":"meditate（瞑想する）"},{"n":"551","w":"mental","m":"精神の、心の","p":[["ment","心"]],"i":"心に関する","r":"physical（身体の）が反対"}]},{"world":"pokemon","title":"アローラへの船旅","lab":"旅","labJa":"テーマ","icon":"theme","en":"Satoshi starts a {{voyage}} to the Alola region. At the ferry {{terminal}}, many {{passengers:passenger}} are waiting. He carries heavy {{luggage}}. His {{destination}} is a tropical island. {{Tourism:tourism}} is the island's main business. He buys a {{souvenir}} for his mom. He walks along a mountain {{trail}}. The {{path}} leads to a beach. The sun sets on the {{horizon}}.","ja":"サトシはアローラ地方への船旅を始める。フェリーターミナルでは、多くの乗客が待っている。彼は重い荷物を持っている。目的地は南の島だ。観光業が島の主な産業だ。彼はママのためにおみやげを買う。山の小道を歩く。その道は浜辺に続いている。太陽が水平線に沈む。","ken":"旅の単語！ <b>luggage（荷物）は数えられない名詞</b>で、baggage と同じ★ a piece of luggage って言うで。horizon は「地平線、水平線」、broaden one's horizons（視野を広げる）も覚えとこ。","words":[{"n":"1030","w":"voyage","m":"船旅、航海","p":[["voy","道"]],"i":"長い船の旅","r":"bon voyage（よい旅を）"},{"n":"789","w":"terminal","m":"終着駅、ターミナル、末期の","p":[["term","終わり"]],"i":"線路の終わり","r":"terminal illness（末期の病気）"},{"n":"456","w":"passenger","m":"乗客","p":[["pass","通る"]],"i":"乗り物で通っていく人","r":"passenger seat（助手席）"},{"n":"1451","w":"luggage","m":"荷物","p":[["lug","引っぱる"]],"i":"旅行の荷物","r":"数えられない名詞★"},{"n":"957","w":"destination","m":"目的地","p":[["destine","運命づける"]],"i":"行くことが決まっている場所","r":"tourist destination（観光地）"},{"n":"953","w":"tourism","m":"観光（業）","p":[["tour","回る"]],"i":"観光旅行の産業","r":"tourist（観光客）"},{"n":"1492","w":"souvenir","m":"おみやげ","p":[["sou","下から"],["venir","来る"]],"i":"記憶によみがえるもの","r":"フランス語から"},{"n":"1493","w":"trail","m":"小道、跡","p":[["trail","引きずる"]],"i":"引きずった跡の道","r":"hiking trail"},{"n":"496","w":"path","m":"小道、進路","p":[["path","道"]],"i":"歩いてできた道","r":"career path（キャリアの道）"},{"n":"756","w":"horizon","m":"地平線、水平線、視野","p":[["horiz","境界"]],"i":"空と地の境目","r":"broaden one's horizons（視野を広げる）"}]},{"world":"pokemon","title":"新しい冒険へ","lab":"冒険","labJa":"テーマ","icon":"theme","en":"Satoshi begins a new {{quest}}. He {{wanders:wander}} through the forest. Wild Pokémon {{roam}} freely there. In the town, he {{strolls:stroll}} down the street with Pikachu. A {{pedestrian}} asks him the way. He {{navigates:navigate}} with a map app. Every winter, some bird Pokémon {{migrate}} to the south. They fly a long {{distance}}. Satoshi wants to be a {{pioneer}} and explore the last {{frontier}}.","ja":"サトシは新しい冒険を始める。森の中をさまよう。そこでは野生のポケモンが自由に歩き回っている。町では、ピカチュウと一緒に通りをぶらぶら歩く。歩行者が彼に道をたずねる。彼は地図アプリで道を進む。毎年冬になると、鳥ポケモンの中には南へ渡るものがいる。彼らは長い距離を飛ぶ。サトシは開拓者になって、最後の辺境を探検したい。","ken":"「歩く」いろいろ★ <b>wander（さまよう）、roam（歩き回る）、stroll（ぶらぶら散歩）</b>。wander と wonder（不思議に思う）はスペル1文字違いやから注意！ pedestrian（歩行者）の ped は「足」。","words":[{"n":"1892","w":"quest","m":"探求、冒険","p":[["quest","求める"]],"i":"何かを求める旅","r":"question（質問）も同じ仲間"},{"n":"392","w":"wander","m":"さまよう","p":[["wander","ぶらつく"]],"i":"あてもなく歩く","r":"wonder（不思議に思う）とスペル注意★"},{"n":"1719","w":"roam","m":"歩き回る","p":[["roam","歩き回る"]],"i":"広い場所をうろうろ","r":"roaming（ローミング）"},{"n":"1723","w":"stroll","m":"ぶらぶら歩く","p":[["stroll","ぶらつく"]],"i":"のんびり散歩","r":"take a stroll"},{"n":"1516","w":"pedestrian","m":"歩行者","p":[["ped","足"]],"i":"歩いている人","r":"pedestrian crossing（横断歩道）"},{"n":"1396","w":"navigate","m":"進路を決める、航行する","p":[["nav","船"],["ig","動かす"]],"i":"船を動かす","r":"navigation（ナビ）"},{"n":"1367","w":"migrate","m":"移住する、渡る","p":[["migr","移る"]],"i":"季節で移動する","r":"migration（移住、渡り）"},{"n":"420","w":"distance","m":"距離","p":[["dis","離れて"],["stance","立つ"]],"i":"離れて立っている長さ","r":"distant（遠い）"},{"n":"1068","w":"pioneer","m":"開拓者","p":[["pion","歩兵"]],"i":"先頭を歩く人","r":"pioneering（先駆的な）"},{"n":"783","w":"frontier","m":"辺境、最前線","p":[["front","前"]],"i":"いちばん前の端っこ","r":"the frontier of science（科学の最先端）"}]},{"world":"pokemon","title":"タイプ相性の授業","lab":"つなぎことば","labJa":"テーマ","icon":"theme","en":"Pikachu is an electric type. {{Therefore:therefore}}, it is strong against water types. Zenigame uses water, {{whereas}} Hitokage uses fire. Hitokage is weak against water; {{conversely}}, it is strong against grass. Pikachu lost the last battle. {{Nevertheless:nevertheless}}, Satoshi still believes in it. It is fast. {{Moreover:moreover}}, it is very brave. {{Besides:besides}}, it is Satoshi's best friend. Satoshi trained hard, {{thereby}} making Pikachu stronger. Then the rain came, and {{thus}} the match was stopped. The rules changed, and the trainers acted {{accordingly}}. It's late; {{hence}}, everyone goes to sleep.","ja":"ピカチュウはでんきタイプだ。したがって、みずタイプに強い。ゼニガメはみずを使う一方で、ヒトカゲはほのおを使う。ヒトカゲはみずに弱い。逆に、くさには強い。ピカチュウは前のバトルで負けた。それにもかかわらず、サトシは今でもピカチュウを信じている。ピカチュウは素早い。さらに、とても勇敢だ。そのうえ、サトシの親友だ。サトシは一生けんめい特訓し、それによってピカチュウを強くした。そのあと雨が降ってきて、それで試合は中止になった。ルールが変わり、トレーナーたちはそれに応じて行動した。もう遅い。だから、みんな寝る。","ken":"★<b>つなぎことばは長文の流れをつかむ最強の武器</b>！ 結果：therefore, thus, hence, accordingly。追加：moreover, besides。逆接：nevertheless。対比：whereas, conversely。早稲田の長文はこれで段落の役割がわかるで！","words":[{"n":"313","w":"therefore","m":"したがって","p":[["there","そこ"],["fore","のために"]],"i":"そういうわけで","r":"so ≒（かたい）"},{"n":"852","w":"whereas","m":"～である一方で","p":[["where","そこで"],["as","～のように"]],"i":"一方では","r":"while ≒（対比）"},{"n":"2025","w":"conversely","m":"逆に","p":[["con","完全に"],["verse","向ける"]],"i":"反対向きに言うと","r":"on the other hand ≒"},{"n":"590","w":"nevertheless","m":"それにもかかわらず","p":[["never","決して"],["the less","少なく"]],"i":"それでもやっぱり","r":"however ≒"},{"n":"591","w":"moreover","m":"さらに","p":[["more","もっと"],["over","上に"]],"i":"そのうえ","r":"in addition ≒"},{"n":"323","w":"besides","m":"そのうえ、～に加えて","p":[["beside","そば"],["s","複数"]],"i":"そばにもう一つ","r":"beside（～のそばに）と区別★"},{"n":"1695","w":"thereby","m":"それによって","p":[["there","それ"],["by","によって"]],"i":"それが原因で","r":"～ing の形がよく続く"},{"n":"320","w":"thus","m":"このように、したがって","p":[["thus","このように"]],"i":"だから","r":"therefore ≒"},{"n":"849","w":"accordingly","m":"それに応じて、したがって","p":[["accord","一致"]],"i":"それに合わせて","r":"according to ～（～によると）"},{"n":"1698","w":"hence","m":"だから、今から","p":[["hence","ここから"]],"i":"ここから導くと","r":"three years hence（今から3年後）"}]},{"world":"pokemon","title":"博士からのアドバイス","lab":"大事な","labJa":"テーマ","icon":"theme","en":"Professor Okido gives Satoshi advice. \"Trust is {{essential}} between a trainer and a Pokémon. It is the most {{fundamental}} rule. Choosing the right Pokémon is {{crucial}} in battle. Water is {{vital}} for all life. Your first badge was a {{significant}} step. Your {{ultimate}} goal is to be a Pokémon Master. By the way, your old ticket is no longer {{valid}}. Use the {{proper}} ball for each Pokémon. Pikachu is {{apt}} to get angry, so be gentle. Your progress this year is {{notable}}.\"","ja":"オーキド博士がサトシにアドバイスをする。「トレーナーとポケモンの間には信頼が欠かせない。それはいちばん基本的なルールだ。バトルでは正しいポケモンを選ぶことが決定的に重要だ。水はすべての生命にとって不可欠だ。君の最初のバッジは重要な一歩だった。君の究極の目標はポケモンマスターになることだ。ところで、君の古いチケットはもう有効ではない。それぞれのポケモンに適切なボールを使いなさい。ピカチュウは怒りっぽいから、やさしくね。今年の君の進歩は注目に値するよ」。","ken":"「大事な」の言い方いろいろ！ <b>essential, crucial, vital, fundamental, significant</b>。important ばっかり使わずに言いかえられたら英作文も強くなる★ <b>be apt to ～（～しがちだ）</b>も覚えとこ。","words":[{"n":"537","w":"essential","m":"欠かせない、本質的な","p":[["essence","本質"]],"i":"ないと成り立たない","r":"be essential to ～"},{"n":"290","w":"fundamental","m":"基本的な","p":[["fund","底"]],"i":"土台になる","r":"fundamentally（根本的に）"},{"n":"1159","w":"crucial","m":"決定的に重要な","p":[["cruc","十字"]],"i":"十字路での決断","r":"critical ≒"},{"n":"793","w":"vital","m":"不可欠な、生命の","p":[["vit","命"]],"i":"命に関わるほど大事","r":"vitality（活力）"},{"n":"280","w":"significant","m":"重要な、かなりの","p":[["sign","しるし"]],"i":"しるしをつけるほど大事","r":"significance（重要性）"},{"n":"1144","w":"ultimate","m":"究極の、最終的な","p":[["ult","最後の"]],"i":"いちばん最後の","r":"ultimately（最終的に）"},{"n":"1325","w":"valid","m":"有効な、正当な","p":[["val","強い"]],"i":"ちゃんと効き目がある","r":"invalid（無効な）"},{"n":"275","w":"proper","m":"適切な","p":[["proper","自分の"]],"i":"その場にぴったり","r":"properly（ちゃんと）"},{"n":"1322","w":"apt","m":"～しがちな、適切な","p":[["apt","合う"]],"i":"ぴったり合う","r":"be apt to ～"},{"n":"1665","w":"notable","m":"注目に値する","p":[["note","注意する"]],"i":"目をとめるべき","r":"notably（特に）"}]},{"world":"pokemon","title":"赤ちゃんポケモンのお世話","lab":"弱い","labJa":"テーマ","icon":"theme","en":"A baby Pokémon has a {{delicate}} body. Its egg was very {{fragile}}. It's {{vulnerable}} to cold weather. Its skin is {{sensitive}} to sunlight. It looks {{pale}} today. It has a {{slender}} body and short fur. Without its fur, it would be almost {{naked}}. Joy hears a {{faint}} cry from its box. She gives its fur a {{trim}} to keep it clean. Its eyes look {{dull}}, so she lets it sleep.","ja":"赤ちゃんポケモンは繊細な体をしている。そのタマゴはとてもこわれやすかった。寒い天気に弱い。皮膚は日光に敏感だ。今日は顔色が悪く見える。ほっそりした体で、毛が短い。毛がなかったら、ほとんど裸だろう。ジョーイさんはその箱からかすかな鳴き声を聞く。清潔に保つために毛を整える。目がどんよりしているので、眠らせてあげる。","ken":"<b>vulnerable（弱い、傷つきやすい）</b>は社会系の長文で超よく出る★ be vulnerable to ～（～に弱い）。sensitive（敏感な）と sensible（分別のある）は区別してな！ dull は「退屈な」と「にぶい」の2つ。","words":[{"n":"802","w":"delicate","m":"繊細な、こわれやすい","p":[["delic","楽しい"]],"i":"そっと扱わないとダメ","r":"delicate issue（デリケートな問題）"},{"n":"1633","w":"fragile","m":"こわれやすい","p":[["frag","割れる"]],"i":"すぐ割れる","r":"Fragile!（こわれもの注意）"},{"n":"1676","w":"vulnerable","m":"弱い、傷つきやすい","p":[["vulner","傷"]],"i":"傷つけられやすい","r":"be vulnerable to ～★"},{"n":"561","w":"sensitive","m":"敏感な","p":[["sens","感じる"]],"i":"すぐ感じる","r":"sensible（分別のある）と区別★"},{"n":"1112","w":"pale","m":"青白い、（色が）薄い","p":[["pale","青白い"]],"i":"顔色が悪い","r":"turn pale（青ざめる）"},{"n":"1979","w":"slender","m":"ほっそりした","p":[["slender","細い"]],"i":"すらっと細い","r":"slim ≒"},{"n":"1667","w":"naked","m":"裸の","p":[["naked","むき出しの"]],"i":"何も着ていない","r":"the naked eye（肉眼）"},{"n":"1326","w":"faint","m":"かすかな、気絶する","p":[["faint","弱い"]],"i":"ぼんやり弱い","r":"faint（気絶する）"},{"n":"1987","w":"trim","m":"整える、刈りこむ","p":[["trim","整える"]],"i":"ちょっと切って整える","r":"トリミング"},{"n":"799","w":"dull","m":"退屈な、にぶい","p":[["dull","にぶい"]],"i":"ぼんやりしてつまらない","r":"a dull knife（切れないナイフ）"}]},{"world":"pokemon","title":"カントーの大病院","lab":"体と科学","labJa":"テーマ","icon":"theme","en":"Satoshi visits a big hospital in Kanto. Doctors give {{physical}} checkups and {{medical}} advice. A scientist studies the {{biological}} and {{physiological}} effects of Pokémon moves. A sign warns about a {{nuclear}} power plant nearby, and a group studies its {{ecological}} effects. A girl who is {{deaf}} talks with Joy in sign language. A man was {{paralyzed}} in an accident, but his Pokémon helps him every day. A {{Muslim:muslim}} family eats a special lunch without pork. In the café, no {{alcoholic}} drinks are served.","ja":"サトシはカントーの大きな病院を訪れる。医者たちは身体検査をして医学的なアドバイスをする。ある科学者は、ポケモンの技が生物学的・生理学的にどんな影響を与えるかを研究している。看板が近くの原子力発電所について注意をうながしていて、あるグループがその生態系への影響を調べている。耳の聞こえない女の子がジョーイさんと手話で話している。ある男性は事故で体がまひしてしまったけど、彼のポケモンが毎日助けてくれる。イスラム教徒の家族は豚肉の入っていない特別なランチを食べる。カフェではアルコールの入った飲み物は出されない。","ken":"科学・医療の形容詞！ <b>physical（身体の、物理的な）⇔ mental（精神の）</b>。ecological（生態系の）は環境問題で必須、eco- は「家・環境」やで。Muslim（イスラム教徒）は大文字で書くのがルール★","words":[{"n":"264","w":"physical","m":"身体の、物理的な","p":[["phys","自然"]],"i":"体や物に関する","r":"physical education（体育）"},{"n":"536","w":"medical","m":"医学の","p":[["medic","医者"]],"i":"医療に関する","r":"medical school（医学部）"},{"n":"581","w":"biological","m":"生物学的な","p":[["bio","命"],["logy","学"]],"i":"生き物に関する","r":"biology（生物学）"},{"n":"1683","w":"physiological","m":"生理学的な","p":[["physio","自然"],["logy","学"]],"i":"体の働きに関する","r":"physiology（生理学）"},{"n":"305","w":"nuclear","m":"原子力の、核の","p":[["nucle","核"]],"i":"原子の中心の","r":"nuclear weapons（核兵器）"},{"n":"1189","w":"ecological","m":"生態系の","p":[["eco","家"],["logy","学"]],"i":"自然環境とのつながりの","r":"ecology（生態学）"},{"n":"1187","w":"deaf","m":"耳の聞こえない","p":[["deaf","ぼんやりした"]],"i":"音が聞こえない","r":"発音「デフ」"},{"n":"2001","w":"paralyzed","m":"まひした","p":[["para","そばで"],["lyze","ゆるめる"]],"i":"体が動かなくなった","r":"paralysis（まひ）"},{"n":"1342","w":"muslim","m":"イスラム教徒（の）","p":[["muslim","神に従う者"]],"i":"イスラム教を信じる人","r":"ふつう Muslim と大文字"},{"n":"1152","w":"alcoholic","m":"アルコールの入った、アルコール依存症の","p":[["alcohol","酒"]],"i":"お酒の","r":"alcoholic drinks（酒類）"}]},{"world":"pokemon","title":"アローラ原産のポケモン","lab":"形容詞いろいろ","labJa":"テーマ","icon":"theme","en":"Satoshi has a {{serious}} talk with Professor Okido. \"Is there a Pokémon {{available}} for me?\" he asks. The professor shows him a Pokémon {{native}} to Alola. It's a {{male}} Pokémon, but it has a {{feminine}} look. \"Is it {{capable}} of fighting?\" Satoshi asks. \"Yes. Its {{current}} level is 20.\" The price is {{reasonable}}. The Pokémon seems {{familiar}}. \"Have I seen it before?\" They talk in a {{private}} room.","ja":"サトシはオーキド博士と真剣な話をする。「ぼくがもらえるポケモンはいますか？」と彼は聞く。博士はアローラ原産のポケモンを見せる。オスのポケモンだけど、女性らしい見た目をしている。「戦う力はありますか？」とサトシ。「ああ。今のレベルは20だ」。値段は手ごろだ。そのポケモンには見覚えがある。「前に見たことあるかな？」二人は個室で話す。","ken":"★<b>be familiar with ～（～をよく知っている）と be familiar to ～（～によく知られている）</b>の区別は鉄板！ capable は be capable of ～ing（～する能力がある）。reasonable は「理にかなった」と「（値段が）手ごろな」の2つやで。","words":[{"n":"257","w":"serious","m":"真剣な、深刻な","p":[["serious","重い"]],"i":"まじめで重い","r":"seriously（真剣に）"},{"n":"259","w":"available","m":"手に入る、利用できる","p":[["avail","役立つ"]],"i":"すぐ使える状態","r":"be available（手があいている）"},{"n":"270","w":"native","m":"生まれ育った、原産の","p":[["nat","生まれる"]],"i":"生まれた場所の","r":"native speaker"},{"n":"274","w":"male","m":"オスの、男性の","p":[["male","男"]],"i":"男の","r":"female（メスの）が反対"},{"n":"1669","w":"feminine","m":"女性らしい","p":[["femin","女性"]],"i":"女の人っぽい","r":"masculine（男性らしい）"},{"n":"276","w":"capable","m":"能力がある","p":[["cap","つかむ"]],"i":"つかみ取る力がある","r":"be capable of ～ing★"},{"n":"273","w":"current","m":"現在の、流れ","p":[["curr","走る"]],"i":"今まさに流れている","r":"currently（現在）"},{"n":"292","w":"reasonable","m":"理にかなった、手ごろな","p":[["reason","理由"]],"i":"筋が通っている","r":"a reasonable price"},{"n":"263","w":"familiar","m":"よく知っている、見覚えのある","p":[["famil","家族"]],"i":"家族みたいになじみがある","r":"be familiar with ～ / to ～★"},{"n":"268","w":"private","m":"個人的な、私立の","p":[["priv","自分だけの"]],"i":"人に見せない","r":"public（公の）が反対"}]},{"world":"pokemon","title":"謎の敵の正体","lab":"考える","labJa":"テーマ","icon":"theme","en":"Satoshi must {{decide}} which Pokémon to use. He tries to {{judge}} the enemy's strength. He {{estimates:estimate}} its level at about 50. \"I {{guess}} it's a fire type,\" he says. Takeshi {{speculates:speculate}} that it's a trap. Satoshi {{contemplates:contemplate}} his next move. He {{anticipates:anticipate}} a big attack. Suddenly, he {{notices:notice}} something. He {{identifies:identify}} the Pokémon: it's a Lizardon! He {{realizes:realize}} that he needs a water type.","ja":"サトシはどのポケモンを使うか決めないといけない。敵の強さを判断しようとする。そのレベルはおよそ50だと見積もる。「たぶんほのおタイプだ」と彼。タケシはそれはワナだと推測する。サトシは次の手をじっくり考える。大きな攻撃を予期する。突然、彼は何かに気づく。そのポケモンの正体を特定する。リザードンだ！ 彼はみずタイプが必要だと気づく。","ken":"「考える」の使い分け★ <b>guess（なんとなく推測）、estimate（数字を見積もる）、speculate（根拠なく推測）、anticipate（予期する）</b>。realize（はっきり気づく）と notice（目や耳で気づく）の違いも大事やで。","words":[{"n":"5","w":"decide","m":"決める","p":[["de","離れて"],["cide","切る"]],"i":"迷いを切り捨てる","r":"decision（決定）"},{"n":"61","w":"judge","m":"判断する、裁判官","p":[["jud","法"],["dge","言う"]],"i":"正しいか判断する","r":"Don't judge a book by its cover."},{"n":"81","w":"estimate","m":"見積もる、見積もり","p":[["estim","評価する"]],"i":"だいたいの数を出す","r":"underestimate（過小評価する）"},{"n":"347","w":"guess","m":"推測する","p":[["guess","予想"]],"i":"なんとなく当てる","r":"I guess ～（～だと思う）"},{"n":"1410","w":"speculate","m":"推測する、投機する","p":[["spec","見る"]],"i":"見て想像する","r":"speculation（推測）"},{"n":"1393","w":"contemplate","m":"じっくり考える","p":[["con","強め"],["templ","神殿"]],"i":"神殿で静かに考える","r":"contemplation（熟考）"},{"n":"1343","w":"anticipate","m":"予期する","p":[["anti","前に"],["cip","取る"]],"i":"先に取っておく","r":"anticipation（期待）"},{"n":"31","w":"notice","m":"気づく","p":[["not","知る"]],"i":"目や耳で気づく","r":"notice（通知）"},{"n":"147","w":"identify","m":"特定する、身元を確認する","p":[["ident","同じ"]],"i":"同じものだと確かめる","r":"identity（正体、自分らしさ）"},{"n":"15","w":"realize","m":"気づく、実現する","p":[["real","本当の"]],"i":"本当だとわかる","r":"★「実現する」の意味も大事"}]},{"world":"pokemon","title":"ロケット団を追え","lab":"移動","labJa":"テーマ","icon":"theme","en":"Rocket-dan steals Pikachu and {{flees:flee}} in a balloon. Satoshi {{chases:chase}} them. Kasumi and Takeshi {{follow}} him. They {{rush}} up a hill. Satoshi {{stumbles:stumble}} over a rock but gets up. He {{mounts:mount}} a flying Pokémon and rises into the sky. He {{steers:steer}} it toward the balloon. The balloon {{plunges:plunge}} into a lake. Satoshi {{reaches:reach}} Pikachu at last. Now Rocket-dan {{dwells:dwell}} in a small cave by the lake.","ja":"ロケット団がピカチュウを盗んで、気球で逃げる。サトシは彼らを追いかける。カスミとタケシはサトシについていく。三人は丘をかけ上がる。サトシは石につまずくけど、立ち上がる。彼は飛べるポケモンに乗って空へ上がる。気球の方へポケモンをあやつる。気球は湖に突っこむ。サトシはついにピカチュウのところへ届く。今では、ロケット団は湖のそばの小さな洞窟に住んでいる。","ken":"動きの動詞！ <b>flee（逃げる）は flee-fled-fled</b>、活用が変わるから注意★ reach は他動詞やから reach to Tokyo はダメ、reach Tokyo が正解。dwell on ～（～をくよくよ考える）も熟語で出るで。","words":[{"n":"1420","w":"flee","m":"逃げる","p":[["flee","逃げる"]],"i":"危険から逃げる","r":"flee-fled-fled"},{"n":"687","w":"chase","m":"追いかける","p":[["chase","捕まえる"]],"i":"後ろから追う","r":"chase after ～"},{"n":"1","w":"follow","m":"ついていく、従う","p":[["follow","ついていく"]],"i":"後ろからついていく","r":"following（次の）"},{"n":"101","w":"rush","m":"急いで行く","p":[["rush","突進"]],"i":"ダーッと急ぐ","r":"rush hour（ラッシュアワー）"},{"n":"1731","w":"stumble","m":"つまずく","p":[["stumble","よろめく"]],"i":"足がひっかかる","r":"stumble on ～（～に偶然出会う）"},{"n":"1273","w":"mount","m":"乗る、登る、増える","p":[["mount","山"]],"i":"上に乗る","r":"Mt. Fuji（富士山）"},{"n":"1225","w":"steer","m":"あやつる、かじを取る","p":[["steer","かじ"]],"i":"向きをコントロールする","r":"steering wheel（ハンドル）"},{"n":"1240","w":"plunge","m":"突っこむ、急落する","p":[["plunge","飛びこむ"]],"i":"ドボンと飛びこむ","r":"prices plunge（価格が急落する）"},{"n":"11","w":"reach","m":"届く、着く","p":[["reach","のばす"]],"i":"手をのばして届く","r":"reach to はダメ"},{"n":"1372","w":"dwell","m":"住む、くよくよ考える","p":[["dwell","とどまる"]],"i":"そこにずっといる","r":"dwell on ～（～をくよくよ考える）"}]},{"world":"pokemon","title":"ヒトカゲを育てる","lab":"育てる","labJa":"テーマ","icon":"theme","en":"A Pokémon trainer must {{nurture}} young Pokémon. Satoshi {{fosters:foster}} a baby Hitokage that has no family. He {{cultivates:cultivate}} berries to feed it. Good food helps it {{thrive}}. Training {{develops:develop}} its skills. Satoshi's passion {{inspires:inspire}} others. Battles {{stimulate}} Hitokage's growth and {{arouse}} its fighting spirit. The cheers of fans {{spur}} it on. Rocket-dan tries to {{lure}} it away with candy.","ja":"ポケモントレーナーは若いポケモンを育てないといけない。サトシは家族のいない赤ちゃんヒトカゲを里親として育てる。それにえさをやるためにきのみを栽培する。いい食べ物はヒトカゲが元気に育つのを助ける。特訓はその技を伸ばす。サトシの情熱はほかの人たちをふるい立たせる。バトルはヒトカゲの成長を刺激し、その闘志をかき立てる。ファンの声援がヒトカゲをかり立てる。ロケット団はお菓子でヒトカゲをおびき出そうとする。","ken":"「育てる」の使い分け★ <b>nurture（愛情こめて育てる）、foster（里親として育てる、促進する）、cultivate（栽培する、養う）</b>。thrive は「元気に育つ、繁栄する」で、長文によく出るで。","words":[{"n":"1409","w":"nurture","m":"育てる","p":[["nur","栄養を与える"]],"i":"愛情をこめて育てる","r":"nature or nurture（生まれか育ちか）"},{"n":"695","w":"foster","m":"里親として育てる、促進する","p":[["foster","食べ物"]],"i":"育ての親になる","r":"foster parents（里親）"},{"n":"634","w":"cultivate","m":"栽培する、養う","p":[["cult","耕す"]],"i":"畑を耕して育てる","r":"culture（文化）も同じ仲間"},{"n":"1209","w":"thrive","m":"繁栄する、元気に育つ","p":[["thrive","つかむ"]],"i":"ぐんぐん育つ","r":"flourish ≒"},{"n":"6","w":"develop","m":"発達させる、開発する","p":[["de","外す"],["velop","包む"]],"i":"包みをほどいて広げる","r":"development（発達）"},{"n":"632","w":"inspire","m":"ふるい立たせる、ひらめきを与える","p":[["in","中に"],["spire","息"]],"i":"息を吹きこむ","r":"inspiration（ひらめき）"},{"n":"627","w":"stimulate","m":"刺激する","p":[["stimul","突き棒"]],"i":"つついて動かす","r":"stimulus（刺激）"},{"n":"1270","w":"arouse","m":"かき立てる","p":[["a","強め"],["rouse","起こす"]],"i":"気持ちを呼び起こす","r":"arouse interest（興味をかき立てる）"},{"n":"1718","w":"spur","m":"かり立てる、拍車","p":[["spur","拍車"]],"i":"馬の拍車でけしかける","r":"on the spur of the moment（その場の勢いで）"},{"n":"1721","w":"lure","m":"おびき寄せる、誘惑","p":[["lure","えさ"]],"i":"えさでつる","r":"ルアー（釣り）"}]},{"world":"pokemon","title":"せっかちなサトシ","lab":"基本動詞","labJa":"テーマ","icon":"theme","en":"Satoshi {{tends:tend}} to rush into battles. Professor Okido {{stresses:stress}} the need to plan. \"{{Focus:focus}} on your goal,\" he says. \"{{Aim:aim}} for the top.\" The Gym leader {{demands:demand}} a fair battle. The league {{grants:grant}} Satoshi a special pass. A new team wants to {{hire}} Satoshi as a coach. Their plan is {{based:base}} on his experience. His red cap {{suits:suit}} him. In the end, he {{proves:prove}} that he is a great trainer.","ja":"サトシはバトルに突っこみがちだ。オーキド博士は計画の必要性を強調する。「目標に集中しなさい」と彼。「トップを目指しなさい」。ジムリーダーはフェアなバトルを要求する。リーグはサトシに特別なパスを与える。新しいチームがサトシをコーチとして雇いたがっている。彼らの計画は彼の経験にもとづいている。赤い帽子は彼に似合う。最後に、彼はすばらしいトレーナーであることを証明する。","ken":"基本動詞やけど語法が大事★ <b>tend to ～（～しがち）、be based on ～（～にもとづく）、take ～ for granted（～を当然と思う）</b>。suit は「似合う」で、match は「（物どうしが）合う」やで。","words":[{"n":"21","w":"tend","m":"～しがちである、世話をする","p":[["tend","伸ばす"]],"i":"そっちに伸びていく","r":"tend to ～"},{"n":"102","w":"stress","m":"強調する、ストレス","p":[["stress","引っぱる"]],"i":"ぐっと力を入れる","r":"emphasize ≒"},{"n":"97","w":"focus","m":"集中する、焦点","p":[["focus","炉"]],"i":"火の中心","r":"focus on ～"},{"n":"82","w":"aim","m":"目指す、ねらい","p":[["aim","見積もる"]],"i":"ねらいを定める","r":"aim at ～ / aim to ～"},{"n":"24","w":"demand","m":"要求する、需要","p":[["de","強め"],["mand","命じる"]],"i":"強く求める","r":"supply and demand（需要と供給）"},{"n":"70","w":"grant","m":"与える、認める","p":[["grant","信じる"]],"i":"認めて与える","r":"take ～ for granted（～を当然と思う）★"},{"n":"26","w":"hire","m":"雇う","p":[["hire","賃金"]],"i":"お金を払って働いてもらう","r":"employ ≒"},{"n":"28","w":"base","m":"もとづかせる、基地","p":[["base","土台"]],"i":"土台にする","r":"be based on ～"},{"n":"80","w":"suit","m":"似合う、都合がいい","p":[["suit","ついていく"]],"i":"その人にぴったり","r":"suitable（適した）"},{"n":"43","w":"prove","m":"証明する、～だとわかる","p":[["prove","試す"]],"i":"試して正しいと示す","r":"prove to be ～（～だとわかる）"}]},{"world":"pokemon","title":"ピカチュウの長所と短所","lab":"性質","labJa":"テーマ","icon":"theme","en":"Every Pokémon has a special {{feature}}. Pikachu's main {{characteristic}} is its electric power. Its best {{trait}} is loyalty. The {{quality}} of its training is high. One {{merit}} of Pikachu is its speed. But it has a {{flaw}}: it can't use ground moves. Satoshi's {{shortcoming}} is that he is too impatient. Some judges have a {{bias}} toward big Pokémon. Satoshi's {{status}} in the league is rising. He has a good {{reputation}} among trainers.","ja":"どのポケモンにも特別な特徴がある。ピカチュウの主な特性は電気の力だ。いちばんいい性質は忠実さだ。その特訓の質は高い。ピカチュウの長所のひとつはスピードだ。でも欠点もある。じめん技が使えないのだ。サトシの短所はせっかちすぎることだ。審判の中には大きいポケモンをひいきする偏見を持つ人もいる。リーグでのサトシの地位は上がってきている。彼はトレーナーたちの間で評判がいい。","ken":"「特徴」と「欠点」の言いかえセット★ 特徴：<b>feature, characteristic, trait</b>、長所：<b>merit</b>、欠点：<b>flaw, shortcoming</b>。bias（偏見）は「バイアスがかかる」の bias やで。","words":[{"n":"176","w":"feature","m":"特徴、特集、目玉","p":[["feature","作り"]],"i":"目立つ部分","r":"featured（特集された）"},{"n":"214","w":"characteristic","m":"特性、特有の","p":[["character","性格"]],"i":"そのものらしい特徴","r":"be characteristic of ～"},{"n":"1069","w":"trait","m":"特性、特質","p":[["trait","引いた線"]],"i":"性格の線","r":"personality trait（性格特性）"},{"n":"406","w":"quality","m":"質、特質","p":[["qual","どんな種類"]],"i":"どのくらい良いか","r":"quantity（量）とセット"},{"n":"974","w":"merit","m":"長所、価値","p":[["merit","得る"]],"i":"ほめられるところ","r":"merits and demerits（長所と短所）"},{"n":"1535","w":"flaw","m":"欠点、傷","p":[["flaw","ひび"]],"i":"小さなひび割れ","r":"flawless（完ぺきな）"},{"n":"1884","w":"shortcoming","m":"短所","p":[["short","足りない"],["coming","来る"]],"i":"届かないところ","r":"weakness ≒"},{"n":"1507","w":"bias","m":"偏見、かたより","p":[["bias","ななめ"]],"i":"ななめに見る","r":"biased（かたよった）"},{"n":"479","w":"status","m":"地位、状況","p":[["stat","立つ"]],"i":"立っている位置","r":"social status（社会的地位）"},{"n":"943","w":"reputation","m":"評判","p":[["re","くり返し"],["put","考える"]],"i":"何度も考えられた評価","r":"have a good reputation"}]},{"world":"pokemon","title":"ポケモンコンテスト","lab":"基準","labJa":"テーマ","icon":"theme","en":"The Pokémon contest has strict {{criteria}}. The {{standard}} is very high. Judges score Pokémon on the {{basis}} of beauty and skill. There are three {{categories:category}}: cute, cool, and smart. This year's {{theme}} is \"water.\" Each performance has three {{elements:element}}. The {{sequence}} of moves is important. Luck is also a {{factor}}. It's the {{norm}} to bow before you start. Under no {{circumstances:circumstance}} can you touch the judges.","ja":"ポケモンコンテストには厳しい基準がある。水準はとても高い。審査員は美しさと技術を基準にポケモンを採点する。部門は3つある。かわいい、かっこいい、かしこい。今年のテーマは「みず」だ。それぞれのパフォーマンスには3つの要素がある。技の順番が大切だ。運も要因のひとつだ。始める前におじぎをするのがふつうのきまりだ。どんな状況でも審査員にさわってはいけない。","ken":"<b>criteria（基準）は複数形</b>で、単数は criterion★ under no circumstances（どんな状況でも～ない）は否定の強調で、倒置が起きるで（can you の語順）。factor（要因）は長文の超頻出語！","words":[{"n":"1519","w":"criteria","m":"基準（複数）","p":[["crit","判断する"]],"i":"判断するものさし","r":"単数形は criterion★"},{"n":"424","w":"standard","m":"水準、標準","p":[["stand","立つ"]],"i":"基準として立てたもの","r":"living standard（生活水準）"},{"n":"759","w":"basis","m":"基礎、根拠","p":[["base","土台"]],"i":"土台となるもの","r":"on the basis of ～（～にもとづいて）"},{"n":"941","w":"category","m":"部門、種類","p":[["category","分類"]],"i":"グループ分け","r":"categorize（分類する）"},{"n":"989","w":"theme","m":"テーマ、主題","p":[["theme","置かれたもの"]],"i":"中心となる話題","r":"theme park"},{"n":"227","w":"element","m":"要素、元素","p":[["element","もと"]],"i":"組み立てている部分","r":"elementary（初歩の）"},{"n":"1278","w":"sequence","m":"順序、連続","p":[["sequ","続く"]],"i":"続いていく順番","r":"in sequence（順番に）"},{"n":"1063","w":"factor","m":"要因","p":[["fact","作る"]],"i":"結果を作り出すもの","r":"a key factor（重要な要因）"},{"n":"1286","w":"norm","m":"標準、規範","p":[["norm","ものさし"]],"i":"ふつうのきまり","r":"normal（ふつうの）"},{"n":"977","w":"circumstance","m":"状況","p":[["circum","まわり"],["stance","立つ"]],"i":"まわりに立っているもの","r":"under no circumstances（どんな状況でも～ない）"}]},{"world":"pokemon","title":"昼寝と悪夢","lab":"気分","labJa":"テーマ","icon":"theme","en":"Satoshi takes a short {{nap}} after lunch. He has a {{nightmare}} about losing Pikachu. He wakes up with a strange {{sensation}} in his arm. Joy checks his {{posture}}. \"Sitting badly is not good for your {{anatomy}},\" she says. She gives him a {{tip}}: \"Stretch every morning.\" She gently {{strokes:stroke}} Pikachu's head. Pikachu has a happy {{spirit}}. Its smile is its {{charm}}. \"Having Pikachu is a {{blessing}},\" Satoshi says.","ja":"サトシは昼ごはんのあと、少し昼寝をする。ピカチュウを失う悪夢を見る。腕に変な感覚があって目を覚ます。ジョーイさんは彼の姿勢をチェックする。「悪い姿勢で座るのは体のつくりによくないわ」と彼女。彼女はアドバイスをくれる。「毎朝ストレッチしなさい」。彼女はピカチュウの頭をやさしくなでる。ピカチュウは明るい心の持ち主だ。笑顔が魅力だ。「ピカチュウがいるのは恵みだよ」とサトシは言う。","ken":"<b>stroke</b> は「なでる」「（病気の）脳卒中」「（テニスなどの）一打ち」と意味が多い！ tip は「助言」「チップ」「先端」の3つ★ take a nap（昼寝する）は会話でめっちゃ使うで。","words":[{"n":"1300","w":"nap","m":"昼寝","p":[["nap","うとうと"]],"i":"ちょっと寝る","r":"take a nap（昼寝する）"},{"n":"1543","w":"nightmare","m":"悪夢","p":[["night","夜"],["mare","悪霊"]],"i":"夜の悪霊が見せる夢","r":"a living nightmare"},{"n":"1311","w":"sensation","m":"感覚、大評判","p":[["sens","感じる"]],"i":"体で感じること、大さわぎ","r":"sensational（センセーショナルな）"},{"n":"1875","w":"posture","m":"姿勢","p":[["pos","置く"]],"i":"体の置き方","r":"good posture（いい姿勢）"},{"n":"1908","w":"anatomy","m":"体の構造、解剖学","p":[["ana","バラバラ"],["tomy","切る"]],"i":"切って中を調べる","r":"human anatomy"},{"n":"1108","w":"tip","m":"助言、チップ、先端","p":[["tip","先っぽ"]],"i":"ちょっとしたヒント","r":"tips for ～（～のコツ）"},{"n":"782","w":"stroke","m":"なでる、脳卒中、一打ち","p":[["stroke","打つ"]],"i":"サッとなでる","r":"have a stroke（脳卒中になる）"},{"n":"223","w":"spirit","m":"心、精神、霊","p":[["spir","息"]],"i":"生きる息、元気","r":"team spirit（チーム精神）"},{"n":"763","w":"charm","m":"魅力、お守り","p":[["charm","呪文"]],"i":"人をひきつける力","r":"charming（魅力的な）"},{"n":"1310","w":"blessing","m":"恵み、祝福","p":[["bless","祝福する"]],"i":"ありがたいこと","r":"a blessing in disguise（不幸中の幸い）"}]},{"world":"pokemon","title":"オーキド博士の野外調査","lab":"名詞いろいろ2","labJa":"テーマ","icon":"theme","en":"Professor Okido studies the {{behavior}} of Pokémon in their natural {{environment}}. The {{purpose}} of his study is to protect them. He finds that {{pollution}} from factories hurts them. He looks for the {{source}} of the dirty water. He writes down every {{detail}}. He also studies the {{origin}} of each Pokémon. Kabigon's {{weight}} is over 400 kilograms, and its {{strength}} is amazing. Metamon can change its {{shape}} into any Pokémon.","ja":"オーキド博士は自然の環境の中でのポケモンの行動を研究している。研究の目的はポケモンを守ることだ。彼は工場からの汚染がポケモンを傷つけていることを発見する。汚れた水の発生源を探す。細かいことをすべて書きとめる。それぞれのポケモンの起源も研究している。カビゴンの体重は400キロ以上で、その力の強さはすごい。メタモンはどんなポケモンにでも形を変えられる。","ken":"基本の名詞やけど長文で毎回見る！ <b>environment（環境）</b>はスペル注意（n を忘れがち）★ origin（起源）の形容詞は original、behavior（行動）の動詞は behave やで。","words":[{"n":"403","w":"behavior","m":"行動、ふるまい","p":[["be","強め"],["have","持つ"]],"i":"身のこなし","r":"behave（ふるまう）"},{"n":"407","w":"environment","m":"環境","p":[["en","中に"],["viron","囲む"]],"i":"まわりを囲むもの","r":"environmental（環境の）、n を忘れずに★"},{"n":"402","w":"purpose","m":"目的","p":[["pur","前に"],["pose","置く"]],"i":"前に置いた目標","r":"on purpose（わざと）"},{"n":"469","w":"pollution","m":"汚染","p":[["pollute","よごす"]],"i":"空気や水をよごすこと","r":"air pollution（大気汚染）"},{"n":"413","w":"source","m":"源、出どころ","p":[["source","わき出る"]],"i":"わき出てくるところ","r":"energy source"},{"n":"419","w":"detail","m":"細部","p":[["de","完全に"],["tail","切る"]],"i":"細かく切った部分","r":"in detail（くわしく）"},{"n":"461","w":"origin","m":"起源","p":[["ori","起こる"]],"i":"始まり","r":"original（元の、独創的な）"},{"n":"449","w":"weight","m":"重さ、体重","p":[["weigh","重さをはかる"]],"i":"どれだけ重いか","r":"lose weight（やせる）"},{"n":"465","w":"strength","m":"強さ","p":[["strong","強い"]],"i":"力の強さ","r":"strengthen（強くする）"},{"n":"415","w":"shape","m":"形、形づくる","p":[["shape","形"]],"i":"見た目の形","r":"in good shape（体調がいい）"}]},{"world":"pokemon","title":"ポケモンセンターの大行列","lab":"名詞と動詞いろいろ","labJa":"テーマ","icon":"theme","en":"A long {{queue}} forms in front of the Pokémon Center. Everyone is {{awaiting}} a new Pokémon. The space is {{tight}}, so people stand close together. Joy gives a {{cue}}, and the doors open. \"Get {{ready}}!\" Satoshi says. Junsar {{summons:summon}} her Pokémon to keep order, because she doesn't want to use {{force}}. Each town in the region has the {{autonomy}} to make its own rules.","ja":"ポケモンセンターの前に長い行列ができる。みんな新しいポケモンを待っている。スペースがきつきつなので、人々はぎゅっと近くに立っている。ジョーイさんが合図を出して、扉が開く。「準備して！」とサトシ。ジュンサーさんは力ずくでおさえたくないので、秩序を保つためにポケモンを呼び出す。この地方のそれぞれの町には、自分たちのルールを作る自治権がある。","ken":"<b>force</b> は名詞「力」と動詞「無理やり～させる」の2つ。★<b>force 人 to ～（人に無理やり～させる）</b>は超頻出！ queue（列）は「キュー」と読む、ue を読まへんで。イギリス英語でよく使う。","words":[{"n":"1809","w":"queue","m":"（順番待ちの）列","p":[["queue","しっぽ"]],"i":"しっぽみたいに並ぶ列","r":"発音「キュー」、line ≒"},{"n":"1356","w":"awaiting","m":"待っている","p":[["a","強め"],["wait","待つ"]],"i":"楽しみに待つ","r":"await（待つ）、他動詞"},{"n":"810","w":"tight","m":"きつい、ぎっしりの","p":[["tight","固い"]],"i":"ギュッとつまった","r":"loose（ゆるい）が反対"},{"n":"1561","w":"cue","m":"合図、きっかけ","p":[["cue","Q（質問の記号）"]],"i":"始めの合図","r":"take one's cue from ～（～にならう）"},{"n":"261","w":"ready","m":"準備ができた","p":[["ready","準備"]],"i":"いつでもOK","r":"get ready（準備する）"},{"n":"1704","w":"summon","m":"呼び出す、召集する","p":[["sum","下から"],["mon","忠告する"]],"i":"呼び寄せる","r":"ゲームの「召喚」"},{"n":"13","w":"force","m":"力、無理やり～させる","p":[["force","力"]],"i":"力ずくで","r":"force 人 to ～★"},{"n":"1870","w":"autonomy","m":"自治、自主性","p":[["auto","自分"],["nomy","法"]],"i":"自分でルールを決める","r":"autonomous（自律した）"}]}];

const T=(t)=>`<text x="100" y="114" text-anchor="middle" font-size="12" fill="var(--muted)">${t}</text>`;
const SVG={
 ex:`<svg viewBox="0 0 200 120"><rect x="60" y="30" width="60" height="60" rx="8" fill="none" stroke="var(--fg)" stroke-width="3"/><circle cx="90" cy="60" r="8" fill="var(--w)"/>${A("M98 60 H175 M165 50 L178 60 L165 70")}${T("中から外へ飛び出す")}</svg>`,
 re:`<svg viewBox="0 0 200 120"><path d="M30 45 H150 A22 22 0 0 1 150 89 H50" fill="none" stroke="var(--w)" stroke-width="4" stroke-linecap="round"/>${A("M62 79 L48 89 L62 99")}<circle cx="30" cy="45" r="7" fill="var(--fg)"/>${T("行って、また戻ってくる")}</svg>`,
 con:`<svg viewBox="0 0 200 120"><path d="M20 25 Q90 25 110 60 M20 95 Q90 95 110 60" fill="none" stroke="var(--fg)" stroke-width="3"/>${A("M110 60 H180 M170 50 L183 60 L170 70")}<rect x="10" y="17" width="16" height="16" fill="var(--w)"/><rect x="10" y="87" width="16" height="16" fill="var(--w)"/>${T("バラバラを一緒にする")}</svg>`,
 ad:`<svg viewBox="0 0 200 120"><circle cx="160" cy="55" r="28" fill="none" stroke="var(--fg)" stroke-width="3"/><circle cx="160" cy="55" r="12" fill="var(--w)"/>${A("M20 55 H128 M118 45 L131 55 L118 65")}${T("ねらった方へ向かう")}</svg>`,
 feel:`<svg viewBox="0 0 200 120"><rect x="15" y="35" width="50" height="40" rx="6" fill="var(--w)"/><text x="40" y="60" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">原因</text><path d="M72 55 H128 M118 45 L131 55 L118 65" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="55" r="24" fill="none" stroke="var(--fg)" stroke-width="3"/><circle cx="152" cy="50" r="3" fill="var(--fg)"/><circle cx="168" cy="50" r="3" fill="var(--fg)"/><path d="M150 64 Q160 70 170 64" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>${T("人に気持ちを「させる」")}</svg>`,
 trans:`<svg viewBox="0 0 200 120"><line x1="100" y1="15" x2="100" y2="95" stroke="var(--fg)" stroke-width="3" stroke-dasharray="6 6"/><circle cx="35" cy="55" r="8" fill="var(--fg)"/>${A("M45 55 Q100 15 160 55 M148 48 L162 56 L150 66")}${T("線をこえて向こう側へ")}</svg>`,
 see:`<svg viewBox="0 0 200 120"><path d="M30 55 Q100 0 170 55 Q100 110 30 55 Z" fill="none" stroke="var(--fg)" stroke-width="3"/><circle cx="100" cy="55" r="18" fill="var(--w)"/><circle cx="100" cy="55" r="7" fill="var(--surface)"/>${T("じっと見る")}</svg>`,
 sub:`<svg viewBox="0 0 200 120"><rect x="60" y="22" width="80" height="26" rx="4" fill="none" stroke="var(--fg)" stroke-width="3"/><line x1="20" y1="58" x2="180" y2="58" stroke="var(--fg)" stroke-width="3"/>${A("M100 98 V68 M90 78 L100 66 L110 78")}${T("下から支える")}</svg>`,
 super:`<svg viewBox="0 0 200 120"><rect x="80" y="55" width="40" height="40" rx="4" fill="none" stroke="var(--fg)" stroke-width="3"/>${A("M30 90 Q100 -10 170 90 M158 82 L171 92 L174 76")}${T("上をこえていく")}</svg>`,
 per:`<svg viewBox="0 0 200 120"><rect x="75" y="25" width="50" height="60" rx="6" fill="none" stroke="var(--fg)" stroke-width="3"/>${A("M20 55 H178 M166 45 L179 55 L166 65")}${T("最後までつらぬく")}</svg>`,
 pre:`<svg viewBox="0 0 200 120"><line x1="40" y1="25" x2="40" y2="90" stroke="var(--fg)" stroke-width="3"/><circle cx="25" cy="57" r="7" fill="var(--fg)"/>${A("M50 57 H170 M158 47 L171 57 L158 67")}${T("先に・前へ進む")}</svg>`,
 dis:`<svg viewBox="0 0 200 120"><rect x="70" y="35" width="26" height="40" rx="4" fill="var(--w)"/><rect x="104" y="35" width="26" height="40" rx="4" fill="var(--w)"/>${A("M64 55 H22 M34 45 L21 55 L34 65 M136 55 H178 M166 45 L179 55 L166 65")}${T("はなれる・バラバラに")}</svg>`,
 in:`<svg viewBox="0 0 200 120"><rect x="110" y="25" width="60" height="60" rx="8" fill="none" stroke="var(--fg)" stroke-width="3"/><circle cx="145" cy="55" r="8" fill="var(--w)"/>${A("M20 55 H128 M118 45 L131 55 L118 65")}${T("中に入る")}</svg>`,
 ob:`<svg viewBox="0 0 200 120"><rect x="130" y="15" width="16" height="80" fill="var(--fg)"/>${A("M20 55 H118 M108 45 L121 55 L108 65")}<path d="M124 38 L118 30 M124 72 L118 80" stroke="var(--w)" stroke-width="3" stroke-linecap="round"/>${T("向かっていく・ぶつかる")}</svg>`
};

// index scenes
const BY={};WORLDS.forEach(w=>BY[w.id]=[]);
DATA.forEach(s=>{s.idx=BY[s.world].length;s.id=s.world+"-"+(s.idx+1);BY[s.world].push(s)});
const ALL=DATA.flatMap(s=>s.words.map(w=>({...w,scene:s})));
const KEY="kochan-tango-v1",POS="kochan-tango-pos";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
let cur=DATA[0];
try{const h=location.hash.slice(1);const f=DATA.find(s=>s.id===h);if(f)cur=f;else{const p=localStorage.getItem(POS);const g=DATA.find(s=>s.id===p);if(g)cur=g}}catch(e){}

const $=id=>document.getElementById(id);
const tabs=$("tabs"),view=$("view"),stages=$("stages"),pager=$("pager");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const wcolor=id=>WORLDS.find(w=>w.id===id).color;
const doneIn=s=>s.words.filter(w=>done[w.w]).length;

function renderTabs(){
 tabs.innerHTML=WORLDS.map(w=>{const ws=BY[w.id].flatMap(s=>s.words);const d=ws.filter(x=>done[x.w]).length;
  return `<button role="tab" type="button" aria-selected="${w.id===cur.world}" style="--wc:${w.color}" data-id="${w.id}">${w.name}<small>${d}/${ws.length}</small></button>`}).join("");
}
function renderStages(){
 stages.innerHTML=BY[cur.world].map(s=>{const d=doneIn(s);
  return `<button type="button" data-id="${s.id}" aria-current="${s===cur}" class="${d===s.words.length?"full":""}"><span class="sn">STAGE ${String(s.idx+1).padStart(2,"0")}</span><span class="st">${esc(s.title)}</span><span class="sd">${d}/${s.words.length}</span></button>`}).join("");
 const a=stages.querySelector('[aria-current="true"]');if(a){a.scrollIntoView({block:"nearest",inline:"center"})}
}
function renderScene(){
 const s=cur;document.documentElement.style.setProperty("--w",wcolor(s.world));
 const en=esc(s.en).replace(/\{\{(.+?)\}\}/g,(m,inner)=>{const i=inner.lastIndexOf(":");const shown=i>=0?inner.slice(0,i):inner;const key=i>=0?inner.slice(i+1):inner;return `<button class="w" type="button" data-k="${esc(key)}">${shown}</button>`});
 const isTheme=s.icon==="theme";
 const pre=isTheme?`<div class="kicker">この場面のテーマ</div><div class="lab ja">${esc(s.lab)}</div>`:`<div class="kicker">この場面の語源</div><div class="lab">${esc(s.lab)}<small>${esc(s.labJa)}</small></div>${SVG[s.icon]||""}`;
 view.innerHTML=`<section class="scene" id="scene">
  <div class="prefix">${pre}</div>
  <div><div class="kicker">${esc(WORLDS.find(w=>w.id===s.world).name)}｜STAGE ${String(s.idx+1).padStart(2,"0")}｜${esc(s.title)}</div><p class="en">${en}</p><p class="ja hide">${esc(s.ja)}</p><div class="ken">${s.ken}</div></div>
 </section>
 <div class="grid">${s.words.map(w=>`<article class="card${done[w.w]?" done":""}" id="c-${esc(w.w.replace(/\s/g,"_"))}" tabindex="0">
  <div class="top"><span class="num">No.${esc(w.n)}</span><span class="word">${esc(w.w)}</span><label class="chk"><input type="checkbox" data-word="${esc(w.w)}" ${done[w.w]?"checked":""}>覚えた</label></div>
  <div class="mean hide">${esc(w.m)}</div>
  ${w.p.length?`<div class="parts">${w.p.map((p,i)=>`<span class="p${w.p.length>1&&i===0?" pre":""}"><em>${esc(p[0])}</em>${esc(p[1])}</span>`).join('<span aria-hidden="true">＋</span>')}</div>`:""}
  <div class="img hide">→ ${esc(w.i)}</div>
  <div class="rel">${esc(w.r).replace(/([A-Za-z][A-Za-z ~～'’.\-]*[A-Za-z.])/g,"<span>$1</span>")}</div>
 </article>`).join("")}</div>`;
 const list=BY[s.world],prev=list[s.idx-1],next=list[s.idx+1];
 pager.innerHTML=`<button type="button" data-id="${prev?prev.id:""}" ${prev?"":"disabled"}>← 前のステージ<small>${prev?esc(prev.title):""}</small></button><button type="button" data-id="${next?next.id:""}" ${next?"":"disabled"}>次のステージ →<small>${next?esc(next.title):""}</small></button>`;
}
function count(){const all=ALL.length;const n=ALL.filter(x=>done[x.w]).length;$("cnt").textContent=n;$("tot").textContent=all;$("barfill").style.width=(n/all*100)+"%"}
function go(s,focusWord){
 cur=s;try{localStorage.setItem(POS,s.id)}catch(e){}
 try{history.replaceState(null,"","#"+s.id)}catch(e){}
 renderTabs();renderStages();renderScene();count();
 if(focusWord){const c=document.getElementById("c-"+focusWord.replace(/\s/g,"_"));if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600)}}
 else window.scrollTo({top:0,behavior:"smooth"});
}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const list=BY[b.dataset.id];const firstOpen=list.find(s=>doneIn(s)<s.words.length)||list[0];go(firstOpen)});
stages.addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(DATA.find(s=>s.id===b.dataset.id))});
pager.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.id)go(DATA.find(s=>s.id===b.dataset.id))});
view.addEventListener("click",e=>{
 const w=e.target.closest(".w");
 if(w){const c=document.getElementById("c-"+w.dataset.k.replace(/\s/g,"_"));if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1400)}return}
 if(e.target.closest(".chk"))return;
 if(document.body.classList.contains("test")){const c=e.target.closest(".card,.scene");if(c)c.classList.toggle("reveal")}
});
view.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")&&document.body.classList.contains("test")){e.preventDefault();e.target.classList.toggle("reveal")}});
view.addEventListener("change",e=>{const i=e.target.closest("input[data-word]");if(!i)return;const k=i.dataset.word;if(i.checked)done[k]=1;else delete done[k];save();i.closest(".card").classList.toggle("done",i.checked);count();renderTabs();renderStages()});
const tb=$("testBtn");
tb.addEventListener("click",()=>{const on=document.body.classList.toggle("test");tb.textContent="テストモード："+(on?"ON":"OFF");document.querySelectorAll(".reveal").forEach(x=>x.classList.remove("reveal"))});
// search
const q=$("q"),res=$("results");
function search(v){
 v=v.trim().toLowerCase();if(!v){res.hidden=true;return}
 let hits;
 if(/^\d+$/.test(v)){hits=ALL.filter(x=>x.n.split("/").some(n=>n===v||n.startsWith(v))).sort((a,b)=>parseInt(a.n)-parseInt(b.n))}
 else{hits=ALL.filter(x=>x.w.toLowerCase().startsWith(v));const more=ALL.filter(x=>!x.w.toLowerCase().startsWith(v)&&(x.w.toLowerCase().includes(v)||x.m.includes(v)));hits=hits.concat(more)}
 hits=hits.slice(0,8);
 if(!hits.length){res.innerHTML=`<button type="button" disabled><span class="rm">見つからへんかった</span></button>`;res.hidden=false;return}
 res.innerHTML=hits.map((x,i)=>`<button type="button" data-i="${ALL.indexOf(x)}"><span class="rn">No.${esc(x.n)}</span><span class="rw">${esc(x.w)}</span><span class="rm">${esc(x.m)}</span></button>`).join("");
 res.hidden=false;
}
q.addEventListener("input",()=>search(q.value));
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=res.querySelector("button[data-i]");if(b)b.click()}if(e.key==="Escape"){res.hidden=true}});
res.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const x=ALL[+b.dataset.i];res.hidden=true;q.value="";go(x.scene,x.w)});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true});
go(cur);
</script>

</body></html>
